# Kustomize base: the manifests every environment shares. Overlays
# (overlays/dev, overlays/prod) build on it with patches and image tags.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
# labels replaces the deprecated commonLabels; includeSelectors also adds
# them to selectors (immutable on existing Deployments: set it once).
labels:
  - pairs:
      app.kubernetes.io/part-of: app
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
