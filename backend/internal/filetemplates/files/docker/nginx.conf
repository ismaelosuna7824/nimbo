# Reverse proxy to the app service. Mount it as
# /etc/nginx/conf.d/default.conf (read-only) in an nginx service.
upstream app {
    server app:8080;
}

server {
    listen 80;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
