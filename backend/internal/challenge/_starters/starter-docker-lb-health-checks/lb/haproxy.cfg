# HAProxy in front of the api replicas.
global
  log stdout format raw local0 notice

defaults
  mode http
  log global
  timeout connect 2s
  timeout client 30s
  timeout server 10s

# Docker's embedded DNS: "api" resolves to every running api replica.
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 1s

frontend web
  bind :8080
  default_backend api

backend api
  balance roundrobin
  # One slot per replica, filled from DNS.
  server-template api- 2 api:3000 resolvers docker init-addr none
