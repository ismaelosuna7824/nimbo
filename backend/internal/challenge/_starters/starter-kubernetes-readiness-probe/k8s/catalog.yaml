# The catalog: two replicas built from catalog/ (Nimbo builds catalog:dev
# and loads it into the local cluster), a Service, and an Ingress that
# Traefik serves at http://catalog.localhost. Traefik sends each request
# to one of the Service's ready pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: catalog
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      containers:
        - name: catalog
          image: catalog:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: WARMUP_SEC
              value: "15"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: catalog
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalog
  namespace: catalog
spec:
  ingressClassName: traefik
  rules:
    - host: catalog.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: catalog
                port:
                  name: http
