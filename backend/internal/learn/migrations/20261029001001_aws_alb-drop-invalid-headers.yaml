description: Tells learners to turn on drop_invalid_header_fields on the load balancer in the ALB and three-tier challenges (bp_alb_drop_invalid_headers)
operations:
- op: upsert
  kind: challenge
  id: aws-alb-auto-scaling
  data:
    provider: aws
    level: intermediate
    title: Replace a single server with a load-balanced Auto Scaling group
    summary: Move an app from one EC2 instance with SSH open to the world to an ALB and a self-healing Auto Scaling group across zones.
    minutes: 45
    tags: [ec2, alb, auto-scaling, high-availability, security-groups]
    prerequisites: [aws-vpc-multi-az-subnets]
    runtime: emulated
    problem: |
      The app runs on one EC2 instance in the default VPC. Its security
      group allows SSH (22) and the app port (8080) from anywhere. When
      the instance or its Availability Zone fails, the app is down until
      someone rebuilds it by hand.

      The standard AWS answer has three parts. An **Application Load
      Balancer** is the one public entry point, spread over at least two
      Availability Zones; its **target group** sends requests only to
      targets that pass a health check. An **Auto Scaling group** keeps a
      minimum number of identical instances (described by a **launch
      template**) running across the zones' subnets, and with
      `health_check_type = "ELB"` it also replaces instances the load
      balancer reports unhealthy. **Security groups** chain: the app
      servers accept traffic only from the load balancer's security group,
      and nobody needs SSH (use Session Manager instead).

      Rebuild the app tier. It deploys to the local AWS emulator when you
      check (the listener is reachable inside the sandbox only, so the
      grader checks the deployment, not an HTTP call).
    requirements:
    - An `aws_lb` of type `application` in the default VPC's subnets (one per Availability Zone) with its own security group allowing HTTP from the internet.
    - An `aws_lb_target_group` on port 8080 whose health check calls `/health`, and an HTTP listener on port 80 forwarding to it.
    - An `aws_launch_template` for the app servers that requires IMDSv2 (`metadata_options { http_tokens = "required" }`).
    - An `aws_autoscaling_group` with `min_size` of at least 2 (a number), `health_check_type = "ELB"` and the target group in `target_group_arns`.
    - The app servers' security group allows port 8080 only from the load balancer's security group; no rule opens SSH or other admin ports to the internet.
    - No standalone `aws_instance` remains, there are no `bp_open_ingress` or `net_single_az` findings, and the workflow deploys.
    hints:
    - 'Delete the single `aws_instance` and build the pieces from the palette: a security group for the load balancer, an `aws_lb`, an `aws_lb_target_group`, an `aws_lb_listener`, an `aws_launch_template` and an `aws_autoscaling_group`. The starter''s `local.subnet_ids` already gives one default subnet per zone: pick it with **Link to…** for the ALB''s `subnets` and the group''s `vpc_zone_identifier`.'
    - 'Security group rules are cards in the inspector: on the new ALB group, add an `ingress` card for port 80 from `0.0.0.0/0` and an `egress` card for all traffic. On the app servers'' group, keep one `ingress` card for port 8080 and, in its `security_groups` field, use **Link to…** to add the ALB group''s `id` instead of `0.0.0.0/0`; remove the SSH card.'
    - 'Wire the rest with **Link to…**: the ALB''s `security_groups` (ALB group), the listener''s `load_balancer_arn` and its `default_action` (`type` forward, `target_group_arn`), the launch template''s `image_id`, `instance_type` and `vpc_security_group_ids` (app group), and the group''s `target_group_arns` and `launch_template` block (`id` and `latest_version`). The app server program moves too: on the launch template''s `user_data`, use **Link to…** with the **Base64-encode** switch on and pick `local.user_data`. Give the target group a `/health` check path, set `http_tokens` to `required` in the launch template''s `metadata_options`, and set the group to `min_size` 2 with `health_check_type` ELB.'
    solution: |
      The reference (`main.tf`) keeps the data lookups and builds:

      - `aws_security_group.alb` (80 from anywhere) and
        `aws_security_group.app` (8080 from the ALB's group only);
      - `aws_lb.app` (application, `drop_invalid_header_fields`),
        `aws_lb_target_group.app` (`/health`, 2 healthy / 2 unhealthy
        checks every 10 s) and `aws_lb_listener.http` forwarding to it;
      - `aws_launch_template.app` (AL2023, IMDSv2 required, the same
        Python server as user data);
      - `aws_autoscaling_group.app` (`min_size = 2`, `max_size = 4`,
        `health_check_type = "ELB"`, grace period 120 s) registering its
        instances with the target group.

      ```hcl
      resource "aws_autoscaling_group" "app" {
        name                      = local.name_prefix
        min_size                  = 2
        max_size                  = 4
        desired_capacity          = 2
        vpc_zone_identifier       = local.subnet_ids
        target_group_arns         = [aws_lb_target_group.app.arn]
        health_check_type         = "ELB"
        health_check_grace_period = 120

        launch_template {
          id      = aws_launch_template.app.id
          version = aws_launch_template.app.latest_version
        }
      }
      ```

      Why: the reliability pillar asks for redundancy across Availability
      Zones and automatic replacement of failed components; ELB health
      checks make the group replace instances whose app is broken even when
      the VM itself is fine. In production put the instances in private
      subnets (the ALB stays public) and add a target tracking scaling
      policy (e.g. 50 % average CPU) so the group follows demand.

      **Without writing code in Nimbo**

      1. Select `aws_instance.web` and delete it.
      2. From the palette, add an `aws_security_group` named `alb`: set `name` and `description`, **Link to…** `data.aws_vpc.default` → `id` for `vpc_id`, add an `ingress` card (HTTP, ports 80–80, protocol `tcp`, `cidr_blocks` `0.0.0.0/0`) and an `egress` card (ports 0–0, protocol `-1`, `cidr_blocks` `0.0.0.0/0`).
      3. Select `aws_security_group.web` and leave a single `ingress` card: ports 8080–8080, protocol `tcp`, and in `security_groups` use **Link to…** to add `aws_security_group.alb` → `id` (remove the other cards, including SSH).
      4. Add an `aws_lb` named `app`: `name` `learn-dev-alb`, `load_balancer_type` **application**, **Link to…** the ALB group's `id` in `security_groups`, **Link to…** `local.subnet_ids` for `subnets`, and turn **drop_invalid_header_fields** on (the load balancer then drops requests with malformed headers instead of forwarding them).
      5. Add an `aws_lb_target_group` named `app`: `name` `learn-dev-app`, `port` 8080, `protocol` HTTP, **Link to…** the default VPC's `id` for `vpc_id`, and `path` `/health` in the `health_check` block.
      6. Add an `aws_lb_listener` named `http`: **Link to…** `aws_lb.app` → `arn` for `load_balancer_arn`, `port` 80, `protocol` HTTP, and in `default_action` set `type` to **forward** and **Link to…** the target group's `arn` for `target_group_arn`.
      7. Add an `aws_launch_template` named `app`: `name` `learn-dev-app`, **Link to…** `data.aws_ssm_parameter.al2023` → `value` for `image_id` and `var.instance_type` for `instance_type`, **Link to…** `aws_security_group.web` → `id` in `vpc_security_group_ids`, and in `metadata_options` set `http_tokens` to **required**. On `user_data`, open **Link to…**, turn on **Base64-encode** and pick `local.user_data`.
      8. Add an `aws_autoscaling_group` named `app`: `name` `learn-dev-app`, `min_size` 2, `max_size` 4, `desired_capacity` 2, `health_check_type` **ELB**, **Link to…** `local.subnet_ids` for `vpc_zone_identifier`, **Link to…** the target group's `arn` in `target_group_arns`, and in the `launch_template` block **Link to…** `aws_launch_template.app` → `id` and → `latest_version`.
    solutionFiles:
      main.tf: |
        data "aws_vpc" "default" {
          default = true
        }

        # One default subnet per Availability Zone.
        data "aws_subnets" "default" {
          filter {
            name   = "vpc-id"
            values = [data.aws_vpc.default.id]
          }

          filter {
            name   = "default-for-az"
            values = ["true"]
          }
        }

        locals {
          subnet_ids = sort(data.aws_subnets.default.ids)
        }

        # Amazon Linux 2023, the latest image AWS publishes for the region.
        data "aws_ssm_parameter" "al2023" {
          name = "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"
        }

        resource "aws_security_group" "alb" {
          name        = "${local.name_prefix}-alb"
          description = "Load balancer: HTTP from anywhere"
          vpc_id      = data.aws_vpc.default.id

          ingress {
            description = "HTTP"
            from_port   = 80
            to_port     = 80
            protocol    = "tcp"
            cidr_blocks = ["0.0.0.0/0"]
          }

          egress {
            description = "Requests and health checks to the targets"
            from_port   = 0
            to_port     = 0
            protocol    = "-1"
            cidr_blocks = ["0.0.0.0/0"]
          }
        }

        # The app port is reachable from the load balancer only; no SSH.
        resource "aws_security_group" "app" {
          name        = "${local.name_prefix}-app"
          description = "App servers: port 8080 from the load balancer only"
          vpc_id      = data.aws_vpc.default.id

          ingress {
            description     = "Requests and health checks from the load balancer"
            from_port       = 8080
            to_port         = 8080
            protocol        = "tcp"
            security_groups = [aws_security_group.alb.id]
          }

          egress {
            description = "Outbound for package installs"
            from_port   = 0
            to_port     = 0
            protocol    = "-1"
            cidr_blocks = ["0.0.0.0/0"]
          }
        }

        resource "aws_lb" "app" {
          name                       = local.name_prefix
          load_balancer_type         = "application"
          internal                   = false
          security_groups            = [aws_security_group.alb.id]
          subnets                    = local.subnet_ids
          drop_invalid_header_fields = true
        }

        # Requests go only to targets that answer /health with 200.
        resource "aws_lb_target_group" "app" {
          name                 = local.name_prefix
          port                 = 8080
          protocol             = "HTTP"
          target_type          = "instance"
          vpc_id               = data.aws_vpc.default.id
          deregistration_delay = 30

          health_check {
            path                = "/health"
            matcher             = "200"
            interval            = 10
            timeout             = 5
            healthy_threshold   = 2
            unhealthy_threshold = 2
          }
        }

        resource "aws_lb_listener" "http" {
          load_balancer_arn = aws_lb.app.arn
          port              = 80
          protocol          = "HTTP"

          default_action {
            type             = "forward"
            target_group_arn = aws_lb_target_group.app.arn
          }
        }

        resource "aws_launch_template" "app" {
          name_prefix            = "${local.name_prefix}-app-"
          image_id               = data.aws_ssm_parameter.al2023.value
          instance_type          = var.instance_type
          vpc_security_group_ids = [aws_security_group.app.id]

          # IMDSv2 only.
          metadata_options {
            http_endpoint = "enabled"
            http_tokens   = "required"
          }

          tag_specifications {
            resource_type = "instance"
            tags          = merge(local.common_tags, { Name = "${local.name_prefix}-app" })
          }

          user_data = base64encode(local.user_data)
        }

        # Keeps two healthy servers across the zones and replaces any the
        # load balancer reports unhealthy.
        resource "aws_autoscaling_group" "app" {
          name                      = local.name_prefix
          min_size                  = 2
          max_size                  = 4
          desired_capacity          = 2
          vpc_zone_identifier       = local.subnet_ids
          target_group_arns         = [aws_lb_target_group.app.arn]
          health_check_type         = "ELB"
          health_check_grace_period = 120

          launch_template {
            id      = aws_launch_template.app.id
            version = aws_launch_template.app.latest_version
          }
        }
      outputs.tf: |
        output "load_balancer_dns_name" {
          value       = aws_lb.app.dns_name
          description = "DNS name of the Application Load Balancer."
        }

        output "autoscaling_group" {
          value       = aws_autoscaling_group.app.name
          description = "Name of the Auto Scaling group of app servers."
        }
    starter:
      kind: terraform
      cloud: aws
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "~> 6.0"
              }
            }
          }
        providers.tf: |
          provider "aws" {
            region = var.aws_region

            default_tags {
              tags = local.common_tags
            }
          }
        locals.tf: |
          locals {
            name_prefix = "${var.project}-${var.environment}"
            common_tags = {
              Project     = var.project
              Environment = var.environment
              ManagedBy   = "nimbo"
            }

            # A small Python service on port 8080: /health answers ok, every
            # other path answers with the server's host name.
            user_data = <<-EOT
              #!/bin/bash
              set -euo pipefail
              mkdir -p /opt/app
              cat > /opt/app/server.py <<'PY'
              import json, socket
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = {"status": "ok"} if self.path == "/health" else {"server": socket.gethostname(), "path": self.path}
                      payload = json.dumps(body).encode()
                      self.send_response(200)
                      self.send_header("content-type", "application/json")
                      self.send_header("content-length", str(len(payload)))
                      self.end_headers()
                      self.wfile.write(payload)
              ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
              PY
              nohup python3 /opt/app/server.py >/var/log/app.log 2>&1 &
            EOT
          }
        variables.tf: |
          variable "project" {
            type        = string
            default     = "learn"
            description = "Project name: the first part of every resource name and the Project tag."

            validation {
              condition     = can(regex("^[a-z][a-z0-9-]{1,19}$", var.project))
              error_message = "project must be 2-20 lowercase letters, digits or hyphens, starting with a letter."
            }
          }

          variable "environment" {
            type        = string
            default     = "dev"
            description = "Deployment environment (dev, staging, prod, …): part of every resource name and the Environment tag."

            validation {
              condition     = can(regex("^[a-z][a-z0-9-]{0,11}$", var.environment))
              error_message = "environment must be 1-12 lowercase letters, digits or hyphens, starting with a letter."
            }
          }

          variable "aws_region" {
            type        = string
            default     = "us-east-1"
            description = "AWS region to deploy into."
          }

          variable "instance_type" {
            type        = string
            default     = "t3.micro"
            description = "EC2 instance type of the app servers (x86_64)."
          }
        main.tf: |
          data "aws_vpc" "default" {
            default = true
          }

          data "aws_subnets" "default" {
            filter {
              name   = "vpc-id"
              values = [data.aws_vpc.default.id]
            }

            filter {
              name   = "default-for-az"
              values = ["true"]
            }
          }

          locals {
            subnet_ids = sort(data.aws_subnets.default.ids)
          }

          data "aws_ssm_parameter" "al2023" {
            name = "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"
          }

          # Admin and app ports open to the whole internet.
          resource "aws_security_group" "web" {
            name        = "${local.name_prefix}-web"
            description = "Web server"
            vpc_id      = data.aws_vpc.default.id

            ingress {
              description = "SSH"
              from_port   = 22
              to_port     = 22
              protocol    = "tcp"
              cidr_blocks = ["0.0.0.0/0"]
            }

            ingress {
              description = "App"
              from_port   = 8080
              to_port     = 8080
              protocol    = "tcp"
              cidr_blocks = ["0.0.0.0/0"]
            }

            egress {
              description = "All outbound traffic"
              from_port   = 0
              to_port     = 0
              protocol    = "-1"
              cidr_blocks = ["0.0.0.0/0"]
            }
          }

          # One server in one Availability Zone.
          resource "aws_instance" "web" {
            ami                    = data.aws_ssm_parameter.al2023.value
            instance_type          = var.instance_type
            subnet_id              = local.subnet_ids[0]
            vpc_security_group_ids = [aws_security_group.web.id]
            user_data              = local.user_data
            tags                   = { Name = "${local.name_prefix}-web" }
          }
        outputs.tf: |
          output "instance_id" {
            value       = aws_instance.web.id
            description = "ID of the web server."
          }
    checks:
    - id: valid
      label: The configuration is valid
      type: validate
    - id: application-load-balancer
      label: An Application Load Balancer is the entry point
      type: has
      has:
        terraform:
          type: aws_lb
          where:
            load_balancer_type: application
            security_groups: {ref: aws_security_group}
    - id: health-check
      label: The target group health-checks /health
      type: has
      has:
        terraform:
          type: aws_lb_target_group
          where:
            port: 8080
            health_check.path: /health
    - id: listener
      label: A listener forwards to the target group
      type: has
      has:
        terraform:
          type: aws_lb_listener
          where:
            default_action.target_group_arn: {ref: aws_lb_target_group}
    - id: imdsv2
      label: The launch template requires IMDSv2
      type: has
      has:
        terraform:
          type: aws_launch_template
          where:
            metadata_options.http_tokens: required
    - id: auto-scaling-group
      label: An Auto Scaling group keeps at least 2 servers healthy behind the ALB
      type: has
      has:
        terraform:
          type: aws_autoscaling_group
          where:
            min_size: {min: 2}
            health_check_type: ELB
            target_group_arns: {ref: aws_lb_target_group}
            launch_template.id: {ref: aws_launch_template}
    - id: app-from-alb-only
      label: App servers accept traffic from the load balancer's security group
      type: has
      has:
        terraform:
          type: aws_security_group
          where:
            ingress.security_groups: {ref: aws_security_group}
    - id: no-single-instance
      label: No standalone EC2 instance remains
      type: has
      has:
        terraform:
          type: aws_instance
          count: {max: 0}
    - id: exposure-findings
      label: No admin ports open to the internet and no single-zone load balancer
      type: rules_clean
      rules_clean:
        codes: [bp_open_ingress, net_single_az]
        minSeverity: warning
    - id: deploy
      label: The app tier deploys to the local AWS emulator
      type: deploy
    sources:
    - title: Use Elastic Load Balancing to distribute incoming application traffic in your Auto Scaling group
      url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/autoscaling-load-balancer.html
    - title: Health checks for instances in an Auto Scaling group
      url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-health-checks.html
    - title: Health checks for Application Load Balancer target groups
      url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html
    - title: Application Load Balancers
      url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/application-load-balancers.html
    - title: Use IMDSv2
      url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-IMDS-new-instances.html
    - title: Security group rules for different use cases
      url: https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html
    - title: 'Terraform AWS provider: aws_autoscaling_group'
      url: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/autoscaling_group
    solvableWithoutCode: true
- op: upsert
  kind: challenge
  id: aws-three-tier-well-architected
  data:
    provider: aws
    level: expert
    title: Well-Architected review of a lift-and-shift web app
    summary: Rebuild a single-server, single-zone app into a secure, resilient three-tier architecture with zero best-practice and network warnings.
    minutes: 120
    tags: [well-architected, three-tier, vpc, alb, auto-scaling, rds, security]
    prerequisites: [aws-alb-auto-scaling, aws-rds-multi-az]
    runtime: design
    problem: |
      A company lifted its web application into AWS as-is: one EC2
      instance in a public subnet of one Availability Zone (SSH, HTTP and
      PostgreSQL open to the internet, an IAM role with full admin rights)
      and an RDS database that is public, single-AZ, unencrypted, without
      backups and with its password in a variable. You run the
      **Well-Architected review**.

      The AWS Well-Architected Framework evaluates a workload against six
      pillars: operational excellence, security, reliability, performance
      efficiency, cost optimization and sustainability. For a classic web
      application the reference answer is a **three-tier** network: a
      public tier with only the load balancer (and NAT gateways), a private
      application tier, and an isolated data tier, each in at least two
      Availability Zones, with security groups chained tier to tier. In
      this challenge you design that architecture; Nimbo grades the design
      (structure, best-practice rules and network analysis) rather than
      deploying it.
    requirements:
    - 'Network: subnets `aws_subnet.public`, `aws_subnet.app` and `aws_subnet.db`, each in two Availability Zones from a data source lookup. The app tier reaches the internet through NAT gateways in the public subnets; the db tier has no route to the internet.'
    - 'Edge: an internet-facing `aws_lb` in the public subnets that drops invalid header fields, with an HTTPS listener (an ACM certificate and a TLS security policy) and an HTTP listener that redirects to HTTPS.'
    - 'App tier: an `aws_autoscaling_group` in `aws_subnet.app` (at least 2 instances, `health_check_type = "ELB"`) from a launch template that requires IMDSv2; a target tracking `aws_autoscaling_policy`; instances managed through Systems Manager (`AmazonSSMManagedInstanceCore` attached to their role), not SSH; no standalone `aws_instance`.'
    - 'Data tier: `aws_db_instance` in a subnet group of `aws_subnet.db`, Multi-AZ, encrypted, not public, backups kept at least 7 days, master password managed in Secrets Manager.'
    - 'Security groups `aws_security_group.alb` → `aws_security_group.app` → `aws_security_group.db`: each tier accepts traffic only from the tier in front of it.'
    - 'Operations: an `aws_cloudwatch_metric_alarm` on the load balancer (`AWS/ApplicationELB`).'
    - No `bp_*` or `net_*` findings at warning level or above.
    hints:
    - 'Start from the network. Add the `aws_availability_zones` data source from the palette, then give every tier one subnet per zone: `public` + `public_b`, `app` + `app_b`, `db` + `db_b`, each with its own /24 and with `availability_zone` picked through **Link to…** → **More…** as `names[0]` or `names[1]`. Add one Elastic IP and one NAT gateway per zone in the public subnets, one app route table per zone whose `0.0.0.0/0` route goes to that zone''s NAT gateway, and a db route table with no route.'
    - 'Chain the security groups with `ingress` cards: the ALB group allows 80 and 443 from the internet, the app group allows 8080 with the ALB group linked in `security_groups`, the db group allows 5432 with the app group linked. Delete the pet server and its admin policy, and attach `arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore` to the server role with an `aws_iam_role_policy_attachment`.'
    - 'Build the edge and app tier as in the ALB challenge, using **Link to…** to add both public subnets to the ALB and both app subnets to the auto scaling group; the launch template''s `user_data` is `local.user_data` picked with **Link to…** and the **Base64-encode** switch on. Add an `aws_acm_certificate`, an HTTPS listener (`ssl_policy` `ELBSecurityPolicy-TLS13-1-2-2021-06`, `certificate_arn` linked) and an HTTP listener whose `default_action` is a **redirect** to port 443 / HTTPS / `HTTP_301`. Add an `aws_autoscaling_policy` of type **TargetTrackingScaling** on `ASGAverageCPUUtilization`, and finish the database: db subnets in the subnet group (remove the public one with the chip''s X), the db group instead of the server group, password cleared, managed password, Multi-AZ, encryption, 7 days of backups and a final snapshot.'
    solution: |
      The reference splits the design by tier: `main.tf` (network),
      `app.tf` (load balancer, app servers, scaling, alarm) and `data.tf`
      (database). How each pillar is addressed:

      | Pillar | Design decision |
      |---|---|
      | Security | Only the ALB is public; SG chain ALB → app → db; TLS 1.3/1.2 policy and HTTP→HTTPS redirect; IMDSv2; SSM instead of SSH; least-privilege instance role; encrypted RDS and EBS; password in Secrets Manager |
      | Reliability | Every tier in two AZs; ASG with ELB health checks replaces broken instances; RDS Multi-AZ with 7-day backups; one NAT gateway per AZ so a zone failure doesn't cut egress for the other |
      | Performance efficiency | Target tracking keeps average CPU near 50 % instead of fixed capacity |
      | Operational excellence | Infrastructure as code split by concern; an alarm on unhealthy targets |
      | Cost optimization | `single_nat_gateway` switches to one NAT gateway for non-production environments (a documented trade-off against zone independence); instance types are variables to right-size |
      | Sustainability | Scaling in when idle avoids running unused capacity |

      ```hcl
      resource "aws_nat_gateway" "main" {
        count         = local.nat_count
        allocation_id = aws_eip.nat[count.index].id
        subnet_id     = aws_subnet.public[count.index].id
      }

      resource "aws_route" "app_egress" {
        count                  = length(local.azs)
        route_table_id         = aws_route_table.app[count.index].id
        destination_cidr_block = "0.0.0.0/0"
        nat_gateway_id         = aws_nat_gateway.main[min(count.index, local.nat_count - 1)].id
      }
      ```

      Next steps a real review would add: AWS WAF on the ALB, ALB access
      logs to S3, VPC Flow Logs, and a Well-Architected Tool review to
      track the remaining risks.

      **Without writing code in Nimbo**

      1. From the palette, add the data source `aws_availability_zones` named `available` with `state` `available`.
      2. Select `aws_subnet.public` and pick `names[0]` of the zones lookup for `availability_zone` (**Link to…** → **More…**). Add `aws_subnet.public_b` (VPC linked, `10.20.1.0/24`, `names[1]`, `map_public_ip_on_launch` on, a `Name` tag) and an `aws_route_table_association` linking it to `aws_route_table.public`.
      3. Add two `aws_eip`s (`nat`, `nat_b`) with `domain` `vpc`, and two `aws_nat_gateway`s (`main` in `aws_subnet.public`, `main_b` in `aws_subnet.public_b`) with **Link to…** each Elastic IP's `allocation_id`.
      4. App tier: add `aws_subnet.app` (`10.20.10.0/24`, `names[0]`) and `aws_subnet.app_b` (`10.20.11.0/24`, `names[1]`); add route tables `app` and `app_b`, each with an `aws_route` for `0.0.0.0/0` whose `nat_gateway_id` links to the NAT gateway of the same zone; add two associations linking each app subnet to its route table.
      5. Data tier: add `aws_subnet.db` (`10.20.20.0/24`, `names[0]`) and `aws_subnet.db_b` (`10.20.21.0/24`, `names[1]`), an `aws_route_table` named `db` with no routes, and two associations linking both db subnets to it.
      6. Security groups (all with `vpc_id` linked to the VPC): `alb` with `ingress` cards for 80 and 443 from `0.0.0.0/0` and an all-traffic `egress` card; `app` with an `ingress` card for 8080 whose `security_groups` links `aws_security_group.alb` → `id`, plus an all-traffic `egress` card; `db` with an `ingress` card for 5432 whose `security_groups` links `aws_security_group.app` → `id`.
      7. Delete `aws_instance.server` and `aws_iam_role_policy.server_admin`. Add an `aws_iam_role_policy_attachment` named `ssm`: **Link to…** `aws_iam_role.server` → `name` for `role`, and type `arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore` as `policy_arn`.
      8. Add an `aws_lb_target_group` named `app` (port 8080, HTTP, VPC linked, `health_check` path `/health`).
      9. Add an `aws_lb` named `app`: `load_balancer_type` **application**, `internal` off, **Link to…** the ALB group's `id` in `security_groups`, and **Link to…** `aws_subnet.public` → `id`, then `aws_subnet.public_b` → `id`, in `subnets`; turn **drop_invalid_header_fields** on so requests with malformed headers are dropped, not forwarded.
      10. Add an `aws_acm_certificate` named `app` (`domain_name` `shop.example.com`, `validation_method` DNS).
      11. Add an `aws_lb_listener` named `https`: `load_balancer_arn` linked to the ALB, port 443, protocol HTTPS, `ssl_policy` `ELBSecurityPolicy-TLS13-1-2-2021-06`, `certificate_arn` linked to the certificate's `arn`, and a `default_action` of type **forward** to the target group's `arn`.
      12. Add an `aws_lb_listener` named `http`: port 80, protocol HTTP, and a `default_action` of type **redirect** whose `redirect` block has protocol `HTTPS`, port `443` and status code `HTTP_301`.
      13. Add an `aws_launch_template` named `app`: `image_id` linked to `data.aws_ssm_parameter.al2023` → `value`, `instance_type` linked to `var.instance_type`, `aws_security_group.app` → `id` in `vpc_security_group_ids`, `iam_instance_profile` `name` linked to `aws_iam_instance_profile.server` → `name`, `user_data` linked to `local.user_data` with **Base64-encode** turned on in the **Link to…** picker, and in `metadata_options` `http_endpoint` **enabled** and `http_tokens` **required**.
      14. Add an `aws_autoscaling_group` named `app`: `min_size` 2, `max_size` 4, `desired_capacity` 2, `health_check_type` **ELB**, both app subnets' `id`s added to `vpc_zone_identifier`, the target group's `arn` in `target_group_arns`, and the `launch_template` block linked to the template's `id` and `latest_version`.
      15. Add an `aws_autoscaling_policy` named `cpu`: `autoscaling_group_name` linked to the group's `name`, `policy_type` **TargetTrackingScaling**, and in `target_tracking_configuration` a `target_value` of 50 with `predefined_metric_type` **ASGAverageCPUUtilization**.
      16. Select `aws_db_subnet_group.db`: add `aws_subnet.db` → `id` and `aws_subnet.db_b` → `id` with **Link to…** and remove the public subnet's chip with its X.
      17. Select `aws_db_instance.main`: add `aws_security_group.db` → `id` to `vpc_security_group_ids` and remove the server group's chip; clear `password`; turn on `manage_master_user_password`, `multi_az` and `storage_encrypted`; turn off `publicly_accessible` and `skip_final_snapshot`; set `backup_retention_period` to 7 and `final_snapshot_identifier` to `shop-prod-db-final`. In the **Variables** panel, mark `db_password` **Sensitive**. Then delete `aws_security_group.server`.
      18. Add an `aws_cloudwatch_metric_alarm` named `alb_5xx`: namespace `AWS/ApplicationELB`, metric `HTTPCode_ELB_5XX_Count`, statistic `Sum`, period 60, 1 evaluation period, threshold 10, comparison **GreaterThanThreshold**, and a `dimensions` row with key `LoadBalancer` whose value uses **Link to…** to pick `aws_lb.app` → `arn_suffix`.
    solutionFiles:
      main.tf: |
        data "aws_availability_zones" "available" {
          state = "available"
        }

        locals {
          azs = slice(data.aws_availability_zones.available.names, 0, 2)
          # One NAT gateway per zone; one in total when cost matters more
          # than zone independence (non-production).
          nat_count = var.single_nat_gateway ? 1 : length(local.azs)
        }

        resource "aws_vpc" "main" {
          cidr_block           = var.vpc_cidr
          enable_dns_support   = true
          enable_dns_hostnames = true
          tags                 = { Name = local.name_prefix }
        }

        resource "aws_internet_gateway" "main" {
          vpc_id = aws_vpc.main.id
          tags   = { Name = local.name_prefix }
        }

        # Public tier: the load balancer and the NAT gateways only.
        resource "aws_subnet" "public" {
          count                   = length(local.azs)
          vpc_id                  = aws_vpc.main.id
          cidr_block              = cidrsubnet(var.vpc_cidr, 8, count.index)
          availability_zone       = local.azs[count.index]
          map_public_ip_on_launch = false
          tags                    = { Name = "${local.name_prefix}-public-${local.azs[count.index]}", Tier = "public" }
        }

        # App tier: private, outbound through the NAT gateways.
        resource "aws_subnet" "app" {
          count             = length(local.azs)
          vpc_id            = aws_vpc.main.id
          cidr_block        = cidrsubnet(var.vpc_cidr, 8, count.index + 10)
          availability_zone = local.azs[count.index]
          tags              = { Name = "${local.name_prefix}-app-${local.azs[count.index]}", Tier = "app" }
        }

        # Data tier: isolated, no route to the internet.
        resource "aws_subnet" "db" {
          count             = length(local.azs)
          vpc_id            = aws_vpc.main.id
          cidr_block        = cidrsubnet(var.vpc_cidr, 8, count.index + 20)
          availability_zone = local.azs[count.index]
          tags              = { Name = "${local.name_prefix}-db-${local.azs[count.index]}", Tier = "db" }
        }

        resource "aws_route_table" "public" {
          vpc_id = aws_vpc.main.id
          tags   = { Name = "${local.name_prefix}-public" }
        }

        resource "aws_route" "public_internet" {
          route_table_id         = aws_route_table.public.id
          destination_cidr_block = "0.0.0.0/0"
          gateway_id             = aws_internet_gateway.main.id
        }

        resource "aws_route_table_association" "public" {
          count          = length(local.azs)
          subnet_id      = aws_subnet.public[count.index].id
          route_table_id = aws_route_table.public.id
        }

        resource "aws_eip" "nat" {
          count  = local.nat_count
          domain = "vpc"
          tags   = { Name = "${local.name_prefix}-nat-${local.azs[count.index]}" }
        }

        resource "aws_nat_gateway" "main" {
          count         = local.nat_count
          allocation_id = aws_eip.nat[count.index].id
          subnet_id     = aws_subnet.public[count.index].id
          tags          = { Name = "${local.name_prefix}-${local.azs[count.index]}" }
          depends_on    = [aws_internet_gateway.main]
        }

        # One route table per zone: each app subnet uses its own zone's NAT
        # gateway (or the single one).
        resource "aws_route_table" "app" {
          count  = length(local.azs)
          vpc_id = aws_vpc.main.id
          tags   = { Name = "${local.name_prefix}-app-${local.azs[count.index]}" }
        }

        resource "aws_route" "app_egress" {
          count                  = length(local.azs)
          route_table_id         = aws_route_table.app[count.index].id
          destination_cidr_block = "0.0.0.0/0"
          nat_gateway_id         = aws_nat_gateway.main[min(count.index, local.nat_count - 1)].id
        }

        resource "aws_route_table_association" "app" {
          count          = length(local.azs)
          subnet_id      = aws_subnet.app[count.index].id
          route_table_id = aws_route_table.app[count.index].id
        }

        resource "aws_route_table" "db" {
          vpc_id = aws_vpc.main.id
          tags   = { Name = "${local.name_prefix}-db" }
        }

        resource "aws_route_table_association" "db" {
          count          = length(local.azs)
          subnet_id      = aws_subnet.db[count.index].id
          route_table_id = aws_route_table.db.id
        }
      app.tf: |
        data "aws_ssm_parameter" "al2023" {
          name = "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"
        }

        resource "aws_security_group" "alb" {
          name        = "${local.name_prefix}-alb"
          description = "Load balancer: HTTP and HTTPS from the internet"
          vpc_id      = aws_vpc.main.id

          ingress {
            description = "HTTP (redirected to HTTPS)"
            from_port   = 80
            to_port     = 80
            protocol    = "tcp"
            cidr_blocks = ["0.0.0.0/0"]
          }

          ingress {
            description = "HTTPS"
            from_port   = 443
            to_port     = 443
            protocol    = "tcp"
            cidr_blocks = ["0.0.0.0/0"]
          }

          egress {
            description = "Requests and health checks to the app tier"
            from_port   = 8080
            to_port     = 8080
            protocol    = "tcp"
            cidr_blocks = [var.vpc_cidr]
          }
        }

        resource "aws_security_group" "app" {
          name        = "${local.name_prefix}-app"
          description = "App servers: 8080 from the load balancer only"
          vpc_id      = aws_vpc.main.id

          ingress {
            description     = "Requests and health checks from the load balancer"
            from_port       = 8080
            to_port         = 8080
            protocol        = "tcp"
            security_groups = [aws_security_group.alb.id]
          }

          egress {
            description = "Outbound HTTPS (updates, AWS APIs) through the NAT gateways"
            from_port   = 443
            to_port     = 443
            protocol    = "tcp"
            cidr_blocks = ["0.0.0.0/0"]
          }

          egress {
            description = "PostgreSQL in the data tier"
            from_port   = 5432
            to_port     = 5432
            protocol    = "tcp"
            cidr_blocks = [var.vpc_cidr]
          }
        }

        resource "aws_lb" "app" {
          name                       = local.name_prefix
          load_balancer_type         = "application"
          internal                   = false
          security_groups            = [aws_security_group.alb.id]
          subnets                    = aws_subnet.public[*].id
          drop_invalid_header_fields = true
        }

        resource "aws_lb_target_group" "app" {
          name                 = local.name_prefix
          port                 = 8080
          protocol             = "HTTP"
          target_type          = "instance"
          vpc_id               = aws_vpc.main.id
          deregistration_delay = 30

          health_check {
            path                = "/health"
            matcher             = "200"
            interval            = 15
            healthy_threshold   = 2
            unhealthy_threshold = 2
          }
        }

        resource "aws_lb_listener" "https" {
          load_balancer_arn = aws_lb.app.arn
          port              = 443
          protocol          = "HTTPS"
          ssl_policy        = "ELBSecurityPolicy-TLS13-1-2-2021-06"
          certificate_arn   = var.certificate_arn

          default_action {
            type             = "forward"
            target_group_arn = aws_lb_target_group.app.arn
          }
        }

        resource "aws_lb_listener" "http" {
          load_balancer_arn = aws_lb.app.arn
          port              = 80
          protocol          = "HTTP"

          default_action {
            type = "redirect"

            redirect {
              port        = "443"
              protocol    = "HTTPS"
              status_code = "HTTP_301"
            }
          }
        }

        # Least privilege for the servers: Systems Manager only (Session
        # Manager replaces SSH).
        resource "aws_iam_role" "app" {
          name = "${local.name_prefix}-app"
          assume_role_policy = jsonencode({
            Version = "2012-10-17"
            Statement = [{
              Effect    = "Allow"
              Principal = { Service = "ec2.amazonaws.com" }
              Action    = "sts:AssumeRole"
            }]
          })
        }

        resource "aws_iam_role_policy_attachment" "app_ssm" {
          role       = aws_iam_role.app.name
          policy_arn = "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"
        }

        resource "aws_iam_instance_profile" "app" {
          name = "${local.name_prefix}-app"
          role = aws_iam_role.app.name
        }

        resource "aws_launch_template" "app" {
          name_prefix            = "${local.name_prefix}-app-"
          image_id               = data.aws_ssm_parameter.al2023.value
          instance_type          = var.instance_type
          vpc_security_group_ids = [aws_security_group.app.id]
          user_data              = base64encode(local.user_data)

          iam_instance_profile {
            arn = aws_iam_instance_profile.app.arn
          }

          metadata_options {
            http_endpoint = "enabled"
            http_tokens   = "required"
          }

          block_device_mappings {
            device_name = "/dev/xvda"

            ebs {
              volume_size = 20
              volume_type = "gp3"
              encrypted   = true
            }
          }

          tag_specifications {
            resource_type = "instance"
            tags          = merge(local.common_tags, { Name = "${local.name_prefix}-app" })
          }
        }

        resource "aws_autoscaling_group" "app" {
          name                      = local.name_prefix
          min_size                  = 2
          max_size                  = 6
          vpc_zone_identifier       = aws_subnet.app[*].id
          target_group_arns         = [aws_lb_target_group.app.arn]
          health_check_type         = "ELB"
          health_check_grace_period = 120

          launch_template {
            id      = aws_launch_template.app.id
            version = aws_launch_template.app.latest_version
          }
        }

        # Capacity follows demand: average CPU around 50 %.
        resource "aws_autoscaling_policy" "cpu" {
          name                   = "${local.name_prefix}-cpu"
          autoscaling_group_name = aws_autoscaling_group.app.name
          policy_type            = "TargetTrackingScaling"

          target_tracking_configuration {
            predefined_metric_specification {
              predefined_metric_type = "ASGAverageCPUUtilization"
            }
            target_value = 50
          }
        }

        resource "aws_cloudwatch_metric_alarm" "unhealthy_targets" {
          alarm_name          = "${local.name_prefix}-unhealthy-targets"
          alarm_description   = "At least one app server fails the load balancer health check."
          namespace           = "AWS/ApplicationELB"
          metric_name         = "UnHealthyHostCount"
          statistic           = "Maximum"
          period              = 60
          evaluation_periods  = 3
          comparison_operator = "GreaterThanThreshold"
          threshold           = 0
          dimensions = {
            LoadBalancer = aws_lb.app.arn_suffix
            TargetGroup  = aws_lb_target_group.app.arn_suffix
          }
        }
      data.tf: |
        resource "aws_security_group" "db" {
          name        = "${local.name_prefix}-db"
          description = "PostgreSQL from the app tier only"
          vpc_id      = aws_vpc.main.id

          ingress {
            description     = "PostgreSQL from the app servers"
            from_port       = 5432
            to_port         = 5432
            protocol        = "tcp"
            security_groups = [aws_security_group.app.id]
          }
        }

        resource "aws_db_subnet_group" "db" {
          name       = "${local.name_prefix}-db"
          subnet_ids = aws_subnet.db[*].id
        }

        resource "aws_db_instance" "main" {
          identifier                  = "${local.name_prefix}-db"
          engine                      = "postgres"
          engine_version              = "16"
          instance_class              = var.db_instance_class
          allocated_storage           = 20
          storage_type                = "gp3"
          db_name                     = "app"
          username                    = "app_admin"
          manage_master_user_password = true
          db_subnet_group_name        = aws_db_subnet_group.db.name
          vpc_security_group_ids      = [aws_security_group.db.id]
          publicly_accessible         = false
          multi_az                    = true
          storage_encrypted           = true
          backup_retention_period     = 7
          backup_window               = "03:00-04:00"
          copy_tags_to_snapshot       = true
          deletion_protection         = true
          skip_final_snapshot         = false
          final_snapshot_identifier   = "${local.name_prefix}-db-final"
        }
      variables.tf: |
        variable "project" {
          type        = string
          default     = "shop"
          description = "Project name: the first part of every resource name and the Project tag."

          validation {
            condition     = can(regex("^[a-z][a-z0-9-]{1,19}$", var.project))
            error_message = "project must be 2-20 lowercase letters, digits or hyphens, starting with a letter."
          }
        }

        variable "environment" {
          type        = string
          default     = "prod"
          description = "Deployment environment (dev, staging, prod, …): part of every resource name and the Environment tag."

          validation {
            condition     = can(regex("^[a-z][a-z0-9-]{0,11}$", var.environment))
            error_message = "environment must be 1-12 lowercase letters, digits or hyphens, starting with a letter."
          }
        }

        variable "aws_region" {
          type        = string
          default     = "us-east-1"
          description = "AWS region to deploy into."
        }

        variable "vpc_cidr" {
          type        = string
          default     = "10.20.0.0/16"
          description = "CIDR block of the VPC; every subnet is a /24 slice of it."
        }

        variable "single_nat_gateway" {
          type        = bool
          default     = false
          description = "Use one NAT gateway for both zones (cheaper, but egress depends on one zone). Keep false in production."
        }

        variable "certificate_arn" {
          type        = string
          description = "ARN of the ACM certificate of the site's domain, for the HTTPS listener."
        }

        variable "instance_type" {
          type        = string
          default     = "t3.small"
          description = "EC2 instance type of the app servers (x86_64)."
        }

        variable "db_instance_class" {
          type        = string
          default     = "db.t4g.medium"
          description = "RDS instance class of the database."
        }
      outputs.tf: |
        output "load_balancer_dns_name" {
          value       = aws_lb.app.dns_name
          description = "DNS name of the load balancer: point the site's domain at it."
        }

        output "db_endpoint" {
          value       = aws_db_instance.main.address
          description = "Host name of the database (reachable from the app tier only)."
        }
    starter:
      kind: terraform
      cloud: aws
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "~> 6.0"
              }
            }
          }
        providers.tf: |
          provider "aws" {
            region = var.aws_region

            default_tags {
              tags = local.common_tags
            }
          }
        locals.tf: |
          locals {
            name_prefix = "${var.project}-${var.environment}"
            common_tags = {
              Project     = var.project
              Environment = var.environment
              ManagedBy   = "nimbo"
            }

            # The app: a small Python service on port 8080 (/health answers ok).
            user_data = <<-EOT
              #!/bin/bash
              set -euo pipefail
              mkdir -p /opt/app
              cat > /opt/app/server.py <<'PY'
              import json, socket
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = {"status": "ok"} if self.path == "/health" else {"server": socket.gethostname()}
                      payload = json.dumps(body).encode()
                      self.send_response(200)
                      self.send_header("content-type", "application/json")
                      self.send_header("content-length", str(len(payload)))
                      self.end_headers()
                      self.wfile.write(payload)
              ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
              PY
              nohup python3 /opt/app/server.py >/var/log/app.log 2>&1 &
            EOT
          }
        variables.tf: |
          variable "project" {
            type        = string
            default     = "shop"
            description = "Project name: the first part of every resource name and the Project tag."

            validation {
              condition     = can(regex("^[a-z][a-z0-9-]{1,19}$", var.project))
              error_message = "project must be 2-20 lowercase letters, digits or hyphens, starting with a letter."
            }
          }

          variable "environment" {
            type        = string
            default     = "prod"
            description = "Deployment environment (dev, staging, prod, …): part of every resource name and the Environment tag."

            validation {
              condition     = can(regex("^[a-z][a-z0-9-]{0,11}$", var.environment))
              error_message = "environment must be 1-12 lowercase letters, digits or hyphens, starting with a letter."
            }
          }

          variable "aws_region" {
            type        = string
            default     = "us-east-1"
            description = "AWS region to deploy into."
          }

          variable "vpc_cidr" {
            type        = string
            default     = "10.20.0.0/16"
            description = "CIDR block of the VPC."
          }

          variable "instance_type" {
            type        = string
            default     = "t3.small"
            description = "EC2 instance type of the server (x86_64)."
          }

          variable "db_password" {
            type        = string
            description = "Master password of the database."
          }
        main.tf: |
          # Lift and shift: everything in one public subnet of one zone.
          resource "aws_vpc" "main" {
            cidr_block           = var.vpc_cidr
            enable_dns_support   = true
            enable_dns_hostnames = true
            tags                 = { Name = local.name_prefix }
          }

          resource "aws_internet_gateway" "main" {
            vpc_id = aws_vpc.main.id
            tags   = { Name = local.name_prefix }
          }

          resource "aws_subnet" "public" {
            vpc_id                  = aws_vpc.main.id
            cidr_block              = cidrsubnet(var.vpc_cidr, 8, 0)
            availability_zone       = "us-east-1a"
            map_public_ip_on_launch = true
            tags                    = { Name = "${local.name_prefix}-public" }
          }

          resource "aws_route_table" "public" {
            vpc_id = aws_vpc.main.id
            tags   = { Name = "${local.name_prefix}-public" }
          }

          resource "aws_route" "internet" {
            route_table_id         = aws_route_table.public.id
            destination_cidr_block = "0.0.0.0/0"
            gateway_id             = aws_internet_gateway.main.id
          }

          resource "aws_route_table_association" "public" {
            subnet_id      = aws_subnet.public.id
            route_table_id = aws_route_table.public.id
          }

          resource "aws_security_group" "server" {
            name        = "${local.name_prefix}-server"
            description = "Everything the server and database need"
            vpc_id      = aws_vpc.main.id

            ingress {
              description = "SSH"
              from_port   = 22
              to_port     = 22
              protocol    = "tcp"
              cidr_blocks = ["0.0.0.0/0"]
            }

            ingress {
              description = "App"
              from_port   = 8080
              to_port     = 8080
              protocol    = "tcp"
              cidr_blocks = ["0.0.0.0/0"]
            }

            ingress {
              description = "PostgreSQL"
              from_port   = 5432
              to_port     = 5432
              protocol    = "tcp"
              cidr_blocks = ["0.0.0.0/0"]
            }

            egress {
              description = "All outbound traffic"
              from_port   = 0
              to_port     = 0
              protocol    = "-1"
              cidr_blocks = ["0.0.0.0/0"]
            }
          }

          resource "aws_iam_role" "server" {
            name = "${local.name_prefix}-server"
            assume_role_policy = jsonencode({
              Version = "2012-10-17"
              Statement = [{
                Effect    = "Allow"
                Principal = { Service = "ec2.amazonaws.com" }
                Action    = "sts:AssumeRole"
              }]
            })
          }

          resource "aws_iam_role_policy" "server_admin" {
            name = "${local.name_prefix}-admin"
            role = aws_iam_role.server.id
            policy = jsonencode({
              Version   = "2012-10-17"
              Statement = [{ Effect = "Allow", Action = "*", Resource = "*" }]
            })
          }

          resource "aws_iam_instance_profile" "server" {
            name = "${local.name_prefix}-server"
            role = aws_iam_role.server.name
          }

          data "aws_ssm_parameter" "al2023" {
            name = "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"
          }

          resource "aws_instance" "server" {
            ami                    = data.aws_ssm_parameter.al2023.value
            instance_type          = var.instance_type
            subnet_id              = aws_subnet.public.id
            vpc_security_group_ids = [aws_security_group.server.id]
            iam_instance_profile   = aws_iam_instance_profile.server.name
            user_data              = local.user_data
            tags                   = { Name = "${local.name_prefix}-server" }
          }

          resource "aws_db_subnet_group" "db" {
            name       = "${local.name_prefix}-db"
            subnet_ids = [aws_subnet.public.id]
          }

          resource "aws_db_instance" "main" {
            identifier              = "${local.name_prefix}-db"
            engine                  = "postgres"
            engine_version          = "16"
            instance_class          = "db.t4g.medium"
            allocated_storage       = 20
            db_name                 = "app"
            username                = "app_admin"
            password                = var.db_password
            db_subnet_group_name    = aws_db_subnet_group.db.name
            vpc_security_group_ids  = [aws_security_group.server.id]
            publicly_accessible     = true
            backup_retention_period = 0
            skip_final_snapshot     = true
          }
        outputs.tf: |
          output "server_public_ip" {
            value       = aws_instance.server.public_ip
            description = "Public IP of the server."
          }
    checks:
    - id: valid
      label: The configuration is valid
      type: validate
    - id: no-findings
      label: No best-practice or network findings at warning level or above
      type: rules_clean
      rules_clean:
        prefixes: [bp_, net_]
        minSeverity: warning
    - id: zones-lookup
      label: Availability Zones come from a data source
      type: has
      has:
        terraform:
          type: data.aws_availability_zones
    - id: app-tier-subnets
      label: A private app tier (aws_subnet.app)
      type: has
      has:
        terraform:
          type: aws_subnet
          name: app
    - id: db-tier-subnets
      label: An isolated data tier (aws_subnet.db)
      type: has
      has:
        terraform:
          type: aws_subnet
          name: db
    - id: nat-egress
      label: The app tier reaches the internet through NAT gateways in the public subnets
      type: has
      has:
        terraform:
          type: aws_nat_gateway
          where:
            subnet_id: {ref: aws_subnet.public}
    - id: public-alb
      label: An internet-facing ALB in the public subnets
      type: has
      has:
        terraform:
          type: aws_lb
          where:
            load_balancer_type: application
            subnets: {ref: aws_subnet.public}
    - id: https-listener
      label: An HTTPS listener with a TLS policy and certificate
      type: has
      has:
        terraform:
          type: aws_lb_listener
          where:
            protocol: HTTPS
            ssl_policy: {exists: true}
            certificate_arn: {exists: true}
    - id: http-redirect
      label: HTTP redirects to HTTPS
      type: has
      has:
        terraform:
          type: aws_lb_listener
          where:
            default_action.type: redirect
            default_action.redirect.protocol: HTTPS
    - id: asg-in-app-tier
      label: An Auto Scaling group of at least 2 servers in aws_subnet.app with ELB health checks
      type: has
      has:
        terraform:
          type: aws_autoscaling_group
          where:
            vpc_zone_identifier: {ref: aws_subnet.app}
            health_check_type: ELB
            min_size: {min: 2}
            target_group_arns: {ref: aws_lb_target_group}
    - id: target-tracking
      label: A target tracking scaling policy
      type: has
      has:
        terraform:
          type: aws_autoscaling_policy
          where:
            policy_type: TargetTrackingScaling
    - id: imdsv2
      label: The launch template requires IMDSv2
      type: has
      has:
        terraform:
          type: aws_launch_template
          where:
            metadata_options.http_tokens: required
    - id: ssm-instead-of-ssh
      label: Servers are managed through Systems Manager
      type: has
      has:
        terraform:
          type: aws_iam_role_policy_attachment
          where:
            policy_arn: {contains: AmazonSSMManagedInstanceCore}
    - id: no-pet-server
      label: No standalone EC2 instance
      type: has
      has:
        terraform:
          type: aws_instance
          count: {max: 0}
    - id: database
      label: The database is Multi-AZ, encrypted, private, backed up and has a managed password
      type: has
      has:
        terraform:
          type: aws_db_instance
          where:
            multi_az: true
            storage_encrypted: true
            publicly_accessible: false
            backup_retention_period: {min: 7}
            manage_master_user_password: true
    - id: db-subnet-group
      label: The database lives in the data tier (aws_subnet.db)
      type: has
      has:
        terraform:
          type: aws_db_subnet_group
          where:
            subnet_ids: {ref: aws_subnet.db}
    - id: sg-alb-to-app
      label: The app tier accepts traffic from the load balancer only
      type: has
      has:
        terraform:
          type: aws_security_group
          name: app
          where:
            ingress.security_groups: {ref: aws_security_group.alb}
    - id: sg-app-to-db
      label: The data tier accepts traffic from the app tier only
      type: has
      has:
        terraform:
          type: aws_security_group
          name: db
          where:
            ingress.security_groups: {ref: aws_security_group.app}
    - id: alb-alarm
      label: An alarm watches the load balancer
      type: has
      has:
        terraform:
          type: aws_cloudwatch_metric_alarm
          where:
            namespace: AWS/ApplicationELB
    sources:
    - title: AWS Well-Architected Framework
      url: https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html
    - title: The pillars of the framework
      url: https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html
    - title: 'AWS Certified Solutions Architect – Professional: Domain 3, Continuous Improvement for Existing Solutions'
      url: https://docs.aws.amazon.com/aws-certification/latest/solutions-architect-professional-02/solutions-architect-professional-02-domain3.html
    - title: 'Example: VPC with servers in private subnets and NAT'
      url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-example-private-subnets-nat.html
    - title: Create an HTTPS listener for your Application Load Balancer
      url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/create-https-listener.html
    - title: Target tracking scaling policies for Amazon EC2 Auto Scaling
      url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html
    - title: AWS Systems Manager Session Manager
      url: https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html
    - title: Multi-AZ DB instance deployments for Amazon RDS
      url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html
    solvableWithoutCode: true
