- op: upsert
  kind: challenge
  id: aws-lambda-least-privilege
  data:
    provider: aws
    level: beginner
    title: A least-privilege role for a Lambda function
    summary: Replace an admin policy on a Lambda execution role with exactly the DynamoDB read and logging permissions it needs.
    minutes: 25
    tags: [iam, lambda, least-privilege, dynamodb, cloudwatch-logs]
    prerequisites: [aws-private-s3-bucket]
    runtime: emulated
    problem: |
      The `reader` Lambda function looks up one order in a DynamoDB table.
      To "make it work" someone gave its execution role a policy that
      allows every action on every resource (`"*"` on `"*"`). If the
      function's code or dependencies are ever compromised, the attacker
      gets administrator access to the whole account.

      A Lambda **execution role** is the identity the function assumes when
      it runs; its policies decide which AWS APIs the code may call. The
      IAM best practice is **least privilege**: grant only the actions the
      workload uses, on only the resources it uses. This function needs to
      read items from one table and write its own logs, nothing else. Logs
      also need a home: a CloudWatch log group with a retention period, so
      they don't pile up (and cost) forever.

      Fix the IAM policy and add the log group. The function deploys to the
      local AWS emulator when you check.
    requirements:
    - 'The role policy allows only read actions on the orders table (for this code: `dynamodb:GetItem`), with `Resource` set to the table''s ARN (`aws_dynamodb_table.orders.arn`), not `"*"`.'
    - No policy statement allows `*` on `*` and no service-wide wildcard such as `dynamodb:*` (no `bp_iam_wildcard` finding).
    - An `aws_cloudwatch_log_group` named `/aws/lambda/<function name>` sets `retention_in_days` (no `bp_log_retention` finding).
    - The role may write logs only to that log group (`logs:CreateLogStream`, `logs:PutLogEvents` on the log group ARN followed by `:*`).
    - The workflow deploys.
    hints:
    - 'Read the function code in `main.tf`: which DynamoDB API does it call? It only reads one item, so the function only needs read access to that one table.'
    - 'Grants are canvas gestures: drag the function onto the `orders` table and pick **Read**. Nimbo writes the DynamoDB read actions on the table''s ARN into the role''s policy. Then open the role policy''s **Access** section and delete the statement that allows `*` on `*` with **Delete statement**.'
    - For logs, add an `aws_cloudwatch_log_group` from the palette. Drag the function onto it and pick **Send the function's logs to this log group** (it names the group `/aws/lambda/<function name>` and keeps logs 14 days), then drag the function onto it again and pick **Write** so the function can create log streams and put log events there.
    solution: |
      The admin statement becomes two narrow statements, and the log group
      is created by Terraform with a retention period:

      ```hcl
      policy = jsonencode({
        Version = "2012-10-17"
        Statement = [
          {
            Sid      = "ReadOrders"
            Effect   = "Allow"
            Action   = ["dynamodb:GetItem"]
            Resource = aws_dynamodb_table.orders.arn
          },
          {
            Sid      = "WriteOwnLogs"
            Effect   = "Allow"
            Action   = ["logs:CreateLogStream", "logs:PutLogEvents"]
            Resource = "${aws_cloudwatch_log_group.reader.arn}:*"
          }
        ]
      })
      ```

      Why: IAM recommends granting least privilege and refining broad
      permissions down to the actions and resources a workload uses; the
      Lambda guide applies the same rule to execution roles. Creating the
      log group in Terraform (instead of letting Lambda create it on first
      run) lets you set `retention_in_days`, and scoping `logs:*`
      permissions to it means the function can't write into other groups.
      The `AWSLambdaBasicExecutionRole` managed policy is a quick start,
      but it allows writing to any log group in the account.

      **Without writing code in Nimbo**

      1. Drag `aws_lambda_function.reader` onto `aws_dynamodb_table.orders` and pick **Read**.
      2. From the palette, add an `aws_cloudwatch_log_group` named `reader`.
      3. Drag the function onto the log group and pick **Send the function's logs to this log group**.
      4. Drag the function onto the log group again and pick **Write**.
      5. Select `aws_iam_role_policy.reader`, open its **Access** section and click **Delete statement** on the statement that allows every action (`*`) on every resource (`*`).
    solutionFiles:
      main.tf: |
        resource "aws_dynamodb_table" "orders" {
          name         = "${local.name_prefix}-orders"
          billing_mode = "PAY_PER_REQUEST"
          hash_key     = "id"

          attribute {
            name = "id"
            type = "S"
          }

          server_side_encryption {
            enabled = true
          }
        }

        data "archive_file" "reader" {
          type        = "zip"
          output_path = "${path.module}/build/reader.zip"

          source {
            filename = "index.mjs"
            content  = <<-EOT
              import { DynamoDBClient, GetItemCommand } from "@aws-sdk/client-dynamodb";

              const db = new DynamoDBClient({});

              export const handler = async (event) => {
                const id = String(event?.id ?? "1");
                const out = await db.send(new GetItemCommand({
                  TableName: process.env.TABLE_NAME,
                  Key: { id: { S: id } },
                }));
                return { found: Boolean(out.Item), id };
              };
            EOT
          }
        }

        resource "aws_iam_role" "reader" {
          name = "${local.name_prefix}-reader"
          assume_role_policy = jsonencode({
            Version = "2012-10-17"
            Statement = [{
              Effect    = "Allow"
              Principal = { Service = "lambda.amazonaws.com" }
              Action    = "sts:AssumeRole"
            }]
          })
        }

        # Exactly what the code uses: one read action on one table, and
        # writing to the function's own log group.
        resource "aws_iam_role_policy" "reader" {
          name = "${local.name_prefix}-reader"
          role = aws_iam_role.reader.id
          policy = jsonencode({
            Version = "2012-10-17"
            Statement = [
              {
                Sid      = "ReadOrders"
                Effect   = "Allow"
                Action   = ["dynamodb:GetItem"]
                Resource = aws_dynamodb_table.orders.arn
              },
              {
                Sid      = "WriteOwnLogs"
                Effect   = "Allow"
                Action   = ["logs:CreateLogStream", "logs:PutLogEvents"]
                Resource = "${aws_cloudwatch_log_group.reader.arn}:*"
              }
            ]
          })
        }

        resource "aws_lambda_function" "reader" {
          function_name    = "${local.name_prefix}-reader"
          role             = aws_iam_role.reader.arn
          runtime          = "nodejs22.x"
          handler          = "index.handler"
          filename         = data.archive_file.reader.output_path
          source_code_hash = data.archive_file.reader.output_base64sha256
          timeout          = 10

          environment {
            variables = {
              TABLE_NAME = aws_dynamodb_table.orders.name
            }
          }
        }

        resource "aws_cloudwatch_log_group" "reader" {
          name              = "/aws/lambda/${aws_lambda_function.reader.function_name}"
          retention_in_days = 14
        }
    starter:
      kind: terraform
      cloud: aws
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "~> 6.0"
              }
              archive = {
                source  = "hashicorp/archive"
                version = "~> 2.0"
              }
            }
          }
        providers.tf: |
          provider "aws" {
            region = var.aws_region

            default_tags {
              tags = local.common_tags
            }
          }
        locals.tf: |
          locals {
            name_prefix = "${var.project}-${var.environment}"
            common_tags = {
              Project     = var.project
              Environment = var.environment
              ManagedBy   = "nimbo"
            }
          }
        variables.tf: |
          variable "project" {
            type        = string
            default     = "learn"
            description = "Project name: the first part of every resource name and the Project tag."

            validation {
              condition     = can(regex("^[a-z][a-z0-9-]{1,19}$", var.project))
              error_message = "project must be 2-20 lowercase letters, digits or hyphens, starting with a letter."
            }
          }

          variable "environment" {
            type        = string
            default     = "dev"
            description = "Deployment environment (dev, staging, prod, …): part of every resource name and the Environment tag."

            validation {
              condition     = can(regex("^[a-z][a-z0-9-]{0,11}$", var.environment))
              error_message = "environment must be 1-12 lowercase letters, digits or hyphens, starting with a letter."
            }
          }

          variable "aws_region" {
            type        = string
            default     = "us-east-1"
            description = "AWS region to deploy into."
          }
        main.tf: |
          resource "aws_dynamodb_table" "orders" {
            name         = "${local.name_prefix}-orders"
            billing_mode = "PAY_PER_REQUEST"
            hash_key     = "id"

            attribute {
              name = "id"
              type = "S"
            }

            server_side_encryption {
              enabled = true
            }
          }

          data "archive_file" "reader" {
            type        = "zip"
            output_path = "${path.module}/build/reader.zip"

            source {
              filename = "index.mjs"
              content  = <<-EOT
                import { DynamoDBClient, GetItemCommand } from "@aws-sdk/client-dynamodb";

                const db = new DynamoDBClient({});

                export const handler = async (event) => {
                  const id = String(event?.id ?? "1");
                  const out = await db.send(new GetItemCommand({
                    TableName: process.env.TABLE_NAME,
                    Key: { id: { S: id } },
                  }));
                  return { found: Boolean(out.Item), id };
                };
              EOT
            }
          }

          resource "aws_iam_role" "reader" {
            name = "${local.name_prefix}-reader"
            assume_role_policy = jsonencode({
              Version = "2012-10-17"
              Statement = [{
                Effect    = "Allow"
                Principal = { Service = "lambda.amazonaws.com" }
                Action    = "sts:AssumeRole"
              }]
            })
          }

          # "It works": the function may do anything to anything.
          resource "aws_iam_role_policy" "reader" {
            name = "${local.name_prefix}-reader"
            role = aws_iam_role.reader.id
            policy = jsonencode({
              Version = "2012-10-17"
              Statement = [{
                Effect   = "Allow"
                Action   = "*"
                Resource = "*"
              }]
            })
          }

          resource "aws_lambda_function" "reader" {
            function_name    = "${local.name_prefix}-reader"
            role             = aws_iam_role.reader.arn
            runtime          = "nodejs22.x"
            handler          = "index.handler"
            filename         = data.archive_file.reader.output_path
            source_code_hash = data.archive_file.reader.output_base64sha256
            timeout          = 10

            environment {
              variables = {
                TABLE_NAME = aws_dynamodb_table.orders.name
              }
            }
          }
        outputs.tf: |
          output "function_name" {
            value       = aws_lambda_function.reader.function_name
            description = "Name of the reader function."
          }
    checks:
    - id: valid
      label: The configuration is valid
      type: validate
    - id: no-admin-policy
      label: No policy grants every action on every resource
      type: rules_clean
      rules_clean:
        codes: [bp_iam_wildcard]
        minSeverity: warning
    - id: scoped-to-table
      label: The role policy targets the orders table's ARN
      type: has
      has:
        terraform:
          type: aws_iam_role_policy
          where:
            policy: {ref: aws_dynamodb_table.orders}
    - id: read-action
      label: The policy grants the read action the code uses
      type: has
      has:
        terraform:
          type: aws_iam_role_policy
          where:
            policy: {contains: 'dynamodb:GetItem'}
    - id: no-service-wildcard
      label: No service-wide DynamoDB wildcard
      type: has
      has:
        terraform:
          type: aws_iam_role_policy
          where:
            policy: {contains: 'dynamodb:*'}
          count: {max: 0}
    - id: own-logs-only
      label: Log permissions are scoped to the function's log group
      type: has
      has:
        terraform:
          type: aws_iam_role_policy
          where:
            policy: {ref: aws_cloudwatch_log_group}
    - id: log-retention
      label: The function's log group has a retention period
      type: rules_clean
      rules_clean:
        codes: [bp_log_retention]
        minSeverity: info
    - id: deploy
      label: The function deploys to the local AWS emulator
      type: deploy
    sources:
    - title: Security best practices in IAM
      url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
    - title: Defining Lambda function permissions with an execution role
      url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-intro-execution-role.html
    - title: Sending Lambda function logs to CloudWatch Logs
      url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-cloudwatchlogs.html
    - title: 'AWS managed policy: AWSLambdaBasicExecutionRole'
      url: https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSLambdaBasicExecutionRole.html
    - title: 'Terraform AWS provider: aws_iam_role_policy'
      url: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/iam_role_policy
    - title: 'Terraform AWS provider: aws_cloudwatch_log_group'
      url: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/cloudwatch_log_group
    solvableWithoutCode: true
- op: upsert
  kind: challenge
  id: aws-http-api-lambda
  data:
    provider: aws
    level: intermediate
    title: Put an HTTP API in front of a Lambda function
    summary: Publish GET /hello through an API Gateway HTTP API with a Lambda proxy integration, throttling and access logs.
    minutes: 35
    tags: [api-gateway, lambda, serverless, http-api, throttling]
    prerequisites: [aws-lambda-least-privilege]
    runtime: emulated
    problem: |
      The `hello` Lambda function is ready, with a least-privilege role and
      a log group, but nothing can call it over HTTP. The frontend team
      needs `GET /hello` on a public URL.

      **Amazon API Gateway HTTP APIs** are the lightweight way to front
      Lambda: an *integration* of type `AWS_PROXY` passes the whole request
      to the function and returns its response; a *route* (`GET /hello`)
      sends matching requests to that integration; a *stage* publishes the
      API, and the special `$default` stage serves it at the root of the
      API's URL. API Gateway also needs permission to invoke the function,
      granted on the function side with a resource-based policy
      (`aws_lambda_permission`). A public API should limit how fast clients
      may call it (stage throttling) and record who called what (access
      logs).

      Add the API. When you check, Nimbo deploys it to the local AWS
      emulator and calls `GET /hello` through it.
    requirements:
    - An `aws_apigatewayv2_api` named `http` (`aws_apigatewayv2_api.http`) with `protocol_type = "HTTP"`.
    - An `aws_apigatewayv2_integration` of type `AWS_PROXY` to the `hello` function, with payload format version `2.0`.
    - An `aws_apigatewayv2_route` with route key `GET /hello` targeting that integration.
    - An `aws_apigatewayv2_stage` named `$default` with `auto_deploy = true`, default route throttling (`throttling_burst_limit` and `throttling_rate_limit`) and access logs sent to a CloudWatch log group with a retention period.
    - An `aws_lambda_permission` lets `apigateway.amazonaws.com` invoke the function, scoped with `source_arn` to this API's execution ARN.
    - No best-practice warnings, the workflow deploys and `GET /hello` through the API answers 200.
    hints:
    - 'Start from the palette: add an `aws_apigatewayv2_api`, give it a name and set `protocol_type` to `HTTP`. Then drag it onto the function on the canvas.'
    - 'Pick **Route HTTP requests to the function**. Nimbo adds the Lambda proxy integration, a route, a `$default` stage that deploys automatically and the invoke permission scoped to this API. The route it adds catches every path: change the route''s `route_key` to `GET /hello`.'
    - Select the stage. In its `default_route_settings` block set `throttling_burst_limit` and `throttling_rate_limit`. For access logs, add an `aws_cloudwatch_log_group` from the palette (name it and set `retention_in_days`), then in the stage's `access_log_settings` block use **Link to…** on `destination_arn` to pick the log group's `arn` and type a JSON log format such as `{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status"}`.
    solution: |
      Five resources turn the function into an API (all in `api.tf`):

      1. `aws_apigatewayv2_api.http` – the HTTP API.
      2. `aws_apigatewayv2_integration.hello` – `AWS_PROXY` to the
         function's `invoke_arn`, payload format `2.0` (the event shape
         the function reads: `rawPath`, `requestContext.http`).
      3. `aws_apigatewayv2_route.hello` – `GET /hello` →
         `integrations/<id>`.
      4. `aws_apigatewayv2_stage.default` – `$default` with
         `auto_deploy`, so every change is published, plus throttling and
         JSON access logs to `/aws/apigateway/<api>` kept 14 days.
      5. `aws_lambda_permission.api` – `lambda:InvokeFunction` for
         `apigateway.amazonaws.com`, limited by `source_arn` to this API so
         no other API can invoke the function.

      ```hcl
      resource "aws_apigatewayv2_stage" "default" {
        api_id      = aws_apigatewayv2_api.http.id
        name        = "$default"
        auto_deploy = true

        default_route_settings {
          throttling_burst_limit = 50
          throttling_rate_limit  = 100
        }

        access_log_settings {
          destination_arn = aws_cloudwatch_log_group.api.arn
          format          = jsonencode({ requestId = "$context.requestId", routeKey = "$context.routeKey", status = "$context.status" })
        }
      }
      ```

      Why: throttling protects the backend and your bill from bursts (the
      account-level limit is shared by every API in the Region), and access
      logs are the operational-excellence pillar's first source of truth
      about who called the API and how it answered.

      **Without writing code in Nimbo**

      1. From the palette, add an `aws_apigatewayv2_api` named `http`; set `name` to `learn-dev-http` and `protocol_type` to `HTTP`.
      2. Drag the API onto `aws_lambda_function.hello` and pick **Route HTTP requests to the function**.
      3. Select the new route and change `route_key` to `GET /hello`.
      4. From the palette, add an `aws_cloudwatch_log_group` named `api_access`; set `name` to `/aws/apigateway/learn-dev-http` and `retention_in_days` to 14.
      5. Select the `$default` stage. In `default_route_settings`, set `throttling_burst_limit` to 50 and `throttling_rate_limit` to 100.
      6. In the stage's `access_log_settings` block, use **Link to…** on `destination_arn` to pick `aws_cloudwatch_log_group.api_access` → `arn`, and type the log format `{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status"}`.
    solutionFiles:
      api.tf: |
        resource "aws_apigatewayv2_api" "http" {
          name          = "${local.name_prefix}-http"
          protocol_type = "HTTP"
        }

        # Lambda proxy integration: the whole request goes to the function.
        resource "aws_apigatewayv2_integration" "hello" {
          api_id                 = aws_apigatewayv2_api.http.id
          integration_type       = "AWS_PROXY"
          integration_uri        = aws_lambda_function.hello.invoke_arn
          payload_format_version = "2.0"
        }

        resource "aws_apigatewayv2_route" "hello" {
          api_id    = aws_apigatewayv2_api.http.id
          route_key = "GET /hello"
          target    = "integrations/${aws_apigatewayv2_integration.hello.id}"
        }

        resource "aws_cloudwatch_log_group" "api" {
          name              = "/aws/apigateway/${local.name_prefix}-http"
          retention_in_days = 14
        }

        # $default serves the API at the root of its URL; every change is
        # deployed automatically.
        resource "aws_apigatewayv2_stage" "default" {
          api_id      = aws_apigatewayv2_api.http.id
          name        = "$default"
          auto_deploy = true

          default_route_settings {
            throttling_burst_limit = 50
            throttling_rate_limit  = 100
          }

          access_log_settings {
            destination_arn = aws_cloudwatch_log_group.api.arn
            format = jsonencode({
              requestId = "$context.requestId"
              routeKey  = "$context.routeKey"
              status    = "$context.status"
              latency   = "$context.responseLatency"
            })
          }
        }

        # Only this API may invoke the function.
        resource "aws_lambda_permission" "api" {
          statement_id  = "AllowHttpApiInvoke"
          action        = "lambda:InvokeFunction"
          function_name = aws_lambda_function.hello.function_name
          principal     = "apigateway.amazonaws.com"
          source_arn    = "${aws_apigatewayv2_api.http.execution_arn}/*/*"
        }
      outputs.tf: |
        output "function_name" {
          value       = aws_lambda_function.hello.function_name
          description = "Name of the hello function."
        }

        output "api_endpoint" {
          value       = aws_apigatewayv2_api.http.api_endpoint
          description = "Base URL of the HTTP API; GET <api_endpoint>/hello calls the function."
        }
    starter:
      kind: terraform
      cloud: aws
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "~> 6.0"
              }
              archive = {
                source  = "hashicorp/archive"
                version = "~> 2.0"
              }
            }
          }
        providers.tf: |
          provider "aws" {
            region = var.aws_region

            default_tags {
              tags = local.common_tags
            }
          }
        locals.tf: |
          locals {
            name_prefix = "${var.project}-${var.environment}"
            common_tags = {
              Project     = var.project
              Environment = var.environment
              ManagedBy   = "nimbo"
            }
          }
        variables.tf: |
          variable "project" {
            type        = string
            default     = "learn"
            description = "Project name: the first part of every resource name and the Project tag."

            validation {
              condition     = can(regex("^[a-z][a-z0-9-]{1,19}$", var.project))
              error_message = "project must be 2-20 lowercase letters, digits or hyphens, starting with a letter."
            }
          }

          variable "environment" {
            type        = string
            default     = "dev"
            description = "Deployment environment (dev, staging, prod, …): part of every resource name and the Environment tag."

            validation {
              condition     = can(regex("^[a-z][a-z0-9-]{0,11}$", var.environment))
              error_message = "environment must be 1-12 lowercase letters, digits or hyphens, starting with a letter."
            }
          }

          variable "aws_region" {
            type        = string
