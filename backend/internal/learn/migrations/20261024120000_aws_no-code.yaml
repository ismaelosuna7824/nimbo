- op: upsert
  kind: challenge
  id: aws-backup-dr-cost
  data:
    provider: aws
    level: expert
    title: Cross-Region backup and restore with cost controls
    summary: Design a backup-and-restore disaster recovery plan for a DynamoDB table and an S3 bucket, with a second Region, PITR and lifecycle rules.
    minutes: 90
    tags: [disaster-recovery, aws-backup, dynamodb, s3, replication, cost-optimization]
    prerequisites: [aws-private-s3-bucket, aws-rds-multi-az]
    runtime: design
    problem: |
      The orders service keeps its data in a DynamoDB table and customer
      documents in an S3 bucket, both in one Region. The business sets the
      recovery objectives: lose at most **minutes** of orders after an
      accidental write or delete, and recover from the loss of the whole
      Region within a day, with backups kept for a year for audit. Finance
      adds one constraint: old data must move to cheaper storage
      automatically.

      AWS describes four DR strategies, in increasing cost and decreasing
      RTO/RPO: **backup and restore**, pilot light, warm standby and
      multi-site active/active. These objectives fit backup and restore:
      - **DynamoDB point-in-time recovery (PITR)** restores the table to
        any second of the recovery window (up to 35 days), which covers
        the minutes-level RPO for data corruption.
      - **AWS Backup** runs scheduled backup plans into encrypted **backup
        vaults** and can **copy each recovery point to a vault in another
        Region**; lifecycle rules move long-term backups to cold storage
        and delete them when their retention ends.
      - **S3 Replication** (Cross-Region Replication) copies new objects
        to a bucket in the recovery Region; both buckets need versioning.
      - **S3 Lifecycle** transitions noncurrent versions to cheaper
        storage classes and expires them, so versioning doesn't grow the
        bill forever.

      Design the plan in Terraform. Nimbo grades the design; it isn't
      deployed.
    requirements:
    - A second `aws` provider with an alias points at the recovery Region (a variable, not a hard-coded Region in resources).
    - The table has point-in-time recovery enabled (`point_in_time_recovery { enabled = true }`).
    - Two `aws_backup_vault`s, one per Region (the recovery one uses the aliased provider), each encrypted with a customer managed `aws_kms_key` that has key rotation enabled.
    - An `aws_backup_plan` with a daily rule whose recovery points expire (`lifecycle { delete_after }`) and are copied to the recovery vault (`copy_action`), and a rule that keeps long-term backups for a year with cold storage (`cold_storage_after`; AWS requires at least 90 days in cold storage).
    - An `aws_backup_selection` assigns the table and the bucket to the plan with a role that `backup.amazonaws.com` can assume (the AWS Backup managed policies attached).
    - Both buckets are versioned, the source replicates to the recovery bucket (`aws_s3_bucket_replication_configuration`), and the source has a lifecycle rule that transitions and expires noncurrent versions.
    - No best-practice warnings (`bp_*` at warning level or above).
    hints:
    - 'Start with the recovery Region. Add a `dr_region` variable in the **Variables** panel, then, with nothing selected, open the **Providers** section of the inspector, click **Add**, give the `aws` provider the alias `dr` and take its Region from `var.dr_region`. Any resource can now run there: pick `aws.dr` in its **Meta-arguments** → `provider` select.'
    - 'Backups: turn on `enabled` in the table''s `point_in_time_recovery` block; add two `aws_kms_key`s with `enable_key_rotation` on (one with provider `aws.dr`) and two `aws_backup_vault`s, each with **Link to…** its key''s `arn` (the recovery vault on `aws.dr`). The `aws_backup_plan` rule targets the primary vault, sets a daily `schedule`, a `lifecycle` with `cold_storage_after` and `delete_after` (at least 90 days apart), and a `copy_action` whose `destination_vault_arn` links to the recovery vault. For the backup role, add `sts:AssumeRole` for the service `backup.amazonaws.com` in its **Access** section and attach the AWS Backup managed policies.'
    - 'Documents: add versioning (status **Enabled**) to the source bucket, a replica `aws_s3_bucket` with its own versioning and public access block on provider `aws.dr`, and a replication role that `s3.amazonaws.com` can assume. Drag the role onto the source bucket and pick **Read**, then onto the replica and pick **Write**. The `aws_s3_bucket_replication_configuration` links the source bucket, the role''s `arn` and the replica''s `arn` as destination, with `depends_on` on the source bucket''s versioning; a lifecycle rule on the source moves noncurrent versions to `STANDARD_IA` after 30 days and expires them after 365.'
    solution: |
      The reference keeps the table and bucket and adds:

      - **Recovery Region**: `provider "aws" { alias = "dr" }` with
        `var.dr_region`.
      - **PITR** on the table (RPO of minutes for logical corruption) and
        `deletion_protection_enabled`.
      - **Vaults**: `primary` and `dr`, each with its own KMS key
        (rotation on). Copies are re-encrypted with the destination
        vault's key.
      - **Backup plan**: `daily` (kept 35 days, copied to the recovery
        vault) and `monthly` (cold storage after 30 days, deleted after
        365, copied as well). Cold storage needs a total retention of at
        least 90 days more than the transition.
      - **Selection**: table + bucket, role trusted by
        `backup.amazonaws.com` with the AWS Backup managed policies for
        backups, restores and S3.
      - **S3**: versioning on both buckets, CRR to the recovery bucket
        into `STANDARD_IA` (cheaper for a copy that's rarely read), and a
        lifecycle rule moving noncurrent versions to `STANDARD_IA` after
        30 days and expiring them after 365.

      ```hcl
      resource "aws_backup_plan" "orders" {
        name = "${local.name_prefix}-orders"

        rule {
          rule_name         = "daily"
          target_vault_name = aws_backup_vault.primary.name
          schedule          = "cron(0 5 ? * * *)"

          lifecycle {
            delete_after = 35
          }

          copy_action {
            destination_vault_arn = aws_backup_vault.dr.arn
            lifecycle {
              delete_after = 35
            }
          }
        }
      }
      ```

      RTO is the time to restore the table from PITR or a copied recovery
      point and to redeploy the stack with Terraform in the recovery
      Region: practice it. If the business later needs an RTO of minutes,
      move up to pilot light or warm standby (for example DynamoDB global
      tables), at a higher cost.

      **Without writing code in Nimbo**

      1. In the **Variables** panel, click **Add variable** and create `dr_region` (type `string`, default `us-west-2`, description `Recovery AWS Region.`).
      2. With nothing selected, open the inspector's **Providers** section, click **Add**, choose `aws`, type the alias `dr`, set **Region from** to `var.dr_region` and click **Add provider**.
      3. Select `aws_dynamodb_table.orders` and turn on `enabled` in its `point_in_time_recovery` block.
      4. From the palette, add two `aws_kms_key`s: `backup` and `backup_dr`. Give each a `description` and turn on `enable_key_rotation`. On `backup_dr`, pick `aws.dr` in **Meta-arguments** → `provider`.
      5. Add two `aws_backup_vault`s: `main` (name `orders-prod-vault`, `kms_key_arn` linked to `aws_kms_key.backup` → `arn`) and `dr` (provider `aws.dr`, name `orders-prod-vault-dr`, `kms_key_arn` linked to `aws_kms_key.backup_dr` → `arn`).
      6. Add an `aws_backup_plan` named `daily` (name `orders-prod-daily`). In its `rule` block: `rule_name` `daily`, `target_vault_name` linked to `aws_backup_vault.main` → `name`, `schedule` `cron(0 3 * * ? *)`; in `lifecycle` set `cold_storage_after` to 30 and `delete_after` to 365; in `copy_action` link `destination_vault_arn` to `aws_backup_vault.dr` → `arn` and set its `lifecycle` `delete_after` to 365.
      7. Add an `aws_iam_role` named `backup` (name `orders-prod-backup`). In its **Access** section, edit the trust policy (`assume_role_policy`): add an **Allow** statement for `sts:AssumeRole` whose principal is the **Service** `backup.amazonaws.com`.
      8. Add `aws_iam_role_policy_attachment`s with `role` linked to `aws_iam_role.backup` → `name`: one with `policy_arn` `arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup`, and one with `arn:aws:iam::aws:policy/AWSBackupServiceRolePolicyForS3Backup` so the role can back up the bucket.
      9. Add an `aws_backup_selection` named `orders`: name `orders`, `plan_id` linked to the plan's `id`, `iam_role_arn` linked to the backup role's `arn`, and in `resources` use **Link to…** to add `aws_dynamodb_table.orders` → `arn`, then `aws_s3_bucket.documents` → `arn`.
      10. Add an `aws_s3_bucket_versioning` named `documents`: `bucket` linked to `aws_s3_bucket.documents` → `id`, `status` **Enabled**.
      11. Add an `aws_s3_bucket` named `replica` (provider `aws.dr`, `bucket_prefix` `orders-prod-replica-`), then an `aws_s3_bucket_versioning` (status **Enabled**) and an `aws_s3_bucket_public_access_block` (all four switches on) for it, both with provider `aws.dr` and `bucket` linked to `aws_s3_bucket.replica` → `id`.
      12. Add an `aws_iam_role` named `replication` (name `orders-prod-replication`) and, in its **Access** section, allow `sts:AssumeRole` for the **Service** `s3.amazonaws.com`.
      13. Drag the replication role onto `aws_s3_bucket.documents` and pick **Read**; drag it onto `aws_s3_bucket.replica` and pick **Write**.
      14. Add an `aws_s3_bucket_replication_configuration` named `documents`: `bucket` linked to the documents bucket's `id`, `role` linked to the replication role's `arn`; in `rule` set `id` `to-recovery-region`, `status` **Enabled** and `destination` → `bucket` linked to `aws_s3_bucket.replica` → `arn`. In **Meta-arguments**, add `aws_s3_bucket_versioning.documents` to `depends_on`.
      15. Add an `aws_s3_bucket_lifecycle_configuration` named `documents`: `bucket` linked to the documents bucket's `id`; in `rule` set `id` `noncurrent-versions`, `status` **Enabled**, a `noncurrent_version_transition` with `noncurrent_days` 30 and `storage_class` **STANDARD_IA**, and a `noncurrent_version_expiration` with `noncurrent_days` 365.
    solutionFiles:
      providers.tf: |
        provider "aws" {
          region = var.aws_region

          default_tags {
            tags = local.common_tags
          }
        }

        # The recovery Region.
        provider "aws" {
          alias  = "dr"
          region = var.dr_region

          default_tags {
            tags = local.common_tags
          }
        }
      variables.tf: |
        variable "project" {
          type        = string
          default     = "orders"
          description = "Project name: the first part of every resource name and the Project tag."

          validation {
            condition     = can(regex("^[a-z][a-z0-9-]{1,19}$", var.project))
            error_message = "project must be 2-20 lowercase letters, digits or hyphens, starting with a letter."
          }
        }

        variable "environment" {
          type        = string
          default     = "prod"
          description = "Deployment environment (dev, staging, prod, …): part of every resource name and the Environment tag."

          validation {
            condition     = can(regex("^[a-z][a-z0-9-]{0,11}$", var.environment))
            error_message = "environment must be 1-12 lowercase letters, digits or hyphens, starting with a letter."
          }
        }

        variable "aws_region" {
          type        = string
          default     = "us-east-1"
          description = "Primary AWS Region of the workload."
        }

        variable "dr_region" {
          type        = string
          default     = "us-west-2"
          description = "Recovery Region: backup copies and the replica bucket live here."
        }
      main.tf: |
        resource "aws_dynamodb_table" "orders" {
          name                        = "${local.name_prefix}-orders"
          billing_mode                = "PAY_PER_REQUEST"
          hash_key                    = "id"
          deletion_protection_enabled = true

          attribute {
            name = "id"
            type = "S"
          }

          server_side_encryption {
            enabled = true
          }

          # Restore to any second of the last 35 days.
          point_in_time_recovery {
            enabled = true
          }
        }

        resource "aws_s3_bucket" "documents" {
          bucket_prefix = "${local.name_prefix}-documents-"
        }

        resource "aws_s3_bucket_public_access_block" "documents" {
          bucket                  = aws_s3_bucket.documents.id
          block_public_acls       = true
          block_public_policy     = true
          ignore_public_acls      = true
          restrict_public_buckets = true
        }

        resource "aws_s3_bucket_server_side_encryption_configuration" "documents" {
          bucket = aws_s3_bucket.documents.id

          rule {
            apply_server_side_encryption_by_default {
              sse_algorithm = "AES256"
            }
          }
        }

        resource "aws_s3_bucket_versioning" "documents" {
          bucket = aws_s3_bucket.documents.id

          versioning_configuration {
            status = "Enabled"
          }
        }

        # Cost: older versions move to Standard-IA, then expire.
        resource "aws_s3_bucket_lifecycle_configuration" "documents" {
          bucket = aws_s3_bucket.documents.id

          rule {
            id     = "noncurrent-versions"
            status = "Enabled"

            filter {}

            noncurrent_version_transition {
              noncurrent_days = 30
              storage_class   = "STANDARD_IA"
            }

            noncurrent_version_expiration {
              noncurrent_days = 365
            }

            abort_incomplete_multipart_upload {
              days_after_initiation = 7
            }
          }

          depends_on = [aws_s3_bucket_versioning.documents]
        }
      dr.tf: |
        # Replica bucket in the recovery Region.
        resource "aws_s3_bucket" "documents_dr" {
          provider      = aws.dr
          bucket_prefix = "${local.name_prefix}-documents-dr-"
        }

        resource "aws_s3_bucket_public_access_block" "documents_dr" {
          provider                = aws.dr
          bucket                  = aws_s3_bucket.documents_dr.id
          block_public_acls       = true
          block_public_policy     = true
          ignore_public_acls      = true
          restrict_public_buckets = true
        }

        resource "aws_s3_bucket_server_side_encryption_configuration" "documents_dr" {
          provider = aws.dr
          bucket   = aws_s3_bucket.documents_dr.id

          rule {
            apply_server_side_encryption_by_default {
              sse_algorithm = "AES256"
            }
          }
        }

        resource "aws_s3_bucket_versioning" "documents_dr" {
          provider = aws.dr
          bucket   = aws_s3_bucket.documents_dr.id

          versioning_configuration {
            status = "Enabled"
          }
        }

        resource "aws_iam_role" "replication" {
          name = "${local.name_prefix}-s3-replication"
          assume_role_policy = jsonencode({
            Version = "2012-10-17"
            Statement = [{
              Effect    = "Allow"
              Principal = { Service = "s3.amazonaws.com" }
              Action    = "sts:AssumeRole"
            }]
          })
        }

        resource "aws_iam_role_policy" "replication" {
          name = "${local.name_prefix}-s3-replication"
          role = aws_iam_role.replication.id
          policy = jsonencode({
            Version = "2012-10-17"
            Statement = [
              {
                Effect   = "Allow"
                Action   = ["s3:GetReplicationConfiguration", "s3:ListBucket"]
                Resource = aws_s3_bucket.documents.arn
              },
              {
                Effect   = "Allow"
                Action   = ["s3:GetObjectVersionForReplication", "s3:GetObjectVersionAcl", "s3:GetObjectVersionTagging"]
                Resource = "${aws_s3_bucket.documents.arn}/*"
              },
              {
                Effect   = "Allow"
                Action   = ["s3:ReplicateObject", "s3:ReplicateDelete", "s3:ReplicateTags"]
                Resource = "${aws_s3_bucket.documents_dr.arn}/*"
              }
            ]
          })
        }

        resource "aws_s3_bucket_replication_configuration" "documents" {
          role   = aws_iam_role.replication.arn
          bucket = aws_s3_bucket.documents.id

          rule {
            id     = "to-recovery-region"
            status = "Enabled"

            filter {}

            delete_marker_replication {
              status = "Enabled"
            }

            destination {
              bucket        = aws_s3_bucket.documents_dr.arn
              storage_class = "STANDARD_IA"
            }
          }

          depends_on = [aws_s3_bucket_versioning.documents, aws_s3_bucket_versioning.documents_dr]
        }
      backup.tf: |
        resource "aws_kms_key" "backup" {
          description         = "Encrypts the primary backup vault"
          enable_key_rotation = true
        }

        resource "aws_kms_key" "backup_dr" {
          provider            = aws.dr
          description         = "Encrypts the recovery-Region backup vault"
          enable_key_rotation = true
        }

        resource "aws_backup_vault" "primary" {
          name        = "${local.name_prefix}-primary"
          kms_key_arn = aws_kms_key.backup.arn
        }

        resource "aws_backup_vault" "dr" {
          provider    = aws.dr
          name        = "${local.name_prefix}-dr"
          kms_key_arn = aws_kms_key.backup_dr.arn
        }

        resource "aws_backup_plan" "orders" {
          name = "${local.name_prefix}-orders"

          # Operational recovery: daily, kept 35 days, copied to the
          # recovery Region.
          rule {
            rule_name         = "daily"
            target_vault_name = aws_backup_vault.primary.name
            schedule          = "cron(0 5 ? * * *)"

            lifecycle {
              delete_after = 35
            }

            copy_action {
              destination_vault_arn = aws_backup_vault.dr.arn

              lifecycle {
                delete_after = 35
              }
            }
          }

          # Audit: monthly, cold storage after 30 days, kept a year.
          rule {
            rule_name         = "monthly"
            target_vault_name = aws_backup_vault.primary.name
            schedule          = "cron(0 6 1 * ? *)"

            lifecycle {
              cold_storage_after = 30
              delete_after       = 365
            }

            copy_action {
              destination_vault_arn = aws_backup_vault.dr.arn

              lifecycle {
                cold_storage_after = 30
                delete_after       = 365
              }
            }
          }
        }

        resource "aws_iam_role" "backup" {
          name = "${local.name_prefix}-backup"
          assume_role_policy = jsonencode({
            Version = "2012-10-17"
            Statement = [{
              Effect    = "Allow"
              Principal = { Service = "backup.amazonaws.com" }
              Action    = "sts:AssumeRole"
            }]
          })
        }

        resource "aws_iam_role_policy_attachment" "backup" {
          for_each = toset([
            "arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup",
            "arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores",
            "arn:aws:iam::aws:policy/AWSBackupServiceRolePolicyForS3Backup",
            "arn:aws:iam::aws:policy/AWSBackupServiceRolePolicyForS3Restore",
          ])
          role       = aws_iam_role.backup.name
          policy_arn = each.value
        }

        resource "aws_backup_selection" "orders" {
          name         = "${local.name_prefix}-orders"
          plan_id      = aws_backup_plan.orders.id
          iam_role_arn = aws_iam_role.backup.arn
          resources    = [aws_dynamodb_table.orders.arn, aws_s3_bucket.documents.arn]
        }
      outputs.tf: |
        output "table_name" {
          value       = aws_dynamodb_table.orders.name
          description = "Name of the orders table."
        }

        output "documents_bucket" {
          value       = aws_s3_bucket.documents.bucket
          description = "Name of the documents bucket."
        }

        output "recovery_vault_arn" {
          value       = aws_backup_vault.dr.arn
          description = "ARN of the backup vault in the recovery Region."
        }
    starter:
      kind: terraform
      cloud: aws
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "~> 6.0"
              }
            }
          }
        providers.tf: |
          provider "aws" {
            region = var.aws_region

            default_tags {
              tags = local.common_tags
            }
          }
        locals.tf: |
          locals {
            name_prefix = "${var.project}-${var.environment}"
            common_tags = {
              Project     = var.project
              Environment = var.environment
              ManagedBy   = "nimbo"
            }
          }
        variables.tf: |
          variable "project" {
            type        = string
            default     = "orders"
            description = "Project name: the first part of every resource name and the Project tag."

            validation {
              condition     = can(regex("^[a-z][a-z0-9-]{1,19}$", var.project))
              error_message = "project must be 2-20 lowercase letters, digits or hyphens, starting with a letter."
            }
          }

          variable "environment" {
            type        = string
            default     = "prod"
            description = "Deployment environment (dev, staging, prod, …): part of every resource name and the Environment tag."

            validation {
              condition     = can(regex("^[a-z][a-z0-9-]{0,11}$", var.environment))
              error_message = "environment must be 1-12 lowercase letters, digits or hyphens, starting with a letter."
            }
          }

          variable "aws_region" {
            type        = string
            default     = "us-east-1"
            description = "Primary AWS Region of the workload."
          }
        main.tf: |
          # The data the business can't lose. No backups, no second Region.
          resource "aws_dynamodb_table" "orders" {
            name         = "${local.name_prefix}-orders"
            billing_mode = "PAY_PER_REQUEST"
            hash_key     = "id"

            attribute {
              name = "id"
              type = "S"
            }

            server_side_encryption {
              enabled = true
            }
          }

          resource "aws_s3_bucket" "documents" {
            bucket_prefix = "${local.name_prefix}-documents-"
          }

          resource "aws_s3_bucket_public_access_block" "documents" {
            bucket                  = aws_s3_bucket.documents.id
            block_public_acls       = true
            block_public_policy     = true
            ignore_public_acls      = true
            restrict_public_buckets = true
          }

          resource "aws_s3_bucket_server_side_encryption_configuration" "documents" {
            bucket = aws_s3_bucket.documents.id

            rule {
              apply_server_side_encryption_by_default {
                sse_algorithm = "AES256"
              }
            }
          }
        outputs.tf: |
          output "table_name" {
            value       = aws_dynamodb_table.orders.name
            description = "Name of the orders table."
          }

          output "documents_bucket" {
            value       = aws_s3_bucket.documents.bucket
            description = "Name of the documents bucket."
          }
    checks:
    - id: valid
      label: The configuration is valid
      type: validate
    - id: best-practices
      label: No best-practice warnings
      type: rules_clean
      rules_clean:
        prefixes: [bp_]
        minSeverity: warning
    - id: pitr
      label: The table has point-in-time recovery
      type: has
      has:
        terraform:
          type: aws_dynamodb_table
          where:
            point_in_time_recovery.enabled: true
    - id: recovery-region-vault
      label: A backup vault in the recovery Region (aliased provider)
      type: has
      has:
        terraform:
          type: aws_backup_vault
          where:
            provider: {exists: true}
    - id: encrypted-vaults
      label: Both vaults use customer managed KMS keys
      type: has
      has:
        terraform:
          type: aws_backup_vault
          where:
            kms_key_arn: {ref: aws_kms_key}
          count: {min: 2}
    - id: key-rotation
      label: The vault keys rotate
      type: has
      has:
        terraform:
          type: aws_kms_key
          where:
            enable_key_rotation: true
          count: {min: 2}
    - id: cross-region-copy
      label: The backup plan copies recovery points to the recovery vault
      type: has
      has:
        terraform:
          type: aws_backup_plan
          where:
            rule.copy_action.destination_vault_arn: {ref: aws_backup_vault}
    - id: retention
      label: Recovery points expire
      type: has
      has:
        terraform:
          type: aws_backup_plan
          where:
            rule.lifecycle.delete_after: {exists: true}
    - id: cold-storage
      label: Long-term backups move to cold storage
      type: has
      has:
        terraform:
          type: aws_backup_plan
          where:
            rule.lifecycle.cold_storage_after: {exists: true}
    - id: selection
      label: The table is assigned to the plan with a backup role
      type: has
      has:
        terraform:
          type: aws_backup_selection
          where:
            resources: {ref: aws_dynamodb_table}
            iam_role_arn: {ref: aws_iam_role}
    - id: backup-role
      label: AWS Backup can assume the selection's role
      type: has
      has:
        terraform:
          type: aws_iam_role
          where:
            assume_role_policy: {contains: backup.amazonaws.com}
    - id: versioned-buckets
      label: Source and replica buckets are versioned
      type: has
      has:
        terraform:
          type: aws_s3_bucket_versioning
          where:
            versioning_configuration.status: Enabled
          count: {min: 2}
    - id: replication
      label: The bucket replicates to another bucket
      type: has
      has:
        terraform:
          type: aws_s3_bucket_replication_configuration
          where:
            rule.status: Enabled
            rule.destination.bucket: {ref: aws_s3_bucket}
    - id: replica-in-recovery-region
      label: The replica bucket is in the recovery Region
      type: has
      has:
        terraform:
          type: aws_s3_bucket
          where:
            provider: {exists: true}
    - id: noncurrent-lifecycle
      label: Noncurrent versions transition to cheaper storage and expire
      type: has
      has:
        terraform:
          type: aws_s3_bucket_lifecycle_configuration
          where:
            rule.noncurrent_version_transition.storage_class: {exists: true}
            rule.noncurrent_version_expiration.noncurrent_days: {exists: true}
    sources:
    - title: Disaster recovery options in the cloud
      url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
    - title: REL13-BP02 Use defined recovery strategies to meet the recovery objectives
      url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_planning_for_recovery_disaster_recovery.html
    - title: Creating backup copies across AWS Regions
      url: https://docs.aws.amazon.com/aws-backup/latest/devguide/cross-region-backup.html
    - title: Backup plan options and configuration
      url: https://docs.aws.amazon.com/aws-backup/latest/devguide/plan-options-and-configuration.html
    - title: Create a backup plan
      url: https://docs.aws.amazon.com/aws-backup/latest/devguide/creating-a-backup-plan.html
    - title: Point-in-time backups for DynamoDB
      url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/PointInTimeRecovery_Howitworks.html
    - title: Requirements and considerations for replication
      url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-requirements.html
    - title: Managing the lifecycle of objects
      url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html
    - title: Optimizing costs with the AWS Well-Architected cost optimization pillar
      url: https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/welcome.html
    solvableWithoutCode: true
