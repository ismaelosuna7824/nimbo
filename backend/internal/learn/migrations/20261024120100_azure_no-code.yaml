- op: upsert
  kind: challenge
  id: azure-storage-data-protection
  data:
    provider: azure
    level: intermediate
    title: Protect blob data against deletion, corruption and outages
    summary: Add zone-redundant replication, soft delete, versioning, a network default-deny and a delete lock to a storage account.
    minutes: 35
    tags: [storage, reliability, backup, data-protection, network]
    prerequisites: [azure-storage-secure-defaults]
    runtime: design
    problem: |
      The invoices storage account is now private and TLS-only, but it is still fragile: it keeps its three copies
      in a single datacenter (LRS), a script that deletes the wrong container or overwrites blobs loses data for
      good, it accepts connections from every network, and anyone with Contributor rights can delete the whole
      account.

      Use the Azure Storage data-protection and redundancy guidance to make the account survive a zone outage and
      human mistakes, and narrow who can reach it.
    requirements:
    - 'Replication survives a zone outage: `account_replication_type` is `ZRS`, `GZRS` or `RAGZRS`.'
    - '`blob_properties` enables `versioning_enabled = true`, blob soft delete (`delete_retention_policy`) and container soft delete (`container_delete_retention_policy`), each kept for at least 7 days.'
    - '`network_rules` sets `default_action = "Deny"` (allow only the networks that need access, plus the trusted Azure services bypass).'
    - An `azurerm_management_lock` with `lock_level = "CanNotDelete"` protects the storage account.
    - The workflow validates.
    hints:
    - Zone-redundant storage (ZRS) copies data across three availability zones; GZRS adds an asynchronous copy in the paired region. Look at the account's replication select first.
    - 'Soft delete and versioning live in the account''s `blob_properties` block: add it in the inspector, turn versioning on and add the two nested retention blocks. The `network_rules` block holds the default action and the bypass list.'
    - Add a management lock from the palette, pick `CanNotDelete` and use Link to… on `scope` to pick the storage account's id. Remember a lock protects the resource, not the data inside it.
    solution: |
      ```hcl
      resource "azurerm_storage_account" "invoices" {
        # ...
        account_replication_type = "GZRS"

        blob_properties {
          versioning_enabled = true
          delete_retention_policy { days = 14 }
          container_delete_retention_policy { days = 14 }
        }

        network_rules {
          default_action             = "Deny"
          bypass                     = ["AzureServices"]
          virtual_network_subnet_ids = [azurerm_subnet.app.id]
        }
      }

      resource "azurerm_management_lock" "invoices" {
        name       = "lock-invoices-nodelete"
        scope      = azurerm_storage_account.invoices.id
        lock_level = "CanNotDelete"
      }
      ```

      **Why:** LRS only survives disk and rack failures inside one datacenter; Microsoft recommends ZRS for high
      availability in the primary region and GZRS when you also need regional disaster recovery. Blob and container
      soft delete let you restore deleted data during the retention window and versioning keeps previous versions of
      overwritten blobs (the Well-Architected guide suggests at least 7 days; versions and soft-deleted data are
      billed, so pair them with lifecycle rules). A default-deny firewall starts from zero network access. A
      `CanNotDelete` lock stops accidental deletion of the account through Azure Resource Manager — it does not
      protect data-plane operations, which is why you need soft delete as well.

      **Without writing code in Nimbo**

      1. Click the storage account `invoices` and pick `GZRS` in **account_replication_type**.
      2. Add the **blob_properties** block: turn **versioning_enabled** on, add **delete_retention_policy** and **container_delete_retention_policy** with `14` days each.
      3. Add the **network_rules** block: **default_action** `Deny` and `AzureServices` in **bypass**.
      4. From the palette add a **management lock**: name `lock-invoices`, **lock_level** `CanNotDelete`, a short note, and **Link to…** on **scope** → the storage account's id.
    solutionFiles:
      main.tf: |
        resource "azurerm_resource_group" "main" {
          name     = "rg-${local.name_prefix}"
          location = var.location
          tags     = local.common_tags
        }

        resource "azurerm_virtual_network" "main" {
          name                = "vnet-${local.name_prefix}"
          resource_group_name = azurerm_resource_group.main.name
          location            = azurerm_resource_group.main.location
          address_space       = ["10.30.0.0/16"]
          tags                = local.common_tags
        }

        resource "azurerm_subnet" "app" {
          name                 = "snet-app"
          resource_group_name  = azurerm_resource_group.main.name
          virtual_network_name = azurerm_virtual_network.main.name
          address_prefixes     = ["10.30.1.0/24"]
          service_endpoints    = ["Microsoft.Storage"]
        }

        resource "azurerm_storage_account" "invoices" {
          name                            = substr("st${replace(local.name_prefix, "-", "")}inv", 0, 24)
          resource_group_name             = azurerm_resource_group.main.name
          location                        = azurerm_resource_group.main.location
          account_tier                    = "Standard"
          account_replication_type        = "GZRS"
          min_tls_version                 = "TLS1_2"
          https_traffic_only_enabled      = true
          allow_nested_items_to_be_public = false
          tags                            = local.common_tags

          blob_properties {
            versioning_enabled = true

            delete_retention_policy {
              days = 14
            }

            container_delete_retention_policy {
              days = 14
            }
          }

          network_rules {
            default_action             = "Deny"
            bypass                     = ["AzureServices"]
            virtual_network_subnet_ids = [azurerm_subnet.app.id]
          }
        }

        resource "azurerm_storage_container" "invoices" {
          name                  = "invoices"
          storage_account_id    = azurerm_storage_account.invoices.id
          container_access_type = "private"
        }

        resource "azurerm_management_lock" "invoices" {
          name       = "lock-${local.name_prefix}-invoices"
          scope      = azurerm_storage_account.invoices.id
          lock_level = "CanNotDelete"
          notes      = "Invoices are retained for compliance; remove this lock only through a reviewed change."
        }
    starter:
      kind: terraform
      cloud: azure
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              azurerm = {
                source  = "hashicorp/azurerm"
                version = "~> 4.0"
              }
            }
          }
        providers.tf: |
          provider "azurerm" {
            features {}
          }
        variables.tf: |
          variable "project" {
            type        = string
            default     = "billing"
            description = "Project name: part of every resource name."
          }

          variable "environment" {
            type        = string
            default     = "prod"
            description = "Deployment environment (dev, test, prod)."
          }

          variable "location" {
            type        = string
            default     = "eastus2"
            description = "Azure region of the resource group and its resources."
          }
        locals.tf: |
          locals {
            name_prefix = "${var.project}-${var.environment}"
            common_tags = {
              project     = var.project
              environment = var.environment
              managedby   = "terraform"
            }
          }
        main.tf: |
          resource "azurerm_resource_group" "main" {
            name     = "rg-${local.name_prefix}"
            location = var.location
            tags     = local.common_tags
          }

          resource "azurerm_virtual_network" "main" {
            name                = "vnet-${local.name_prefix}"
            resource_group_name = azurerm_resource_group.main.name
            location            = azurerm_resource_group.main.location
            address_space       = ["10.30.0.0/16"]
            tags                = local.common_tags
          }

          resource "azurerm_subnet" "app" {
            name                 = "snet-app"
            resource_group_name  = azurerm_resource_group.main.name
            virtual_network_name = azurerm_virtual_network.main.name
            address_prefixes     = ["10.30.1.0/24"]
            service_endpoints    = ["Microsoft.Storage"]
          }

          resource "azurerm_storage_account" "invoices" {
            name                            = substr("st${replace(local.name_prefix, "-", "")}inv", 0, 24)
            resource_group_name             = azurerm_resource_group.main.name
            location                        = azurerm_resource_group.main.location
            account_tier                    = "Standard"
            account_replication_type        = "LRS"
            min_tls_version                 = "TLS1_2"
            https_traffic_only_enabled      = true
            allow_nested_items_to_be_public = false
            tags                            = local.common_tags
          }

          resource "azurerm_storage_container" "invoices" {
            name                  = "invoices"
            storage_account_id    = azurerm_storage_account.invoices.id
            container_access_type = "private"
          }
    checks:
    - id: validate
      label: The workflow validates
      type: validate
    - id: zone-redundant
      label: Replication survives a zone outage (ZRS, GZRS or RA-GZRS)
      type: has
      has:
        terraform:
          type: azurerm_storage_account
          where:
            account_replication_type:
              in: [ZRS, GZRS, RAGZRS]
    - id: versioning
      label: Blob versioning is enabled
      type: has
      has:
        terraform:
          type: azurerm_storage_account
          where:
            blob_properties.versioning_enabled: true
    - id: soft-delete
      label: Blob and container soft delete keep data at least 7 days
      type: has
      has:
        terraform:
          type: azurerm_storage_account
          where:
            blob_properties.delete_retention_policy.days:
              min: 7
            blob_properties.container_delete_retention_policy.days:
              min: 7
    - id: network-deny
      label: The storage firewall denies by default
      type: has
      has:
        terraform:
          type: azurerm_storage_account
          where:
            network_rules.default_action: Deny
    - id: delete-lock
      label: A CanNotDelete lock protects the storage account
      type: has
      has:
        terraform:
          type: azurerm_management_lock
          where:
            lock_level: CanNotDelete
            scope:
              ref: azurerm_storage_account
    sources:
    - title: Azure Storage redundancy
      url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
    - title: Security recommendations for Blob Storage (data protection and networking)
      url: https://learn.microsoft.com/en-us/azure/storage/blobs/security-recommendations
    - title: Well-Architected Framework service guide — Azure Blob Storage
      url: https://learn.microsoft.com/en-us/azure/well-architected/service-guides/azure-blob-storage
    - title: Lock your Azure resources to protect your infrastructure
      url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
    - title: Study guide for Exam AZ-104 (configure Azure Files and Blob Storage)
      url: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104
    - title: azurerm_storage_account (azurerm 4.x)
      url: https://registry.terraform.io/providers/hashicorp/azurerm/4.81.0/docs/resources/storage_account
    - title: azurerm_management_lock (azurerm 4.x)
