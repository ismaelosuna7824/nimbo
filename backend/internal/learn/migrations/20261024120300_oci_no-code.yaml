- op: upsert
  kind: challenge
  id: oci-vault-customer-managed-keys
  data:
    provider: oci
    level: intermediate
    title: Customer-managed encryption keys with OCI Vault
    summary: Encrypt a bucket and a block volume with your own Vault master encryption key, and authorize only the storage services to use it.
    minutes: 35
    tags: [vault, kms, encryption, object-storage, block-volume]
    prerequisites: [oci-private-bucket-lifecycle]
    runtime: design
    problem: |
      A compliance review asks that customer data be encrypted with keys the company controls: it must be able
      to rotate them on its own schedule and to revoke access by disabling a key. Today the reports bucket and
      the database volume rely on the default encryption, whose master keys Oracle manages.

      Object Storage and Block Volume always encrypt data; what you choose is who manages the master encryption
      key. The OCI security guide recommends creating and managing your own keys in the Vault service and
      limiting who can create, rotate and delete them. The storage services call Vault on your behalf, so an IAM
      policy must let them use the key — and only that key.
    requirements:
    - A vault (oci_kms_vault) holds an AES-256 master encryption key (key_shape algorithm "AES", length 32) protected by an HSM (protection_mode = "HSM").
    - The bucket and the block volume set kms_key_id to that key.
    - An IAM policy lets the storage services (blockstorage and objectstorage-<region>) use keys, restricted to this key with a target.key.id condition.
    hints:
    - Add a vault and a key from the palette. The key is created against the vault's management endpoint (**Link to…** the vault's `management_endpoint`), and its `key_shape` length is in bytes, so AES-256 is 32. Vault type DEFAULT or VIRTUAL_PRIVATE both work here.
    - Click the bucket and the volume and **Link to…** the key's id in their `kms_key_id` fields.
    - 'The storage services can only use the key once a policy allows it. Add an IAM policy in the tenancy and, in its **Access** section, add a statement: **Who** `service` → `blockstorage` and `objectstorage-us-ashburn-1`, verb `use`, `keys`, location `tenancy`, and a **where** condition `target.key.id = ` followed by the key''s id (the **Link to…** next to the where field adds it).'
    solution: |
      Create the vault and a key, authorize the services, then point the storage at the key:

      ```hcl
      resource "oci_kms_key" "data" {
        compartment_id      = var.compartment_ocid
        display_name        = "${local.name_prefix}-data"
        management_endpoint = oci_kms_vault.main.management_endpoint
        protection_mode     = "HSM"
        key_shape {
          algorithm = "AES"
          length    = 32
        }
      }

      resource "oci_identity_policy" "storage_keys" {
        # ...
        statements = [
          "Allow service blockstorage, objectstorage-${var.oci_region} to use keys in tenancy where target.key.id = '${oci_kms_key.data.id}'",
        ]
      }
      ```

      and set `kms_key_id = oci_kms_key.data.id` on `oci_objectstorage_bucket` and `oci_core_volume`.

      **Why:** every object and volume is encrypted with a data key, and the data key is wrapped by the master
      key assigned to the bucket or volume. With a Vault key you own that master key: you can rotate it (new key
      versions protect new data), and disabling or deleting it makes the data unreadable. HSM protection keeps
      the key material inside a hardware security module where it can't be exported. The `target.key.id`
      condition gives the services access to this key only, which follows least privilege. Automatic key
      rotation is available for keys in a virtual private vault.

      **Without writing code in Nimbo**

      1. From the palette add a **KMS vault**: tenancy OCID in **compartment_id**, display name `learn-dev-vault`, vault type `DEFAULT`.
      2. Add a **KMS key**: same compartment, display name `learn-dev-cmk`, **Link to…** the vault's `management_endpoint`, protection mode `HSM`, and in **key_shape** algorithm `AES`, length `32`.
      3. Click the bucket `reports` and the volume `db` and **Link to…** the key's id in **kms_key_id** on both.
      4. Add an **identity policy** in the tenancy (name `learn-dev-storage-keys`, short description). In its **Access** section click **Add statement**: **Who** `service` → `blockstorage`, `objectstorage-us-ashburn-1`, `use`, `keys`, location `tenancy`. Type `target.key.id = ` in the **where** field and use its **Link to…** to append the key's id.
    solutionFiles:
      main.tf: |
        data "oci_objectstorage_namespace" "ns" {
          compartment_id = var.compartment_ocid
        }

        data "oci_identity_availability_domains" "ads" {
          compartment_id = var.compartment_ocid
        }

        resource "oci_kms_vault" "main" {
          compartment_id = var.compartment_ocid
          display_name   = "${local.name_prefix}-vault"
          vault_type     = "DEFAULT"
          freeform_tags  = local.common_tags
        }

        # AES-256 master encryption key kept inside an HSM.
        resource "oci_kms_key" "data" {
          compartment_id      = var.compartment_ocid
          display_name        = "${local.name_prefix}-data"
          management_endpoint = oci_kms_vault.main.management_endpoint
          protection_mode     = "HSM"
          freeform_tags       = local.common_tags

          key_shape {
            algorithm = "AES"
            length    = 32
          }
        }

        # The storage services wrap data keys with this key, and only this one.
        resource "oci_identity_policy" "storage_keys" {
          compartment_id = var.compartment_ocid
          name           = "${local.name_prefix}-storage-keys"
          description    = "Lets Block Volume and Object Storage use the data key"
          freeform_tags  = local.common_tags
          statements = [
            "Allow service blockstorage, objectstorage-${var.oci_region} to use keys in tenancy where target.key.id = '${oci_kms_key.data.id}'",
          ]
        }

        resource "oci_objectstorage_bucket" "reports" {
          compartment_id = var.compartment_ocid
          namespace      = data.oci_objectstorage_namespace.ns.namespace
          name           = "${local.name_prefix}-reports"
          access_type    = "NoPublicAccess"
          versioning     = "Enabled"
          kms_key_id     = oci_kms_key.data.id
          freeform_tags  = local.common_tags

          depends_on = [oci_identity_policy.storage_keys]
        }

        resource "oci_core_volume" "db" {
          compartment_id      = var.compartment_ocid
          availability_domain = data.oci_identity_availability_domains.ads.availability_domains[0].name
          display_name        = "${local.name_prefix}-db"
          size_in_gbs         = 100
          kms_key_id          = oci_kms_key.data.id
          freeform_tags       = local.common_tags

          depends_on = [oci_identity_policy.storage_keys]
        }
    starter:
      kind: terraform
      cloud: oci
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              oci = {
                source  = "oracle/oci"
                version = "~> 9.0"
              }
            }
          }
        providers.tf: |
          provider "oci" {
            region = var.oci_region
          }
        variables.tf: |
          variable "project" {
            type        = string
            default     = "learn"
            description = "Project name: the first part of every resource name and the Project tag."
          }

          variable "environment" {
            type        = string
            default     = "dev"
            description = "Deployment environment (dev, staging, prod): part of every resource name and the Environment tag."
          }

          variable "oci_region" {
            type        = string
            default     = "us-ashburn-1"
            description = "OCI region to deploy into."
          }

          variable "compartment_ocid" {
            type        = string
            default     = "ocid1.tenancy.oc1..flocilocaltenancy0000000000000000000000000000000000000000"
            description = "Compartment OCID for every resource (defaults to the local Floci tenancy root compartment)."
          }
        locals.tf: |
          locals {
            name_prefix = "${var.project}-${var.environment}"
            common_tags = {
              Project     = var.project
              Environment = var.environment
              ManagedBy   = "nimbo"
            }
          }
        main.tf: |
          data "oci_objectstorage_namespace" "ns" {
            compartment_id = var.compartment_ocid
          }

          data "oci_identity_availability_domains" "ads" {
            compartment_id = var.compartment_ocid
          }

          # Encrypted at rest with Oracle-managed keys (the default).
          resource "oci_objectstorage_bucket" "reports" {
            compartment_id = var.compartment_ocid
            namespace      = data.oci_objectstorage_namespace.ns.namespace
            name           = "${local.name_prefix}-reports"
            access_type    = "NoPublicAccess"
            versioning     = "Enabled"
            freeform_tags  = local.common_tags
          }

          resource "oci_core_volume" "db" {
            compartment_id      = var.compartment_ocid
            availability_domain = data.oci_identity_availability_domains.ads.availability_domains[0].name
            display_name        = "${local.name_prefix}-db"
            size_in_gbs         = 100
            freeform_tags       = local.common_tags
          }
        outputs.tf: |
          output "bucket_name" {
            value       = oci_objectstorage_bucket.reports.name
            description = "Name of the reports bucket."
          }

          output "volume_id" {
            value       = oci_core_volume.db.id
            description = "OCID of the database volume."
          }
    checks:
    - id: validate
      label: The workflow validates
      type: validate
    - id: vault
      label: A vault exists
      type: has
      has:
        terraform:
          type: oci_kms_vault
          where:
            vault_type: {in: [DEFAULT, VIRTUAL_PRIVATE]}
    - id: hsm-aes-key
      label: The vault holds an HSM-protected AES-256 key
      type: has
      has:
        terraform:
          type: oci_kms_key
          where:
            management_endpoint: {ref: oci_kms_vault}
            protection_mode: HSM
            key_shape.algorithm: AES
            key_shape.length: 32
    - id: bucket-cmk
      label: The bucket is encrypted with the Vault key
      type: has
      has:
        terraform:
          type: oci_objectstorage_bucket
          where:
            kms_key_id: {ref: oci_kms_key}
    - id: volume-cmk
      label: The block volume is encrypted with the Vault key
      type: has
      has:
        terraform:
          type: oci_core_volume
          where:
            kms_key_id: {ref: oci_kms_key}
    - id: object-storage-can-use-key
      label: Object Storage may use keys
      type: has
      has:
        terraform:
          type: oci_identity_policy
          where:
            statements: {contains: objectstorage-}
    - id: block-storage-can-use-key
      label: Block Volume may use keys
      type: has
      has:
        terraform:
          type: oci_identity_policy
          where:
            statements: {contains: blockstorage}
    - id: key-scoped
      label: The service grant is limited to this key
      type: has
      has:
        terraform:
          type: oci_identity_policy
          where:
            statements: {contains: target.key.id}
    sources:
    - title: Overview of Vaults and Key Management
      url: https://docs.oracle.com/en-us/iaas/Content/KeyManagement/Concepts/keyoverview.htm
    - title: Object Storage Data Encryption
      url: https://docs.oracle.com/en-us/iaas/Content/Object/Tasks/encryption.htm
    - title: Securing Object Storage (OCI Security Guide)
      url: https://docs.oracle.com/en-us/iaas/Content/Security/Reference/objectstorage_security.htm
    - title: Common Policies (let Block Volume, Object Storage and others use keys)
      url: https://docs.oracle.com/en-us/iaas/Content/Identity/policiescommon/commonpolicies.htm
    - title: oci_kms_key (oracle/oci 9.x)
      url: https://registry.terraform.io/providers/oracle/oci/9.11.0/docs/resources/kms_key
    - title: oci_kms_vault (oracle/oci 9.x)
      url: https://registry.terraform.io/providers/oracle/oci/9.11.0/docs/resources/kms_vault
    solvableWithoutCode: true
- op: upsert
  kind: challenge
  id: oci-autonomous-db-private-endpoint
  data:
    provider: oci
    level: advanced
    title: Autonomous Database on a private endpoint
    summary: Take an Autonomous Database off the public internet, reach it through a private endpoint guarded by an NSG, and keep the admin password out of the code.
    minutes: 40
    tags: [database, autonomous-database, private-endpoint, nsg, secrets]
    prerequisites: [oci-nsg-tiered-access]
    runtime: design
    problem: |
      The orders service uses an Autonomous Database (serverless) that was created with a public endpoint and an
      access control list of 0.0.0.0/0, so anyone who obtains the credentials can connect from anywhere. The
      ADMIN password is a default value in variables.tf, committed to Git and printed by every plan.

      Autonomous Database can use a private endpoint inside your VCN instead: traffic is allowed only from that
      VCN, public access is blocked, and network security groups (or security lists) decide who may connect.
      For TLS and mTLS connections the database listens on TCP 1522. Move the database into the private data
      subnet, let only the app tier reach it, and treat the password as a secret.
    requirements:
    - The Autonomous Database uses a private endpoint (subnet_id in the data subnet) and has nsg_ids.
    - The database has no public access control list (no whitelisted_ips).
    - The data subnet is private (both subnets end up with prohibit_public_ip_on_vnic = true).
    - An NSG rule allows TCP 1522 into the database NSG from inside the VCN (not from 0.0.0.0/0).
    - The ADMIN password comes from a variable marked sensitive = true, without a default (Nimbo rule bp_sensitive_not_marked reports nothing).
    hints:
    - 'Click the Autonomous Database: its private endpoint settings are inspector fields (`subnet_id`, `nsg_ids`, `private_endpoint_label`). Whitelisted IPs only apply to public endpoints, so clear that field.'
    - 'Add a network security group for the database from the palette and a security rule for it: direction `INGRESS`, protocol `6` (TCP), destination port range 1522 to 1522, and the VCN range as the source (**Link to…** `var.vcn_cidr`). Then **Link to…** the NSG''s id on the database''s `nsg_ids`: it is added to the list.'
    - Make the data subnet private with its `prohibit_public_ip_on_vnic` switch. In the **Variables** panel, click **Remove default** on `db_admin_password` and tick **Sensitive**; pass the value through TF_VAR_db_admin_password or a Vault secret at deploy time.
    solution: |
      Put the database in the private subnet behind its own NSG:

      ```hcl
      resource "oci_database_autonomous_database" "orders" {
        # ...
        admin_password         = var.db_admin_password
        subnet_id              = oci_core_subnet.data.id
        nsg_ids                = [oci_core_network_security_group.db.id]
        private_endpoint_label = "orders"
      }

      resource "oci_core_network_security_group_security_rule" "db_from_app" {
        network_security_group_id = oci_core_network_security_group.db.id
        direction                 = "INGRESS"
        protocol                  = "6"
        source                    = local.app_cidr
        source_type               = "CIDR_BLOCK"
        tcp_options {
          destination_port_range {
            min = 1522
            max = 1522
          }
        }
      }

      variable "db_admin_password" {
        type        = string
        sensitive   = true
        description = "ADMIN password of the database (pass it with TF_VAR_db_admin_password)."
      }
      ```

      and set `prohibit_public_ip_on_vnic = true` on the data subnet.

      **Why:** with a private endpoint the database accepts traffic only from the VCN you specify and blocks
      all public IPs, so the network becomes a second barrier after the credentials. The NSG acts as a virtual
      firewall for the database; port 1522 serves both TLS and mutual TLS connections. With a private endpoint,
      the NSG and the VCN's security rules decide who connects, so the 0.0.0.0/0 access list goes. A sensitive variable without a default keeps the password out
      of the repository and redacted in plan output.

      **Without writing code in Nimbo**

      1. Click the subnet `data` and turn **prohibit_public_ip_on_vnic** on.
      2. From the palette add a **network security group** `db`: **Link to…** `var.compartment_ocid` and the VCN's id, display name `learn-dev-db`.
      3. Add a **network security group security rule**: **Link to…** the NSG's id in **network_security_group_id**, direction `INGRESS`, protocol `6`, source type `CIDR_BLOCK`, source → **Link to…** `var.vcn_cidr`, and in **tcp_options** → **destination_port_range** min `1522` and max `1522`.
      4. Click the Autonomous Database: **Link to…** the data subnet's id in **subnet_id**, **Link to…** the NSG's id in **nsg_ids**, and clear **whitelisted_ips**.
      5. Open the **Variables** panel: on `db_admin_password` click **Remove default** and tick **Sensitive**.
    solutionFiles:
      variables.tf: |
        variable "project" {
          type        = string
          default     = "learn"
          description = "Project name: the first part of every resource name and the Project tag."
        }

        variable "environment" {
          type        = string
          default     = "dev"
          description = "Deployment environment (dev, staging, prod): part of every resource name and the Environment tag."
        }

        variable "oci_region" {
          type        = string
          default     = "us-ashburn-1"
          description = "OCI region to deploy into."
        }

        variable "compartment_ocid" {
          type        = string
          default     = "ocid1.tenancy.oc1..flocilocaltenancy0000000000000000000000000000000000000000"
          description = "Compartment OCID for every resource (defaults to the local Floci tenancy root compartment)."
        }

        variable "vcn_cidr" {
          type        = string
          default     = "10.40.0.0/16"
          description = "Address range of the VCN: the app subnet is its first /24, the data subnet the second."
        }

        variable "db_admin_password" {
          type        = string
          sensitive   = true
          description = "ADMIN password of the database (pass it with TF_VAR_db_admin_password)."
        }
      network.tf: |
        resource "oci_core_vcn" "main" {
          compartment_id = var.compartment_ocid
          display_name   = local.name_prefix
          cidr_blocks    = [var.vcn_cidr]
          dns_label      = "orders"
          freeform_tags  = local.common_tags
        }

        resource "oci_core_subnet" "app" {
          compartment_id             = var.compartment_ocid
          vcn_id                     = oci_core_vcn.main.id
          display_name               = "${local.name_prefix}-app"
          cidr_block                 = local.app_cidr
          dns_label                  = "app"
          prohibit_public_ip_on_vnic = true
          freeform_tags              = local.common_tags
        }

        resource "oci_core_subnet" "data" {
          compartment_id             = var.compartment_ocid
          vcn_id                     = oci_core_vcn.main.id
          display_name               = "${local.name_prefix}-data"
          cidr_block                 = local.data_cidr
          dns_label                  = "data"
          prohibit_public_ip_on_vnic = true
          freeform_tags              = local.common_tags
        }

        # Virtual firewall of the database's private endpoint.
        resource "oci_core_network_security_group" "db" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.main.id
          display_name   = "${local.name_prefix}-db"
          freeform_tags  = local.common_tags
        }

        resource "oci_core_network_security_group_security_rule" "db_from_app" {
          network_security_group_id = oci_core_network_security_group.db.id
          description               = "TLS and mTLS connections from the app subnet"
          direction                 = "INGRESS"
          protocol                  = "6"
          source                    = local.app_cidr
          source_type               = "CIDR_BLOCK"

          tcp_options {
            destination_port_range {
              min = 1522
              max = 1522
            }
          }
        }
      main.tf: |
        resource "oci_database_autonomous_database" "orders" {
          compartment_id           = var.compartment_ocid
          db_name                  = "orders"
          display_name             = "${local.name_prefix}-orders"
          db_workload              = "OLTP"
          compute_model            = "ECPU"
          compute_count            = 2
          data_storage_size_in_tbs = 1
          admin_password           = var.db_admin_password
          subnet_id                = oci_core_subnet.data.id
          nsg_ids                  = [oci_core_network_security_group.db.id]
          private_endpoint_label   = "orders"
          freeform_tags            = local.common_tags
        }
    starter:
      kind: terraform
      cloud: oci
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              oci = {
                source  = "oracle/oci"
                version = "~> 9.0"
              }
            }
          }
        providers.tf: |
          provider "oci" {
            region = var.oci_region
          }
        variables.tf: |
          variable "project" {
            type        = string
            default     = "learn"
            description = "Project name: the first part of every resource name and the Project tag."
          }

          variable "environment" {
            type        = string
            default     = "dev"
            description = "Deployment environment (dev, staging, prod): part of every resource name and the Environment tag."
          }

          variable "oci_region" {
            type        = string
            default     = "us-ashburn-1"
            description = "OCI region to deploy into."
          }

          variable "compartment_ocid" {
            type        = string
            default     = "ocid1.tenancy.oc1..flocilocaltenancy0000000000000000000000000000000000000000"
            description = "Compartment OCID for every resource (defaults to the local Floci tenancy root compartment)."
          }

          variable "vcn_cidr" {
            type        = string
            default     = "10.40.0.0/16"
            description = "Address range of the VCN: the app subnet is its first /24, the data subnet the second."
          }

          variable "db_admin_password" {
            type        = string
            default     = "Welcome-Orders-2026#"
            description = "ADMIN password of the database."
          }
        locals.tf: |
          locals {
            name_prefix = "${var.project}-${var.environment}"
            common_tags = {
              Project     = var.project
              Environment = var.environment
              ManagedBy   = "nimbo"
            }

            app_cidr  = cidrsubnet(var.vcn_cidr, 8, 0)
            data_cidr = cidrsubnet(var.vcn_cidr, 8, 1)
          }
        network.tf: |
          resource "oci_core_vcn" "main" {
            compartment_id = var.compartment_ocid
            display_name   = local.name_prefix
            cidr_blocks    = [var.vcn_cidr]
            dns_label      = "orders"
            freeform_tags  = local.common_tags
          }

          resource "oci_core_subnet" "app" {
            compartment_id             = var.compartment_ocid
            vcn_id                     = oci_core_vcn.main.id
            display_name               = "${local.name_prefix}-app"
            cidr_block                 = local.app_cidr
            dns_label                  = "app"
            prohibit_public_ip_on_vnic = true
            freeform_tags              = local.common_tags
          }

          # Planned for the database, but nothing uses it yet.
          resource "oci_core_subnet" "data" {
            compartment_id             = var.compartment_ocid
            vcn_id                     = oci_core_vcn.main.id
            display_name               = "${local.name_prefix}-data"
            cidr_block                 = local.data_cidr
            dns_label                  = "data"
            prohibit_public_ip_on_vnic = false
            freeform_tags              = local.common_tags
          }
        main.tf: |
          # Public endpoint, reachable from any IP address.
          resource "oci_database_autonomous_database" "orders" {
            compartment_id           = var.compartment_ocid
            db_name                  = "orders"
            display_name             = "${local.name_prefix}-orders"
            db_workload              = "OLTP"
            compute_model            = "ECPU"
            compute_count            = 2
            data_storage_size_in_tbs = 1
            admin_password           = var.db_admin_password
            whitelisted_ips          = ["0.0.0.0/0"]
            freeform_tags            = local.common_tags
          }
        outputs.tf: |
          output "database_id" {
            value       = oci_database_autonomous_database.orders.id
            description = "OCID of the orders database."
          }
    checks:
    - id: validate
      label: The workflow validates
      type: validate
    - id: private-endpoint
      label: The database uses a private endpoint in a subnet
      type: has
      has:
        terraform:
          type: oci_database_autonomous_database
          where:
            subnet_id: {ref: oci_core_subnet}
    - id: database-nsg
      label: The private endpoint is protected by an NSG
      type: has
      has:
        terraform:
          type: oci_database_autonomous_database
          where:
            nsg_ids: {ref: oci_core_network_security_group}
    - id: no-public-acl
      label: No public access control list remains
      type: has
      has:
        terraform:
          type: oci_database_autonomous_database
          where:
            whitelisted_ips: {exists: true}
          count: {max: 0}
    - id: private-subnets
      label: Both subnets forbid public IPs
      type: has
      has:
        terraform:
          type: oci_core_subnet
          where:
            prohibit_public_ip_on_vnic: true
          count: {min: 2}
    - id: db-port-from-vcn
      label: TCP 1522 is allowed into the database NSG from inside the VCN
      type: has
      has:
        terraform:
          type: oci_core_network_security_group_security_rule
          where:
            direction: INGRESS
            source: {notIn: [0.0.0.0/0]}
            tcp_options.destination_port_range.min: 1522
    - id: password-secret
      label: The admin password variable is sensitive (bp_sensitive_not_marked)
      type: rules_clean
      rules_clean:
        codes: [bp_sensitive_not_marked]
        minSeverity: info
    - id: password-from-variable
      label: The admin password is not a literal
      type: has
      has:
        terraform:
          type: oci_database_autonomous_database
          where:
            admin_password: {ref: var.}
    sources:
    - title: Configure Network Access with Private Endpoints (Autonomous Database Serverless)
      url: https://docs.oracle.com/en-us/iaas/autonomous-database-serverless/doc/private-endpoints-autonomous.html
    - title: Network Security Groups
      url: https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/networksecuritygroups.htm
    - title: Securing Networking (OCI Security Guide)
      url: https://docs.oracle.com/en-us/iaas/Content/Security/Reference/networking_security.htm
    - title: oci_database_autonomous_database (oracle/oci 9.x)
      url: https://registry.terraform.io/providers/oracle/oci/9.11.0/docs/resources/database_autonomous_database
    - title: Sensitive input variables (Terraform)
      url: https://developer.hashicorp.com/terraform/language/values/variables#suppressing-values-in-cli-output
    solvableWithoutCode: true
- op: upsert
  kind: challenge
  id: oci-oke-private-cluster
  data:
    provider: oci
    level: advanced
    title: Private OKE cluster with VCN-native pod networking
    summary: Rebuild a public, single-node OKE cluster as a private, VCN-native cluster with highly available worker nodes and secrets encrypted by your own key.
    minutes: 50
    tags: [oke, kubernetes, networking, vault, high-availability]
    prerequisites: [oci-vcn-public-private-subnets, oci-vault-customer-managed-keys]
    runtime: design
    problem: |
      A proof-of-concept Kubernetes Engine (OKE) cluster became production. Its Kubernetes API endpoint has a
      public IP, the API endpoint and the worker nodes share one public subnet, the node pool has a single node
      in one availability domain, pods use the flannel overlay, and Kubernetes secrets in etcd are encrypted
      with Oracle-managed keys.

      Oracle's OKE best practices recommend private clusters — a VCN-native cluster whose API endpoint is in a
      private subnet — with worker nodes in private subnets, separate subnets for the API endpoint, workers,
      pods and load balancers, NSGs instead of security lists, and regional subnets with workloads spread for
      high availability. Secrets can be encrypted at rest with a master encryption key from Vault that you manage.
    requirements:
    - The cluster's API endpoint has no public IP (endpoint_config.is_public_ip_enabled = false), lives in a subnet and has an NSG.
    - The cluster and its node pool use the OCI VCN-Native Pod Networking CNI (OCI_VCN_IP_NATIVE), with pods in their own subnet (pod_subnet_ids).
    - The node pool has at least 3 nodes and placement configs (one per availability domain).
    - The API endpoint, worker and pod subnets are private (at least 3 subnets with prohibit_public_ip_on_vnic = true), and service load balancers get a fourth, public subnet (options.service_lb_subnet_ids).
    - The cluster's kms_key_id is a Vault key, and a policy lets clusters use that key (request.principal.type = 'cluster' and target.key.id).
    hints:
    - Split the VCN into regional subnets — Kubernetes API endpoint, workers and pods (all private) — and leave the existing public subnet to the service load balancers. Add the three private subnets from the palette and point each cluster/node-pool field at the right one with **Link to…**.
    - 'VCN-native pod networking is set twice: pick `OCI_VCN_IP_NATIVE` in the cluster''s `cluster_pod_network_options` block and in the node pool''s `node_pool_pod_network_option_details` block (add the pods subnet to its `pod_subnet_ids`). Turn off the public IP of the API endpoint in `endpoint_config` and give it its own NSG.'
    - 'Encrypt Kubernetes secrets with a key from a vault you add from the palette (**Link to…** the key''s id in the cluster''s `kms_key_id`). The key policy from the OKE docs is a statement in the policy''s **Access** section: **Who** `any-user`, `use`, `keys`, location `tenancy`, where `ALL {request.principal.type = ''cluster'', target.key.id = ` + the key''s id (via the where field''s **Link to…**) + `}`.'
    solution: |
      The cluster gets a private, NSG-protected endpoint, VCN-native pod networking and a Vault key:

      ```hcl
      resource "oci_containerengine_cluster" "main" {
        # ...
        kms_key_id = oci_kms_key.secrets.id

        cluster_pod_network_options {
          cni_type = "OCI_VCN_IP_NATIVE"
        }

        endpoint_config {
          is_public_ip_enabled = false
          subnet_id            = oci_core_subnet.api.id
          nsg_ids              = [oci_core_network_security_group.api.id]
        }

        options {
          service_lb_subnet_ids = [oci_core_subnet.lb.id]
        }
      }
      ```

      The node pool sets `size = 3`, one placement per availability domain in the workers subnet, and
      `node_pool_pod_network_option_details { cni_type = "OCI_VCN_IP_NATIVE", pod_subnet_ids = [...] }`.
      A policy statement `Allow any-user to use keys in tenancy where ALL {request.principal.type = 'cluster',
      target.key.id = '<key OCID>'}` lets the cluster use the key.

      **Why:** without a private endpoint, the API has a public IPv4 address and all API traffic, including
      traffic from the node pools, crosses the public network. Private worker subnets keep nodes off the
      internet; a service gateway (and NAT for internet egress) gives them what they need. With VCN-native pod
      networking, pods get IP addresses from a VCN subnet, so NSGs and VCN routing apply to pod traffic. Three
      nodes across availability domains let the cluster lose an AD or a node without losing capacity entirely.
      Encrypting secrets with your own key means disabling the key cuts off access to them — and deleting it
      makes them unrecoverable, so protect the key.

      **Without writing code in Nimbo**

      1. From the palette add three **subnets** in the VCN (**Link to…** its id), all with **prohibit_public_ip_on_vnic** on: `api` (`10.0.1.0/24`), `workers` (`10.0.2.0/24`) and `pods` (`10.0.32.0/19`).
      2. Add a **network security group** `api` in the VCN.
      3. Add a **KMS vault** (`DEFAULT`) and a **KMS key**: **Link to…** the vault's `management_endpoint`, and in **key_shape** algorithm `AES`, length `32`.
      4. Click the cluster: **Link to…** the key's id in **kms_key_id**; in **cluster_pod_network_options** pick `OCI_VCN_IP_NATIVE`; in **endpoint_config** turn **is_public_ip_enabled** off, **Link to…** the `api` subnet's id in **subnet_id** and the NSG's id in **nsg_ids**.
      5. Click the node pool: in **node_config_details** set size `3`, **Link to…** the `workers` subnet's id in the placement config's **subnet_id**, and in **node_pool_pod_network_option_details** pick `OCI_VCN_IP_NATIVE` and **Link to…** the `pods` subnet's id in **pod_subnet_ids**.
      6. Add an **identity policy** (name `learn-dev-oke-key`). In its **Access** section click **Add statement**: **Who** `any-user`, `use`, `keys`, location `tenancy`. In **where** type `ALL {request.principal.type = 'cluster', target.key.id = `, use the field's **Link to…** to append the key's id, and type the closing `}`.
    solutionFiles:
      network.tf: |
        resource "oci_core_vcn" "main" {
          compartment_id = var.compartment_ocid
          display_name   = local.name_prefix
          cidr_blocks    = [var.vcn_cidr]
          dns_label      = "oke"
          freeform_tags  = local.common_tags
        }

        resource "oci_core_internet_gateway" "main" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.main.id
          display_name   = "${local.name_prefix}-igw"
          enabled        = true
          freeform_tags  = local.common_tags
        }

        resource "oci_core_nat_gateway" "main" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.main.id
          display_name   = "${local.name_prefix}-nat"
          freeform_tags  = local.common_tags
        }

        data "oci_core_services" "all" {
          filter {
            name   = "name"
            values = ["All .* Services In Oracle Services Network"]
            regex  = true
          }
        }

        resource "oci_core_service_gateway" "main" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.main.id
          display_name   = "${local.name_prefix}-sgw"
          freeform_tags  = local.common_tags

          services {
            service_id = data.oci_core_services.all.services[0].id
          }
        }

        resource "oci_core_route_table" "public" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.main.id
          display_name   = "${local.name_prefix}-public"
          freeform_tags  = local.common_tags

          route_rules {
            destination       = "0.0.0.0/0"
            destination_type  = "CIDR_BLOCK"
            network_entity_id = oci_core_internet_gateway.main.id
          }
        }

        resource "oci_core_route_table" "private" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.main.id
          display_name   = "${local.name_prefix}-private"
          freeform_tags  = local.common_tags

          route_rules {
            destination       = "0.0.0.0/0"
            destination_type  = "CIDR_BLOCK"
            network_entity_id = oci_core_nat_gateway.main.id
          }

          route_rules {
            destination       = data.oci_core_services.all.services[0].cidr_block
            destination_type  = "SERVICE_CIDR_BLOCK"
            network_entity_id = oci_core_service_gateway.main.id
          }
        }

        # Regional private subnets: API endpoint, worker nodes and pods.
        resource "oci_core_subnet" "api" {
          compartment_id             = var.compartment_ocid
          vcn_id                     = oci_core_vcn.main.id
          display_name               = "${local.name_prefix}-api"
          cidr_block                 = cidrsubnet(var.vcn_cidr, 12, 0)
          dns_label                  = "api"
          prohibit_public_ip_on_vnic = true
          route_table_id             = oci_core_route_table.private.id
          freeform_tags              = local.common_tags
        }

        resource "oci_core_subnet" "workers" {
          compartment_id             = var.compartment_ocid
          vcn_id                     = oci_core_vcn.main.id
          display_name               = "${local.name_prefix}-workers"
          cidr_block                 = cidrsubnet(var.vcn_cidr, 8, 1)
          dns_label                  = "workers"
          prohibit_public_ip_on_vnic = true
          route_table_id             = oci_core_route_table.private.id
          freeform_tags              = local.common_tags
        }

        # Large range: with VCN-native networking every pod gets a VCN IP.
        resource "oci_core_subnet" "pods" {
          compartment_id             = var.compartment_ocid
          vcn_id                     = oci_core_vcn.main.id
          display_name               = "${local.name_prefix}-pods"
          cidr_block                 = cidrsubnet(var.vcn_cidr, 3, 1)
          dns_label                  = "pods"
          prohibit_public_ip_on_vnic = true
          route_table_id             = oci_core_route_table.private.id
          freeform_tags              = local.common_tags
        }

        # Public subnet for the load balancers of Kubernetes services only.
        resource "oci_core_subnet" "lb" {
          compartment_id             = var.compartment_ocid
          vcn_id                     = oci_core_vcn.main.id
          display_name               = "${local.name_prefix}-lb"
          cidr_block                 = cidrsubnet(var.vcn_cidr, 8, 2)
          dns_label                  = "lb"
          prohibit_public_ip_on_vnic = false
          route_table_id             = oci_core_route_table.public.id
          freeform_tags              = local.common_tags
        }

        resource "oci_core_network_security_group" "api" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.main.id
          display_name   = "${local.name_prefix}-api"
          freeform_tags  = local.common_tags
        }

        # kubectl and the worker nodes reach the API from inside the VCN.
        resource "oci_core_network_security_group_security_rule" "api_from_vcn" {
          network_security_group_id = oci_core_network_security_group.api.id
          description               = "Kubernetes API from the VCN"
          direction                 = "INGRESS"
          protocol                  = "6"
          source                    = var.vcn_cidr
          source_type               = "CIDR_BLOCK"

          tcp_options {
            destination_port_range {
              min = 6443
              max = 6443
            }
          }
        }
      keys.tf: |
        resource "oci_kms_vault" "main" {
          compartment_id = var.compartment_ocid
          display_name   = "${local.name_prefix}-vault"
          vault_type     = "DEFAULT"
          freeform_tags  = local.common_tags
        }

        resource "oci_kms_key" "secrets" {
          compartment_id      = var.compartment_ocid
          display_name        = "${local.name_prefix}-k8s-secrets"
          management_endpoint = oci_kms_vault.main.management_endpoint
          protection_mode     = "HSM"
          freeform_tags       = local.common_tags

          key_shape {
            algorithm = "AES"
            length    = 32
          }
        }

        # Only clusters may use this key, and only this key.
        resource "oci_identity_policy" "oke_secrets_key" {
          compartment_id = var.compartment_ocid
          name           = "${local.name_prefix}-oke-secrets-key"
          description    = "Lets OKE clusters encrypt Kubernetes secrets with the Vault key"
          freeform_tags  = local.common_tags
          statements = [
            "Allow any-user to use keys in tenancy where ALL {request.principal.type = 'cluster', target.key.id = '${oci_kms_key.secrets.id}'}",
          ]
        }
      main.tf: |
        data "oci_identity_availability_domains" "ads" {
          compartment_id = var.compartment_ocid
        }

        data "oci_containerengine_node_pool_option" "all" {
          node_pool_option_id = "all"
          compartment_id      = var.compartment_ocid
        }

        resource "oci_containerengine_cluster" "main" {
          compartment_id     = var.compartment_ocid
          name               = local.name_prefix
          kubernetes_version = var.kubernetes_version
          vcn_id             = oci_core_vcn.main.id
          type               = "ENHANCED_CLUSTER"
          kms_key_id         = oci_kms_key.secrets.id
          freeform_tags      = local.common_tags

          cluster_pod_network_options {
            cni_type = "OCI_VCN_IP_NATIVE"
          }

          endpoint_config {
            is_public_ip_enabled = false
            subnet_id            = oci_core_subnet.api.id
            nsg_ids              = [oci_core_network_security_group.api.id]
          }

          options {
            service_lb_subnet_ids = [oci_core_subnet.lb.id]
          }

          depends_on = [oci_identity_policy.oke_secrets_key]
        }

        resource "oci_containerengine_node_pool" "workers" {
          cluster_id         = oci_containerengine_cluster.main.id
          compartment_id     = var.compartment_ocid
          name               = "${local.name_prefix}-workers"
          kubernetes_version = var.kubernetes_version
          node_shape         = var.node_shape
          freeform_tags      = local.common_tags

          node_shape_config {
            ocpus         = 2
            memory_in_gbs = 16
          }

          node_source_details {
            source_type = "IMAGE"
            image_id    = local.node_image_id
          }

          node_config_details {
            size = 3

            dynamic "placement_configs" {
              for_each = data.oci_identity_availability_domains.ads.availability_domains
              content {
                availability_domain = placement_configs.value.name
                subnet_id           = oci_core_subnet.workers.id
              }
            }

            node_pool_pod_network_option_details {
              cni_type       = "OCI_VCN_IP_NATIVE"
              pod_subnet_ids = [oci_core_subnet.pods.id]
            }
          }
        }
    starter:
      kind: terraform
      cloud: oci
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              oci = {
                source  = "oracle/oci"
                version = "~> 9.0"
              }
            }
          }
        providers.tf: |
          provider "oci" {
            region = var.oci_region
          }
        variables.tf: |
          variable "project" {
            type        = string
            default     = "learn"
            description = "Project name: the first part of every resource name and the Project tag."
          }

          variable "environment" {
            type        = string
            default     = "dev"
            description = "Deployment environment (dev, staging, prod): part of every resource name and the Environment tag."
          }

          variable "oci_region" {
            type        = string
            default     = "us-ashburn-1"
            description = "OCI region to deploy into."
          }

          variable "compartment_ocid" {
            type        = string
            default     = "ocid1.tenancy.oc1..flocilocaltenancy0000000000000000000000000000000000000000"
            description = "Compartment OCID for every resource (defaults to the local Floci tenancy root compartment)."
          }

          variable "vcn_cidr" {
            type        = string
            default     = "10.0.0.0/16"
            description = "Address range of the VCN."
          }

          variable "kubernetes_version" {
            type        = string
            default     = "v1.35.2"
            description = "Kubernetes version of the cluster and its node pool (one OKE supports in your region)."
          }

          variable "node_shape" {
            type        = string
            default     = "VM.Standard.E4.Flex"
            description = "Compute shape of the worker nodes (a flexible shape)."
          }
        locals.tf: |
          locals {
            name_prefix = "${var.project}-${var.environment}"
            common_tags = {
              Project     = var.project
              Environment = var.environment
              ManagedBy   = "nimbo"
            }

            # Newest OKE Oracle Linux image for the cluster's Kubernetes version.
            node_image_id = [
              for s in data.oci_containerengine_node_pool_option.all.sources : s.image_id
              if length(regexall("Oracle-Linux-.*-OKE-${trimprefix(var.kubernetes_version, "v")}-", s.source_name)) > 0
            ][0]
          }
        network.tf: |
          resource "oci_core_vcn" "main" {
            compartment_id = var.compartment_ocid
            display_name   = local.name_prefix
            cidr_blocks    = [var.vcn_cidr]
            dns_label      = "oke"
            freeform_tags  = local.common_tags
          }

          resource "oci_core_internet_gateway" "main" {
            compartment_id = var.compartment_ocid
            vcn_id         = oci_core_vcn.main.id
            display_name   = "${local.name_prefix}-igw"
            enabled        = true
            freeform_tags  = local.common_tags
          }

          resource "oci_core_route_table" "public" {
            compartment_id = var.compartment_ocid
            vcn_id         = oci_core_vcn.main.id
            display_name   = "${local.name_prefix}-public"
            freeform_tags  = local.common_tags

            route_rules {
              destination       = "0.0.0.0/0"
              destination_type  = "CIDR_BLOCK"
              network_entity_id = oci_core_internet_gateway.main.id
            }
          }

          # Everything shares one public subnet: API endpoint, nodes and load
          # balancers.
          resource "oci_core_subnet" "public" {
            compartment_id             = var.compartment_ocid
            vcn_id                     = oci_core_vcn.main.id
            display_name               = "${local.name_prefix}-public"
            cidr_block                 = cidrsubnet(var.vcn_cidr, 8, 0)
            dns_label                  = "public"
            prohibit_public_ip_on_vnic = false
            route_table_id             = oci_core_route_table.public.id
            freeform_tags              = local.common_tags
          }
        main.tf: |
          data "oci_identity_availability_domains" "ads" {
            compartment_id = var.compartment_ocid
          }

          data "oci_containerengine_node_pool_option" "all" {
            node_pool_option_id = "all"
            compartment_id      = var.compartment_ocid
          }

          resource "oci_containerengine_cluster" "main" {
            compartment_id     = var.compartment_ocid
            name               = local.name_prefix
            kubernetes_version = var.kubernetes_version
            vcn_id             = oci_core_vcn.main.id
            freeform_tags      = local.common_tags

            cluster_pod_network_options {
              cni_type = "FLANNEL_OVERLAY"
            }

            endpoint_config {
              is_public_ip_enabled = true
              subnet_id            = oci_core_subnet.public.id
            }

            options {
              service_lb_subnet_ids = [oci_core_subnet.public.id]
            }
          }

          resource "oci_containerengine_node_pool" "workers" {
            cluster_id         = oci_containerengine_cluster.main.id
            compartment_id     = var.compartment_ocid
            name               = "${local.name_prefix}-workers"
            kubernetes_version = var.kubernetes_version
            node_shape         = var.node_shape
            freeform_tags      = local.common_tags

            node_shape_config {
              ocpus         = 2
              memory_in_gbs = 16
            }

            node_source_details {
              source_type = "IMAGE"
              image_id    = local.node_image_id
            }

            node_config_details {
              size = 1

              placement_configs {
                availability_domain = data.oci_identity_availability_domains.ads.availability_domains[0].name
                subnet_id           = oci_core_subnet.public.id
              }
            }
          }
        outputs.tf: |
          output "cluster_id" {
            value       = oci_containerengine_cluster.main.id
            description = "OCID of the OKE cluster."
          }
    checks:
    - id: validate
      label: The workflow validates
      type: validate
    - id: private-api-endpoint
      label: The Kubernetes API endpoint has no public IP and an NSG
      type: has
      has:
        terraform:
          type: oci_containerengine_cluster
          where:
            endpoint_config.is_public_ip_enabled: false
            endpoint_config.subnet_id: {ref: oci_core_subnet}
            endpoint_config.nsg_ids: {ref: oci_core_network_security_group}
    - id: vcn-native-cluster
      label: The cluster uses VCN-native pod networking
      type: has
      has:
        terraform:
          type: oci_containerengine_cluster
          where:
            cluster_pod_network_options.cni_type: OCI_VCN_IP_NATIVE
    - id: vcn-native-pods
      label: The node pool puts pods in their own VCN subnet
      type: has
      has:
        terraform:
          type: oci_containerengine_node_pool
          where:
            node_config_details.node_pool_pod_network_option_details.cni_type: OCI_VCN_IP_NATIVE
            node_config_details.node_pool_pod_network_option_details.pod_subnet_ids: {exists: true}
    - id: ha-node-pool
      label: The node pool has at least 3 nodes with placement configs
      type: has
      has:
        terraform:
          type: oci_containerengine_node_pool
          where:
            node_config_details.size: {min: 3}
            node_config_details.placement_configs: {exists: true}
    - id: private-subnets
      label: API endpoint, worker and pod subnets are private
      type: has
      has:
        terraform:
          type: oci_core_subnet
          where:
            prohibit_public_ip_on_vnic: true
          count: {min: 3}
    - id: separate-lb-subnet
      label: Load balancers get their own subnet (four subnets in total)
      type: has
      has:
        terraform:
          type: oci_core_subnet
          count: {min: 4}
    - id: secrets-cmk
      label: Kubernetes secrets are encrypted with a Vault key
      type: has
      has:
        terraform:
          type: oci_containerengine_cluster
          where:
            kms_key_id: {ref: oci_kms_key}
    - id: key-policy
      label: Only clusters may use the key
      type: has
      has:
        terraform:
          type: oci_identity_policy
          where:
            statements: {contains: request.principal.type = 'cluster'}
    sources:
    - title: Security Best Practices (Kubernetes Engine)
      url: https://docs.oracle.com/en-us/iaas/Content/ContEng/Tasks/contengbestpractices_topic-Security-best-practices.htm
    - title: Networking Best Practices (Kubernetes Engine)
      url: https://docs.oracle.com/en-us/iaas/Content/ContEng/Tasks/contengbestpractices_topic-Networking-best-practices.htm
    - title: Network Resource Configuration for Cluster Creation and Deployment
      url: https://docs.oracle.com/en-us/iaas/Content/ContEng/Concepts/contengnetworkconfig.htm
    - title: Using the OCI VCN-Native Pod Networking CNI plugin for pod networking
      url: https://docs.oracle.com/en-us/iaas/Content/ContEng/Concepts/contengpodnetworking_topic-OCI_CNI_plugin.htm
    - title: Encrypting Kubernetes Secrets at Rest in Etcd
      url: https://docs.oracle.com/en-us/iaas/Content/ContEng/Tasks/contengencryptingdata.htm
    - title: Securing Kubernetes Engine (OCI Security Guide)
      url: https://docs.oracle.com/en-us/iaas/Content/Security/Reference/oke_security.htm
    - title: oci_containerengine_cluster (oracle/oci 9.x)
      url: https://registry.terraform.io/providers/oracle/oci/9.11.0/docs/resources/containerengine_cluster
    - title: oci_containerengine_node_pool (oracle/oci 9.x)
      url: https://registry.terraform.io/providers/oracle/oci/9.11.0/docs/resources/containerengine_node_pool
    solvableWithoutCode: true
- op: upsert
  kind: challenge
  id: oci-cis-landing-zone
  data:
    provider: oci
    level: expert
    title: A CIS-aligned landing zone
    summary: Turn a flat tenancy with one all-powerful group into a landing zone with role compartments, scoped groups, Cloud Guard, change notifications and a budget.
    minutes: 75
    tags: [landing-zone, governance, iam, cloud-guard, events, budgets]
    prerequisites: [oci-compartment-least-privilege, oci-vault-customer-managed-keys]
    runtime: design
    problem: |
      Your company is moving its first production workloads to OCI. Today the tenancy has one compartment
      (workloads) and one ops group allowed to manage all resources in the whole tenancy. Nobody is told when a
      policy or a security list changes, there is no security posture monitoring, and spending is only seen on
      the monthly invoice.

      Oracle's reference architecture "Deploy a Secure Landing Zone That Meets the CIS Foundations Benchmark"
      (OCI Core Landing Zone) starts from a compartment design inside an enclosing compartment — Network,
      Security, App and Database — with one group per compartment and policies that separate duties. It enables
      Cloud Guard to monitor configuration and activity, uses Events and Notifications topics to alert
      administrators about changes, keeps keys in Vault, and the Foundations learning path adds budgets and
      tagging for cost management. Build that baseline in Terraform.
    requirements:
    - An enclosing compartment under the tenancy contains at least four child compartments (network, security, app and database).
    - There are at least four role groups (network, security, app and database administrators), and no policy statement grants manage all-resources in tenancy.
    - Network administrators manage virtual-network-family only in the network compartment (in compartment <enclosing>:<network>).
    - Cloud Guard is enabled (status = "ENABLED") with a reporting region.
    - A Notifications topic has a subscription, and Events rules send IAM changes (com.oraclecloud.identityControlPlane.*) and network changes (com.oraclecloud.virtualnetwork.*) to it.
    - A vault lives in a landing zone compartment (not in the root).
    - A budget covers the landing zone and has an alert rule.
    hints:
    - 'Use the existing `workloads` compartment as the enclosing one: add four child compartments (network, security, app, database) from the palette and **Link to…** its id in their `compartment_id`. Policies in the tenancy name nested compartments with a colon path, such as `workloads:network`.'
    - 'Give each role its own group (rename `ops` to the network admins and add security, app and database admin groups). In the policy''s **Access** section, delete the tenancy-admin statement and add one statement per role, scoped to its compartment path: network admins manage virtual-network-family, security admins manage vaults and keys, app admins manage instance-family, database admins manage database-family.'
    - 'The rest comes from the palette: a Cloud Guard configuration in the tenancy (`reporting_region`, status `ENABLED`), a notification topic with an email subscription, events rules whose `condition_details` list event types such as `com.oraclecloud.identityControlPlane.CreatePolicy` and whose `actions` → `action` sends to the topic (`ONS`), a vault in the security compartment, and a budget with target type `COMPARTMENT` plus a FORECAST alert rule.'
    solution: |
      The solution has four parts.

      1. **Compartments and duties** — `oci_identity_compartment.lz` under the tenancy and network, security,
         app and database compartments inside it; four groups; one policy per role, for example:

         ```
         Allow group lz-network-admins to manage virtual-network-family in compartment lz:network
         Allow group lz-security-admins to manage vaults in compartment lz:security
         Allow group lz-security-admins to manage keys in compartment lz:security
         Allow group lz-app-admins to manage instance-family in compartment lz:app
         Allow group lz-app-admins to use virtual-network-family in compartment lz:network
         Allow group lz-database-admins to manage autonomous-database-family in compartment lz:database
         ```

      2. **Posture monitoring** — `oci_cloud_guard_cloud_guard_configuration` with `status = "ENABLED"`.
      3. **Change alerts** — an `oci_ons_notification_topic` with an email subscription and two
         `oci_events_rule` resources: one for IAM event types (CreatePolicy, UpdatePolicy, DeletePolicy,
         CreateGroup, DeleteGroup, AddUserToGroup…) and one for network event types (security lists, NSGs,
         route tables, gateways), both with an `ONS` action to the topic.
      4. **Keys and cost** — an `oci_kms_vault` in the security compartment, and an `oci_budget_budget`
         targeting the enclosing compartment with a forecast alert at 100%.

      **Why:** the compartment design mirrors how responsibilities are split between networking, security,
      application and database teams, and the policies give each group only its compartment, so a compromise or
      mistake stays contained. Cloud Guard detects misconfigurations and risky activity and recommends fixes.
      The landing zone architecture uses Events and Notifications topics to alert administrators about changes
      in the deployed resources, which is what the two rules and the topic provide. Customer-managed keys in Vault and a
      budget with alerts complete the security and cost baseline. Oracle publishes the full landing zone as
      Terraform (OCI Core Landing Zone) that you can deploy with Resource Manager.

      **Without writing code in Nimbo**

      1. Click the group `ops` and rename it `network-admins` (description "Network administrators"). From the palette add three **identity groups** in the tenancy: `security-admins`, `app-admins` and `database-admins`.
      2. Add four **identity compartments** — `network`, `security`, `app`, `database` — each with a description and **Link to…** the `workloads` compartment's id in **compartment_id**.
      3. Click the policy `ops`, open its **Access** section and delete the tenancy-admin statement. Click **Add statement** for each role, with location `compartment` and the compartment path typed in the compartment field: `network-admins` manage `virtual-network-family` in `workloads:network`; `security-admins` manage `vaults` and manage `keys` in `workloads:security` (two statements); `app-admins` manage `instance-family` in `workloads:app`; `database-admins` manage `database-family` in `workloads:database`.
      4. Add a **Cloud Guard configuration**: tenancy OCID as compartment, reporting region `us-ashburn-1`, status `ENABLED`.
      5. Add a **notification topic** `lz-prod-security` and a **subscription** (protocol `EMAIL`, endpoint `security@example.com`), both in the security compartment (**Link to…**), the subscription linked to the topic.
      6. Add two **events rules** in the tenancy, enabled: `lz-prod-iam-changes` with the event types `com.oraclecloud.identityControlPlane.CreatePolicy`, `UpdatePolicy`, `DeletePolicy` and `AddUserToGroup`, and `lz-prod-network-changes` with `com.oraclecloud.virtualnetwork.updatesecuritylist`, `updatenetworksecuritygroup` and `updateroutetable` (type them in **condition_details** → **event_types**). In **actions** → **action** pick `ONS`, enable it and **Link to…** the topic's id.
      7. Add a **KMS vault** `lz-prod-vault` (`DEFAULT`) in the security compartment.
      8. Add a **budget** in the tenancy: `lz-prod-monthly`, amount `500`, reset period `MONTHLY`, target type `COMPARTMENT`, and **Link to…** the `workloads` compartment's id in **targets**. Add a **budget alert rule** linked to it: `forecast-100`, type `FORECAST`, threshold `100`, `PERCENTAGE`, recipient `security@example.com`.
    solutionFiles:
      variables.tf: |
        variable "project" {
          type        = string
          default     = "lz"
          description = "Project name: the enclosing compartment's name and the first part of every resource name."
        }

        variable "environment" {
          type        = string
          default     = "prod"
          description = "Deployment environment: part of every resource name and the Environment tag."
        }

        variable "oci_region" {
          type        = string
          default     = "us-ashburn-1"
          description = "Home region of the tenancy (Cloud Guard reports here)."
        }

        variable "tenancy_ocid" {
          type        = string
          default     = "ocid1.tenancy.oc1..flocilocaltenancy0000000000000000000000000000000000000000"
          description = "OCID of the tenancy (the root compartment); defaults to the local Floci tenancy."
        }

        variable "security_email" {
          type        = string
          default     = "security-alerts@example.com"
          description = "Address subscribed to the security notifications topic."
        }

        variable "monthly_budget" {
          type        = number
          default     = 1000
          description = "Monthly budget of the landing zone, in the tenancy's currency."
        }
      iam.tf: |
        # Enclosing compartment: everything the landing zone creates lives here.
        resource "oci_identity_compartment" "lz" {
          compartment_id = var.tenancy_ocid
          name           = var.project
          description    = "Landing zone enclosing compartment"
          freeform_tags  = local.common_tags
        }

        resource "oci_identity_compartment" "network" {
          compartment_id = oci_identity_compartment.lz.id
          name           = "network"
          description    = "VCNs, gateways and network security"
          freeform_tags  = local.common_tags
        }

        resource "oci_identity_compartment" "security" {
          compartment_id = oci_identity_compartment.lz.id
          name           = "security"
          description    = "Vaults, keys, logging and notifications"
          freeform_tags  = local.common_tags
        }

        resource "oci_identity_compartment" "app" {
          compartment_id = oci_identity_compartment.lz.id
          name           = "app"
          description    = "Compute, storage and other application services"
          freeform_tags  = local.common_tags
        }

        resource "oci_identity_compartment" "database" {
          compartment_id = oci_identity_compartment.lz.id
          name           = "database"
          description    = "Database services"
          freeform_tags  = local.common_tags
        }

        resource "oci_identity_group" "network_admins" {
          compartment_id = var.tenancy_ocid
          name           = "${var.project}-network-admins"
          description    = "Manage the landing zone network"
          freeform_tags  = local.common_tags
        }

        resource "oci_identity_group" "security_admins" {
          compartment_id = var.tenancy_ocid
          name           = "${var.project}-security-admins"
          description    = "Manage keys, logging and notifications"
          freeform_tags  = local.common_tags
        }

        resource "oci_identity_group" "app_admins" {
          compartment_id = var.tenancy_ocid
          name           = "${var.project}-app-admins"
          description    = "Manage application resources"
          freeform_tags  = local.common_tags
        }

        resource "oci_identity_group" "database_admins" {
          compartment_id = var.tenancy_ocid
          name           = "${var.project}-database-admins"
          description    = "Manage databases"
          freeform_tags  = local.common_tags
        }

        resource "oci_identity_policy" "network_admins" {
          compartment_id = var.tenancy_ocid
          name           = "${local.name_prefix}-network-admins"
          description    = "Network administrators manage the network compartment only"
          freeform_tags  = local.common_tags
          statements = [
            "Allow group ${oci_identity_group.network_admins.name} to manage virtual-network-family in compartment ${var.project}:network",
          ]

          depends_on = [oci_identity_compartment.network]
        }

        resource "oci_identity_policy" "security_admins" {
          compartment_id = var.tenancy_ocid
          name           = "${local.name_prefix}-security-admins"
          description    = "Security administrators manage keys, logging and notifications"
          freeform_tags  = local.common_tags
          statements = [
            "Allow group ${oci_identity_group.security_admins.name} to manage vaults in compartment ${var.project}:security",
            "Allow group ${oci_identity_group.security_admins.name} to manage keys in compartment ${var.project}:security",
            "Allow group ${oci_identity_group.security_admins.name} to manage logging-family in compartment ${var.project}:security",
            "Allow group ${oci_identity_group.security_admins.name} to manage ons-topics in compartment ${var.project}:security",
            "Allow group ${oci_identity_group.security_admins.name} to manage ons-subscriptions in compartment ${var.project}:security",
          ]

          depends_on = [oci_identity_compartment.security]
        }

        resource "oci_identity_policy" "app_admins" {
          compartment_id = var.tenancy_ocid
          name           = "${local.name_prefix}-app-admins"
          description    = "Application administrators manage the app compartment and use the network"
          freeform_tags  = local.common_tags
          statements = [
            "Allow group ${oci_identity_group.app_admins.name} to manage instance-family in compartment ${var.project}:app",
            "Allow group ${oci_identity_group.app_admins.name} to manage object-family in compartment ${var.project}:app",
            "Allow group ${oci_identity_group.app_admins.name} to use virtual-network-family in compartment ${var.project}:network",
            "Allow group ${oci_identity_group.app_admins.name} to use keys in compartment ${var.project}:security",
          ]

          depends_on = [oci_identity_compartment.app, oci_identity_compartment.network]
        }

        resource "oci_identity_policy" "database_admins" {
          compartment_id = var.tenancy_ocid
          name           = "${local.name_prefix}-database-admins"
          description    = "Database administrators manage the database compartment and use the network"
          freeform_tags  = local.common_tags
          statements = [
            "Allow group ${oci_identity_group.database_admins.name} to manage database-family in compartment ${var.project}:database",
            "Allow group ${oci_identity_group.database_admins.name} to manage autonomous-database-family in compartment ${var.project}:database",
            "Allow group ${oci_identity_group.database_admins.name} to use virtual-network-family in compartment ${var.project}:network",
            "Allow group ${oci_identity_group.database_admins.name} to use keys in compartment ${var.project}:security",
          ]

          depends_on = [oci_identity_compartment.database, oci_identity_compartment.network]
        }
      security.tf: |
        resource "oci_cloud_guard_cloud_guard_configuration" "main" {
          compartment_id   = var.tenancy_ocid
          reporting_region = var.oci_region
          status           = "ENABLED"
        }

        resource "oci_kms_vault" "main" {
          compartment_id = oci_identity_compartment.security.id
          display_name   = "${local.name_prefix}-vault"
          vault_type     = "DEFAULT"
          freeform_tags  = local.common_tags
        }

        resource "oci_ons_notification_topic" "security" {
          compartment_id = oci_identity_compartment.security.id
          name           = "${local.name_prefix}-security"
          description    = "Identity and network change alerts"
          freeform_tags  = local.common_tags
        }

        resource "oci_ons_subscription" "security_email" {
          compartment_id = oci_identity_compartment.security.id
          topic_id       = oci_ons_notification_topic.security.id
          protocol       = "EMAIL"
          endpoint       = var.security_email
          freeform_tags  = local.common_tags
        }

        resource "oci_events_rule" "iam_changes" {
          compartment_id = var.tenancy_ocid
          display_name   = "${local.name_prefix}-iam-changes"
          description    = "Notify on identity changes"
          is_enabled     = true
          freeform_tags  = local.common_tags

          condition_details {
            event_types = [
              "com.oraclecloud.identityControlPlane.CreatePolicy",
              "com.oraclecloud.identityControlPlane.UpdatePolicy",
              "com.oraclecloud.identityControlPlane.DeletePolicy",
              "com.oraclecloud.identityControlPlane.CreateGroup",
              "com.oraclecloud.identityControlPlane.DeleteGroup",
              "com.oraclecloud.identityControlPlane.AddUserToGroup",
              "com.oraclecloud.identityControlPlane.RemoveUserFromGroup",
            ]
          }

          actions {
            action {
              action_type = "ONS"
              is_enabled  = true
              topic_id    = oci_ons_notification_topic.security.id
            }
          }
        }

        resource "oci_events_rule" "network_changes" {
          compartment_id = var.tenancy_ocid
          display_name   = "${local.name_prefix}-network-changes"
          description    = "Notify on network security and routing changes"
          is_enabled     = true
          freeform_tags  = local.common_tags

          condition_details {
            event_types = [
              "com.oraclecloud.virtualnetwork.createsecuritylist",
              "com.oraclecloud.virtualnetwork.updatesecuritylist",
              "com.oraclecloud.virtualnetwork.deletesecuritylist",
              "com.oraclecloud.virtualnetwork.createnetworksecuritygroup",
              "com.oraclecloud.virtualnetwork.updatenetworksecuritygroup",
              "com.oraclecloud.virtualnetwork.deletenetworksecuritygroup",
              "com.oraclecloud.virtualnetwork.createroutetable",
              "com.oraclecloud.virtualnetwork.updateroutetable",
              "com.oraclecloud.virtualnetwork.deleteroutetable",
              "com.oraclecloud.virtualnetwork.createinternetgateway",
              "com.oraclecloud.virtualnetwork.deleteinternetgateway",
            ]
          }

          actions {
            action {
              action_type = "ONS"
              is_enabled  = true
              topic_id    = oci_ons_notification_topic.security.id
            }
          }
        }
      budget.tf: |
        resource "oci_budget_budget" "lz" {
          compartment_id = var.tenancy_ocid
          display_name   = "${local.name_prefix}-monthly"
          description    = "Monthly spend of the landing zone"
          amount         = var.monthly_budget
          reset_period   = "MONTHLY"
          target_type    = "COMPARTMENT"
          targets        = [oci_identity_compartment.lz.id]
          freeform_tags  = local.common_tags
        }

        resource "oci_budget_alert_rule" "forecast" {
          budget_id      = oci_budget_budget.lz.id
          display_name   = "forecast-100"
          type           = "FORECAST"
          threshold      = 100
          threshold_type = "PERCENTAGE"
          recipients     = var.security_email
          message        = "The landing zone is forecast to exceed its monthly budget."
        }
    starter:
      kind: terraform
      cloud: oci
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              oci = {
                source  = "oracle/oci"
                version = "~> 9.0"
              }
            }
          }
        providers.tf: |
          provider "oci" {
            region = var.oci_region
          }
        variables.tf: |
          variable "project" {
            type        = string
            default     = "lz"
            description = "Project name: the first part of every resource name."
          }

          variable "environment" {
            type        = string
            default     = "prod"
            description = "Deployment environment: part of every resource name and the Environment tag."
          }

          variable "oci_region" {
            type        = string
            default     = "us-ashburn-1"
            description = "Home region of the tenancy."
          }

          variable "tenancy_ocid" {
            type        = string
            default     = "ocid1.tenancy.oc1..flocilocaltenancy0000000000000000000000000000000000000000"
            description = "OCID of the tenancy (the root compartment); defaults to the local Floci tenancy."
          }
        locals.tf: |
          locals {
            name_prefix = "${var.project}-${var.environment}"
            common_tags = {
              Project     = var.project
              Environment = var.environment
              ManagedBy   = "nimbo"
            }
          }
        iam.tf: |
          # One compartment for everything, one group that can do anything.
          resource "oci_identity_compartment" "workloads" {
            compartment_id = var.tenancy_ocid
            name           = "workloads"
            description    = "All workloads"
            freeform_tags  = local.common_tags
          }

          resource "oci_identity_group" "ops" {
            compartment_id = var.tenancy_ocid
            name           = "ops"
            description    = "Operations team"
            freeform_tags  = local.common_tags
          }

          resource "oci_identity_policy" "ops" {
            compartment_id = var.tenancy_ocid
            name           = "${local.name_prefix}-ops"
            description    = "Operations access"
            freeform_tags  = local.common_tags
            statements = [
              "Allow group ops to manage all-resources in tenancy",
            ]

            depends_on = [oci_identity_group.ops]
          }
    checks:
    - id: validate
      label: The workflow validates
      type: validate
    - id: enclosing-compartment
      label: An enclosing compartment sits directly under the tenancy
      type: has
      has:
        terraform:
          type: oci_identity_compartment
          where:
            compartment_id: {ref: var.tenancy_ocid}
    - id: role-compartments
      label: At least four compartments live inside the enclosing compartment
      type: has
      has:
        terraform:
          type: oci_identity_compartment
          where:
            compartment_id: {ref: oci_identity_compartment}
          count: {min: 4}
    - id: role-groups
      label: At least four role groups exist
      type: has
      has:
        terraform:
          type: oci_identity_group
          count: {min: 4}
    - id: no-tenancy-admin
      label: No statement grants manage all-resources in tenancy
      type: has
      has:
        terraform:
          type: oci_identity_policy
          where:
            statements: {contains: manage all-resources in tenancy}
          count: {max: 0}
    - id: network-duty
      label: Network administration is limited to a compartment
      type: has
      has:
        terraform:
          type: oci_identity_policy
          where:
            statements: {contains: to manage virtual-network-family in compartment}
    - id: cloud-guard
      label: Cloud Guard is enabled
      type: has
      has:
        terraform:
          type: oci_cloud_guard_cloud_guard_configuration
          where:
            status: ENABLED
            reporting_region: {exists: true}
    - id: topic-subscription
      label: The notifications topic has a subscription
      type: has
      has:
        terraform:
          type: oci_ons_subscription
          where:
            topic_id: {ref: oci_ons_notification_topic}
    - id: iam-change-alerts
      label: IAM changes are sent to the topic
      type: has
      has:
        terraform:
          type: oci_events_rule
          where:
            is_enabled: true
            condition_details.event_types: {contains: com.oraclecloud.identityControlPlane.}
            actions.action.topic_id: {ref: oci_ons_notification_topic}
    - id: network-change-alerts
      label: Network changes are sent to the topic
      type: has
      has:
        terraform:
          type: oci_events_rule
          where:
            is_enabled: true
            condition_details.event_types: {contains: com.oraclecloud.virtualnetwork.}
            actions.action.topic_id: {ref: oci_ons_notification_topic}
    - id: vault-in-landing-zone
      label: A vault lives in a landing zone compartment
      type: has
      has:
        terraform:
          type: oci_kms_vault
          where:
