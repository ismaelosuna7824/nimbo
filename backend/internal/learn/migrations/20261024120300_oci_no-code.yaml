- op: upsert
  kind: challenge
  id: oci-hub-spoke-drg
  data:
    provider: oci
    level: expert
    title: Hub-and-spoke network with a dynamic routing gateway
    summary: Replace two internet-facing VCNs with a hub and private spokes connected through a DRG, administered through the Bastion service.
    minutes: 60
    tags: [networking, drg, hub-and-spoke, bastion, segmentation]
    prerequisites: [oci-vcn-public-private-subnets, oci-nsg-tiered-access]
    runtime: design
    problem: |
      Production and development each got their own VCN, and each VCN got its own internet gateway and public
      subnet so administrators could SSH in. The two environments can't reach shared services privately, every
      new environment repeats the same internet exposure, and there is no central place to add on-premises
      connectivity later.

      Oracle's reference architecture "Set Up a Hub-and-Spoke Network Topology Using a Dynamic Routing Gateway"
      connects many VCNs to one DRG — a virtual router that also terminates FastConnect and Site-to-Site VPN —
      so spokes reach the hub and each other privately, and uses OCI Bastion for administrative access to
      resources without public endpoints. Rebuild the network that way: a hub VCN for shared services and two
      private spokes.
    requirements:
    - Three VCNs (a hub and two spokes), each defined as its own oci_core_vcn resource with a non-overlapping CIDR.
    - A dynamic routing gateway (oci_core_drg) with one VCN attachment per VCN (at least three oci_core_drg_attachment with network_details type "VCN").
    - The spokes' route tables send traffic for the other networks to the DRG (route_rules.network_entity_id = the DRG).
    - No internet gateways remain and every subnet is private (prohibit_public_ip_on_vnic = true).
    - An OCI Bastion in the hub targets a hub subnet, and its client_cidr_block_allow_list does not contain 0.0.0.0/0.
    hints:
    - Add a dynamic routing gateway (DRG) from the palette, then one DRG attachment per VCN (hub, prod, dev) so each connection is explicit. An attachment links to the DRG and, in its `network_details` block, has type `VCN` and the VCN's id.
    - The DRG learns the CIDRs of the attached VCNs, so each spoke route table only needs one rule to the DRG for `10.0.0.0/8`. Change the spokes' existing rule to that destination and **Link to…** the DRG as its target, then delete the internet gateways and make the spoke app subnets private.
    - Add the hub VCN (`10.0.0.0/16`) with a private management subnet (`10.0.1.0/24`), attach it to the DRG too, and add a Bastion (type `STANDARD`) whose target subnet is the hub subnet. Its sessions reach the spokes through the DRG.
    solution: |
      Add a hub VCN, a DRG and three attachments, and remove all public exposure from the spokes:

      ```hcl
      resource "oci_core_drg" "hub" {
        compartment_id = var.compartment_ocid
        display_name   = "${local.name_prefix}-drg"
      }

      resource "oci_core_drg_attachment" "prod" {
        drg_id = oci_core_drg.hub.id
        network_details {
          id   = oci_core_vcn.prod.id
          type = "VCN"
        }
      }

      resource "oci_core_route_table" "prod" {
        compartment_id = var.compartment_ocid
        vcn_id         = oci_core_vcn.prod.id
        route_rules {
          destination       = "10.0.0.0/8"
          destination_type  = "CIDR_BLOCK"
          network_entity_id = oci_core_drg.hub.id
        }
        route_rules {
          destination       = "0.0.0.0/0"
          destination_type  = "CIDR_BLOCK"
          network_entity_id = oci_core_nat_gateway.prod.id
        }
      }
      ```

      Repeat the attachment and route table for the hub and the dev spoke, make every subnet private, delete
      the internet gateways and public route tables, and add `oci_bastion_bastion` targeting the hub's shared
      subnet with `client_cidr_block_allow_list = [var.admin_cidr]`.

      **Why:** a DRG can attach many VCNs, which simplifies routing and security management compared with a
      mesh of peerings, and the same DRG later carries FastConnect or Site-to-Site VPN traffic to every spoke.
      Choosing CIDR blocks that don't overlap with each other (or with on-premises and other clouds) is what
      makes that routing possible. The Bastion service replaces public SSH with identity-based, audited,
      time-limited sessions, so no subnet needs a public IP and no VCN needs an internet gateway; NAT gateways
      keep outbound updates working.

      **Without writing code in Nimbo**

      1. From the palette add a **DRG** `hub`: **Link to…** `var.compartment_ocid`, display name `learn-shared-drg`.
      2. Click the route table `prod`: on its route rule set destination `10.0.0.0/8` and **Link to…** the DRG's id in **network_entity_id**. Do the same on the route table `dev`.
      3. Delete the internet gateways `prod` and `dev` from the canvas, and turn **prohibit_public_ip_on_vnic** on in the subnets `prod_app` and `dev_app`.
      4. Add a **VCN** `hub` (compartment linked, display name `learn-shared-hub`, CIDR `10.0.0.0/16`, DNS label `hub`) and a **subnet** `hub_mgmt` in it (**Link to…** the hub VCN's id, CIDR `10.0.1.0/24`, DNS label `mgmt`, **prohibit_public_ip_on_vnic** on).
      5. Add three **DRG attachments**, `hub`, `prod` and `dev`: **Link to…** the DRG's id in **drg_id**, and in **network_details** pick type `VCN` and **Link to…** that VCN's id in **id**.
      6. Add a **Bastion**: name `learnsharedbastion`, type `STANDARD`, compartment linked, **Link to…** the hub subnet's id in **target_subnet_id**, and add `203.0.113.0/24` to **client_cidr_block_allow_list**.
    solutionFiles:
      variables.tf: |
        variable "project" {
          type        = string
          default     = "learn"
          description = "Project name: the first part of every resource name and the Project tag."
        }

        variable "environment" {
          type        = string
          default     = "shared"
          description = "Environment label: part of every resource name and the Environment tag."
        }

        variable "oci_region" {
          type        = string
          default     = "us-ashburn-1"
          description = "OCI region to deploy into."
        }

        variable "compartment_ocid" {
          type        = string
          default     = "ocid1.tenancy.oc1..flocilocaltenancy0000000000000000000000000000000000000000"
          description = "Compartment OCID for every resource (defaults to the local Floci tenancy root compartment)."
        }

        variable "admin_cidr" {
          type        = string
          default     = "203.0.113.0/24"
          description = "Office or VPN range allowed to open Bastion sessions."
        }
      network.tf: |
        # Non-overlapping ranges inside 10.0.0.0/8 so the DRG can route between them.
        resource "oci_core_vcn" "hub" {
          compartment_id = var.compartment_ocid
          display_name   = "${local.name_prefix}-hub"
          cidr_blocks    = ["10.0.0.0/16"]
          dns_label      = "hub"
          freeform_tags  = local.common_tags
        }

        resource "oci_core_vcn" "prod" {
          compartment_id = var.compartment_ocid
          display_name   = "${local.name_prefix}-prod"
          cidr_blocks    = ["10.1.0.0/16"]
          dns_label      = "prod"
          freeform_tags  = local.common_tags
        }

        resource "oci_core_vcn" "dev" {
          compartment_id = var.compartment_ocid
          display_name   = "${local.name_prefix}-dev"
          cidr_blocks    = ["10.2.0.0/16"]
          dns_label      = "dev"
          freeform_tags  = local.common_tags
        }

        resource "oci_core_drg" "hub" {
          compartment_id = var.compartment_ocid
          display_name   = "${local.name_prefix}-drg"
          freeform_tags  = local.common_tags
        }

        resource "oci_core_drg_attachment" "hub" {
          drg_id        = oci_core_drg.hub.id
          display_name  = "${local.name_prefix}-hub"
          freeform_tags = local.common_tags

          network_details {
            id   = oci_core_vcn.hub.id
            type = "VCN"
          }
        }

        resource "oci_core_drg_attachment" "prod" {
          drg_id        = oci_core_drg.hub.id
          display_name  = "${local.name_prefix}-prod"
          freeform_tags = local.common_tags

          network_details {
            id   = oci_core_vcn.prod.id
            type = "VCN"
          }
        }

        resource "oci_core_drg_attachment" "dev" {
          drg_id        = oci_core_drg.hub.id
          display_name  = "${local.name_prefix}-dev"
          freeform_tags = local.common_tags

          network_details {
            id   = oci_core_vcn.dev.id
            type = "VCN"
          }
        }

        # Spokes: outbound internet through NAT, everything private through the DRG.
        resource "oci_core_nat_gateway" "prod" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.prod.id
          display_name   = "${local.name_prefix}-prod-nat"
          freeform_tags  = local.common_tags
        }

        resource "oci_core_nat_gateway" "dev" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.dev.id
          display_name   = "${local.name_prefix}-dev-nat"
          freeform_tags  = local.common_tags
        }

        resource "oci_core_route_table" "hub" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.hub.id
          display_name   = "${local.name_prefix}-hub"
          freeform_tags  = local.common_tags

          route_rules {
            destination       = "10.0.0.0/8"
            destination_type  = "CIDR_BLOCK"
            network_entity_id = oci_core_drg.hub.id
          }
        }

        resource "oci_core_route_table" "prod" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.prod.id
          display_name   = "${local.name_prefix}-prod"
          freeform_tags  = local.common_tags

          route_rules {
            destination       = "10.0.0.0/8"
            destination_type  = "CIDR_BLOCK"
            network_entity_id = oci_core_drg.hub.id
          }

          route_rules {
            destination       = "0.0.0.0/0"
            destination_type  = "CIDR_BLOCK"
            network_entity_id = oci_core_nat_gateway.prod.id
          }
        }

        resource "oci_core_route_table" "dev" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.dev.id
          display_name   = "${local.name_prefix}-dev"
          freeform_tags  = local.common_tags

          route_rules {
            destination       = "10.0.0.0/8"
            destination_type  = "CIDR_BLOCK"
            network_entity_id = oci_core_drg.hub.id
          }

          route_rules {
            destination       = "0.0.0.0/0"
            destination_type  = "CIDR_BLOCK"
            network_entity_id = oci_core_nat_gateway.dev.id
          }
        }

        resource "oci_core_subnet" "hub_shared" {
          compartment_id             = var.compartment_ocid
          vcn_id                     = oci_core_vcn.hub.id
          display_name               = "${local.name_prefix}-hub-shared"
          cidr_block                 = "10.0.1.0/24"
          dns_label                  = "shared"
          prohibit_public_ip_on_vnic = true
          route_table_id             = oci_core_route_table.hub.id
          freeform_tags              = local.common_tags
        }

        resource "oci_core_subnet" "prod_app" {
          compartment_id             = var.compartment_ocid
          vcn_id                     = oci_core_vcn.prod.id
          display_name               = "${local.name_prefix}-prod-app"
          cidr_block                 = "10.1.1.0/24"
          dns_label                  = "app"
          prohibit_public_ip_on_vnic = true
          route_table_id             = oci_core_route_table.prod.id
          freeform_tags              = local.common_tags
        }

        resource "oci_core_subnet" "dev_app" {
          compartment_id             = var.compartment_ocid
          vcn_id                     = oci_core_vcn.dev.id
          display_name               = "${local.name_prefix}-dev-app"
          cidr_block                 = "10.2.1.0/24"
          dns_label                  = "app"
          prohibit_public_ip_on_vnic = true
          route_table_id             = oci_core_route_table.dev.id
          freeform_tags              = local.common_tags
        }

        # Administrative access without public IPs or internet gateways.
        resource "oci_bastion_bastion" "hub" {
          bastion_type                 = "standard"
          compartment_id               = var.compartment_ocid
          target_subnet_id             = oci_core_subnet.hub_shared.id
          name                         = replace("${local.name_prefix}-hub", "-", "")
          client_cidr_block_allow_list = [var.admin_cidr]
          max_session_ttl_in_seconds   = 3600
          freeform_tags                = local.common_tags
        }
      outputs.tf: |
        output "drg_id" {
          value       = oci_core_drg.hub.id
          description = "OCID of the dynamic routing gateway that connects the hub and the spokes."
        }

        output "bastion_id" {
          value       = oci_bastion_bastion.hub.id
          description = "OCID of the Bastion used for administrative sessions."
        }
    starter:
      kind: terraform
      cloud: oci
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              oci = {
                source  = "oracle/oci"
                version = "~> 9.0"
              }
            }
          }
        providers.tf: |
          provider "oci" {
            region = var.oci_region
          }
        variables.tf: |
          variable "project" {
            type        = string
            default     = "learn"
            description = "Project name: the first part of every resource name and the Project tag."
          }

          variable "environment" {
            type        = string
            default     = "shared"
            description = "Environment label: part of every resource name and the Environment tag."
          }

          variable "oci_region" {
            type        = string
            default     = "us-ashburn-1"
            description = "OCI region to deploy into."
          }

          variable "compartment_ocid" {
            type        = string
            default     = "ocid1.tenancy.oc1..flocilocaltenancy0000000000000000000000000000000000000000"
            description = "Compartment OCID for every resource (defaults to the local Floci tenancy root compartment)."
          }
        locals.tf: |
          locals {
            name_prefix = "${var.project}-${var.environment}"
            common_tags = {
              Project     = var.project
              Environment = var.environment
              ManagedBy   = "nimbo"
            }
          }
        network.tf: |
          # Two isolated VCNs, each with its own internet gateway and a public
          # subnet so administrators can SSH in.
          resource "oci_core_vcn" "prod" {
            compartment_id = var.compartment_ocid
            display_name   = "${local.name_prefix}-prod"
            cidr_blocks    = ["10.1.0.0/16"]
            dns_label      = "prod"
            freeform_tags  = local.common_tags
          }

          resource "oci_core_vcn" "dev" {
            compartment_id = var.compartment_ocid
            display_name   = "${local.name_prefix}-dev"
            cidr_blocks    = ["10.2.0.0/16"]
            dns_label      = "dev"
            freeform_tags  = local.common_tags
          }

          resource "oci_core_internet_gateway" "prod" {
            compartment_id = var.compartment_ocid
            vcn_id         = oci_core_vcn.prod.id
            display_name   = "${local.name_prefix}-prod-igw"
            enabled        = true
            freeform_tags  = local.common_tags
          }

          resource "oci_core_internet_gateway" "dev" {
            compartment_id = var.compartment_ocid
            vcn_id         = oci_core_vcn.dev.id
            display_name   = "${local.name_prefix}-dev-igw"
            enabled        = true
            freeform_tags  = local.common_tags
          }

          resource "oci_core_route_table" "prod" {
            compartment_id = var.compartment_ocid
            vcn_id         = oci_core_vcn.prod.id
            display_name   = "${local.name_prefix}-prod"
            freeform_tags  = local.common_tags

            route_rules {
              destination       = "0.0.0.0/0"
              destination_type  = "CIDR_BLOCK"
              network_entity_id = oci_core_internet_gateway.prod.id
            }
          }

          resource "oci_core_route_table" "dev" {
            compartment_id = var.compartment_ocid
            vcn_id         = oci_core_vcn.dev.id
            display_name   = "${local.name_prefix}-dev"
            freeform_tags  = local.common_tags

            route_rules {
              destination       = "0.0.0.0/0"
              destination_type  = "CIDR_BLOCK"
              network_entity_id = oci_core_internet_gateway.dev.id
            }
          }

          resource "oci_core_subnet" "prod_app" {
            compartment_id             = var.compartment_ocid
            vcn_id                     = oci_core_vcn.prod.id
            display_name               = "${local.name_prefix}-prod-app"
            cidr_block                 = "10.1.1.0/24"
            dns_label                  = "app"
            prohibit_public_ip_on_vnic = false
            route_table_id             = oci_core_route_table.prod.id
            freeform_tags              = local.common_tags
          }

          resource "oci_core_subnet" "dev_app" {
            compartment_id             = var.compartment_ocid
            vcn_id                     = oci_core_vcn.dev.id
            display_name               = "${local.name_prefix}-dev-app"
            cidr_block                 = "10.2.1.0/24"
            dns_label                  = "app"
            prohibit_public_ip_on_vnic = false
            route_table_id             = oci_core_route_table.dev.id
            freeform_tags              = local.common_tags
          }
        outputs.tf: |
          output "prod_vcn_id" {
            value       = oci_core_vcn.prod.id
            description = "OCID of the production VCN."
          }

          output "dev_vcn_id" {
            value       = oci_core_vcn.dev.id
            description = "OCID of the development VCN."
          }
    checks:
    - id: validate
      label: The workflow validates
      type: validate
    - id: three-vcns
      label: A hub and two spoke VCNs exist
      type: has
      has:
        terraform:
          type: oci_core_vcn
          count: {min: 3}
    - id: drg
      label: A dynamic routing gateway exists
      type: has
      has:
        terraform:
          type: oci_core_drg
    - id: drg-attachments
      label: Every VCN is attached to the DRG
      type: has
      has:
        terraform:
          type: oci_core_drg_attachment
          where:
            drg_id: {ref: oci_core_drg}
            network_details.type: VCN
            network_details.id: {ref: oci_core_vcn}
          count: {min: 3}
    - id: spoke-routes
      label: Spoke route tables send private traffic to the DRG
      type: has
      has:
        terraform:
          type: oci_core_route_table
          where:
            route_rules.network_entity_id: {ref: oci_core_drg}
          count: {min: 2}
    - id: no-internet-gateways
      label: No internet gateways remain
      type: has
      has:
        terraform:
          type: oci_core_internet_gateway
          count: {max: 0}
    - id: private-subnet-per-vcn
      label: Hub and spokes each have a private subnet
      type: has
      has:
        terraform:
          type: oci_core_subnet
          where:
            prohibit_public_ip_on_vnic: true
          count: {min: 3}
    - id: private-subnets
      label: Every subnet is private
      type: has
      has:
        terraform:
          type: oci_core_subnet
          where:
            prohibit_public_ip_on_vnic: {notIn: [true]}
          count: {max: 0}
    - id: bastion
      label: An OCI Bastion targets a hub subnet
      type: has
      has:
        terraform:
          type: oci_bastion_bastion
          where:
            target_subnet_id: {ref: oci_core_subnet}
            client_cidr_block_allow_list: {exists: true}
    - id: bastion-not-open
      label: Bastion sessions are not open to 0.0.0.0/0
      type: has
      has:
        terraform:
          type: oci_bastion_bastion
          where:
            client_cidr_block_allow_list: {contains: 0.0.0.0/0}
          count: {max: 0}
    sources:
    - title: Set Up a Hub-and-Spoke Network Topology Using a Dynamic Routing Gateway
      url: https://docs.oracle.com/en/solutions/hub-spoke-network-drg/index.html
    - title: Dynamic Routing Gateways
      url: https://docs.oracle.com/en-us/iaas/Content/Network/Tasks/managingDRGs.htm
    - title: Bastion Overview
      url: https://docs.oracle.com/en-us/iaas/Content/Bastion/Concepts/bastionoverview.htm
    - title: NAT Gateway
      url: https://docs.oracle.com/en-us/iaas/Content/Network/Tasks/NATgateway.htm
    - title: Securing Networking (OCI Security Guide)
      url: https://docs.oracle.com/en-us/iaas/Content/Security/Reference/networking_security.htm
    - title: oci_core_drg_attachment (oracle/oci 9.x)
      url: https://registry.terraform.io/providers/oracle/oci/9.11.0/docs/resources/core_drg_attachment
    - title: oci_core_drg (oracle/oci 9.x)
      url: https://registry.terraform.io/providers/oracle/oci/9.11.0/docs/resources/core_drg
    solvableWithoutCode: true
