description: Marks which oci challenges are solvable without code and rewrites their hints as UI steps
operations:
- op: upsert
  kind: challenge
  id: oci-compartment-least-privilege
  data:
    provider: oci
    level: beginner
    title: Compartments and least-privilege IAM policies
    summary: Move a team out of the root compartment and replace a tenancy-wide admin grant with scoped policy statements.
    minutes: 25
    tags: [iam, compartments, policies, least-privilege]
    runtime: design
    problem: |
      A small team started on Oracle Cloud Infrastructure by putting everything in the tenancy (the root
      compartment) and writing one policy so nobody would get blocked:

      ```
      Allow group app-developers to manage all-resources in tenancy
      ```

      That statement lets every developer delete any network, read any bucket and rewrite IAM policies for the
      whole company. Oracle's tenancy setup guidance says to plan a compartment hierarchy together with groups,
      and the OCI security guide recommends least-privilege access: grant each group only the verbs and resource
      types it needs, in the compartment where its resources live.

      Rework the Terraform so the application has its own compartment and the developers' access stops at that
      compartment's boundary. The network team keeps ownership of the network, so developers may use it but
      not change it.
    requirements:
    - An oci_identity_compartment named app-dev is created directly under the tenancy (its compartment_id is the tenancy OCID).
    - No policy statement grants all-resources in the tenancy.
    - The app-developers group gets statements scoped with in compartment app-dev, for example to manage instance-family, volume-family and object-family.
    - Developers can use the network but not manage it (use virtual-network-family, never manage virtual-network-family).
    hints:
    - 'Click the policy `app_developers` and open its **Access** section: each statement is a sentence, Allow <who> to <verb> <resource-type> in <location>. The location can be the whole tenancy or one compartment.'
    - 'The four verbs, from least to most access, are inspect, read, use and manage. Pick the smallest one that still lets the team work, and use resource families (instance-family, volume-family, object-family, virtual-network-family) in **On what**: one statement per family.'
    - 'Add a compartment from the palette, name it `app-dev` and use **Link to…** on `compartment_id` to pick `var.tenancy_ocid`. Then delete the tenancy-wide statement and add four statements for the group `app-developers` with location `compartment` → `app-dev`: manage instance-family, volume-family and object-family, and only use virtual-network-family.'
    solution: |
      Create the compartment under the tenancy, keep the group, and replace the tenancy-wide statement with one
      statement per resource family, each scoped to the new compartment:

      ```hcl
      resource "oci_identity_compartment" "app" {
        compartment_id = var.tenancy_ocid
        name           = "app-dev"
        description    = "Application resources of the app team"
      }

      resource "oci_identity_policy" "app_developers" {
        compartment_id = var.tenancy_ocid
        name           = "${local.name_prefix}-app-developers"
        description    = "Least-privilege access for app developers to the app-dev compartment"
        statements = [
          "Allow group app-developers to manage instance-family in compartment app-dev",
          "Allow group app-developers to manage volume-family in compartment app-dev",
          "Allow group app-developers to manage object-family in compartment app-dev",
          "Allow group app-developers to use virtual-network-family in compartment app-dev",
        ]
      }
      ```

      **Why:** compartments are the unit OCI uses to organize and isolate resources, and every policy statement
      names the compartment it applies to. Policies inherit downward, so a grant in the tenancy reaches every
      compartment; a grant in compartment app-dev reaches only app-dev and its children. The verbs are ordered
      inspect < read < use < manage: use lets developers attach instances to existing subnets without being able
      to create or delete network resources, which stay with the network administrators. These statements are
      based on the "Let users launch compute instances" template from Oracle's common policies.

      **Without writing code in Nimbo**

      1. From the palette add an **identity compartment**. Name it `app-dev`, give it a short description and use **Link to…** on **compartment_id** to pick `var.tenancy_ocid`.
      2. Click the policy `app_developers` and open its **Access** section. Delete the statement that grants everything in the tenancy.
      3. Click **Add statement** four times. In each one pick `group` and `app-developers` in **Who**, pick `compartment` as the location and choose `app-dev` with **Pick a compartment**, then set: `manage` instance-family, `manage` volume-family, `manage` object-family and `use` virtual-network-family.
    solutionFiles:
      main.tf: |
        resource "oci_identity_compartment" "app" {
          compartment_id = var.tenancy_ocid
          name           = "app-dev"
          description    = "Application resources of the app team"
          freeform_tags  = local.common_tags
        }

        resource "oci_identity_group" "app_developers" {
          compartment_id = var.tenancy_ocid
          name           = "app-developers"
          description    = "Developers of the application"
          freeform_tags  = local.common_tags
        }

        # Policies inherit downward: these statements reach app-dev and its
        # children only.
        resource "oci_identity_policy" "app_developers" {
          compartment_id = var.tenancy_ocid
          name           = "${local.name_prefix}-app-developers"
          description    = "Least-privilege access for app developers to the app-dev compartment"
          freeform_tags  = local.common_tags
          statements = [
            "Allow group app-developers to manage instance-family in compartment app-dev",
            "Allow group app-developers to manage volume-family in compartment app-dev",
            "Allow group app-developers to manage object-family in compartment app-dev",
            "Allow group app-developers to use virtual-network-family in compartment app-dev",
          ]

          depends_on = [oci_identity_compartment.app, oci_identity_group.app_developers]
        }
    starter:
      kind: terraform
      cloud: oci
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              oci = {
                source  = "oracle/oci"
                version = "~> 9.0"
              }
            }
          }
        providers.tf: |
          provider "oci" {
            region = var.oci_region
          }
        variables.tf: |
          variable "project" {
            type        = string
            default     = "learn"
            description = "Project name: the first part of every resource name and the Project tag."
          }

          variable "environment" {
            type        = string
            default     = "dev"
            description = "Deployment environment (dev, staging, prod): part of every resource name and the Environment tag."
          }

          variable "oci_region" {
            type        = string
            default     = "us-ashburn-1"
            description = "OCI region to deploy into."
          }

          variable "tenancy_ocid" {
            type        = string
            default     = "ocid1.tenancy.oc1..flocilocaltenancy0000000000000000000000000000000000000000"
            description = "OCID of the tenancy (the root compartment); defaults to the local Floci tenancy."
          }
        locals.tf: |
          locals {
            name_prefix = "${var.project}-${var.environment}"
            common_tags = {
              Project     = var.project
              Environment = var.environment
              ManagedBy   = "nimbo"
            }
          }
        main.tf: |
          resource "oci_identity_group" "app_developers" {
            compartment_id = var.tenancy_ocid
            name           = "app-developers"
            description    = "Developers of the application"
            freeform_tags  = local.common_tags
          }

          # Quick start: give the team everything so nobody gets blocked.
          resource "oci_identity_policy" "app_developers" {
            compartment_id = var.tenancy_ocid
            name           = "${local.name_prefix}-app-developers"
            description    = "Access for app developers"
            freeform_tags  = local.common_tags
            statements = [
              "Allow group app-developers to manage all-resources in tenancy",
            ]

            depends_on = [oci_identity_group.app_developers]
          }
        outputs.tf: |
          output "policy_id" {
            value       = oci_identity_policy.app_developers.id
            description = "OCID of the app developers' policy."
          }
    checks:
    - id: validate
      label: The workflow validates
      type: validate
    - id: app-compartment
      label: An app-dev compartment exists directly under the tenancy
      type: has
      has:
        terraform:
          type: oci_identity_compartment
          where:
            name: app-dev
            compartment_id: {ref: var.tenancy_ocid}
    - id: no-tenancy-admin
      label: No statement grants all-resources in the tenancy
      type: has
      has:
        terraform:
          type: oci_identity_policy
          where:
            statements: {contains: all-resources in tenancy}
          count: {max: 0}
    - id: scoped-to-compartment
      label: Developer statements are scoped to compartment app-dev
      type: has
      has:
        terraform:
          type: oci_identity_policy
          where:
            statements: {contains: app-developers to manage instance-family in compartment app-dev}
    - id: network-use-only
      label: Developers use the network but cannot manage it
      type: has
      has:
        terraform:
          type: oci_identity_policy
          where:
            statements: {contains: app-developers to use virtual-network-family in compartment app-dev}
    - id: no-network-manage
      label: No statement lets developers manage the network
      type: has
      has:
        terraform:
          type: oci_identity_policy
          where:
            statements: {contains: app-developers to manage virtual-network-family}
          count: {max: 0}
    sources:
    - title: Learn Best Practices for Setting Up Your Tenancy
      url: https://docs.oracle.com/en-us/iaas/Content/GSG/Concepts/settinguptenancy.htm
    - title: How Policies Work
      url: https://docs.oracle.com/en-us/iaas/Content/Identity/Concepts/policies.htm
    - title: Policy Syntax
      url: https://docs.oracle.com/en-us/iaas/Content/Identity/Concepts/policysyntax.htm
    - title: IAM Security Policies (OCI Security Guide)
      url: https://docs.oracle.com/en-us/iaas/Content/Security/Reference/iam_security_topic-IAM_Security_Policies.htm
    - title: Common Policies (Policy Builder templates)
      url: https://docs.oracle.com/en-us/iaas/Content/Identity/policiescommon/commonpolicies.htm
    - title: oci_identity_compartment (oracle/oci 9.x)
      url: https://registry.terraform.io/providers/oracle/oci/9.11.0/docs/resources/identity_compartment
    - title: oci_identity_policy (oracle/oci 9.x)
      url: https://registry.terraform.io/providers/oracle/oci/9.11.0/docs/resources/identity_policy
    solvableWithoutCode: true
- op: upsert
  kind: challenge
  id: oci-private-bucket-lifecycle
  data:
    provider: oci
    level: beginner
    title: Private, versioned Object Storage with lifecycle rules
    summary: Protect a bucket against overwrites and deletes with versioning, and let lifecycle rules archive and expire old data.
    minutes: 25
    tags: [object-storage, versioning, lifecycle, cost]
    prerequisites: [oci-compartment-least-privilege]
    runtime: design
    problem: |
      The finance team stores exported invoices in an Object Storage bucket. The bucket is already private
      (NoPublicAccess), but two incidents worried them: a script overwrote a month of invoices with empty files,
      and the bucket keeps growing because nobody deletes anything.

      The OCI security guide for Object Storage recommends object versioning to recover from accidental or
      malicious overwrites and deletes, and Object Lifecycle Management can move old objects to cheaper tiers and
      delete what is no longer needed. Lifecycle rules run as the Object Storage service, which needs a policy
      that authorizes it in your tenancy.
    requirements:
    - The bucket stays private (access_type = "NoPublicAccess").
    - Versioning is enabled on the bucket.
    - An oci_objectstorage_object_lifecycle_policy is attached to the bucket.
    - A lifecycle rule moves current objects to the Archive tier (target "objects", action "ARCHIVE").
    - A lifecycle rule deletes previous object versions (target "previous-object-versions", action "DELETE").
    - An IAM policy authorizes the Object Storage service of the region (objectstorage-<region>) to manage object-family, so lifecycle rules can run.
    hints:
    - 'Click the bucket: versioning is one select in its inspector, with the values Enabled and Disabled.'
    - 'A bucket has one object lifecycle policy holding all its rules. Add it from the palette, use **Link to…** for its `namespace` (the namespace data source) and `bucket` (the bucket''s name), and click **Add** next to `rules` once per rule: each rule has a name, action, target, an on/off switch and an age (`time_amount` + `time_unit`).'
    - Object Storage needs permission to move and delete your objects. Add an IAM policy from the palette in the tenancy and, in its **Access** section, add a statement with **Who** set to `service` and `objectstorage-us-ashburn-1`, verb `manage`, `object-family`, location `tenancy`.
    solution: |
      Enable versioning on the bucket, attach one lifecycle policy with two rules, and authorize Object Storage
      to act on your objects:

      ```hcl
      resource "oci_objectstorage_bucket" "assets" {
        # ...
        access_type = "NoPublicAccess"
        versioning  = "Enabled"
      }

      resource "oci_objectstorage_object_lifecycle_policy" "assets" {
        namespace = data.oci_objectstorage_namespace.ns.namespace
        bucket    = oci_objectstorage_bucket.assets.name

        rules {
          name        = "archive-after-90-days"
          action      = "ARCHIVE"
          target      = "objects"
          is_enabled  = true
          time_amount = 90
          time_unit   = "DAYS"
        }

        rules {
          name        = "delete-old-versions"
          action      = "DELETE"
          target      = "previous-object-versions"
          is_enabled  = true
          time_amount = 120
          time_unit   = "DAYS"
        }
      }
      ```

      **Why:** with versioning on, an overwrite or delete creates a new version and keeps the previous one, so
      the empty-file incident becomes a restore instead of a loss. Versioning alone makes storage grow faster,
      which is why the lifecycle policy also deletes previous versions after a retention window and archives
      current objects that are rarely read. Object Storage is a regional service and runs lifecycle actions on
      your behalf, so Oracle requires a policy such as
      `Allow service objectstorage-us-ashburn-1 to manage object-family in tenancy` in every region where you use
      lifecycle rules.

      **Without writing code in Nimbo**

      1. Click the bucket `assets` and pick `Enabled` in **versioning**.
      2. From the palette add an **identity policy** named `nimbo-dev-object-lifecycle` with a short description, and type the tenancy OCID in **compartment_id**. In its **Access** section click **Add statement**: **Who** `service` → `objectstorage-us-ashburn-1`, `manage`, `object-family`, location `tenancy`.
      3. From the palette add an **object lifecycle policy**. Use **Link to…** on **namespace** to pick the namespace data source's `namespace` and on **bucket** to pick the bucket's `name`.
      4. In its **rules** block click **Add** twice. Rule 1: name `archive-after-90-days`, action `ARCHIVE`, target `objects`, enabled, `90` `DAYS`. Rule 2: name `delete-old-versions`, action `DELETE`, target `previous-object-versions`, enabled, `120` `DAYS`.
      5. In its **Meta-arguments** add the IAM policy to **depends_on**, so the rules are created after Object Storage has permission.
    solutionFiles:
      main.tf: |
        data "oci_objectstorage_namespace" "ns" {
          compartment_id = var.compartment_ocid
        }

        resource "oci_objectstorage_bucket" "assets" {
          compartment_id = var.compartment_ocid
          namespace      = data.oci_objectstorage_namespace.ns.namespace
          name           = "${local.name_prefix}-assets"
          access_type    = "NoPublicAccess"
          storage_tier   = "Standard"
          versioning     = "Enabled"
          freeform_tags  = local.common_tags
        }

        # Lifecycle actions run as the Object Storage service of the region.
        resource "oci_identity_policy" "object_lifecycle" {
          compartment_id = var.compartment_ocid
          name           = "${local.name_prefix}-object-lifecycle"
          description    = "Lets Object Storage archive and delete objects for lifecycle rules"
          freeform_tags  = local.common_tags
          statements = [
            "Allow service objectstorage-${var.oci_region} to manage object-family in tenancy",
          ]
        }

        resource "oci_objectstorage_object_lifecycle_policy" "assets" {
          namespace = data.oci_objectstorage_namespace.ns.namespace
          bucket    = oci_objectstorage_bucket.assets.name

          rules {
            name        = "archive-after-90-days"
            action      = "ARCHIVE"
            target      = "objects"
            is_enabled  = true
            time_amount = 90
            time_unit   = "DAYS"
          }

          rules {
            name        = "delete-old-versions"
            action      = "DELETE"
            target      = "previous-object-versions"
            is_enabled  = true
            time_amount = 120
            time_unit   = "DAYS"
          }

          depends_on = [oci_identity_policy.object_lifecycle]
        }
    starter:
      templateId: oci-object-storage
    checks:
    - id: validate
      label: The workflow validates
      type: validate
    - id: private
      label: The bucket is private (NoPublicAccess)
      type: has
      has:
        terraform:
          type: oci_objectstorage_bucket
          where:
            access_type: NoPublicAccess
    - id: versioning
      label: Versioning is enabled
      type: has
      has:
        terraform:
          type: oci_objectstorage_bucket
          where:
            versioning: Enabled
    - id: lifecycle-policy
      label: A lifecycle policy is attached to the bucket
      type: has
      has:
        terraform:
          type: oci_objectstorage_object_lifecycle_policy
          where:
            bucket: {ref: oci_objectstorage_bucket}
    - id: archive-rule
      label: Current objects move to the Archive tier
      type: has
      has:
        terraform:
          type: oci_objectstorage_object_lifecycle_policy
          where:
            rules.target: objects
            rules.action: ARCHIVE
    - id: expire-versions
      label: Previous object versions are deleted after a retention window
      type: has
      has:
        terraform:
          type: oci_objectstorage_object_lifecycle_policy
          where:
            rules.target: previous-object-versions
            rules.action: DELETE
    - id: service-policy
      label: Object Storage is authorized to run lifecycle actions
      type: has
      has:
        terraform:
          type: oci_identity_policy
          where:
            statements: {contains: Allow service objectstorage-}
    sources:
    - title: Securing Object Storage (OCI Security Guide)
      url: https://docs.oracle.com/en-us/iaas/Content/Security/Reference/objectstorage_security.htm
    - title: Object Storage Versioning
      url: https://docs.oracle.com/en-us/iaas/Content/Object/Tasks/usingversioning.htm
    - title: Object Storage Object Lifecycle Management
      url: https://docs.oracle.com/en-us/iaas/Content/Object/Tasks/usinglifecyclepolicies.htm
    - title: Object Storage Buckets
      url: https://docs.oracle.com/en-us/iaas/Content/Object/Tasks/managingbuckets.htm
    - title: oci_objectstorage_bucket (oracle/oci 9.x)
      url: https://registry.terraform.io/providers/oracle/oci/9.11.0/docs/resources/objectstorage_bucket
    - title: oci_objectstorage_object_lifecycle_policy (oracle/oci 9.x)
      url: https://registry.terraform.io/providers/oracle/oci/9.11.0/docs/resources/objectstorage_object_lifecycle_policy
    solvableWithoutCode: true
- op: upsert
  kind: challenge
  id: oci-vcn-public-private-subnets
  data:
    provider: oci
    level: beginner
    title: VCN with public and private subnets
    summary: Split a flat network into a public subnet behind an internet gateway and a private subnet that reaches out through NAT and service gateways.
    minutes: 30
    tags: [networking, vcn, subnets, gateways]
    runtime: design
    problem: |
      The first VCN of the project has two subnets, web and app, and both are public: every VNIC may get a
      public IP and both route tables send all traffic to the internet gateway. The app servers only need to
      download packages and write to Object Storage; nothing on the internet should be able to reach them.

      OCI's networking guidance is to put internal hosts in a private subnet. A private subnet's instances can't
      have public IPs; a NAT gateway lets them start connections to the internet without accepting inbound
      ones, and a service gateway sends traffic to Oracle services such as Object Storage over the Oracle network
      instead of the internet. Keep the web subnet public and make the app subnet private.
    requirements:
    - The app subnet is private (prohibit_public_ip_on_vnic = true).
    - The VCN has a NAT gateway and a service gateway that covers the Oracle Services Network.
    - A route table for the private subnet sends 0.0.0.0/0 to the NAT gateway.
    - The same route table sends the Oracle Services Network CIDR label to the service gateway (destination_type = "SERVICE_CIDR_BLOCK").
    - The private subnet uses that route table, while the public subnet keeps its route to the internet gateway.
    hints:
    - Subnets are public by default; one switch in the subnet's inspector (`prohibit_public_ip_on_vnic`) makes them private. A private subnet then needs its own route table to reach the internet (NAT gateway) and Oracle services (service gateway).
    - 'Add the data source `oci_core_services` from the palette and, in its `filter` block, keep only the entry whose name matches `All .* Services In Oracle Services Network` (turn on regex). Its first service gives you an id for the service gateway and a CIDR label for the route rule: find both under **Link to…** → **More…**.'
    - 'Add a NAT gateway, a service gateway and a second route table from the palette. The route table gets two `route_rules`: `0.0.0.0/0` (type `CIDR_BLOCK`) to the NAT gateway, and the services CIDR (type `SERVICE_CIDR_BLOCK`) to the service gateway. Point the app subnet''s `route_table_id` at it with **Link to…**.'
    solution: |
      Make the app subnet private and give it its own route table with two egress paths:

      ```hcl
      data "oci_core_services" "all" {
        filter {
          name   = "name"
          values = ["All .* Services In Oracle Services Network"]
          regex  = true
        }
      }

      resource "oci_core_nat_gateway" "main" {
        compartment_id = var.compartment_ocid
        vcn_id         = oci_core_vcn.main.id
      }

      resource "oci_core_service_gateway" "main" {
        compartment_id = var.compartment_ocid
        vcn_id         = oci_core_vcn.main.id
        services {
          service_id = data.oci_core_services.all.services[0].id
        }
      }

      resource "oci_core_route_table" "private" {
        compartment_id = var.compartment_ocid
        vcn_id         = oci_core_vcn.main.id

        route_rules {
          destination       = "0.0.0.0/0"
          destination_type  = "CIDR_BLOCK"
          network_entity_id = oci_core_nat_gateway.main.id
        }

        route_rules {
          destination       = data.oci_core_services.all.services[0].cidr_block
          destination_type  = "SERVICE_CIDR_BLOCK"
          network_entity_id = oci_core_service_gateway.main.id
        }
      }
      ```

      Then set `prohibit_public_ip_on_vnic = true` and `route_table_id = oci_core_route_table.private.id` on the
      app subnet.

      **Why:** routing in a VCN is chosen per subnet, so each subnet's route table decides which gateway it
      uses. The NAT gateway allows outbound connections and their responses but never inbound connections from
      the internet. The service gateway keeps Object Storage traffic on the Oracle network and needs no public
      IPs at all. A route table can hold only one rule per service CIDR label, and the label must match what the
      service gateway is configured for, which is why both use the same "All services" entry.

      **Without writing code in Nimbo**

      1. From the palette add the data source **core services** named `all`. In its **filter** block set name `name`, values `All .* Services In Oracle Services Network` and turn **regex** on.
      2. Add a **NAT gateway** and a **service gateway**. On both, **Link to…** `var.compartment_ocid` for **compartment_id** and the VCN's id for **vcn_id**, and give them a display name. In the service gateway's **services** block, open **Link to…** on **service_id**, click **More…** and pick `data.oci_core_services.all.services[0].id`.
      3. Add a **route table** `private` (same compartment and VCN links). In **route_rules** click **Add** twice: rule 1 destination `0.0.0.0/0`, type `CIDR_BLOCK`, network entity → **Link to…** the NAT gateway's id; rule 2 destination → **Link to…** → **More…** `data.oci_core_services.all.services[0].cidr_block`, type `SERVICE_CIDR_BLOCK`, network entity → the service gateway's id.
      4. Click the subnet `app`: turn **prohibit_public_ip_on_vnic** on and **Link to…** the private route table's id in **route_table_id**.
    solutionFiles:
      network.tf: |
        resource "oci_core_vcn" "main" {
          compartment_id = var.compartment_ocid
          display_name   = local.name_prefix
          cidr_blocks    = [var.vcn_cidr]
          dns_label      = "main"
          freeform_tags  = local.common_tags
        }

        resource "oci_core_internet_gateway" "main" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.main.id
          display_name   = "${local.name_prefix}-igw"
          enabled        = true
          freeform_tags  = local.common_tags
        }

        # Private subnets reach the internet (outbound only) through NAT and
        # Oracle services through the service gateway.
        data "oci_core_services" "all" {
          filter {
            name   = "name"
            values = ["All .* Services In Oracle Services Network"]
            regex  = true
          }
        }

        resource "oci_core_nat_gateway" "main" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.main.id
          display_name   = "${local.name_prefix}-nat"
          freeform_tags  = local.common_tags
        }

        resource "oci_core_service_gateway" "main" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.main.id
          display_name   = "${local.name_prefix}-sgw"
          freeform_tags  = local.common_tags

          services {
            service_id = data.oci_core_services.all.services[0].id
          }
        }

        resource "oci_core_route_table" "public" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.main.id
          display_name   = "${local.name_prefix}-public"
          freeform_tags  = local.common_tags

          route_rules {
            destination       = "0.0.0.0/0"
            destination_type  = "CIDR_BLOCK"
            network_entity_id = oci_core_internet_gateway.main.id
          }
        }

        resource "oci_core_route_table" "private" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.main.id
          display_name   = "${local.name_prefix}-private"
          freeform_tags  = local.common_tags

          route_rules {
            destination       = "0.0.0.0/0"
            destination_type  = "CIDR_BLOCK"
            network_entity_id = oci_core_nat_gateway.main.id
          }

          route_rules {
            destination       = data.oci_core_services.all.services[0].cidr_block
            destination_type  = "SERVICE_CIDR_BLOCK"
            network_entity_id = oci_core_service_gateway.main.id
          }
        }

        resource "oci_core_subnet" "web" {
          compartment_id             = var.compartment_ocid
          vcn_id                     = oci_core_vcn.main.id
          display_name               = "${local.name_prefix}-web"
          cidr_block                 = cidrsubnet(var.vcn_cidr, 8, 0)
          dns_label                  = "web"
          prohibit_public_ip_on_vnic = false
          route_table_id             = oci_core_route_table.public.id
          freeform_tags              = local.common_tags
        }

        resource "oci_core_subnet" "app" {
          compartment_id             = var.compartment_ocid
          vcn_id                     = oci_core_vcn.main.id
          display_name               = "${local.name_prefix}-app"
          cidr_block                 = cidrsubnet(var.vcn_cidr, 8, 1)
          dns_label                  = "app"
          prohibit_public_ip_on_vnic = true
          route_table_id             = oci_core_route_table.private.id
          freeform_tags              = local.common_tags
        }
    starter:
      kind: terraform
      cloud: oci
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              oci = {
                source  = "oracle/oci"
                version = "~> 9.0"
              }
            }
          }
        providers.tf: |
          provider "oci" {
            region = var.oci_region
          }
        variables.tf: |
          variable "project" {
            type        = string
            default     = "learn"
            description = "Project name: the first part of every resource name and the Project tag."
          }

          variable "environment" {
            type        = string
            default     = "dev"
            description = "Deployment environment (dev, staging, prod): part of every resource name and the Environment tag."
          }

          variable "oci_region" {
            type        = string
            default     = "us-ashburn-1"
            description = "OCI region to deploy into."
          }

          variable "compartment_ocid" {
            type        = string
            default     = "ocid1.tenancy.oc1..flocilocaltenancy0000000000000000000000000000000000000000"
            description = "Compartment OCID for every resource (defaults to the local Floci tenancy root compartment)."
          }

          variable "vcn_cidr" {
            type        = string
            default     = "10.20.0.0/16"
            description = "Address range of the VCN: the web subnet is its first /24, the app subnet the second."
          }
        locals.tf: |
          locals {
            name_prefix = "${var.project}-${var.environment}"
            common_tags = {
              Project     = var.project
              Environment = var.environment
              ManagedBy   = "nimbo"
            }
          }
        network.tf: |
          resource "oci_core_vcn" "main" {
            compartment_id = var.compartment_ocid
            display_name   = local.name_prefix
            cidr_blocks    = [var.vcn_cidr]
            dns_label      = "main"
            freeform_tags  = local.common_tags
          }

          resource "oci_core_internet_gateway" "main" {
            compartment_id = var.compartment_ocid
            vcn_id         = oci_core_vcn.main.id
            display_name   = "${local.name_prefix}-igw"
            enabled        = true
            freeform_tags  = local.common_tags
          }

          resource "oci_core_route_table" "public" {
            compartment_id = var.compartment_ocid
            vcn_id         = oci_core_vcn.main.id
            display_name   = "${local.name_prefix}-public"
            freeform_tags  = local.common_tags

            route_rules {
              destination       = "0.0.0.0/0"
              destination_type  = "CIDR_BLOCK"
              network_entity_id = oci_core_internet_gateway.main.id
            }
          }

          resource "oci_core_subnet" "web" {
            compartment_id             = var.compartment_ocid
            vcn_id                     = oci_core_vcn.main.id
            display_name               = "${local.name_prefix}-web"
            cidr_block                 = cidrsubnet(var.vcn_cidr, 8, 0)
            dns_label                  = "web"
            prohibit_public_ip_on_vnic = false
            route_table_id             = oci_core_route_table.public.id
            freeform_tags              = local.common_tags
          }

          # The app servers only call out (packages, Object Storage) but sit in
          # a public subnet that routes everything through the internet gateway.
          resource "oci_core_subnet" "app" {
            compartment_id             = var.compartment_ocid
            vcn_id                     = oci_core_vcn.main.id
            display_name               = "${local.name_prefix}-app"
            cidr_block                 = cidrsubnet(var.vcn_cidr, 8, 1)
            dns_label                  = "app"
            prohibit_public_ip_on_vnic = false
            route_table_id             = oci_core_route_table.public.id
            freeform_tags              = local.common_tags
          }
        outputs.tf: |
          output "vcn_id" {
            value       = oci_core_vcn.main.id
            description = "OCID of the VCN."
          }

          output "app_subnet_id" {
            value       = oci_core_subnet.app.id
            description = "OCID of the app subnet."
          }
    checks:
    - id: validate
      label: The workflow validates
      type: validate
    - id: private-subnet
      label: The app subnet forbids public IPs
      type: has
      has:
        terraform:
          type: oci_core_subnet
          where:
            prohibit_public_ip_on_vnic: true
    - id: nat-gateway
      label: The VCN has a NAT gateway
      type: has
      has:
        terraform:
          type: oci_core_nat_gateway
          where:
            vcn_id: {ref: oci_core_vcn}
    - id: service-gateway
      label: The VCN has a service gateway for Oracle services
      type: has
      has:
        terraform:
          type: oci_core_service_gateway
          where:
            services.service_id: {exists: true}
    - id: route-to-nat
      label: A route table sends internet-bound traffic to the NAT gateway
      type: has
      has:
        terraform:
          type: oci_core_route_table
          where:
            route_rules.network_entity_id: {ref: oci_core_nat_gateway}
    - id: route-to-service-gateway
      label: The same route table sends Oracle services traffic to the service gateway
      type: has
      has:
        terraform:
          type: oci_core_route_table
          where:
            route_rules.network_entity_id: {ref: oci_core_service_gateway}
            route_rules.destination_type: SERVICE_CIDR_BLOCK
    - id: two-route-tables
      label: Public and private subnets use separate route tables
      type: has
      has:
        terraform:
          type: oci_core_route_table
          count: {min: 2}
    sources:
    - title: Networking Overview
      url: https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/overview.htm
    - title: NAT Gateway
      url: https://docs.oracle.com/en-us/iaas/Content/Network/Tasks/NATgateway.htm
    - title: 'Access to Oracle Services: Service Gateway'
      url: https://docs.oracle.com/en-us/iaas/Content/Network/Tasks/servicegateway.htm
    - title: Internet Gateway
      url: https://docs.oracle.com/en-us/iaas/Content/Network/Tasks/managingIGs.htm
    - title: Securing Networking (OCI Security Guide)
      url: https://docs.oracle.com/en-us/iaas/Content/Security/Reference/networking_security.htm
    - title: oci_core_service_gateway (oracle/oci 9.x)
      url: https://registry.terraform.io/providers/oracle/oci/9.11.0/docs/resources/core_service_gateway
    - title: oci_core_route_table (oracle/oci 9.x)
      url: https://registry.terraform.io/providers/oracle/oci/9.11.0/docs/resources/core_route_table
    solvableWithoutCode: true
- op: upsert
  kind: challenge
  id: oci-nsg-tiered-access
  data:
    provider: oci
    level: intermediate
    title: Tiered access with network security groups and Bastion
    summary: Replace a wide-open security list with per-tier NSGs, and reach private hosts through the Bastion service instead of public SSH.
    minutes: 40
    tags: [networking, nsg, security-lists, bastion, segmentation]
    prerequisites: [oci-vcn-public-private-subnets]
    runtime: design
    problem: |
      A two-tier app runs a web server in a public subnet and an API server (port 8080) in a private subnet. Both
      subnets share one security list that accepts SSH (22), HTTPS (443) and the API port (8080) from
      0.0.0.0/0, so anything that can reach either subnet can reach every port, and SSH is exposed to the whole
      internet.

      OCI recommends network security groups (NSGs) over security lists: an NSG applies to the VNICs you put in
      it, and a rule's source can be another NSG, so "the API accepts traffic only from the web tier" becomes a
      single rule that survives IP changes. For administration, the OCI Bastion service gives time-limited,
      audited SSH sessions to hosts without public IPs, limited to the client ranges you allow.
    requirements:
    - No security list has an ingress rule from 0.0.0.0/0 (internet-facing rules move to an NSG).
    - A web NSG allows TCP 443 from 0.0.0.0/0.
    - An app NSG allows TCP 8080 only from the web NSG (source_type = "NETWORK_SECURITY_GROUP").
    - No NSG rule opens SSH (22) or the API port (8080) to 0.0.0.0/0.
    - Both instances join their NSG through create_vnic_details.nsg_ids.
    - An oci_bastion_bastion targets the private subnet and its client_cidr_block_allow_list does not contain 0.0.0.0/0.
    hints:
    - The shared security list lets SSH in from anywhere. Click it and remove its ingress rule cards so only the egress rules stay; access between tiers then comes from network security groups (NSGs).
    - 'Add one NSG per tier (web, app) from the palette. Each rule is its own NSG security rule node: direction, protocol `6` (TCP), source type and source, and the port range in `tcp_options`. For the app tier pick source type `NETWORK_SECURITY_GROUP` and **Link to…** the web NSG''s id as the source.'
    - 'Put each instance in its tier: in the instance''s `create_vnic_details` block, **Link to…** the NSG''s id on `nsg_ids`. Finally add a Bastion from the palette (type `STANDARD`) that targets the app subnet, with your office or VPN range in `client_cidr_block_allow_list`.'
    solution: |
      1. Replace the shared security list with one that has only egress rules, so the default list's SSH rule
         and the old 0.0.0.0/0 rules are gone.
      2. Create two NSGs and express the tiers as rules:

      ```hcl
      resource "oci_core_network_security_group_security_rule" "web_https_in" {
        network_security_group_id = oci_core_network_security_group.web.id
        direction                 = "INGRESS"
        protocol                  = "6"
        source                    = "0.0.0.0/0"
        source_type               = "CIDR_BLOCK"
        tcp_options {
          destination_port_range {
            min = 443
            max = 443
          }
        }
      }

      resource "oci_core_network_security_group_security_rule" "app_from_web" {
        network_security_group_id = oci_core_network_security_group.app.id
        direction                 = "INGRESS"
        protocol                  = "6"
        source                    = oci_core_network_security_group.web.id
        source_type               = "NETWORK_SECURITY_GROUP"
        tcp_options {
          destination_port_range {
            min = 8080
            max = 8080
          }
        }
      }
      ```

      3. Put each instance in its NSG with `create_vnic_details { nsg_ids = [...] }`.
      4. Add `oci_bastion_bastion` (bastion_type = "standard") targeting the private subnet, with
         `client_cidr_block_allow_list = [var.admin_cidr]`.

      **Why:** security lists apply to every VNIC in a subnet, so one permissive list exposes all hosts in it.
      NSG rules follow the VNICs that belong to the group, and an NSG source keeps the web-to-API path correct
      even when instances are replaced. Oracle's security guide recommends allowing SSH only from authorized
      CIDR blocks rather than 0.0.0.0/0; the Bastion service goes further, giving identity-based, audited and
      time-bound sessions without public IPs on the hosts. Traffic is allowed if any security list or NSG that
      applies to the VNIC allows it, which is why the old open rules must be removed, not just complemented.

      **Without writing code in Nimbo**

      1. Click the security list `shared` and delete its ingress rule cards (keep the egress rules).
      2. From the palette add two **network security groups**, `web` and `app`: **Link to…** `var.compartment_ocid` and the VCN's id, display names `learn-dev-web` and `learn-dev-app`.
      3. Add a **network security group security rule** `web_https`: NSG → **Link to…** the web NSG, `INGRESS`, protocol `6`, source type `CIDR_BLOCK`, source `0.0.0.0/0`, destination port range 443–443.
      4. Add a rule `app_from_web`: NSG → the app NSG, `INGRESS`, protocol `6`, source type `NETWORK_SECURITY_GROUP`, source → **Link to…** the web NSG's id, destination port range 8080–8080.
      5. Click the instance `web` and, in its **create_vnic_details** block, **Link to…** the web NSG's id on **nsg_ids**. Do the same on the instance `app` with the app NSG.
      6. From the palette add a **Bastion**: name `learndevbastion`, type `STANDARD`, **Link to…** `var.compartment_ocid` and the app subnet's id in **target_subnet_id**, and add `203.0.113.0/24` (your office or VPN range) to **client_cidr_block_allow_list**.
    solutionFiles:
      variables.tf: |
        variable "project" {
          type        = string
          default     = "learn"
          description = "Project name: the first part of every resource name and the Project tag."
        }

        variable "environment" {
          type        = string
          default     = "dev"
          description = "Deployment environment (dev, staging, prod): part of every resource name and the Environment tag."
        }

        variable "oci_region" {
          type        = string
          default     = "us-ashburn-1"
          description = "OCI region to deploy into."
        }

        variable "compartment_ocid" {
          type        = string
          default     = "ocid1.tenancy.oc1..flocilocaltenancy0000000000000000000000000000000000000000"
          description = "Compartment OCID for every resource (defaults to the local Floci tenancy root compartment)."
        }

        variable "vcn_cidr" {
          type        = string
          default     = "10.30.0.0/16"
          description = "Address range of the VCN: the web subnet is its first /24, the app subnet the second."
        }

        variable "instance_shape" {
          type        = string
          default     = "VM.Standard.E4.Flex"
          description = "Compute shape of both instances (a flexible shape)."
        }

        variable "admin_cidr" {
          type        = string
          default     = "203.0.113.0/24"
          description = "Office or VPN range allowed to open Bastion sessions."
        }
      network.tf: |
        resource "oci_core_vcn" "main" {
          compartment_id = var.compartment_ocid
          display_name   = local.name_prefix
          cidr_blocks    = [var.vcn_cidr]
          dns_label      = "tiers"
          freeform_tags  = local.common_tags
        }

        resource "oci_core_internet_gateway" "main" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.main.id
          display_name   = "${local.name_prefix}-igw"
          enabled        = true
          freeform_tags  = local.common_tags
        }

        resource "oci_core_nat_gateway" "main" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.main.id
          display_name   = "${local.name_prefix}-nat"
          freeform_tags  = local.common_tags
        }

        resource "oci_core_route_table" "public" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.main.id
          display_name   = "${local.name_prefix}-public"
          freeform_tags  = local.common_tags

          route_rules {
            destination       = "0.0.0.0/0"
            destination_type  = "CIDR_BLOCK"
            network_entity_id = oci_core_internet_gateway.main.id
          }
        }

        resource "oci_core_route_table" "private" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.main.id
          display_name   = "${local.name_prefix}-private"
          freeform_tags  = local.common_tags

          route_rules {
            destination       = "0.0.0.0/0"
            destination_type  = "CIDR_BLOCK"
            network_entity_id = oci_core_nat_gateway.main.id
          }
        }

        # Egress only: every ingress rule lives in an NSG. Listing this
        # security list on the subnets also replaces the VCN's default one,
        # whose stock rules allow SSH from anywhere.
        resource "oci_core_security_list" "egress_only" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.main.id
          display_name   = "${local.name_prefix}-egress-only"
          freeform_tags  = local.common_tags

          egress_security_rules {
            description = "All outbound traffic"
            protocol    = "all"
            destination = "0.0.0.0/0"
          }
        }

        resource "oci_core_subnet" "web" {
          compartment_id             = var.compartment_ocid
          vcn_id                     = oci_core_vcn.main.id
          display_name               = "${local.name_prefix}-web"
          cidr_block                 = local.web_cidr
          dns_label                  = "web"
          prohibit_public_ip_on_vnic = false
          route_table_id             = oci_core_route_table.public.id
          security_list_ids          = [oci_core_security_list.egress_only.id]
          freeform_tags              = local.common_tags
        }

        resource "oci_core_subnet" "app" {
          compartment_id             = var.compartment_ocid
          vcn_id                     = oci_core_vcn.main.id
          display_name               = "${local.name_prefix}-app"
          cidr_block                 = local.app_cidr
          dns_label                  = "app"
          prohibit_public_ip_on_vnic = true
          route_table_id             = oci_core_route_table.private.id
          security_list_ids          = [oci_core_security_list.egress_only.id]
          freeform_tags              = local.common_tags
        }
      nsg.tf: |
        resource "oci_core_network_security_group" "web" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.main.id
          display_name   = "${local.name_prefix}-web"
          freeform_tags  = local.common_tags
        }

        resource "oci_core_network_security_group" "app" {
          compartment_id = var.compartment_ocid
          vcn_id         = oci_core_vcn.main.id
          display_name   = "${local.name_prefix}-app"
          freeform_tags  = local.common_tags
        }

        resource "oci_core_network_security_group_security_rule" "web_https_in" {
          network_security_group_id = oci_core_network_security_group.web.id
          description               = "HTTPS from the internet"
          direction                 = "INGRESS"
          protocol                  = "6"
          source                    = "0.0.0.0/0"
          source_type               = "CIDR_BLOCK"

          tcp_options {
            destination_port_range {
              min = 443
              max = 443
            }
          }
        }

        resource "oci_core_network_security_group_security_rule" "web_to_app" {
          network_security_group_id = oci_core_network_security_group.web.id
          description               = "Calls to the API tier"
          direction                 = "EGRESS"
          protocol                  = "6"
          destination               = oci_core_network_security_group.app.id
          destination_type          = "NETWORK_SECURITY_GROUP"

          tcp_options {
            destination_port_range {
              min = 8080
              max = 8080
            }
          }
        }

        resource "oci_core_network_security_group_security_rule" "app_from_web" {
          network_security_group_id = oci_core_network_security_group.app.id
          description               = "API calls from the web tier only"
          direction                 = "INGRESS"
          protocol                  = "6"
          source                    = oci_core_network_security_group.web.id
          source_type               = "NETWORK_SECURITY_GROUP"

          tcp_options {
            destination_port_range {
              min = 8080
              max = 8080
            }
          }
        }

        # Bastion sessions start from the bastion's endpoint in the private
        # subnet.
        resource "oci_core_network_security_group_security_rule" "app_ssh_from_bastion" {
          network_security_group_id = oci_core_network_security_group.app.id
          description               = "SSH through the Bastion service"
          direction                 = "INGRESS"
          protocol                  = "6"
          source                    = local.app_cidr
          source_type               = "CIDR_BLOCK"

          tcp_options {
            destination_port_range {
              min = 22
              max = 22
            }
          }
        }

        resource "oci_bastion_bastion" "admin" {
          bastion_type                 = "standard"
          compartment_id               = var.compartment_ocid
          target_subnet_id             = oci_core_subnet.app.id
          name                         = replace("${local.name_prefix}-admin", "-", "")
          client_cidr_block_allow_list = [var.admin_cidr]
          max_session_ttl_in_seconds   = 3600
          freeform_tags                = local.common_tags
        }
      compute.tf: |
        data "oci_identity_availability_domains" "ads" {
          compartment_id = var.compartment_ocid
        }

        data "oci_core_images" "ol9" {
          compartment_id           = var.compartment_ocid
          operating_system         = "Oracle Linux"
          operating_system_version = "9"
          shape                    = var.instance_shape
          sort_by                  = "TIMECREATED"
          sort_order               = "DESC"
        }

        resource "oci_core_instance" "web" {
          compartment_id      = var.compartment_ocid
          availability_domain = data.oci_identity_availability_domains.ads.availability_domains[0].name
          display_name        = "${local.name_prefix}-web"
          shape               = var.instance_shape
          freeform_tags       = local.common_tags

          shape_config {
            ocpus         = 1
            memory_in_gbs = 8
          }

          source_details {
            source_type = "image"
            source_id   = data.oci_core_images.ol9.images[0].id
          }

          create_vnic_details {
            subnet_id        = oci_core_subnet.web.id
            assign_public_ip = true
            nsg_ids          = [oci_core_network_security_group.web.id]
          }
        }

        resource "oci_core_instance" "app" {
          compartment_id      = var.compartment_ocid
          availability_domain = data.oci_identity_availability_domains.ads.availability_domains[0].name
          display_name        = "${local.name_prefix}-app"
          shape               = var.instance_shape
          freeform_tags       = local.common_tags

          shape_config {
            ocpus         = 1
            memory_in_gbs = 8
          }

          source_details {
            source_type = "image"
            source_id   = data.oci_core_images.ol9.images[0].id
          }

          create_vnic_details {
            subnet_id        = oci_core_subnet.app.id
            assign_public_ip = false
            nsg_ids          = [oci_core_network_security_group.app.id]
          }

          agent_config {
            plugins_config {
              name          = "Bastion"
              desired_state = "ENABLED"
            }
          }
        }
    starter:
      kind: terraform
      cloud: oci
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              oci = {
                source  = "oracle/oci"
                version = "~> 9.0"
              }
            }
          }
        providers.tf: |
          provider "oci" {
            region = var.oci_region
          }
        variables.tf: |
          variable "project" {
            type        = string
            default     = "learn"
            description = "Project name: the first part of every resource name and the Project tag."
          }

          variable "environment" {
            type        = string
            default     = "dev"
            description = "Deployment environment (dev, staging, prod): part of every resource name and the Environment tag."
          }

          variable "oci_region" {
            type        = string
            default     = "us-ashburn-1"
            description = "OCI region to deploy into."
          }

          variable "compartment_ocid" {
            type        = string
            default     = "ocid1.tenancy.oc1..flocilocaltenancy0000000000000000000000000000000000000000"
            description = "Compartment OCID for every resource (defaults to the local Floci tenancy root compartment)."
          }

          variable "vcn_cidr" {
            type        = string
            default     = "10.30.0.0/16"
            description = "Address range of the VCN: the web subnet is its first /24, the app subnet the second."
          }

          variable "instance_shape" {
            type        = string
            default     = "VM.Standard.E4.Flex"
            description = "Compute shape of both instances (a flexible shape)."
          }
        locals.tf: |
          locals {
            name_prefix = "${var.project}-${var.environment}"
            common_tags = {
              Project     = var.project
              Environment = var.environment
              ManagedBy   = "nimbo"
            }

            web_cidr = cidrsubnet(var.vcn_cidr, 8, 0)
            app_cidr = cidrsubnet(var.vcn_cidr, 8, 1)
          }
        network.tf: |
          resource "oci_core_vcn" "main" {
            compartment_id = var.compartment_ocid
            display_name   = local.name_prefix
            cidr_blocks    = [var.vcn_cidr]
            dns_label      = "tiers"
            freeform_tags  = local.common_tags
          }

          resource "oci_core_internet_gateway" "main" {
            compartment_id = var.compartment_ocid
            vcn_id         = oci_core_vcn.main.id
            display_name   = "${local.name_prefix}-igw"
            enabled        = true
            freeform_tags  = local.common_tags
          }

          resource "oci_core_nat_gateway" "main" {
            compartment_id = var.compartment_ocid
            vcn_id         = oci_core_vcn.main.id
            display_name   = "${local.name_prefix}-nat"
            freeform_tags  = local.common_tags
          }

          resource "oci_core_route_table" "public" {
            compartment_id = var.compartment_ocid
            vcn_id         = oci_core_vcn.main.id
            display_name   = "${local.name_prefix}-public"
            freeform_tags  = local.common_tags

            route_rules {
              destination       = "0.0.0.0/0"
              destination_type  = "CIDR_BLOCK"
              network_entity_id = oci_core_internet_gateway.main.id
            }
          }

          resource "oci_core_route_table" "private" {
            compartment_id = var.compartment_ocid
            vcn_id         = oci_core_vcn.main.id
            display_name   = "${local.name_prefix}-private"
            freeform_tags  = local.common_tags

            route_rules {
              destination       = "0.0.0.0/0"
              destination_type  = "CIDR_BLOCK"
              network_entity_id = oci_core_nat_gateway.main.id
            }
          }

          # One list for both tiers: SSH, HTTPS and the API port from anywhere.
          resource "oci_core_security_list" "shared" {
            compartment_id = var.compartment_ocid
            vcn_id         = oci_core_vcn.main.id
            display_name   = "${local.name_prefix}-shared"
            freeform_tags  = local.common_tags

            ingress_security_rules {
              description = "SSH"
              protocol    = "6"
              source      = "0.0.0.0/0"

              tcp_options {
                min = 22
                max = 22
              }
            }

            ingress_security_rules {
              description = "HTTPS"
              protocol    = "6"
              source      = "0.0.0.0/0"

              tcp_options {
                min = 443
                max = 443
              }
            }

            ingress_security_rules {
              description = "API"
              protocol    = "6"
              source      = "0.0.0.0/0"

              tcp_options {
                min = 8080
                max = 8080
              }
            }

            egress_security_rules {
              description = "All outbound traffic"
              protocol    = "all"
              destination = "0.0.0.0/0"
            }
          }

          resource "oci_core_subnet" "web" {
            compartment_id             = var.compartment_ocid
            vcn_id                     = oci_core_vcn.main.id
            display_name               = "${local.name_prefix}-web"
            cidr_block                 = local.web_cidr
            dns_label                  = "web"
            prohibit_public_ip_on_vnic = false
            route_table_id             = oci_core_route_table.public.id
            security_list_ids          = [oci_core_security_list.shared.id]
            freeform_tags              = local.common_tags
          }

          resource "oci_core_subnet" "app" {
            compartment_id             = var.compartment_ocid
            vcn_id                     = oci_core_vcn.main.id
            display_name               = "${local.name_prefix}-app"
            cidr_block                 = local.app_cidr
            dns_label                  = "app"
            prohibit_public_ip_on_vnic = true
            route_table_id             = oci_core_route_table.private.id
            security_list_ids          = [oci_core_security_list.shared.id]
            freeform_tags              = local.common_tags
          }
        compute.tf: |
          data "oci_identity_availability_domains" "ads" {
            compartment_id = var.compartment_ocid
          }

          data "oci_core_images" "ol9" {
            compartment_id           = var.compartment_ocid
            operating_system         = "Oracle Linux"
            operating_system_version = "9"
            shape                    = var.instance_shape
            sort_by                  = "TIMECREATED"
            sort_order               = "DESC"
          }

          resource "oci_core_instance" "web" {
            compartment_id      = var.compartment_ocid
            availability_domain = data.oci_identity_availability_domains.ads.availability_domains[0].name
            display_name        = "${local.name_prefix}-web"
            shape               = var.instance_shape
            freeform_tags       = local.common_tags

            shape_config {
              ocpus         = 1
              memory_in_gbs = 8
            }

            source_details {
              source_type = "image"
              source_id   = data.oci_core_images.ol9.images[0].id
            }

            create_vnic_details {
              subnet_id        = oci_core_subnet.web.id
              assign_public_ip = true
            }
          }

          resource "oci_core_instance" "app" {
            compartment_id      = var.compartment_ocid
            availability_domain = data.oci_identity_availability_domains.ads.availability_domains[0].name
            display_name        = "${local.name_prefix}-app"
            shape               = var.instance_shape
            freeform_tags       = local.common_tags

            shape_config {
              ocpus         = 1
              memory_in_gbs = 8
            }

            source_details {
              source_type = "image"
              source_id   = data.oci_core_images.ol9.images[0].id
            }

            create_vnic_details {
              subnet_id        = oci_core_subnet.app.id
              assign_public_ip = false
            }
          }
        outputs.tf: |
          output "web_public_ip" {
            value       = oci_core_instance.web.public_ip
            description = "Public IP of the web server."
          }
    checks:
    - id: validate
      label: The workflow validates
      type: validate
    - id: no-open-security-list
      label: No security list accepts traffic from 0.0.0.0/0
      type: has
      has:
        terraform:
          type: oci_core_security_list
          where:
            ingress_security_rules.source: 0.0.0.0/0
          count: {max: 0}
    - id: web-https
      label: The web NSG accepts HTTPS from the internet
      type: has
      has:
        terraform:
          type: oci_core_network_security_group_security_rule
          where:
            direction: INGRESS
            source: 0.0.0.0/0
            tcp_options.destination_port_range.min: 443
    - id: app-from-web-only
      label: The app NSG accepts 8080 only from the web NSG
      type: has
      has:
        terraform:
          type: oci_core_network_security_group_security_rule
          where:
            direction: INGRESS
            source_type: NETWORK_SECURITY_GROUP
            source: {ref: oci_core_network_security_group}
            tcp_options.destination_port_range.min: 8080
    - id: no-public-ssh-or-api
      label: No NSG rule opens SSH or 8080 to the internet
      type: has
      has:
        terraform:
          type: oci_core_network_security_group_security_rule
          where:
            source: 0.0.0.0/0
            tcp_options.destination_port_range.min: {in: [22, 8080]}
          count: {max: 0}
    - id: instances-in-nsgs
      label: Both instances join an NSG
      type: has
      has:
        terraform:
          type: oci_core_instance
          where:
            create_vnic_details.nsg_ids: {exists: true}
          count: {min: 2}
    - id: bastion
      label: A Bastion targets the private subnet
      type: has
      has:
        terraform:
          type: oci_bastion_bastion
          where:
            target_subnet_id: {ref: oci_core_subnet}
            client_cidr_block_allow_list: {exists: true}
    - id: bastion-not-open
      label: Bastion sessions are not open to 0.0.0.0/0
      type: has
      has:
        terraform:
          type: oci_bastion_bastion
          where:
            client_cidr_block_allow_list: {contains: 0.0.0.0/0}
          count: {max: 0}
    sources:
    - title: Network Security Groups
      url: https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/networksecuritygroups.htm
    - title: Security Lists
      url: https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/securitylists.htm
    - title: Security Rules
      url: https://docs.oracle.com/en-us/iaas/Content/Network/Concepts/securityrules.htm
    - title: Securing Networking (OCI Security Guide)
      url: https://docs.oracle.com/en-us/iaas/Content/Security/Reference/networking_security.htm
    - title: Bastion Overview
      url: https://docs.oracle.com/en-us/iaas/Content/Bastion/Concepts/bastionoverview.htm
    - title: oci_core_network_security_group_security_rule (oracle/oci 9.x)
      url: https://registry.terraform.io/providers/oracle/oci/9.11.0/docs/resources/core_network_security_group_security_rule
    - title: oci_bastion_bastion (oracle/oci 9.x)
      url: https://registry.terraform.io/providers/oracle/oci/9.11.0/docs/resources/bastion_bastion
    solvableWithoutCode: true
- op: upsert
  kind: challenge
  id: oci-lb-instance-pool-autoscaling
  data:
    provider: oci
    level: intermediate
    title: Load-balanced instance pool with autoscaling
    summary: Turn fixed, hand-registered servers behind a flexible load balancer into an instance pool across availability domains that scales on CPU.
    minutes: 45
    tags: [compute, instance-pool, autoscaling, load-balancer, high-availability]
    prerequisites: [oci-vcn-public-private-subnets]
    runtime: design
    problem: |
      The starter is Nimbo's OCI load balancer template: a flexible load balancer in a public subnet, a backend
      set with an HTTP health check, and two app servers created one by one with `oci_core_instance` and added
      to the backend set by hand with `oci_load_balancer_backend`.

      It works until traffic doubles or a server dies: nobody replaces a failed instance, adding capacity means
      editing Terraform, and every new server must be registered with the load balancer manually. OCI solves
      this with an instance configuration (the template of an instance), an instance pool (a managed group
      created from it, which registers its members with a load balancer backend set automatically) and an
      autoscaling configuration that resizes the pool from Monitoring metrics.
    requirements:
    - An oci_core_instance_configuration describes the app server (no public IP) and replaces the hand-made instances, so the workflow has no oci_core_instance and no oci_load_balancer_backend.
    - An oci_core_instance_pool is created from that configuration and attached to the load balancer's backend set (load_balancers block).
    - The pool sets placement_configurations so instances can be spread across availability domains and fault domains, in the private subnet.
    - An oci_autoscaling_auto_scaling_configuration targets the pool with a threshold policy on CPU_UTILIZATION, a minimum capacity of at least 2 and a maximum of at least 3.
    - The backend set keeps its HTTP health check.
    hints:
    - Move the shape, image, metadata (user_data) and VNIC settings of oci_core_instance into instance_details.launch_details of an instance configuration (instance_type = "compute").
    - The pool's load_balancers block needs load_balancer_id, backend_set_name, port (8080) and vnic_selection = "PrimaryVnic"; the pool then adds and removes backends by itself.
    - A dynamic "placement_configurations" block over data.oci_identity_availability_domains gives one placement per availability domain; without fault_domains, OCI spreads instances across fault domains on a best-effort basis.
    - 'A threshold policy has two rules: scale out (CHANGE_COUNT_BY 1 when CPU_UTILIZATION is GT a value) and scale in (CHANGE_COUNT_BY -1 when it is LT a value); auto_scaling_resources uses type = "instancePool".'
    solution: |
      Replace the instances and backends with a configuration, a pool and an autoscaling configuration:

      ```hcl
      resource "oci_core_instance_pool" "app" {
        compartment_id            = var.compartment_ocid
        instance_configuration_id = oci_core_instance_configuration.app.id
        size                      = 2

        dynamic "placement_configurations" {
          for_each = data.oci_identity_availability_domains.ads.availability_domains
          content {
            availability_domain = placement_configurations.value.name
            primary_vnic_subnets {
              subnet_id = oci_core_subnet.tier["private"].id
            }
          }
        }

        load_balancers {
          load_balancer_id = oci_load_balancer_load_balancer.main.id
          backend_set_name = oci_load_balancer_backend_set.app.name
          port             = 8080
          vnic_selection   = "PrimaryVnic"
        }
      }
      ```

      The autoscaling configuration uses `policy_type = "threshold"`, a capacity of min 2 / initial 2 / max 6,
      and two `CPU_UTILIZATION` rules (GT 70 → +1, LT 20 → -1) with a cooldown of 300 seconds.

      **Why:** an instance pool creates its instances from one configuration and, when associated with a load
      balancer, adds each new instance to the backend set; the backend set's health check keeps traffic away
      from instances that are not ready. Placements in several availability domains (or, in single-AD regions,
      the default spread across the three fault domains) remove single points of failure. Metric-based
      autoscaling evaluates Monitoring metrics averaged across the pool and adjusts its size, with a cooldown so
      the system stabilizes between actions; the minimum of two keeps redundancy at the lowest load.

      **Without writing code in Nimbo**

      In Nimbo you can add the instance configuration, instance pool, autoscaling configuration and the pool's `load_balancers` block from the palette and inspector. The part that needs code is the app server itself: its start-up script lives in the instances' `metadata` as `user_data = base64encode(...)`, and you must write it again in the instance configuration's launch details in `main.tf` (Nimbo doesn't write scripts or call `base64encode`). Placing the pool in a `for_each` subnet (`oci_core_subnet.tier["private"]`) also needs code.
    solutionFiles:
      variables.tf: |
        variable "project" {
          type        = string
          default     = "edge-lb"
          description = "Project name: the first part of every resource name and the Project tag."

          validation {
            condition     = can(regex("^[a-z][a-z0-9-]{1,19}$", var.project))
            error_message = "project must be 2-20 lowercase letters, digits or hyphens, starting with a letter."
          }
        }

        variable "environment" {
          type        = string
          default     = "dev"
          description = "Deployment environment (dev, staging, prod, …): part of every resource name and the Environment tag."

          validation {
            condition     = can(regex("^[a-z][a-z0-9-]{0,11}$", var.environment))
            error_message = "environment must be 1-12 lowercase letters, digits or hyphens, starting with a letter."
          }
        }

        variable "oci_region" {
          type        = string
          default     = "us-ashburn-1"
          description = "OCI region to deploy into."
        }

        variable "compartment_ocid" {
          type        = string
          default     = "ocid1.tenancy.oc1..flocilocaltenancy0000000000000000000000000000000000000000"
          description = "Compartment OCID for every resource (defaults to the local Floci tenancy root compartment)."
        }

        variable "vcn_cidr" {
          type        = string
          default     = "10.50.0.0/16"
          description = "Address range of the VCN: the public subnet is its first /24, the private subnet the second."
        }

        variable "instance_shape" {
          type        = string
          default     = "VM.Standard.E4.Flex"
          description = "Compute shape of the pool's instances (a flexible shape)."
        }

        variable "instance_ocpus" {
          type        = number
          default     = 1
          description = "OCPUs of each instance."
        }

        variable "instance_memory_gbs" {
          type        = number
          default     = 8
          description = "Memory of each instance in GB."
        }

        variable "lb_bandwidth_mbps" {
          type        = number
          default     = 10
          description = "Minimum and maximum bandwidth of the flexible load balancer in Mbps (10 is the always-free size)."
        }
      compute.tf: |
        # Oracle Linux 9, the newest image for the shape.
        data "oci_core_images" "ol9" {
          compartment_id           = var.compartment_ocid
          operating_system         = "Oracle Linux"
          operating_system_version = "9"
          shape                    = var.instance_shape
          sort_by                  = "TIMECREATED"
          sort_order               = "DESC"
        }

        # The template of every app server: a tiny Python HTTP service on
        # port 8080 that answers with the instance's host name.
        resource "oci_core_instance_configuration" "app" {
          compartment_id = var.compartment_ocid
          display_name   = "${local.name_prefix}-app"
          freeform_tags  = local.common_tags

          instance_details {
            instance_type = "compute"

            launch_details {
              compartment_id = var.compartment_ocid
              shape          = var.instance_shape
              freeform_tags  = local.common_tags

              shape_config {
                ocpus         = var.instance_ocpus
                memory_in_gbs = var.instance_memory_gbs
              }

              source_details {
                source_type = "image"
                image_id    = data.oci_core_images.ol9.images[0].id
              }

              create_vnic_details {
                assign_public_ip = false
              }

              metadata = {
                user_data = base64encode(<<-EOT
                  #!/bin/bash
                  cat > /opt/app.py <<'PY'
                  import json, socket
                  from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

                  class Handler(BaseHTTPRequestHandler):
                      def do_GET(self):
                          body = {"status": "ok"} if self.path == "/health" else {"host": socket.gethostname(), "path": self.path}
                          payload = json.dumps(body).encode()
                          self.send_response(200)
                          self.send_header("content-type", "application/json")
                          self.send_header("content-length", str(len(payload)))
                          self.end_headers()
                          self.wfile.write(payload)

                  ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
                  PY
                  cat > /etc/systemd/system/app.service <<'UNIT'
                  [Unit]
                  Description=App server
                  After=network-online.target

                  [Service]
                  ExecStart=/usr/bin/python3 /opt/app.py
                  Restart=always
                  DynamicUser=yes

                  [Install]
                  WantedBy=multi-user.target
                  UNIT
                  firewall-cmd --permanent --add-port=8080/tcp
                  firewall-cmd --reload
                  systemctl enable --now app.service
                EOT
                )
              }
            }
          }
        }

        # One placement per availability domain; without fault_domains OCI
        # spreads the instances across fault domains (best effort). The pool
        # registers every instance it creates in the backend set.
        resource "oci_core_instance_pool" "app" {
          compartment_id            = var.compartment_ocid
          instance_configuration_id = oci_core_instance_configuration.app.id
          display_name              = "${local.name_prefix}-app"
          size                      = 2
          freeform_tags             = local.common_tags

          dynamic "placement_configurations" {
            for_each = data.oci_identity_availability_domains.ads.availability_domains
            content {
              availability_domain = placement_configurations.value.name

              primary_vnic_subnets {
                subnet_id = oci_core_subnet.tier["private"].id
              }
            }
          }

          load_balancers {
            load_balancer_id = oci_load_balancer_load_balancer.main.id
            backend_set_name = oci_load_balancer_backend_set.app.name
            port             = 8080
            vnic_selection   = "PrimaryVnic"
          }

          # Autoscaling owns the size after creation.
          lifecycle {
            ignore_changes = [size]
          }
        }

        resource "oci_autoscaling_auto_scaling_configuration" "app" {
          compartment_id       = var.compartment_ocid
          display_name         = "${local.name_prefix}-app"
          cool_down_in_seconds = 300
          is_enabled           = true
          freeform_tags        = local.common_tags

          auto_scaling_resources {
            id   = oci_core_instance_pool.app.id
            type = "instancePool"
          }

          policies {
            display_name = "cpu"
            policy_type  = "threshold"

            capacity {
              initial = 2
              min     = 2
              max     = 6
            }

            rules {
              display_name = "scale-out"

              action {
                type  = "CHANGE_COUNT_BY"
                value = 1
              }

              metric {
                metric_type = "CPU_UTILIZATION"

                threshold {
                  operator = "GT"
                  value    = 70
                }
              }
            }

            rules {
              display_name = "scale-in"

              action {
                type  = "CHANGE_COUNT_BY"
                value = -1
              }

              metric {
                metric_type = "CPU_UTILIZATION"

                threshold {
                  operator = "LT"
                  value    = 20
                }
              }
            }
          }
        }
      main.tf: |
        # The one public entry point (flexible shape).
        resource "oci_load_balancer_load_balancer" "main" {
          compartment_id = var.compartment_ocid
          display_name   = local.name_prefix
          shape          = "flexible"
          subnet_ids     = [oci_core_subnet.tier["public"].id]
          is_private     = false
          freeform_tags  = local.common_tags

          shape_details {
            minimum_bandwidth_in_mbps = var.lb_bandwidth_mbps
            maximum_bandwidth_in_mbps = var.lb_bandwidth_mbps
          }
        }

        # Requests are spread round robin over the pool members that answer
        # /health; the instance pool adds and removes the backends.
        resource "oci_load_balancer_backend_set" "app" {
          name             = "app"
          load_balancer_id = oci_load_balancer_load_balancer.main.id
          policy           = "ROUND_ROBIN"

          health_checker {
            protocol          = "HTTP"
            port              = 8080
            url_path          = "/health"
            return_code       = 200
            interval_ms       = 10000
            timeout_in_millis = 3000
            retries           = 3
          }
        }

        resource "oci_load_balancer_listener" "http" {
          name                     = "http"
          load_balancer_id         = oci_load_balancer_load_balancer.main.id
          port                     = 80
          protocol                 = "HTTP"
          default_backend_set_name = oci_load_balancer_backend_set.app.name
        }
      outputs.tf: |
        output "public_ip" {
          value       = oci_load_balancer_load_balancer.main.ip_address_details[0].ip_address
          description = "Public IP of the load balancer: http://<ip>/ reaches a healthy pool member."
        }

        output "instance_pool_id" {
          value       = oci_core_instance_pool.app.id
          description = "OCID of the app instance pool."
        }

        output "backend_set" {
          value       = oci_load_balancer_backend_set.app.name
          description = "Backend set whose health checker decides which pool members get traffic."
        }
    starter:
      templateId: oci-load-balancer
    checks:
    - id: validate
      label: The workflow validates
      type: validate
    - id: instance-configuration
      label: An instance configuration describes the app server without a public IP
      type: has
      has:
        terraform:
          type: oci_core_instance_configuration
          where:
            instance_details.launch_details.create_vnic_details.assign_public_ip: false
    - id: no-hand-made-servers
      label: No standalone instances or hand-registered backends remain
      type: has
      has:
        terraform:
          type: oci_core_instance
          count: {max: 0}
    - id: no-manual-backends
      label: Backends are registered by the pool, not by hand
      type: has
      has:
        terraform:
          type: oci_load_balancer_backend
          count: {max: 0}
    - id: pool-behind-lb
      label: An instance pool from the configuration is attached to the backend set
      type: has
      has:
        terraform:
