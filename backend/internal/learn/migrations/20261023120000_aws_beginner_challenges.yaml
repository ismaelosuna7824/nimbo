description: Adds the AWS beginner challenges (private S3 bucket, VPC across two Availability Zones, least-privilege Lambda role)
operations:
  - op: upsert
    kind: challenge
    id: aws-private-s3-bucket
    data:
      provider: aws
      level: beginner
      title: Lock down an S3 bucket
      summary: Turn a bare bucket into a private, versioned, encrypted bucket that only accepts HTTPS requests.
      minutes: 20
      tags: [s3, security, encryption, versioning, storage]
      runtime: emulated
      problem: |
        The analytics team created an S3 bucket for raw exports with a single
        Terraform resource and nothing else. The security review flagged it:
        nothing in the code says the bucket must stay private, a bad script
        could overwrite or delete an export with no way back, encryption is
        left to whatever the account default is, and clients may still talk
        to it over plain HTTP.

        Amazon S3 gives you separate, explicit controls for each of these
        concerns. **S3 Block Public Access** has four settings that override
        any ACL or bucket policy that would make data public. **Object
        Ownership** set to *bucket owner enforced* disables ACLs entirely, so
        access is decided by policies only. **Versioning** keeps every
        version of every object, so a delete only adds a delete marker and an
        overwrite keeps the previous version. **Default encryption** states
        how new objects are encrypted at rest, and a bucket policy that
        denies requests where `aws:SecureTransport` is `false` forces
        encryption in transit.

        Harden `main.tf` so the bucket follows the S3 security best practices.
        The bucket deploys to the local AWS emulator (Floci) when you check.
      requirements:
        - "An `aws_s3_bucket_public_access_block` for the bucket turns on all four settings: `block_public_acls`, `block_public_policy`, `ignore_public_acls` and `restrict_public_buckets`."
        - "An `aws_s3_bucket_ownership_controls` sets `object_ownership = \"BucketOwnerEnforced\"` (ACLs disabled)."
        - "An `aws_s3_bucket_versioning` sets the versioning status to `Enabled`."
        - "An `aws_s3_bucket_server_side_encryption_configuration` sets default encryption (`AES256` for SSE-S3, or `aws:kms` / `aws:kms:dsse` with a KMS key)."
        - "An `aws_s3_bucket_policy` denies every request made without TLS (`aws:SecureTransport` = `false`); write the policy inline with `jsonencode` so the grader can read it."
        - "No `bp_public_bucket` or `bp_unencrypted_storage` findings (any severity), and the workflow deploys."
      hints:
        - Each S3 bucket feature is its own Terraform resource in the AWS provider v4 and later (`aws_s3_bucket_versioning`, `aws_s3_bucket_public_access_block`, …). Every one of them takes `bucket = aws_s3_bucket.data.id`.
        - "Versioning lives in a nested block: `versioning_configuration { status = \"Enabled\" }`. Default encryption lives in `rule { apply_server_side_encryption_by_default { sse_algorithm = \"AES256\" } }`."
        - "The TLS-only policy is one `Deny` statement for `Principal = \"*\"`, `Action = \"s3:*\"` on both the bucket ARN and `\"${aws_s3_bucket.data.arn}/*\"`, with `Condition = { Bool = { \"aws:SecureTransport\" = \"false\" } }`. Add `depends_on` on the public access block so the two don't race."
      solution: |
        Every control is a separate resource attached to the same bucket:

        1. **Block Public Access** – all four settings `true`. AWS recommends
           turning on all four unless you knowingly serve public content;
           they win over any ACL or policy that would grant public access.
        2. **Object Ownership = `BucketOwnerEnforced`** – ACLs are disabled
           and the bucket owner owns every object, so only IAM and bucket
           policies decide access (the S3 default for new buckets and the
           recommended setting).
        3. **Versioning `Enabled`** – deletes add a delete marker and
           overwrites create a new version, so accidental or malicious
           changes can be rolled back.
        4. **Default encryption** – S3 already encrypts new objects with
           SSE-S3, but declaring it keeps the intent in code and lets you
           move to SSE-KMS (customer managed key, bucket key) later.
        5. **TLS only** – a `Deny` on `aws:SecureTransport = false` rejects
           any HTTP request, whoever makes it.

        ```hcl
        resource "aws_s3_bucket_public_access_block" "data" {
          bucket                  = aws_s3_bucket.data.id
          block_public_acls       = true
          block_public_policy     = true
          ignore_public_acls      = true
          restrict_public_buckets = true
        }

        resource "aws_s3_bucket_versioning" "data" {
          bucket = aws_s3_bucket.data.id
          versioning_configuration {
            status = "Enabled"
          }
        }
        ```

        The full reference is in the solution files. Versioning keeps old
        versions forever: pair it with a lifecycle rule that expires
        noncurrent versions (covered in the expert backup challenge).
      solutionFiles:
        main.tf: |
          resource "aws_s3_bucket" "data" {
            bucket_prefix = "${local.name_prefix}-data-"
            force_destroy = true
          }

          # All four Block Public Access settings: no ACL or policy can make
          # the bucket or its objects public.
          resource "aws_s3_bucket_public_access_block" "data" {
            bucket                  = aws_s3_bucket.data.id
            block_public_acls       = true
            block_public_policy     = true
            ignore_public_acls      = true
            restrict_public_buckets = true
          }

          # ACLs disabled: access is decided by IAM and bucket policies only.
          resource "aws_s3_bucket_ownership_controls" "data" {
            bucket = aws_s3_bucket.data.id

            rule {
              object_ownership = "BucketOwnerEnforced"
            }
          }

          # Deletes and overwrites keep the previous version.
          resource "aws_s3_bucket_versioning" "data" {
            bucket = aws_s3_bucket.data.id

            versioning_configuration {
              status = "Enabled"
            }
          }

          resource "aws_s3_bucket_server_side_encryption_configuration" "data" {
            bucket = aws_s3_bucket.data.id

            rule {
              apply_server_side_encryption_by_default {
                sse_algorithm = "AES256"
              }
            }
          }

          # Encryption in transit: any request made over plain HTTP is denied.
          resource "aws_s3_bucket_policy" "tls_only" {
            bucket = aws_s3_bucket.data.id
            policy = jsonencode({
              Version = "2012-10-17"
              Statement = [{
                Sid       = "DenyInsecureTransport"
                Effect    = "Deny"
                Principal = "*"
                Action    = "s3:*"
                Resource  = [aws_s3_bucket.data.arn, "${aws_s3_bucket.data.arn}/*"]
                Condition = { Bool = { "aws:SecureTransport" = "false" } }
              }]
            })
            depends_on = [aws_s3_bucket_public_access_block.data]
          }
      starter:
        kind: terraform
        cloud: aws
        files:
          versions.tf: &aws_versions |
            terraform {
              required_version = ">= 1.6"

              required_providers {
                aws = {
                  source  = "hashicorp/aws"
                  version = "~> 6.0"
                }
              }
            }
          providers.tf: &aws_providers |
            provider "aws" {
              region = var.aws_region

              default_tags {
                tags = local.common_tags
              }
            }
          locals.tf: &aws_locals |
            locals {
              name_prefix = "${var.project}-${var.environment}"
              common_tags = {
                Project     = var.project
                Environment = var.environment
                ManagedBy   = "nimbo"
              }
            }
          variables.tf: &aws_variables |
            variable "project" {
              type        = string
              default     = "learn"
              description = "Project name: the first part of every resource name and the Project tag."

              validation {
                condition     = can(regex("^[a-z][a-z0-9-]{1,19}$", var.project))
                error_message = "project must be 2-20 lowercase letters, digits or hyphens, starting with a letter."
              }
            }

            variable "environment" {
              type        = string
              default     = "dev"
              description = "Deployment environment (dev, staging, prod, …): part of every resource name and the Environment tag."

              validation {
                condition     = can(regex("^[a-z][a-z0-9-]{0,11}$", var.environment))
                error_message = "environment must be 1-12 lowercase letters, digits or hyphens, starting with a letter."
              }
            }

            variable "aws_region" {
              type        = string
              default     = "us-east-1"
              description = "AWS region to deploy into."
            }
          main.tf: |
            # Raw analytics exports. Make this bucket private, versioned,
            # encrypted and HTTPS-only.
            resource "aws_s3_bucket" "data" {
              bucket_prefix = "${local.name_prefix}-data-"
              force_destroy = true
            }
          outputs.tf: |
            output "bucket" {
              value       = aws_s3_bucket.data.bucket
              description = "Name of the exports bucket."
            }
      checks:
        - id: valid
          label: The configuration is valid
          type: validate
        - id: block-public-access
          label: All four Block Public Access settings are on
          type: has
          has:
            terraform:
              type: aws_s3_bucket_public_access_block
              where:
                block_public_acls: true
                block_public_policy: true
                ignore_public_acls: true
                restrict_public_buckets: true
        - id: acls-disabled
          label: ACLs are disabled (bucket owner enforced)
          type: has
          has:
            terraform:
              type: aws_s3_bucket_ownership_controls
              where:
                rule.object_ownership: BucketOwnerEnforced
        - id: versioning
          label: Versioning is enabled
          type: has
          has:
            terraform:
              type: aws_s3_bucket_versioning
              where:
                versioning_configuration.status: Enabled
        - id: default-encryption
          label: Default encryption is declared
          type: has
          has:
            terraform:
              type: aws_s3_bucket_server_side_encryption_configuration
              where:
                rule.apply_server_side_encryption_by_default.sse_algorithm: {in: [AES256, "aws:kms", "aws:kms:dsse"]}
        - id: tls-only
          label: A bucket policy denies requests without TLS
          type: has
          has:
            terraform:
              type: aws_s3_bucket_policy
              where:
                policy: {contains: "aws:SecureTransport"}
        - id: storage-rules
          label: No public-bucket or unencrypted-storage findings
          type: rules_clean
          rules_clean:
            codes: [bp_public_bucket, bp_unencrypted_storage]
            minSeverity: info
        - id: deploy
          label: The bucket deploys to the local AWS emulator
          type: deploy
      sources:
        - title: Blocking public access to your Amazon S3 storage
          url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html
        - title: Security best practices for Amazon S3
          url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/security-best-practices.html
        - title: Controlling ownership of objects and disabling ACLs for your bucket
          url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/about-object-ownership.html
        - title: Retaining multiple versions of objects with S3 Versioning
          url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html
        - title: Setting default server-side encryption behavior for Amazon S3 buckets
          url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucket-encryption.html
        - title: "Terraform AWS provider: aws_s3_bucket_public_access_block"
          url: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/s3_bucket_public_access_block
        - title: "Terraform AWS provider: aws_s3_bucket_versioning"
          url: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/s3_bucket_versioning

  - op: upsert
    kind: challenge
    id: aws-vpc-multi-az-subnets
    data:
      provider: aws
      level: beginner
      title: A VPC with public and private subnets in two Availability Zones
      summary: Grow a one-subnet VPC into public and private tiers spread over two Availability Zones looked up at plan time.
      minutes: 30
      tags: [vpc, networking, subnets, availability-zones, route-tables]
      prerequisites: [aws-private-s3-bucket]
      runtime: emulated
      problem: |
        Your first VPC has a single public subnet pinned to `us-east-1a`.
        Everything you launch lands in one Availability Zone and is reachable
        from the internet. The next workloads need two things: a **private
        tier** for databases and app servers that nothing on the internet can
        reach, and **two Availability Zones** so a zone outage doesn't take
        the whole network down.

        A subnet is a range of the VPC's addresses that lives in exactly one
        Availability Zone. What makes it *public* is its route table: a
        `0.0.0.0/0` route to an internet gateway. A *private* subnet's route
        table has no such route (later you'll add a NAT gateway or VPC
        endpoints for outbound traffic). Hard-coding zone names ties the code
        to one region and account, so look the zones up with the
        `aws_availability_zones` data source.

        Rework `main.tf` accordingly. The network deploys to the local AWS
        emulator when you check.
      requirements:
        - "Availability Zones come from a `data \"aws_availability_zones\"` lookup (no hard-coded zone names, no `bp_hardcoded_az` finding)."
        - "`aws_subnet.public` creates one public subnet per zone in **two** zones (`map_public_ip_on_launch = true`), associated with a route table whose `0.0.0.0/0` route goes to the internet gateway."
        - "`aws_subnet.private` creates one private subnet per zone in the same two zones; it never maps public IPs."
        - "The private subnets use their own route table with **no** route to the internet gateway, and every route table is associated with its subnets."
        - "Subnets don't overlap and stay inside the VPC (no `net_*` findings), and the workflow deploys."
      hints:
        - "`data \"aws_availability_zones\" \"available\" { state = \"available\" }` returns `names`; `slice(data.aws_availability_zones.available.names, 0, 2)` keeps the first two."
        - "Use `count = 2` (or `for_each` over the zones) on each subnet resource and `cidrsubnet(var.vpc_cidr, 8, n)` to carve non-overlapping /24 ranges: e.g. `count.index` for public and `count.index + 10` for private."
        - "A route table without any `aws_route` only has the implicit local route: that is exactly a private route table. Associate it with `aws_route_table_association` using `count = 2` and `aws_subnet.private[count.index].id`."
      solution: |
        The reference keeps the VPC, internet gateway and public route table,
        and adds:

        - a `data "aws_availability_zones"` lookup and a local list of the
          first two zone names;
        - `aws_subnet.public` and `aws_subnet.private` with `count =
          length(local.azs)`, each in `local.azs[count.index]`, with ranges
          from `cidrsubnet` (`10.0.0.0/24`, `10.0.1.0/24` public;
          `10.0.10.0/24`, `10.0.11.0/24` private);
        - a private route table with no internet route and associations
          for every subnet.

        ```hcl
        data "aws_availability_zones" "available" {
          state = "available"
        }

        locals {
          azs = slice(data.aws_availability_zones.available.names, 0, 2)
        }

        resource "aws_subnet" "private" {
          count                   = length(local.azs)
          vpc_id                  = aws_vpc.main.id
          cidr_block              = cidrsubnet(var.vpc_cidr, 8, count.index + 10)
          availability_zone       = local.azs[count.index]
          map_public_ip_on_launch = false
        }
        ```

        Why: the Well-Architected reliability pillar asks you to deploy
        across multiple Availability Zones, and the security pillar to keep
        resources that don't need internet exposure in private subnets.
        Private instances that need outbound access get it through a NAT
        gateway in each public subnet (one per zone, so a zone failure
        doesn't cut the others off) or through VPC endpoints.
      solutionFiles:
        main.tf: |
          data "aws_availability_zones" "available" {
            state = "available"
          }

          locals {
            # Two zones: every tier gets one subnet in each.
            azs = slice(data.aws_availability_zones.available.names, 0, 2)
          }

          resource "aws_vpc" "main" {
            cidr_block           = var.vpc_cidr
            enable_dns_support   = true
            enable_dns_hostnames = true
            tags                 = { Name = local.name_prefix }
          }

          resource "aws_internet_gateway" "main" {
            vpc_id = aws_vpc.main.id
            tags   = { Name = local.name_prefix }
          }

          # Public tier: instances get public IPs and the route table sends
          # internet traffic to the internet gateway.
          resource "aws_subnet" "public" {
            count                   = length(local.azs)
            vpc_id                  = aws_vpc.main.id
            cidr_block              = cidrsubnet(var.vpc_cidr, 8, count.index)
            availability_zone       = local.azs[count.index]
            map_public_ip_on_launch = true
            tags                    = { Name = "${local.name_prefix}-public-${local.azs[count.index]}", Tier = "public" }
          }

          resource "aws_route_table" "public" {
            vpc_id = aws_vpc.main.id
            tags   = { Name = "${local.name_prefix}-public" }
          }

          resource "aws_route" "internet" {
            route_table_id         = aws_route_table.public.id
            destination_cidr_block = "0.0.0.0/0"
            gateway_id             = aws_internet_gateway.main.id
          }

          resource "aws_route_table_association" "public" {
            count          = length(local.azs)
            subnet_id      = aws_subnet.public[count.index].id
            route_table_id = aws_route_table.public.id
          }

          # Private tier: no public IPs and no route to the internet gateway.
          resource "aws_subnet" "private" {
            count                   = length(local.azs)
            vpc_id                  = aws_vpc.main.id
            cidr_block              = cidrsubnet(var.vpc_cidr, 8, count.index + 10)
            availability_zone       = local.azs[count.index]
            map_public_ip_on_launch = false
            tags                    = { Name = "${local.name_prefix}-private-${local.azs[count.index]}", Tier = "private" }
          }

          resource "aws_route_table" "private" {
            vpc_id = aws_vpc.main.id
            tags   = { Name = "${local.name_prefix}-private" }
          }

          resource "aws_route_table_association" "private" {
            count          = length(local.azs)
            subnet_id      = aws_subnet.private[count.index].id
            route_table_id = aws_route_table.private.id
          }
        outputs.tf: |
          output "vpc_id" {
            value       = aws_vpc.main.id
            description = "ID of the VPC."
          }

          output "public_subnet_ids" {
            value       = aws_subnet.public[*].id
            description = "IDs of the public subnets, one per Availability Zone."
          }

          output "private_subnet_ids" {
            value       = aws_subnet.private[*].id
            description = "IDs of the private subnets, one per Availability Zone."
          }
      starter:
        kind: terraform
        cloud: aws
        files:
          versions.tf: *aws_versions
          providers.tf: *aws_providers
          locals.tf: *aws_locals
          variables.tf: |
            variable "project" {
              type        = string
              default     = "learn"
              description = "Project name: the first part of every resource name and the Project tag."

              validation {
                condition     = can(regex("^[a-z][a-z0-9-]{1,19}$", var.project))
                error_message = "project must be 2-20 lowercase letters, digits or hyphens, starting with a letter."
              }
            }

            variable "environment" {
              type        = string
              default     = "dev"
              description = "Deployment environment (dev, staging, prod, …): part of every resource name and the Environment tag."

              validation {
                condition     = can(regex("^[a-z][a-z0-9-]{0,11}$", var.environment))
                error_message = "environment must be 1-12 lowercase letters, digits or hyphens, starting with a letter."
              }
            }

            variable "aws_region" {
              type        = string
              default     = "us-east-1"
              description = "AWS region to deploy into."
            }

            variable "vpc_cidr" {
              type        = string
              default     = "10.0.0.0/16"
              description = "CIDR block of the VPC; subnets are /24 slices of it."
            }
          main.tf: |
            resource "aws_vpc" "main" {
              cidr_block           = var.vpc_cidr
              enable_dns_support   = true
              enable_dns_hostnames = true
              tags                 = { Name = local.name_prefix }
            }

            resource "aws_internet_gateway" "main" {
              vpc_id = aws_vpc.main.id
              tags   = { Name = local.name_prefix }
            }

            # One public subnet in one hard-coded zone: no private tier and no
            # second Availability Zone.
            resource "aws_subnet" "public" {
              vpc_id                  = aws_vpc.main.id
              cidr_block              = cidrsubnet(var.vpc_cidr, 8, 0)
              availability_zone       = "us-east-1a"
              map_public_ip_on_launch = true
              tags                    = { Name = "${local.name_prefix}-public" }
            }

            resource "aws_route_table" "public" {
              vpc_id = aws_vpc.main.id
              tags   = { Name = "${local.name_prefix}-public" }
            }

            resource "aws_route" "internet" {
              route_table_id         = aws_route_table.public.id
              destination_cidr_block = "0.0.0.0/0"
              gateway_id             = aws_internet_gateway.main.id
            }

            resource "aws_route_table_association" "public" {
              subnet_id      = aws_subnet.public.id
              route_table_id = aws_route_table.public.id
            }
          outputs.tf: |
            output "vpc_id" {
              value       = aws_vpc.main.id
              description = "ID of the VPC."
            }
      checks:
        - id: valid
          label: The configuration is valid
          type: validate
        - id: zone-lookup
          label: Availability Zones are looked up with a data source
          type: has
          has:
            terraform:
              type: data.aws_availability_zones
        - id: no-hardcoded-zones
          label: No hard-coded Availability Zones
          type: rules_clean
          rules_clean:
            codes: [bp_hardcoded_az]
            minSeverity: info
        - id: public-tier
          label: "aws_subnet.public maps public IPs and spans several zones"
          type: has
          has:
            terraform:
              type: aws_subnet
              name: public
              where:
                map_public_ip_on_launch: true
                availability_zone: {exists: true}
        - id: private-tier
          label: "aws_subnet.private exists in its own zones"
          type: has
          has:
            terraform:
              type: aws_subnet
              name: private
              where:
                availability_zone: {exists: true}
        - id: private-no-public-ip
          label: Private subnets never map public IPs
          type: has
          has:
            terraform:
              type: aws_subnet
              name: private
              where:
                map_public_ip_on_launch: true
              count: {max: 0}
        - id: private-route-table
          label: Public and private subnets have their own route tables
          type: has
          has:
            terraform:
              type: aws_route_table
              count: {min: 2}
        - id: route-associations
          label: Every tier is associated with its route table
          type: has
          has:
            terraform:
              type: aws_route_table_association
              count: {min: 2}
        - id: network-findings
          label: No network findings (overlaps, private subnets routed to the internet, unassociated route tables)
          type: rules_clean
          rules_clean:
            prefixes: [net_]
            minSeverity: info
        - id: deploy
          label: The network deploys to the local AWS emulator
          type: deploy
      sources:
        - title: Subnets for your VPC
          url: https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html
        - title: "Example: VPC with servers in private subnets and NAT"
          url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-example-private-subnets-nat.html
        - title: NAT gateways
          url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html
        - title: "AWS Certified Solutions Architect – Associate: Domain 1, Design Secure Architectures"
          url: https://docs.aws.amazon.com/aws-certification/latest/solutions-architect-associate-03/solutions-architect-associate-03-domain1.html
        - title: "Terraform AWS provider: aws_availability_zones data source"
          url: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/data-sources/availability_zones
        - title: "Terraform AWS provider: aws_subnet"
          url: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/subnet

  - op: upsert
    kind: challenge
    id: aws-lambda-least-privilege
    data:
      provider: aws
      level: beginner
      title: A least-privilege role for a Lambda function
      summary: Replace an admin policy on a Lambda execution role with exactly the DynamoDB read and logging permissions it needs.
      minutes: 25
      tags: [iam, lambda, least-privilege, dynamodb, cloudwatch-logs]
      prerequisites: [aws-private-s3-bucket]
      runtime: emulated
      problem: |
        The `reader` Lambda function looks up one order in a DynamoDB table.
        To "make it work" someone gave its execution role a policy that
        allows every action on every resource (`"*"` on `"*"`). If the
        function's code or dependencies are ever compromised, the attacker
        gets administrator access to the whole account.

        A Lambda **execution role** is the identity the function assumes when
        it runs; its policies decide which AWS APIs the code may call. The
        IAM best practice is **least privilege**: grant only the actions the
        workload uses, on only the resources it uses. This function needs to
        read items from one table and write its own logs, nothing else. Logs
        also need a home: a CloudWatch log group with a retention period, so
        they don't pile up (and cost) forever.

        Fix the IAM policy and add the log group. The function deploys to the
        local AWS emulator when you check.
      requirements:
        - "The role policy allows only read actions on the orders table (for this code: `dynamodb:GetItem`), with `Resource` set to the table's ARN (`aws_dynamodb_table.orders.arn`), not `\"*\"`."
        - "No policy statement allows `*` on `*` and no service-wide wildcard such as `dynamodb:*` (no `bp_iam_wildcard` finding)."
        - "An `aws_cloudwatch_log_group` named `/aws/lambda/<function name>` sets `retention_in_days` (no `bp_log_retention` finding)."
        - "The role may write logs only to that log group (`logs:CreateLogStream`, `logs:PutLogEvents` on the log group ARN followed by `:*`)."
        - The workflow deploys.
      hints:
        - "Read the function code in `main.tf`: which DynamoDB API does it call? That single action is all the policy needs for the table."
        - "Reference the table instead of `\"*\"`: `Resource = aws_dynamodb_table.orders.arn`. Inside `jsonencode` you can list several statements, e.g. one for DynamoDB and one for logs."
        - "Lambda writes to the log group `/aws/lambda/${aws_lambda_function.reader.function_name}`. Create it yourself with `retention_in_days = 14` and grant `logs:CreateLogStream` and `logs:PutLogEvents` on `\"${aws_cloudwatch_log_group.reader.arn}:*\"`."
      solution: |
        The admin statement becomes two narrow statements, and the log group
        is created by Terraform with a retention period:

        ```hcl
        policy = jsonencode({
          Version = "2012-10-17"
          Statement = [
            {
              Sid      = "ReadOrders"
              Effect   = "Allow"
              Action   = ["dynamodb:GetItem"]
              Resource = aws_dynamodb_table.orders.arn
            },
            {
              Sid      = "WriteOwnLogs"
              Effect   = "Allow"
              Action   = ["logs:CreateLogStream", "logs:PutLogEvents"]
              Resource = "${aws_cloudwatch_log_group.reader.arn}:*"
            }
          ]
        })
        ```

        Why: IAM recommends granting least privilege and refining broad
        permissions down to the actions and resources a workload uses; the
        Lambda guide applies the same rule to execution roles. Creating the
        log group in Terraform (instead of letting Lambda create it on first
        run) lets you set `retention_in_days`, and scoping `logs:*`
        permissions to it means the function can't write into other groups.
        The `AWSLambdaBasicExecutionRole` managed policy is a quick start,
        but it allows writing to any log group in the account.
      solutionFiles:
        main.tf: |
          resource "aws_dynamodb_table" "orders" {
            name         = "${local.name_prefix}-orders"
            billing_mode = "PAY_PER_REQUEST"
            hash_key     = "id"

            attribute {
              name = "id"
              type = "S"
            }

            server_side_encryption {
              enabled = true
            }
          }

          data "archive_file" "reader" {
            type        = "zip"
            output_path = "${path.module}/build/reader.zip"

            source {
              filename = "index.mjs"
              content  = <<-EOT
                import { DynamoDBClient, GetItemCommand } from "@aws-sdk/client-dynamodb";

                const db = new DynamoDBClient({});

                export const handler = async (event) => {
                  const id = String(event?.id ?? "1");
                  const out = await db.send(new GetItemCommand({
                    TableName: process.env.TABLE_NAME,
                    Key: { id: { S: id } },
                  }));
                  return { found: Boolean(out.Item), id };
                };
              EOT
            }
          }

          resource "aws_iam_role" "reader" {
            name = "${local.name_prefix}-reader"
            assume_role_policy = jsonencode({
              Version = "2012-10-17"
              Statement = [{
                Effect    = "Allow"
                Principal = { Service = "lambda.amazonaws.com" }
                Action    = "sts:AssumeRole"
              }]
            })
          }

          # Exactly what the code uses: one read action on one table, and
          # writing to the function's own log group.
          resource "aws_iam_role_policy" "reader" {
            name = "${local.name_prefix}-reader"
            role = aws_iam_role.reader.id
            policy = jsonencode({
              Version = "2012-10-17"
              Statement = [
                {
                  Sid      = "ReadOrders"
                  Effect   = "Allow"
                  Action   = ["dynamodb:GetItem"]
                  Resource = aws_dynamodb_table.orders.arn
                },
                {
                  Sid      = "WriteOwnLogs"
                  Effect   = "Allow"
                  Action   = ["logs:CreateLogStream", "logs:PutLogEvents"]
                  Resource = "${aws_cloudwatch_log_group.reader.arn}:*"
                }
              ]
            })
          }

          resource "aws_lambda_function" "reader" {
            function_name    = "${local.name_prefix}-reader"
            role             = aws_iam_role.reader.arn
            runtime          = "nodejs22.x"
            handler          = "index.handler"
            filename         = data.archive_file.reader.output_path
            source_code_hash = data.archive_file.reader.output_base64sha256
            timeout          = 10

            environment {
              variables = {
                TABLE_NAME = aws_dynamodb_table.orders.name
              }
            }
          }

          resource "aws_cloudwatch_log_group" "reader" {
            name              = "/aws/lambda/${aws_lambda_function.reader.function_name}"
            retention_in_days = 14
          }
      starter:
        kind: terraform
        cloud: aws
        files:
          versions.tf: &aws_versions_archive |
            terraform {
              required_version = ">= 1.6"

              required_providers {
                aws = {
                  source  = "hashicorp/aws"
                  version = "~> 6.0"
                }
                archive = {
                  source  = "hashicorp/archive"
                  version = "~> 2.0"
                }
              }
            }
          providers.tf: *aws_providers
          locals.tf: *aws_locals
          variables.tf: *aws_variables
          main.tf: |
            resource "aws_dynamodb_table" "orders" {
              name         = "${local.name_prefix}-orders"
              billing_mode = "PAY_PER_REQUEST"
              hash_key     = "id"

              attribute {
                name = "id"
                type = "S"
              }

              server_side_encryption {
                enabled = true
              }
            }

            data "archive_file" "reader" {
              type        = "zip"
              output_path = "${path.module}/build/reader.zip"

              source {
                filename = "index.mjs"
                content  = <<-EOT
                  import { DynamoDBClient, GetItemCommand } from "@aws-sdk/client-dynamodb";

                  const db = new DynamoDBClient({});

                  export const handler = async (event) => {
                    const id = String(event?.id ?? "1");
                    const out = await db.send(new GetItemCommand({
                      TableName: process.env.TABLE_NAME,
                      Key: { id: { S: id } },
                    }));
                    return { found: Boolean(out.Item), id };
                  };
                EOT
              }
            }

            resource "aws_iam_role" "reader" {
              name = "${local.name_prefix}-reader"
              assume_role_policy = jsonencode({
                Version = "2012-10-17"
                Statement = [{
                  Effect    = "Allow"
                  Principal = { Service = "lambda.amazonaws.com" }
                  Action    = "sts:AssumeRole"
                }]
              })
            }

            # "It works": the function may do anything to anything.
            resource "aws_iam_role_policy" "reader" {
              name = "${local.name_prefix}-reader"
              role = aws_iam_role.reader.id
              policy = jsonencode({
                Version = "2012-10-17"
                Statement = [{
                  Effect   = "Allow"
                  Action   = "*"
                  Resource = "*"
                }]
              })
            }

            resource "aws_lambda_function" "reader" {
              function_name    = "${local.name_prefix}-reader"
              role             = aws_iam_role.reader.arn
              runtime          = "nodejs22.x"
              handler          = "index.handler"
              filename         = data.archive_file.reader.output_path
              source_code_hash = data.archive_file.reader.output_base64sha256
              timeout          = 10

              environment {
                variables = {
                  TABLE_NAME = aws_dynamodb_table.orders.name
                }
              }
            }
          outputs.tf: |
            output "function_name" {
              value       = aws_lambda_function.reader.function_name
              description = "Name of the reader function."
            }
      checks:
        - id: valid
          label: The configuration is valid
          type: validate
        - id: no-admin-policy
          label: No policy grants every action on every resource
          type: rules_clean
          rules_clean:
            codes: [bp_iam_wildcard]
            minSeverity: warning
        - id: scoped-to-table
          label: The role policy targets the orders table's ARN
          type: has
          has:
            terraform:
              type: aws_iam_role_policy
              where:
                policy: {ref: aws_dynamodb_table.orders}
        - id: read-action
          label: The policy grants the read action the code uses
          type: has
          has:
            terraform:
              type: aws_iam_role_policy
              where:
                policy: {contains: "dynamodb:GetItem"}
        - id: no-service-wildcard
          label: No service-wide DynamoDB wildcard
          type: has
          has:
            terraform:
              type: aws_iam_role_policy
              where:
                policy: {contains: "dynamodb:*"}
              count: {max: 0}
        - id: own-logs-only
          label: Log permissions are scoped to the function's log group
          type: has
          has:
            terraform:
              type: aws_iam_role_policy
              where:
                policy: {ref: aws_cloudwatch_log_group}
        - id: log-retention
          label: The function's log group has a retention period
          type: rules_clean
          rules_clean:
            codes: [bp_log_retention]
            minSeverity: info
        - id: deploy
          label: The function deploys to the local AWS emulator
          type: deploy
      sources:
        - title: Security best practices in IAM
          url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
        - title: Defining Lambda function permissions with an execution role
          url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-intro-execution-role.html
        - title: Sending Lambda function logs to CloudWatch Logs
          url: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-cloudwatchlogs.html
        - title: "AWS managed policy: AWSLambdaBasicExecutionRole"
          url: https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSLambdaBasicExecutionRole.html
        - title: "Terraform AWS provider: aws_iam_role_policy"
          url: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/iam_role_policy
        - title: "Terraform AWS provider: aws_cloudwatch_log_group"
          url: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/cloudwatch_log_group
