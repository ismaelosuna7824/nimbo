description: Marks which docker challenges are solvable without code and rewrites their hints as UI steps
operations:
- op: upsert
  kind: challenge
  id: docker-first-web-service
  data:
    provider: docker
    level: beginner
    title: Your first web service
    summary: Serve a static site from a pinned image, publish its port, and let Docker know when it is healthy and restart it when it crashes.
    minutes: 15
    tags: [compose, dockerfile, nginx, healthcheck, restart]
    runtime: local
    problem: |
      Your team's landing page is a single `index.html`. A teammate wrapped it in a
      Dockerfile and a `compose.yaml`, but nothing works the way it should:

      - the image is built `FROM nginx` with no tag, so every rebuild may pull a
        different NGINX version;
      - the container's port 80 is never published, so nobody can open the page
        from the host;
      - Docker only knows that the process is running, not whether it actually
        answers HTTP requests;
      - when the container stops (a crash, or Docker restarting), it stays down.

      Turn it into a small, well-behaved web service.
    requirements:
    - The Dockerfile's `FROM` names a version tag (for example `nginx:1.27-alpine`), not `latest` or no tag.
    - The `web` service publishes container port 80 on a host port, so `GET /` answers 200 from the host.
    - The service has a healthcheck (a compose `healthcheck:` or a Dockerfile `HEALTHCHECK`) that fails when NGINX can't serve.
    - The service has a restart policy such as `unless-stopped`.
    hints:
    - 'Image tags can change: `nginx` alone means `nginx:latest`. Click the `web` service and find **Base image (FROM)** in its **Container** section. It rewrites the FROM line of `site/Dockerfile`.'
    - Pin a major-minor tag from the official image, such as `nginx:1.27-alpine`. Then, in **Ports**, use **Publish a port** with host port `8080` and container port `80`.
    - In **Health check**, click **Add a health check** and set **Test** to `wget -qO- http://127.0.0.1/ >/dev/null || exit 1` (the Alpine image ships BusyBox wget; `127.0.0.1` avoids IPv6 surprises). Finally pick **Unless stopped** under **Restart**.
    solution: |
      **Why.** Docker's building best practices recommend pinning base image
      versions (tags are mutable) and choosing a minimal official base. Compose
      only publishes the ports you list in `ports:`. A healthcheck lets Docker
      (and Compose `depends_on`) tell a running container from one that can
      serve, and a restart policy brings a stopped container back.

      **Steps.**
      1. In `site/Dockerfile`, change `FROM nginx` to `FROM nginx:1.27-alpine`.
      2. In `compose.yaml`, publish the port with `ports: ["8080:80"]`.
      3. Add a healthcheck that requests the page:
         `test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]`
         with `interval: 10s`, `timeout: 3s`, `retries: 3` and `start_period: 5s`
         (keep the timeout below the interval).
      4. Add `restart: unless-stopped`.
      5. Deploy and open `http://localhost:8080/`; the Deploy tab shows the
         service as healthy once the first check passes.

      **Without writing code in Nimbo**

      1. Click the `web` service. In **Container**, set **Base image (FROM)** to `nginx:1.27-alpine`. The service keeps building from `./site`.
      2. In **Ports**, click **Publish a port**: **Host port** `8080`, **Container port** `80`.
      3. In **Health check**, click **Add a health check**. Set **Test** to `wget -qO- http://127.0.0.1/ >/dev/null || exit 1`, **Interval** `10s`, **Timeout** `3s`, **Retries** `3`, **Start period** `5s`.
      4. In **Restart & resources**, set **Restart** to **Unless stopped**.
      5. Deploy and open `http://localhost:8080/`.
    solutionFiles:
      compose.yaml: |
        # A static site served by NGINX: pinned image, published port,
        # healthcheck and restart policy.
        services:
          web:
            build: ./site
            ports:
              - "8080:80"
            restart: unless-stopped
            healthcheck:
              test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
              interval: 10s
              timeout: 3s
              retries: 3
              start_period: 5s
      site/Dockerfile: |
        # Pinned official image (Alpine variant: small, ships BusyBox wget).
        FROM nginx:1.27-alpine
        COPY index.html /usr/share/nginx/html/index.html
        EXPOSE 80
    starter:
      kind: docker
      files:
        compose.yaml: |
          services:
            web:
              build: ./site
        site/Dockerfile: |
          FROM nginx
          COPY index.html /usr/share/nginx/html/index.html
        site/.dockerignore: |
          Dockerfile
          .dockerignore
        site/index.html: |
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>Nimbo Learn</title>
            </head>
            <body>
              <h1>Hello from Docker</h1>
              <p>This page is served by NGINX running in a container.</p>
            </body>
          </html>
    checks:
    - id: valid
      label: The compose project is valid
      type: validate
    - id: pinned
      label: The base image is pinned to a version tag
      type: rules_clean
      rules_clean: {codes: [dk_latest_tag], minSeverity: info}
    - id: healthcheck
      label: The web service has a healthcheck
      type: rules_clean
      rules_clean: {codes: [dk_missing_healthcheck, dk_healthcheck_timing], minSeverity: info}
    - id: restart
      label: The web service has a restart policy
      type: rules_clean
      rules_clean: {codes: [dk_no_restart], minSeverity: info}
    - id: deploy
      label: The project deploys
      type: deploy
    - id: page
      label: The page answers 200 from the host
      type: http
      http: {service: web, port: 80, path: /, status: 200, contains: Hello from Docker}
    sources:
    - {title: 'Docker Docs: Building best practices (pin base image versions, choose the right base image)', url: 'https://docs.docker.com/build/building/best-practices/'}
    - {title: 'Docker Docs: Compose file reference, services (ports, healthcheck, restart)', url: 'https://docs.docker.com/reference/compose-file/services/'}
    - {title: 'Docker Docs: Dockerfile reference (FROM, EXPOSE, HEALTHCHECK)', url: 'https://docs.docker.com/reference/dockerfile/'}
    - {title: 'Docker Docs: Start containers automatically (restart policies)', url: 'https://docs.docker.com/engine/containers/start-containers-automatically/'}
    solvableWithoutCode: true
- op: upsert
  kind: challenge
  id: docker-cache-friendly-dockerfile
  data:
    provider: docker
    level: beginner
    title: A Dockerfile that builds fast and stops cleanly
    summary: Reorder a Node.js Dockerfile so dependency installs are cached, run it on a pinned slim base, and start the app in exec form so it receives SIGTERM.
    minutes: 20
    tags: [dockerfile, build-cache, node, exec-form, dockerignore]
    prerequisites: [docker-first-web-service]
    runtime: local
    problem: |
      Every small change to the catalog API's source rebuilds its image from
      scratch, and `docker compose down` always takes ten seconds before the
      container goes away. The Dockerfile looks innocent:

      ```dockerfile
      FROM node
      WORKDIR /app
      COPY . .
      RUN npm install --omit=dev
      CMD npm start
      ```

      Fix the image so that editing `server.js` reuses the cached dependency
      layer, the image is based on a pinned slim Node.js image, and the app
      shuts down as soon as Docker asks it to.
    requirements:
    - The final image is based on a pinned, slim Node.js tag (for example `node:22-alpine`), not `node` / `node:latest`.
    - '`package.json` is copied and dependencies are installed **before** the application sources are copied.'
    - '`CMD` uses the exec (JSON array) form and runs `node` directly.'
    - A `.dockerignore` keeps `node_modules`, logs and env files out of the build context.
    - The service still builds and `GET /health` answers 200.
    hints:
    - Docker rebuilds a layer when anything copied before it changed. If `COPY . .` comes first, every source edit invalidates `npm install`.
    - 'Copy only the manifest first: `COPY package.json ./`, then `RUN npm install --omit=dev`, then `COPY server.js ./` (or `COPY . .`).'
    - '`CMD npm start` is the shell form: `/bin/sh -c` becomes PID 1 and doesn''t forward SIGTERM, and `npm` doesn''t either. Use `CMD ["node", "server.js"]`.'
    - '`node` without a tag is the full Debian-based image. The `-alpine` (or `-slim`) variants carry far fewer packages.'
    solution: |
      **Why.** Docker's cache guide explains that a changed layer invalidates
      every layer after it, so dependency manifests should be copied and
      installed before the frequently changing sources. The building best
      practices recommend a minimal, pinned base image and a `.dockerignore`
      so the build context only holds what the image needs. The Dockerfile
      reference recommends the exec form for `CMD`/`ENTRYPOINT`: with the shell
      form the app runs under `/bin/sh -c` and does not receive signals, so
      `docker stop` waits for the grace period and kills it.

      **Steps.**
      1. `FROM node:22-alpine` and `ENV NODE_ENV=production`.
      2. `COPY package.json ./` then `RUN npm install --omit=dev --no-audit --no-fund`.
      3. `COPY server.js ./` after the install.
      4. Run as the image's unprivileged `node` user (`USER node`) and `EXPOSE 3000`.
      5. `CMD ["node", "server.js"]`; the app already closes its server on SIGTERM.
      6. Add `api/.dockerignore` with `node_modules`, `npm-debug.log*`, `.env*`, `.git`.
      7. Optionally add a `HEALTHCHECK` (BusyBox `wget` is available on Alpine).

      Rebuild after editing `server.js`: the `npm install` step now shows `CACHED`.

      **Without writing code in Nimbo**

      The **Base image (FROM)** field in the `api` service form can pin `node:22-alpine`. Moving `COPY package.json` and `npm install` before `COPY . .`, writing `CMD` in exec form, and adding `.dockerignore` all mean editing files in the code editor: the canvas has no Dockerfile editor.
    solutionFiles:
      api/Dockerfile: |
        # Dependencies first (cached until package.json changes), then the code.
        FROM node:22-alpine
        ENV NODE_ENV=production
        WORKDIR /app
        COPY package.json ./
        RUN npm install --omit=dev --no-audit --no-fund
        COPY server.js ./
        USER node
        EXPOSE 3000
        HEALTHCHECK --interval=10s --timeout=3s --start-period=5s --retries=3 \
          CMD wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1
        # Exec form: node is PID 1's direct command and receives SIGTERM.
        CMD ["node", "server.js"]
      api/.dockerignore: |
        node_modules
        npm-debug.log*
        .env*
        .git
        Dockerfile
        .dockerignore
    starter:
      kind: docker
      files:
        compose.yaml: |
          services:
            api:
              build: ./api
              init: true
              ports:
                - "3000:3000"
              restart: unless-stopped
        api/Dockerfile: |
          FROM node
          WORKDIR /app
          COPY . .
          RUN npm install --omit=dev
          EXPOSE 3000
          CMD npm start
        api/package.json: |
          {
            "name": "catalog-api",
            "version": "1.0.0",
            "private": true,
            "main": "server.js",
            "scripts": {
              "start": "node server.js"
            }
          }
        api/server.js: |
          const http = require("node:http");

          const port = Number(process.env.PORT ?? 3000);

          function send(res, status, body) {
            res.writeHead(status, { "Content-Type": "application/json" });
            res.end(JSON.stringify(body));
          }

          const server = http.createServer((req, res) => {
            const path = new URL(req.url, "http://localhost").pathname;
            if (path === "/health") return send(res, 200, { status: "ok" });
            if (path === "/") return send(res, 200, { message: "Hello from the catalog API" });
            send(res, 404, { error: "not found" });
          });

          server.listen(port, () => console.log(`listening on :${port}`));

          // Stop accepting connections and exit when Docker asks us to stop.
          process.on("SIGTERM", () => server.close(() => process.exit(0)));
    checks:
    - id: valid
      label: The compose project is valid
      type: validate
    - id: base
      label: The image runs on a pinned, slim Node.js base
      type: rules_clean
      rules_clean: {codes: [dk_latest_tag, dk_heavy_base], minSeverity: info}
    - id: layers
      label: Dependencies install before the sources are copied
      type: rules_clean
      rules_clean: {codes: [dk_layer_order], minSeverity: warning}
    - id: exec-form
      label: CMD uses the exec form
      type: rules_clean
      rules_clean: {codes: [dk_shell_form], minSeverity: warning}
    - id: deploy
      label: The project deploys
      type: deploy
    - id: health
      label: GET /health answers 200
      type: http
      http: {service: api, port: 3000, path: /health, status: 200}
    sources:
    - {title: 'Docker Docs: Optimize cache usage in builds (order your layers)', url: 'https://docs.docker.com/build/cache/optimize/'}
    - {title: 'Docker Docs: Building best practices', url: 'https://docs.docker.com/build/building/best-practices/'}
    - {title: 'Docker Docs: Dockerfile reference (shell and exec form)', url: 'https://docs.docker.com/reference/dockerfile/'}
    - {title: 'Docker Docs: Build context and .dockerignore files', url: 'https://docs.docker.com/build/concepts/context/'}
    solvableWithoutCode: false
- op: upsert
  kind: challenge
  id: docker-app-with-postgres
  data:
    provider: docker
    level: beginner
    title: An API and its PostgreSQL database
    summary: Keep PostgreSQL data in a named volume, start the API only once the database is healthy, and stop exposing the database to your whole network.
    minutes: 25
    tags: [compose, postgres, volumes, depends_on, healthcheck, startup-order]
    prerequisites: [docker-first-web-service]
    runtime: local
    problem: |
      The visits API counts every request in PostgreSQL. It works on a good day,
      but:

      - after `docker compose down` and `up` the counter is back to zero:
        PostgreSQL writes to an anonymous volume nobody reuses;
      - on a cold start the API boots before PostgreSQL accepts connections and
        its first requests fail;
      - the database is published as `5432:5432`, so anyone on the same Wi-Fi
        can try the password.

      Make the stack start in the right order, keep its data, and keep the
      database private to the project.
    requirements:
    - PostgreSQL stores `/var/lib/postgresql/data` in a **named** volume declared under the top-level `volumes:`.
    - The `db` service has a healthcheck that succeeds only when PostgreSQL accepts connections.
    - 'The `api` service waits for `db` with `depends_on: {db: {condition: service_healthy}}`.'
    - The database is not published on every network interface (drop `ports:`, or bind it to `127.0.0.1`).
    - The stack deploys and `GET /health` on the API answers 200.
    hints:
    - The postgres image keeps its data in `/var/lib/postgresql/data`. If you mount nothing there, Docker creates an anonymous volume with a random name. Add a **Volume** from the palette and give it a clear name such as `pgdata`.
    - 'Mount it in the `db` service''s **Volumes** section (type **volume**, source `pgdata`, path `/var/lib/postgresql/data`). Then click **Add a health check** and use a **Test** that succeeds only when PostgreSQL accepts connections: the image ships `pg_isready`.'
    - 'Set the test to `pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}`. In `api`, under **Depends on**, make it wait for `db` **until healthy**. Remove the `db` row from **Ports**: other services reach it as `db:5432` without a published port.'
    solution: |
      **Why.** Docker's volume docs explain that named volumes persist
      independently of containers and are reused by name, while anonymous
      volumes get random names. Compose's startup-order guide notes that
      Compose waits for a dependency to be *running*, not *ready*, unless you
      use `condition: service_healthy` with a healthcheck. Compose networking
      gives every service a DNS name on the project network, so a database
      doesn't need a published port for the API to reach it.

      **Steps.**
      1. Mount `pgdata:/var/lib/postgresql/data` on `db` and declare `pgdata:` under `volumes:`.
      2. Add a `pg_isready` healthcheck to `db` (interval 5s, timeout 5s, retries 10).
      3. Change the API's `depends_on` to the long form with `condition: service_healthy`.
      4. Remove `ports:` from `db` (use `"127.0.0.1:5432:5432"` only if you need a local SQL client).
      5. Deploy, call `/` a few times, redeploy: the visit counter keeps counting.

      **Without writing code in Nimbo**

      1. From the palette (Networking & storage), add a **Volume**. In its inspector, rename it to `pgdata`.
      2. Click the `db` service. In **Volumes**, add a **Mount**: type **volume**, **Source** `pgdata`, **Path in the container** `/var/lib/postgresql/data`.
      3. In **Health check**, click **Add a health check**. Set **Test** to `pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}`, **Interval** `5s`, **Timeout** `5s`, **Retries** `10`. Compose fills in the user and database from `.env`.
      4. In **Ports**, remove the `db` row.
      5. Click the `api` service. In **Depends on**, set the `db` row to **until healthy** (**Add dependency** if it's missing).
      6. Deploy: `GET /health` on the API answers 200.
    solutionFiles:
      compose.yaml: |
        # The API reaches PostgreSQL as db:5432 on the project network; only
        # the API is published. The database keeps its data in a named volume
        # and the API starts once the database is healthy.
        services:
          api:
            build: ./api
            init: true
            ports:
              - "3000:3000"
            environment:
              DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
            depends_on:
              db:
                condition: service_healthy
            restart: unless-stopped

          db:
            image: postgres:16-alpine
            environment:
              POSTGRES_USER: ${POSTGRES_USER}
              POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
              POSTGRES_DB: ${POSTGRES_DB}
            volumes:
              - pgdata:/var/lib/postgresql/data
            healthcheck:
              test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
              interval: 5s
              timeout: 5s
              retries: 10
            restart: unless-stopped

        volumes:
          pgdata:
    starter:
      kind: docker
      files:
        compose.yaml: |
          services:
            api:
              build: ./api
              init: true
              ports:
                - "3000:3000"
              environment:
                DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
              depends_on:
                - db
              restart: unless-stopped

            db:
              image: postgres:16-alpine
              ports:
                - "5432:5432"
              environment:
                POSTGRES_USER: ${POSTGRES_USER}
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                POSTGRES_DB: ${POSTGRES_DB}
              restart: unless-stopped
        .env: |
          # Local development credentials only: keep real ones out of git.
          POSTGRES_USER=visits
          POSTGRES_PASSWORD=local-dev-only
          POSTGRES_DB=visits
        api/Dockerfile: |
          # Dependencies first (cached until package.json changes), then the code.
          FROM node:22-alpine
          ENV NODE_ENV=production
          WORKDIR /app
          COPY package.json ./
          RUN npm install --omit=dev --no-audit --no-fund
          COPY server.js ./
          USER node
          EXPOSE 3000
          HEALTHCHECK --interval=10s --timeout=3s --start-period=5s --retries=3 \
            CMD wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1
          CMD ["node", "server.js"]
        api/.dockerignore: |
          node_modules
          npm-debug.log*
          .env*
          Dockerfile
          .dockerignore
        api/package.json: |
          {
            "name": "visits-api",
            "version": "1.0.0",
            "private": true,
            "main": "server.js",
            "dependencies": {
              "pg": "8.13.1"
            }
          }
        api/server.js: |
          const http = require("node:http");
          const { Pool } = require("pg");

          const port = Number(process.env.PORT ?? 3000);
          const pool = new Pool({ connectionString: process.env.DATABASE_URL, max: 5 });
          // An idle client losing its connection must not crash the process.
          pool.on("error", (err) => console.error("postgres:", err.message));

          // Create the table once; retried on the next request if it failed.
          let schema;
          function ensureSchema() {
            schema ??= pool
              .query("CREATE TABLE IF NOT EXISTS visits (id serial PRIMARY KEY, at timestamptz NOT NULL DEFAULT now())")
              .catch((err) => {
                schema = undefined;
                throw err;
              });
            return schema;
          }

          function send(res, status, body) {
            res.writeHead(status, { "Content-Type": "application/json" });
            res.end(JSON.stringify(body));
          }

          const server = http.createServer(async (req, res) => {
            const path = new URL(req.url, "http://localhost").pathname;
            try {
              if (path === "/health") {
                await pool.query("SELECT 1");
                return send(res, 200, { status: "ok" });
              }
              if (path === "/") {
                await ensureSchema();
                await pool.query("INSERT INTO visits DEFAULT VALUES");
                const { rows } = await pool.query("SELECT count(*)::int AS total FROM visits");
                return send(res, 200, { visits: rows[0].total });
              }
              send(res, 404, { error: "not found" });
            } catch (err) {
              console.error(err.message);
              send(res, 503, { error: "database unavailable" });
            }
          });

          server.listen(port, () => console.log(`listening on :${port}`));

          process.on("SIGTERM", () => server.close(() => pool.end().then(() => process.exit(0))));
    checks:
    - id: valid
      label: The compose project is valid
      type: validate
    - id: named-volume
      label: PostgreSQL keeps its data in a named volume
      type: rules_clean
      rules_clean: {codes: [dk_anon_volume], minSeverity: warning}
    - id: db-healthcheck
      label: The database has a healthcheck
      type: has
      has:
        compose:
          service: db
          where: {healthcheck.test: {exists: true}}
    - id: healthy-order
      label: The API waits until the database is healthy
      type: has
      has:
        compose:
          service: api
          where: {depends_on.db.condition: service_healthy}
    - id: private-db
      label: The database is not published on every interface
      type: rules_clean
      rules_clean: {codes: [dk_db_published], minSeverity: warning}
    - id: deploy
      label: The stack deploys
      type: deploy
    - id: health
      label: The API reaches the database (GET /health answers 200)
      type: http
      http: {service: api, port: 3000, path: /health, status: 200}
    sources:
    - {title: 'Docker Docs: Control startup and shutdown order in Compose', url: 'https://docs.docker.com/compose/how-tos/startup-order/'}
    - {title: 'Docker Docs: Volumes', url: 'https://docs.docker.com/engine/storage/volumes/'}
    - {title: 'Docker Docs: Compose file reference, volumes top-level element', url: 'https://docs.docker.com/reference/compose-file/volumes/'}
    - {title: 'Docker Docs: Networking in Compose', url: 'https://docs.docker.com/compose/how-tos/networking/'}
    - {title: 'Docker Docs: Compose file reference, services (depends_on, healthcheck, ports)', url: 'https://docs.docker.com/reference/compose-file/services/'}
    solvableWithoutCode: true
- op: upsert
  kind: challenge
  id: docker-multi-stage-nonroot
  data:
    provider: docker
    level: intermediate
    title: A small, non-root image with a multi-stage build
    summary: Build a Go service in a build stage and ship only the static binary on a minimal runtime image that runs as a non-root user.
    minutes: 30
    tags: [dockerfile, multi-stage, go, distroless, non-root, image-size]
    prerequisites: [docker-cache-friendly-dockerfile]
    runtime: local
    problem: |
      The inventory service is a single Go binary, yet its image weighs several
      hundred megabytes: it is built and run in the same `golang` stage, so the
      container ships the Go toolchain, the module cache and the sources, and the
      process runs as `root`.

      Security asked for two things before the service can go anywhere near
      production: the runtime image must contain only what the binary needs, and
      the process must not run as root.
    requirements:
    - The Dockerfile has a build stage (on a pinned `golang` image) that compiles a static binary (`CGO_ENABLED=0`).
    - The final stage is a minimal runtime image (for example `gcr.io/distroless/static-debian12`, or a pinned `alpine`) that only receives the binary with `COPY --from=`.
    - The final stage runs as a non-root user (`USER`).
    - The service still deploys and `GET /health` answers 200.
    hints:
    - Each `FROM` starts a new stage. Name the first one (`FROM golang:1.23-alpine AS build`) and copy its output into the next with `COPY --from=build /out/app /app`.
    - A binary built with `CGO_ENABLED=0` has no libc dependency, so it runs on an image with no shell or package manager.
    - '`gcr.io/distroless/static-debian12:nonroot` already defines a `nonroot` user (uid 65532); add `USER nonroot:nonroot` so the intent is explicit in your Dockerfile. On Alpine, create one with `adduser -D -u 10001 app`.'
    - 'Distroless has no `wget` or shell for a healthcheck. The service supports `-healthcheck`: `HEALTHCHECK CMD ["/app", "-healthcheck"]` (exec form, no shell needed).'
    solution: |
      **Why.** Docker's multi-stage build guide shows how to compile in one
      stage and copy only the artifacts into a clean final stage, so the image
      carries no compilers, caches or sources. The building best practices
      recommend a minimal base image to reduce size and attack surface, and
      switching to a non-root `USER` when the service doesn't need privileges.
      The Docker security docs explain why: root in a container is still root
      over everything mounted into it.

      **Steps.**
      1. Build stage: `FROM golang:1.23-alpine AS build`, `WORKDIR /src`,
         `COPY go.mod ./` then `RUN go mod download` (a cacheable layer),
         `COPY . .`, then
         `RUN CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /out/app .`
      2. Runtime stage: `FROM gcr.io/distroless/static-debian12:nonroot`,
         `COPY --from=build /out/app /app`, `USER nonroot:nonroot`, `EXPOSE 8080`.
      3. `HEALTHCHECK --interval=10s --timeout=3s --start-period=5s --retries=3 CMD ["/app", "-healthcheck"]`
      4. `ENTRYPOINT ["/app"]`
      5. Rebuild and compare `docker image ls`: the image shrinks from hundreds
         of MB to a few MB.

      **Without writing code in Nimbo**

      The **Base image (FROM)** field only rewrites an existing FROM line, and the **Run as non-root** switch in **Hardening** writes compose `user:`, not a Dockerfile `USER`. The second stage (`COPY --from=build` into a minimal image) and `USER` must be written in `inventory/Dockerfile` in the code editor.
    solutionFiles:
      inventory/Dockerfile: |
        # Build a static binary in the build stage...
        FROM golang:1.23-alpine AS build
        WORKDIR /src
        COPY go.mod ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /out/app .

        # ...and run it alone on distroless as a non-root user
        # (no shell, no package manager: a few MB).
        FROM gcr.io/distroless/static-debian12:nonroot
        COPY --from=build /out/app /app
        USER nonroot:nonroot
        EXPOSE 8080
        HEALTHCHECK --interval=10s --timeout=3s --start-period=5s --retries=3 CMD ["/app", "-healthcheck"]
        ENTRYPOINT ["/app"]
    starter:
      kind: docker
      files:
        compose.yaml: |
          services:
            inventory:
              build: ./inventory
              ports:
                - "8080:8080"
              restart: unless-stopped
        inventory/Dockerfile: |
          FROM golang:1.23-alpine
          WORKDIR /src
          COPY . .
          RUN go build -o /usr/local/bin/inventory .
          EXPOSE 8080
          HEALTHCHECK --interval=10s --timeout=3s --start-period=5s --retries=3 CMD ["inventory", "-healthcheck"]
          CMD ["inventory"]
        inventory/.dockerignore: |
          .git
          Dockerfile
          .dockerignore
        inventory/go.mod: |
          module example.com/inventory

          go 1.23
        inventory/main.go: |
          // Command inventory serves a small product inventory over HTTP.
          package main

          import (
          	"context"
          	"encoding/json"
          	"flag"
          	"log"
          	"net/http"
          	"os"
          	"os/signal"
          	"syscall"
          	"time"
          )

          var items = []map[string]any{
          	{"sku": "NB-001", "name": "Notebook", "stock": 42},
          	{"sku": "PN-002", "name": "Pen", "stock": 310},
          }

          func main() {
          	// The runtime image may have no shell or wget: the binary probes itself.
          	healthcheck := flag.Bool("healthcheck", false, "probe the running server and exit")
          	flag.Parse()
          	if *healthcheck {
          		client := http.Client{Timeout: 3 * time.Second}
          		resp, err := client.Get("http://127.0.0.1:8080/health")
          		if err != nil || resp.StatusCode != http.StatusOK {
          			os.Exit(1)
          		}
          		return
          	}

          	mux := http.NewServeMux()
          	mux.HandleFunc("GET /health", func(w http.ResponseWriter, r *http.Request) {
          		writeJSON(w, map[string]string{"status": "ok"})
          	})
          	mux.HandleFunc("GET /items", func(w http.ResponseWriter, r *http.Request) {
          		writeJSON(w, items)
          	})
          	srv := &http.Server{Addr: ":8080", Handler: mux, ReadHeaderTimeout: 5 * time.Second}

          	ctx, stop := signal.NotifyContext(context.Background(), syscall.SIGTERM, os.Interrupt)
          	defer stop()
          	go func() {
          		<-ctx.Done()
          		shutdown, cancel := context.WithTimeout(context.Background(), 5*time.Second)
          		defer cancel()
          		_ = srv.Shutdown(shutdown)
          	}()
          	log.Println("listening on :8080")
          	if err := srv.ListenAndServe(); err != nil && err != http.ErrServerClosed {
          		log.Fatal(err)
          	}
          }

          func writeJSON(w http.ResponseWriter, v any) {
          	w.Header().Set("Content-Type", "application/json")
          	_ = json.NewEncoder(w).Encode(v)
          }
    checks:
    - id: valid
      label: The compose project is valid
      type: validate
    - id: multi-stage
      label: The Go toolchain stays in a build stage
      type: rules_clean
      rules_clean: {codes: [dk_single_stage], minSeverity: info}
    - id: slim-runtime
      label: The final stage runs on a minimal image
      type: rules_clean
      rules_clean: {codes: [dk_heavy_base, dk_latest_tag], minSeverity: info}
    - id: non-root
      label: The container runs as a non-root user
      type: rules_clean
      rules_clean: {codes: [dk_root_user], minSeverity: info}
    - id: deploy
      label: The service deploys
      type: deploy
    - id: health
      label: GET /health answers 200
      type: http
      http: {service: inventory, port: 8080, path: /health, status: 200}
    sources:
    - {title: 'Docker Docs: Multi-stage builds', url: 'https://docs.docker.com/build/building/multi-stage/'}
    - {title: 'Docker Docs: Multi-stage builds (Docker concepts)', url: 'https://docs.docker.com/get-started/docker-concepts/building-images/multi-stage-builds/'}
    - {title: 'Docker Docs: Building best practices (choose the right base image, USER)', url: 'https://docs.docker.com/build/building/best-practices/'}
    - {title: 'Docker Docs: Docker Engine security', url: 'https://docs.docker.com/engine/security/'}
    - {title: 'Docker Docs: Dockerfile reference (HEALTHCHECK, USER, COPY --from)', url: 'https://docs.docker.com/reference/dockerfile/'}
    solvableWithoutCode: false
- op: upsert
  kind: challenge
  id: docker-secrets-as-files
  data:
    provider: docker
    level: intermediate
    title: Database passwords as secrets, not environment variables
    summary: Move a password out of environment variables into a Compose secret mounted as a file, for both PostgreSQL and the API.
    minutes: 25
    tags: [compose, secrets, postgres, security]
    prerequisites: [docker-app-with-postgres]
    runtime: local
    problem: |
      The orders API and its PostgreSQL database share a password that is
      written right into `compose.yaml`, in the `environment:` of both services.
      It is in the repository history, `docker inspect` prints it, and any
      process in the containers can read it from the environment.

      Docker Compose can hand the password to exactly the services that need it
      as a file under `/run/secrets/`. The official postgres image reads
      `POSTGRES_PASSWORD_FILE`, and the API already reads `PGPASSWORD_FILE` when
      it is set (see `api/server.js`).
    requirements:
    - A top-level `secrets:` entry provides the database password from a file (for example `./secrets/db_password.txt`).
    - '`db` and `api` are both granted the secret with a service-level `secrets:` list.'
    - '`db` uses `POSTGRES_PASSWORD_FILE` and no longer sets `POSTGRES_PASSWORD`.'
    - '`api` uses `PGPASSWORD_FILE` and no longer sets `PGPASSWORD`.'
    - No password is written literally in the compose file, and the stack still deploys with `GET /health` answering 200.
    hints:
    - Compose can mount a secret as a file at `/run/secrets/<name>`, so the password doesn't sit in the environment. Look at the `db` service's **Hardening** section, under **Secrets as files**.
    - 'On `db`, move `POSTGRES_PASSWORD` to a secret file named `db_password`, and tick **Set POSTGRES_PASSWORD_FILE**: the postgres image reads that variable (Docker Official Images follow this `_FILE` convention).'
    - 'On `api`, move `PGPASSWORD` to the same secret (type `db_password` to reuse it) and tick **Set PGPASSWORD_FILE**: this app reads it. Keep `secrets/` out of git.'
    solution: |
      **Why.** Docker's Compose secrets guide explains that environment
      variables are visible to every process in the container, are hard to
      track and can leak into logs, while secrets are mounted as files in
      `/run/secrets/<name>` and only for the services that are explicitly
      granted them. The postgres Official Image supports `*_FILE` variables for
      exactly this.

      **Steps.**
      1. Create `secrets/db_password.txt` with the password (no trailing secrets
         in git: ignore the folder).
      2. Declare it: `secrets: {db_password: {file: ./secrets/db_password.txt}}`.
      3. `db`: replace `POSTGRES_PASSWORD` with
         `POSTGRES_PASSWORD_FILE: /run/secrets/db_password` and add `secrets: [db_password]`.
      4. `api`: replace `PGPASSWORD` with `PGPASSWORD_FILE: /run/secrets/db_password`
         and add `secrets: [db_password]`.
      5. PostgreSQL only reads the password when it initializes an empty data
         directory: if you deployed the starter before, redeploy with volumes
         removed so the database is created with the secret.

      **Without writing code in Nimbo**

      1. Click the `db` service. In **Hardening** → **Secrets as files**, find the `POSTGRES_PASSWORD` row. Name the secret `db_password`, keep **Set POSTGRES_PASSWORD_FILE=/run/secrets/db_password** ticked, and click **Move to a secret file**. Nimbo writes the value to `./secrets/db_password.txt`, declares the secret, grants it to `db` and removes the variable.
      2. Click the `api` service. In the `PGPASSWORD` row, type `db_password` to reuse the declared secret, tick **Set PGPASSWORD_FILE=/run/secrets/db_password**, and click **Move to a secret file**.
      3. Add `secrets/` to `.gitignore`, then deploy: `GET /health` answers 200. If the database volume was created with another password, recreate it.
    solutionFiles:
      compose.yaml: |
        # The password reaches db and api as /run/secrets/db_password, only
        # in the containers granted the secret.
        services:
          api:
            build: ./api
            init: true
            ports:
              - "3000:3000"
            environment:
              PGHOST: db
              PGUSER: orders
              PGDATABASE: orders
              PGPASSWORD_FILE: /run/secrets/db_password
            secrets:
              - db_password
            depends_on:
              db:
                condition: service_healthy
            restart: unless-stopped

          db:
            image: postgres:16-alpine
            environment:
              POSTGRES_USER: orders
              POSTGRES_DB: orders
              POSTGRES_PASSWORD_FILE: /run/secrets/db_password
            secrets:
              - db_password
            volumes:
              - pgdata:/var/lib/postgresql/data
            healthcheck:
              test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
              interval: 5s
              timeout: 5s
              retries: 10
            restart: unless-stopped

        secrets:
          db_password:
            file: ./secrets/db_password.txt

        volumes:
          pgdata:
      secrets/db_password.txt: |
        local-dev-only-change-me
      .gitignore: |
        secrets/
    starter:
      kind: docker
      files:
        compose.yaml: |
          services:
            api:
              build: ./api
              init: true
              ports:
                - "3000:3000"
              environment:
                PGHOST: db
                PGUSER: orders
                PGDATABASE: orders
                PGPASSWORD: "s3cr3t-orders-pw"
              depends_on:
                db:
                  condition: service_healthy
              restart: unless-stopped

            db:
              image: postgres:16-alpine
              environment:
                POSTGRES_USER: orders
                POSTGRES_DB: orders
                POSTGRES_PASSWORD: "s3cr3t-orders-pw"
              volumes:
                - pgdata:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
                interval: 5s
                timeout: 5s
                retries: 10
              restart: unless-stopped

          volumes:
            pgdata:
        api/Dockerfile: |
          FROM node:22-alpine
          ENV NODE_ENV=production
          WORKDIR /app
          COPY package.json ./
          RUN npm install --omit=dev --no-audit --no-fund
          COPY server.js ./
          USER node
          EXPOSE 3000
          HEALTHCHECK --interval=10s --timeout=3s --start-period=5s --retries=3 \
            CMD wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1
          CMD ["node", "server.js"]
        api/.dockerignore: |
          node_modules
          npm-debug.log*
          .env*
          Dockerfile
          .dockerignore
        api/package.json: |
          {
            "name": "orders-api",
            "version": "1.0.0",
            "private": true,
            "main": "server.js",
            "dependencies": {
              "pg": "8.13.1"
            }
          }
        api/server.js: |
          const fs = require("node:fs");
          const http = require("node:http");
          const { Pool } = require("pg");

          const port = Number(process.env.PORT ?? 3000);

          // PGHOST, PGUSER, PGDATABASE and PGPASSWORD come from the environment
          // (node-postgres reads them). When PGPASSWORD_FILE is set, the password
          // is read from that file instead (a Compose secret in /run/secrets/).
          const passwordFile = process.env.PGPASSWORD_FILE;
          const password = passwordFile ? fs.readFileSync(passwordFile, "utf8").trim() : undefined;

          const pool = new Pool({ password, max: 5 });
          pool.on("error", (err) => console.error("postgres:", err.message));

          function send(res, status, body) {
            res.writeHead(status, { "Content-Type": "application/json" });
            res.end(JSON.stringify(body));
          }

          const server = http.createServer(async (req, res) => {
            const path = new URL(req.url, "http://localhost").pathname;
            try {
              if (path === "/health") {
                await pool.query("SELECT 1");
                return send(res, 200, { status: "ok" });
              }
              if (path === "/") {
                const { rows } = await pool.query("SELECT current_user AS user, now() AS at");
                return send(res, 200, rows[0]);
              }
              send(res, 404, { error: "not found" });
            } catch (err) {
              console.error(err.message);
              send(res, 503, { error: "database unavailable" });
            }
          });

          server.listen(port, () => console.log(`listening on :${port}`));

          process.on("SIGTERM", () => server.close(() => pool.end().then(() => process.exit(0))));
    checks:
    - id: valid
      label: The compose project is valid
      type: validate
    - id: no-literal-secrets
      label: No password is written in the compose file
      type: rules_clean
      rules_clean: {codes: [dk_secret_env], minSeverity: warning}
    - id: secret-from-file
      label: A top-level secret is read from a file
      type: has
      has:
        compose:
          where: {secrets.*.file: {exists: true}}
    - id: db-secret
      label: PostgreSQL reads its password from the secret file
      type: has
      has:
        compose:
          service: db
          where:
            secrets: {exists: true}
            environment.POSTGRES_PASSWORD_FILE: {contains: /run/secrets/}
            environment.POSTGRES_PASSWORD: {exists: false}
    - id: api-secret
      label: The API reads its password from the secret file
      type: has
      has:
        compose:
          service: api
          where:
            secrets: {exists: true}
            environment.PGPASSWORD_FILE: {contains: /run/secrets/}
            environment.PGPASSWORD: {exists: false}
    - id: deploy
      label: The stack deploys
      type: deploy
    - id: health
      label: The API authenticates to the database (GET /health answers 200)
      type: http
      http: {service: api, port: 3000, path: /health, status: 200}
    sources:
    - {title: 'Docker Docs: Manage secrets securely in Docker Compose', url: 'https://docs.docker.com/compose/how-tos/use-secrets/'}
    - {title: 'Docker Docs: Compose file reference, secrets top-level element', url: 'https://docs.docker.com/reference/compose-file/secrets/'}
    - {title: 'Docker Docs: Compose file reference, services (secrets)', url: 'https://docs.docker.com/reference/compose-file/services/'}
    - {title: 'Docker Docs: Set environment variables within your container''s environment', url: 'https://docs.docker.com/compose/how-tos/environment-variables/set-environment-variables/'}
    solvableWithoutCode: true
- op: upsert
  kind: challenge
  id: docker-network-isolation
  data:
    provider: docker
    level: intermediate
    title: Front and back networks
    summary: Split a proxy, an API and a database across a public front network and an internal back network so only the proxy is reachable and the database never is.
    minutes: 30
    tags: [compose, networks, nginx, reverse-proxy, postgres, isolation]
    prerequisites: [docker-app-with-postgres]
    runtime: local
    problem: |
      The shop runs NGINX in front of an API backed by PostgreSQL. Everything is
      on Compose's single default network and every service publishes a port, so
      the API can be called without going through the proxy, the database is
      reachable from the host, and the proxy container could open connections
      straight to PostgreSQL.

      Give the stack the classic two-tier layout: only the proxy faces the
      outside world, and the database lives on a network with no external
      connectivity at all.
    requirements:
    - 'Two networks are declared: `front` and `back`; `back` is `internal: true`.'
    - '`proxy` is attached to `front` only and is the only service with published `ports:`.'
    - '`api` is attached to `front` and `back` (the proxy reaches it; it reaches the database).'
    - '`db` is attached to `back` only and publishes no port.'
    - The stack deploys and the proxy serves `/` and `/health` from the API.
    hints:
    - On one shared network, every service can reach every other. Add two **Network**s from the palette and rename them `front` and `back` in their inspector.
    - 'Tick **Internal: no access to the outside world** on `back`. Then choose each service''s networks with the checkboxes in its **Networks** section: a service that picks networks leaves the default one.'
    - '`proxy` → `front` only, `api` → `front` and `back`, `db` → `back` only. Remove the `api` and `db` rows from **Ports**: services still reach each other by name on a shared network.'
    solution: |
      **Why.** Compose's networking guide shows custom networks isolating a
      proxy from a database: services can only reach services that share a
      network, and only the app joins both. The Compose networks reference
      documents `internal: true` for an externally isolated network. Published
      ports are how traffic enters from the host, so only the entry point should
      have them.

      **Steps.**
      1. Add `networks: {front: {}, back: {internal: true}}`.
      2. `proxy`: `networks: [front]`, keep `ports: ["8080:80"]`.
      3. `api`: `networks: [front, back]`, remove `ports:`.
      4. `db`: `networks: [back]`, remove `ports:`.
      5. Deploy and call `http://localhost:8080/health`: the proxy forwards to
         `api:3000`, which queries `db:5432`.

      **Without writing code in Nimbo**

      1. From the palette (Networking & storage), add a **Network** twice. Rename them `front` and `back` in the **Network** inspector (**Name**).
      2. On `back`, tick **Internal: no access to the outside world**.
      3. In each service's **Networks** section, tick: `proxy` → `front`; `api` → `front` and `back`; `db` → `back`.
      4. In **Ports**, remove every row of `api` and of `db`. `proxy` stays the only published service.
      5. Deploy: the proxy serves `/` and `/health`.
    solutionFiles:
      compose.yaml: |
        # proxy (front) -> api (front + back) -> db (back, internal).
        # Only the proxy publishes a port; db can't reach or be reached from
        # outside the back network.
        services:
          proxy:
            build: ./proxy
            ports:
              - "8080:80"
            networks: [front]
            depends_on:
              api:
                condition: service_healthy
            restart: unless-stopped

          api:
            build: ./api
            init: true
            environment:
              DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
            networks: [front, back]
            depends_on:
              db:
                condition: service_healthy
            restart: unless-stopped

          db:
            image: postgres:16-alpine
            environment:
              POSTGRES_USER: ${POSTGRES_USER}
              POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
              POSTGRES_DB: ${POSTGRES_DB}
            volumes:
              - pgdata:/var/lib/postgresql/data
            networks: [back]
            healthcheck:
              test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
              interval: 5s
              timeout: 5s
              retries: 10
            restart: unless-stopped

        networks:
          front: {}
          back:
            internal: true

        volumes:
          pgdata:
    starter:
      kind: docker
      files:
        compose.yaml: |
          services:
            proxy:
              build: ./proxy
              ports:
                - "8080:80"
              depends_on:
                api:
                  condition: service_healthy
              restart: unless-stopped

            api:
              build: ./api
              init: true
              ports:
                - "3000:3000"
              environment:
                DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
              depends_on:
                db:
                  condition: service_healthy
              restart: unless-stopped

            db:
              image: postgres:16-alpine
              ports:
                - "127.0.0.1:5432:5432"
              environment:
                POSTGRES_USER: ${POSTGRES_USER}
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                POSTGRES_DB: ${POSTGRES_DB}
              volumes:
                - pgdata:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
                interval: 5s
                timeout: 5s
                retries: 10
              restart: unless-stopped

          volumes:
            pgdata:
        .env: |
          # Local development credentials only: keep real ones out of git.
          POSTGRES_USER=shop
          POSTGRES_PASSWORD=local-dev-only
          POSTGRES_DB=shop
        proxy/Dockerfile: |
          FROM nginx:1.27-alpine
          COPY default.conf /etc/nginx/conf.d/default.conf
          EXPOSE 80
          HEALTHCHECK --interval=10s --timeout=3s --start-period=5s --retries=3 \
            CMD wget -qO- http://127.0.0.1/health >/dev/null || exit 1
        proxy/.dockerignore: |
          Dockerfile
          .dockerignore
        proxy/default.conf: |
          # Forward everything to the API service (resolved by Compose's DNS).
          server {
            listen 80;
            location / {
              proxy_pass http://api:3000;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
          }
        api/Dockerfile: |
          FROM node:22-alpine
          ENV NODE_ENV=production
          WORKDIR /app
          COPY package.json ./
          RUN npm install --omit=dev --no-audit --no-fund
          COPY server.js ./
          USER node
          EXPOSE 3000
          HEALTHCHECK --interval=10s --timeout=3s --start-period=5s --retries=3 \
            CMD wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1
          CMD ["node", "server.js"]
        api/.dockerignore: |
          node_modules
          npm-debug.log*
          .env*
          Dockerfile
          .dockerignore
        api/package.json: |
          {
            "name": "shop-api",
            "version": "1.0.0",
            "private": true,
            "main": "server.js",
            "dependencies": {
              "pg": "8.13.1"
            }
          }
        api/server.js: |
          const http = require("node:http");
          const { Pool } = require("pg");

          const port = Number(process.env.PORT ?? 3000);
          const pool = new Pool({ connectionString: process.env.DATABASE_URL, max: 5 });
          pool.on("error", (err) => console.error("postgres:", err.message));

          function send(res, status, body) {
            res.writeHead(status, { "Content-Type": "application/json" });
            res.end(JSON.stringify(body));
          }

          const server = http.createServer(async (req, res) => {
            const path = new URL(req.url, "http://localhost").pathname;
            try {
              if (path === "/health") {
                await pool.query("SELECT 1");
                return send(res, 200, { status: "ok" });
              }
              if (path === "/") {
                const { rows } = await pool.query("SELECT version() AS postgres");
                return send(res, 200, { shop: "open", postgres: rows[0].postgres });
              }
              send(res, 404, { error: "not found" });
            } catch (err) {
              console.error(err.message);
              send(res, 503, { error: "database unavailable" });
            }
          });

          server.listen(port, () => console.log(`listening on :${port}`));

          process.on("SIGTERM", () => server.close(() => pool.end().then(() => process.exit(0))));
    checks:
    - id: valid
      label: The compose project is valid
      type: validate
    - id: internal-back
      label: The back network is internal
      type: has
      has:
        compose:
          where: {networks.back.internal: true}
    - id: front-network
      label: A front network is declared
      type: has
      has:
        compose:
          where: {networks.front: {exists: true}}
    - id: proxy-front-only
      label: The proxy is on the front network only
      type: has
      has:
        compose:
          service: proxy
          where:
            networks.front: {exists: true}
            networks.back: {exists: false}
    - id: api-both
      label: The API joins both networks
      type: has
      has:
        compose:
          service: api
          where:
            networks.front: {exists: true}
            networks.back: {exists: true}
    - id: db-back-only
      label: The database is on the back network only
      type: has
      has:
        compose:
          service: db
          where:
            networks.back: {exists: true}
            networks.front: {exists: false}
            networks.default: {exists: false}
    - id: api-not-published
      label: The API publishes no port (only the proxy is reachable)
      type: has
      has:
        compose:
          service: api
          where: {ports: {exists: false}}
    - id: db-not-published
      label: The database publishes no port
      type: has
      has:
        compose:
          service: db
          where: {ports: {exists: false}}
    - id: deploy
      label: The stack deploys
      type: deploy
    - id: through-proxy
      label: The proxy serves the API's /health
      type: http
      http: {service: proxy, port: 80, path: /health, status: 200}
    sources:
