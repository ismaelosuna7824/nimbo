- op: upsert
  kind: challenge
  id: gcp-cloud-run-least-privilege
  data:
    provider: gcp
    level: intermediate
    title: Cloud Run with a least-privilege service identity
    summary: Give a Cloud Run service its own service account, grant it one secret instead of Editor, and restrict ingress.
    minutes: 35
    tags:
    - cloud-run
    - iam
    - secret-manager
    - security
    prerequisites:
    - gcp-storage-private-bucket
    runtime: design
    problem: |-
      The `orders-api` Cloud Run service needs exactly one thing from Google Cloud: the database password stored in Secret Manager. Because it had no service account configured, it ran as the **Compute Engine default service account**, and to "make it work" the team granted that account **`roles/editor`** on the whole project.

      Now any code running in that service — or in any other workload using the default account — can modify almost every resource in the project. Fix the identity: a dedicated runtime service account, access to that single secret only, and no basic roles. The service should also only receive traffic through the load balancer, not straight from the internet.
    requirements:
    - A dedicated `google_service_account` for the service, set as `template.service_account` of `google_cloud_run_v2_service.orders`.
    - No `google_project_iam_member` grants `roles/editor` or `roles/owner`.
    - The service account gets `roles/secretmanager.secretAccessor` **on the secret** (`google_secret_manager_secret_iam_member`), not on the project.
    - The container reads the password from Secret Manager (`env.value_source.secret_key_ref`), not from a plain-text value.
    - Ingress is limited to internal traffic and Cloud Load Balancing (`INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER`).
    hints:
    - The service runs as whatever identity its revision template names, and that identity has Editor on the whole project. Look at the service's `template` block and at the project IAM member node (its Access section flags the basic role).
    - 'Add a service account from the palette and Link to… its email in the service''s `template` → `service_account` field. Delete the project Editor grant node. Then drag the Cloud Run service onto the secret and pick Read: Nimbo grants `roles/secretmanager.secretAccessor` on that secret only.'
    - 'In `template` → `containers` → `env`, name the variable `DB_PASSWORD` and fill its `value_source` → `secret_key_ref`: Link to… the secret''s id and version `latest`. Pick `INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER` (Internal and Cloud Load Balancing) in `ingress`.'
    solution: |
      Every Cloud Run revision runs as a **service identity**. If you don't set one, it uses the Compute Engine default service account, which Google Cloud may automatically grant the Editor basic role. Cloud Run's documentation recommends a **user-managed service account** per service, with only the permissions it needs; the IAM best practices add: don't use the default service accounts' automatic grants, and avoid basic roles.

      1. Create `google_service_account.orders` and set it as `template.service_account`.
      2. Delete the project-level `roles/editor` grant.
      3. Grant `roles/secretmanager.secretAccessor` on the **secret** to that service account, and reference the secret from the container with `secret_key_ref` so the value never sits in the configuration.
      4. Set `ingress = "INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER"`: requests from the internet must come through an external Application Load Balancer, and direct `run.app` requests from the internet are refused.

      ```hcl
      resource "google_service_account" "orders" {
        account_id   = "orders-api"
        display_name = "Orders API runtime"
      }

      resource "google_cloud_run_v2_service" "orders" {
        name     = "orders-api"
        location = var.region
        ingress  = "INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER"

        template {
          service_account = google_service_account.orders.email
          containers {
            image = var.image
            env {
              name = "DB_PASSWORD"
              value_source {
                secret_key_ref {
                  secret  = google_secret_manager_secret.db_password.secret_id
                  version = "latest"
                }
              }
            }
          }
        }
      }

      resource "google_secret_manager_secret_iam_member" "orders_reads_db_password" {
        secret_id = google_secret_manager_secret.db_password.id
        role      = "roles/secretmanager.secretAccessor"
        member    = "serviceAccount:${google_service_account.orders.email}"
      }
      ```

      **Without writing code in Nimbo**

      1. Add a **service account** from the palette: account id `orders-api`, display name `Orders API runtime`.
      2. Click the Cloud Run service `orders`: pick `INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER` in **ingress**, and in **template** use **Link to…** on **service_account** to pick the new account's email.
      3. In **template** → **containers** → **env** set the name `DB_PASSWORD`; in **value_source** → **secret_key_ref** **Link to…** `secret` → the `db_password` secret's id and set version `latest`.
      4. Delete the project IAM member `runtime_editor` (its Access section flags the basic Editor role).
      5. Drag the Cloud Run service onto the secret `db_password` and pick **Read**.
    solutionFiles:
      versions.tf: |
        terraform {
          required_version = ">= 1.6"

          required_providers {
            google = {
              source  = "hashicorp/google"
              version = "~> 7.46"
            }
          }
        }

        provider "google" {
          project        = var.project_id
          region         = var.region
          default_labels = local.common_labels
        }
      variables.tf: |
        variable "project_id" {
          description = "Google Cloud project ID that owns the resources."
          type        = string
        }

        variable "region" {
          description = "Region for regional resources."
          type        = string
          default     = "europe-west1"
        }

        variable "image" {
          description = "Container image of the orders API (Artifact Registry path)."
          type        = string
          default     = "us-docker.pkg.dev/cloudrun/container/hello"
        }
      main.tf: |
        locals {
          common_labels = {
            app         = "nimbo-learn"
            environment = "dev"
            owner       = "platform"
          }
        }

        resource "google_service_account" "orders" {
          account_id   = "orders-api"
          display_name = "Orders API runtime"
        }

        resource "google_cloud_run_v2_service" "orders" {
          name     = "orders-api"
          location = var.region
          ingress  = "INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER"

          template {
            service_account = google_service_account.orders.email

            containers {
              image = var.image

              env {
                name = "DB_PASSWORD"
                value_source {
                  secret_key_ref {
                    secret  = google_secret_manager_secret.db_password.secret_id
                    version = "latest"
                  }
                }
              }
            }
          }
        }

        resource "google_secret_manager_secret" "db_password" {
          secret_id = "orders-db-password"

          replication {
            auto {}
          }
        }

        # Least privilege: read access to this one secret only.
        resource "google_secret_manager_secret_iam_member" "orders_reads_db_password" {
          secret_id = google_secret_manager_secret.db_password.id
          role      = "roles/secretmanager.secretAccessor"
          member    = "serviceAccount:${google_service_account.orders.email}"
        }
    starter:
      kind: terraform
      cloud: gcp
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              google = {
                source  = "hashicorp/google"
                version = "~> 7.46"
              }
            }
          }

          provider "google" {
            project        = var.project_id
            region         = var.region
            default_labels = local.common_labels
          }
        variables.tf: |
          variable "project_id" {
            description = "Google Cloud project ID that owns the resources."
            type        = string
          }

          variable "region" {
            description = "Region for regional resources."
            type        = string
            default     = "europe-west1"
          }

          variable "image" {
            description = "Container image of the orders API (Artifact Registry path)."
            type        = string
            default     = "us-docker.pkg.dev/cloudrun/container/hello"
          }
        main.tf: |
          locals {
            common_labels = {
              app         = "nimbo-learn"
              environment = "dev"
              owner       = "platform"
            }
          }

          data "google_project" "current" {}

          resource "google_cloud_run_v2_service" "orders" {
            name     = "orders-api"
            location = var.region

            template {
              containers {
                image = var.image
              }
            }
          }

          # The API reads one secret, so the team gave the runtime identity Editor.
          resource "google_project_iam_member" "runtime_editor" {
            project = var.project_id
            role    = "roles/editor"
            member  = "serviceAccount:${data.google_project.current.number}-compute@developer.gserviceaccount.com"
          }

          resource "google_secret_manager_secret" "db_password" {
            secret_id = "orders-db-password"

            replication {
              auto {}
            }
          }
    checks:
    - id: validate
      label: The configuration validates
      type: validate
    - id: runtime-sa
      label: The service runs as a dedicated service account
      type: has
      has:
        terraform:
          type: google_cloud_run_v2_service
          where:
            template.service_account:
              ref: google_service_account
    - id: no-basic-roles
      label: No project-level Editor or Owner grants
      type: has
      has:
        terraform:
          type: google_project_iam_member
          where:
            role:
              in:
              - roles/editor
              - roles/owner
          count:
            max: 0
    - id: secret-scoped
      label: The runtime account can read only the secret
      type: has
      has:
        terraform:
          type: google_secret_manager_secret_iam_member
          where:
            role: roles/secretmanager.secretAccessor
            member:
              ref: google_service_account
    - id: secret-env
      label: The password comes from Secret Manager
      type: has
      has:
        terraform:
          type: google_cloud_run_v2_service
          where:
            template.containers.env.value_source.secret_key_ref.secret:
              exists: true
    - id: ingress
      label: Ingress is internal + Cloud Load Balancing
      type: has
      has:
        terraform:
          type: google_cloud_run_v2_service
          where:
            ingress: INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER
    sources:
    - title: Cloud Run service identity
      url: https://docs.cloud.google.com/run/docs/securing/service-identity
    - title: Best practices for using service accounts securely
      url: https://docs.cloud.google.com/iam/docs/best-practices-service-accounts
    - title: Restrict network ingress for Cloud Run
      url: https://docs.cloud.google.com/run/docs/securing/ingress
    - title: Secret Manager overview
      url: https://docs.cloud.google.com/secret-manager/docs/overview
    - title: 'Terraform google provider: google_cloud_run_v2_service'
      url: https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/cloud_run_v2_service
    - title: 'Terraform google provider: google_google_service_account'
      url: https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/google_service_account
    - title: 'Terraform google provider: google_secret_manager_secret_iam'
      url: https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/secret_manager_secret_iam
    - title: 'Terraform google provider: google_google_project_iam'
      url: https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/google_project_iam
    solvableWithoutCode: true
- op: upsert
  kind: challenge
  id: gcp-pubsub-dead-letter
  data:
    provider: gcp
    level: intermediate
    title: Pub/Sub subscription with retries and a dead-letter topic
    summary: 'Stop poison messages from being redelivered forever: exponential backoff, a dead-letter topic and the IAM it needs.'
    minutes: 30
    tags:
    - pubsub
    - messaging
    - reliability
    - iam
    runtime: design
    problem: |-
      The billing service consumes `orders` events through the `orders-billing` subscription. Last week one malformed message made the consumer crash on every delivery: Pub/Sub redelivered it immediately, again and again, and the backlog of good orders grew behind it.

      Configure the subscription so failing messages back off progressively and, after a bounded number of attempts, are moved to a **dead-letter topic** where the team can inspect and replay them.
    requirements:
    - A second topic for dead letters and a subscription on it so dead-lettered messages are retained for inspection.
    - '`google_pubsub_subscription.billing` has a `dead_letter_policy` pointing to that topic with `max_delivery_attempts` between 5 and 100.'
    - The subscription uses an **exponential backoff** `retry_policy` (minimum and maximum backoff).
    - The Pub/Sub service agent (`service-PROJECT_NUMBER@gcp-sa-pubsub.iam.gserviceaccount.com`) has `roles/pubsub.publisher` on the dead-letter topic and `roles/pubsub.subscriber` on the source subscription.
    hints:
    - 'Messages that fail too many times need somewhere to go: a second topic, plus a subscription on it so you can read them later. Add both from the palette.'
    - On the billing subscription add a `dead_letter_policy` block (Link to… the dead-letter topic id; max delivery attempts between 5 and 100) and a `retry_policy` block with a minimum and maximum backoff.
    - 'The Pub/Sub service agent needs two grants. Add the project data source and a topic IAM member and a subscription IAM member from the palette. In each Access section: On what = Link to… the dead-letter topic / the billing subscription, Can do = `roles/pubsub.publisher` / `roles/pubsub.subscriber`, Who = Service account → Pub/Sub service agent of the project data source.'
    solution: |
      When a subscriber can't acknowledge a message, Pub/Sub redelivers it. A **retry policy with exponential backoff** spaces those redeliveries out (between the minimum and maximum backoff, up to 600 s) instead of retrying immediately. A **dead-letter topic** bounds the retries: after `max_delivery_attempts` (5–100), Pub/Sub forwards the message to the dead-letter topic and acknowledges it on the source subscription.

      Pub/Sub does that forwarding with its **service agent**, so it needs `roles/pubsub.publisher` on the dead-letter topic and `roles/pubsub.subscriber` on the source subscription. A topic with no subscription drops messages, so attach one to the dead-letter topic to keep them.

      ```hcl
      resource "google_pubsub_subscription" "billing" {
        name                 = "orders-billing"
        topic                = google_pubsub_topic.orders.id
        ack_deadline_seconds = 20

        retry_policy {
          minimum_backoff = "10s"
          maximum_backoff = "600s"
        }

        dead_letter_policy {
          dead_letter_topic     = google_pubsub_topic.orders_dead_letter.id
          max_delivery_attempts = 5
        }
      }

      resource "google_pubsub_topic_iam_member" "agent_publishes_dead_letters" {
        topic  = google_pubsub_topic.orders_dead_letter.id
        role   = "roles/pubsub.publisher"
        member = local.pubsub_agent
      }

      resource "google_pubsub_subscription_iam_member" "agent_acks_source" {
        subscription = google_pubsub_subscription.billing.id
        role         = "roles/pubsub.subscriber"
        member       = local.pubsub_agent
      }
      ```

      **Without writing code in Nimbo**

      1. From the palette add the **project** data source (name `current`).
      2. Add a **Pub/Sub topic** named `orders-dead-letter`, and a **Pub/Sub subscription** named `orders-dead-letter-inspect` whose **topic** is **Link to…** that topic's id.
      3. Click the subscription `billing`: add **dead_letter_policy** (**Link to…** the dead-letter topic's id, **max_delivery_attempts** `10`) and **retry_policy** (minimum backoff `10s`, maximum backoff `600s`).
      4. Add a **Pub/Sub topic IAM member**. In its **Access** section: **On what** → **Link to…** the dead-letter topic; **Can do** → `roles/pubsub.publisher`; **Who** → **Service account** → "Pub/Sub service agent of data.google_project.current".
      5. Add a **Pub/Sub subscription IAM member** the same way: on the `billing` subscription, role `roles/pubsub.subscriber`, same service agent.
    solutionFiles:
      versions.tf: |
        terraform {
          required_version = ">= 1.6"

          required_providers {
            google = {
              source  = "hashicorp/google"
              version = "~> 7.46"
            }
          }
        }

        provider "google" {
          project        = var.project_id
          region         = var.region
          default_labels = local.common_labels
        }
      variables.tf: |
        variable "project_id" {
          description = "Google Cloud project ID that owns the resources."
          type        = string
        }

        variable "region" {
          description = "Region for regional resources."
          type        = string
          default     = "europe-west1"
        }
      main.tf: |
        locals {
          common_labels = {
            app         = "nimbo-learn"
            environment = "dev"
            owner       = "platform"
          }
        }

        data "google_project" "current" {}

        locals {
          pubsub_agent = "serviceAccount:service-${data.google_project.current.number}@gcp-sa-pubsub.iam.gserviceaccount.com"
        }

        resource "google_pubsub_topic" "orders" {
          name = "orders"
        }

        resource "google_pubsub_topic" "orders_dead_letter" {
          name = "orders-dead-letter"
        }

        resource "google_pubsub_subscription" "billing" {
          name  = "orders-billing"
          topic = google_pubsub_topic.orders.id

          ack_deadline_seconds = 20

          retry_policy {
            minimum_backoff = "10s"
            maximum_backoff = "600s"
          }

          dead_letter_policy {
            dead_letter_topic     = google_pubsub_topic.orders_dead_letter.id
            max_delivery_attempts = 5
          }
        }

        # Keep dead-lettered messages so they can be inspected and replayed.
        resource "google_pubsub_subscription" "orders_dead_letter" {
          name                       = "orders-dead-letter-inspect"
          topic                      = google_pubsub_topic.orders_dead_letter.id
          message_retention_duration = "604800s"
        }

        # The Pub/Sub service agent forwards failed messages to the dead-letter topic
        # and acknowledges them on the source subscription.
        resource "google_pubsub_topic_iam_member" "agent_publishes_dead_letters" {
          topic  = google_pubsub_topic.orders_dead_letter.id
          role   = "roles/pubsub.publisher"
          member = local.pubsub_agent
        }

        resource "google_pubsub_subscription_iam_member" "agent_acks_source" {
          subscription = google_pubsub_subscription.billing.id
          role         = "roles/pubsub.subscriber"
          member       = local.pubsub_agent
        }
    starter:
      kind: terraform
      cloud: gcp
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              google = {
                source  = "hashicorp/google"
                version = "~> 7.46"
              }
            }
          }

          provider "google" {
            project        = var.project_id
            region         = var.region
            default_labels = local.common_labels
          }
        variables.tf: |
          variable "project_id" {
            description = "Google Cloud project ID that owns the resources."
            type        = string
          }

          variable "region" {
            description = "Region for regional resources."
            type        = string
            default     = "europe-west1"
          }
        main.tf: |
          locals {
            common_labels = {
              app         = "nimbo-learn"
              environment = "dev"
              owner       = "platform"
            }
          }

          resource "google_pubsub_topic" "orders" {
            name = "orders"
          }

          resource "google_pubsub_subscription" "billing" {
            name  = "orders-billing"
            topic = google_pubsub_topic.orders.id

            ack_deadline_seconds = 20
          }
    checks:
    - id: validate
      label: The configuration validates
      type: validate
    - id: dlq
      label: Failed messages go to a dead-letter topic
      type: has
      has:
        terraform:
          type: google_pubsub_subscription
          name: billing
          where:
            dead_letter_policy.dead_letter_topic:
              ref: google_pubsub_topic
    - id: attempts
      label: Delivery attempts are bounded (5–100)
      type: has
      has:
        terraform:
          type: google_pubsub_subscription
          name: billing
          where:
            dead_letter_policy.max_delivery_attempts:
              min: 5
              max: 100
    - id: backoff
      label: Retries use exponential backoff
      type: has
      has:
        terraform:
          type: google_pubsub_subscription
          name: billing
          where:
            retry_policy.minimum_backoff:
              exists: true
            retry_policy.maximum_backoff:
              exists: true
    - id: dlq-retained
      label: Dead-lettered messages are kept in a subscription
      type: has
      has:
        terraform:
          type: google_pubsub_subscription
          where:
            topic:
              ref: google_pubsub_topic.orders_dead_letter
    - id: agent-publisher
      label: The Pub/Sub service agent can publish dead letters
      type: has
      has:
        terraform:
          type: google_pubsub_topic_iam_member
          where:
            role: roles/pubsub.publisher
    - id: agent-subscriber
      label: The Pub/Sub service agent can acknowledge on the source subscription
      type: has
      has:
        terraform:
          type: google_pubsub_subscription_iam_member
          where:
            role: roles/pubsub.subscriber
