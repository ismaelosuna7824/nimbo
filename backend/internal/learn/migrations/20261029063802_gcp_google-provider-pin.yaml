- op: upsert
  kind: challenge
  id: gcp-cloud-sql-private-ip
  data:
    provider: gcp
    level: advanced
    title: Cloud SQL on private IP with HA and point-in-time recovery
    summary: Move a public PostgreSQL instance to private services access, regional HA, automated backups and PITR.
    minutes: 45
    tags:
    - cloud-sql
    - postgres
    - private-services-access
    - backups
    - high-availability
    prerequisites:
    - gcp-custom-vpc-firewall
    runtime: design
    problem: |-
      `orders-db` is a Cloud SQL for PostgreSQL instance with a **public IP** and an authorized network of `0.0.0.0/0`, no backups, a single zone and no deletion protection. One bad migration, one zonal outage or one leaked password away from a very bad day.

      Redesign it for production: reachable only from your VPC through **private services access**, highly available across zones, with automated backups and **point-in-time recovery**, and protected against accidental deletion.
    requirements:
    - 'A reserved range: `google_compute_global_address` with `purpose = "VPC_PEERING"` in your VPC.'
    - A `google_service_networking_connection` to `servicenetworking.googleapis.com` using that range.
    - The instance has **no public IPv4** (`ipv4_enabled = false`) and a `private_network` set to the VPC; SSL is required.
    - '`availability_type = "REGIONAL"` (primary + standby in another zone).'
    - Automated backups enabled with **point-in-time recovery**, and a retention you chose explicitly.
    - '`deletion_protection = true`.'
    hints:
    - 'Private services access is two resources from the palette: an internal global address range (`VPC_PEERING`, `INTERNAL`, prefix length 16) and the service networking connection that uses it.'
    - Link both to the VPC id. On the connection, type `servicenetworking.googleapis.com` as the service and use Link to… on `reserved_peering_ranges` to add the address's name.
    - 'All instance settings live under the `settings` block: in `ip_configuration` remove the authorized network, turn IPv4 off, Link to… the VPC as private network and pick `ENCRYPTED_ONLY`; in `backup_configuration` turn on backups and point-in-time recovery and set retained backups. Pick `REGIONAL` availability and turn deletion protection on.'
    solution: |
      With **private services access**, Cloud SQL instances get an internal IP from a range you reserve in your VPC; the service producer network is connected to yours through VPC Network Peering (`google_service_networking_connection`). Clients in the VPC connect privately, and with `ipv4_enabled = false` there's no public endpoint to attack at all. `ssl_mode = "ENCRYPTED_ONLY"` additionally refuses unencrypted connections.

      For reliability, a **regional (HA) instance** keeps a standby in a second zone with synchronous replication; if the primary or its zone fails, the standby takes over the same IP. **Automated backups** plus **point-in-time recovery** (write-ahead logs) let you restore to any moment within the retention window — e.g. right before a bad migration. Retention is configurable from 1 to 365 automated backups. `deletion_protection` prevents Terraform or a person from deleting the instance by mistake.

      ```hcl
      resource "google_compute_global_address" "private_services" {
        name          = "google-managed-services"
        purpose       = "VPC_PEERING"
        address_type  = "INTERNAL"
        prefix_length = 16
        network       = google_compute_network.main.id
      }

      resource "google_service_networking_connection" "private_services" {
        network                 = google_compute_network.main.id
        service                 = "servicenetworking.googleapis.com"
        reserved_peering_ranges = [google_compute_global_address.private_services.name]
      }

      resource "google_sql_database_instance" "orders" {
        name                = "orders-db"
        database_version    = "POSTGRES_16"
        region              = var.region
        deletion_protection = true

        settings {
          tier              = "db-custom-2-7680"
          availability_type = "REGIONAL"

          ip_configuration {
            ipv4_enabled    = false
            private_network = google_compute_network.main.id
            ssl_mode        = "ENCRYPTED_ONLY"
          }

          backup_configuration {
            enabled                        = true
            start_time                     = "02:00"
            point_in_time_recovery_enabled = true
            backup_retention_settings {
              retained_backups = 14
            }
          }
        }

        depends_on = [google_service_networking_connection.private_services]
      }
      ```

      **Without writing code in Nimbo**

      1. Add a **global address** from the palette: name `private-services`, purpose `VPC_PEERING`, type `INTERNAL`, prefix length `16`, **Link to…** `network` → the VPC id.
      2. Add a **service networking connection**: **Link to…** `network` → the VPC id, service `servicenetworking.googleapis.com`, and **Link to…** on **reserved_peering_ranges** to add the address's name.
      3. Click the instance `orders`: turn **deletion_protection** on. In **settings** pick `REGIONAL` availability.
      4. In **settings** → **ip_configuration** remove the **authorized_networks** block with its Trash button, turn **ipv4_enabled** off, **Link to…** `private_network` → the VPC id and pick `ENCRYPTED_ONLY` SSL mode.
      5. In **settings** → **backup_configuration** turn **enabled** and **point_in_time_recovery_enabled** on, and add **backup_retention_settings** with `7` retained backups.
    solutionFiles:
      versions.tf: |
        terraform {
          required_version = ">= 1.6"

          required_providers {
            google = {
              source  = "hashicorp/google"
              version = "~> 7.46"
            }
          }
        }

        provider "google" {
          project        = var.project_id
          region         = var.region
          default_labels = local.common_labels
        }
      variables.tf: |
        variable "project_id" {
          description = "Google Cloud project ID that owns the resources."
          type        = string
        }

        variable "region" {
          description = "Region for regional resources."
          type        = string
          default     = "europe-west1"
        }
      main.tf: |
        locals {
          common_labels = {
            app         = "nimbo-learn"
            environment = "dev"
            owner       = "platform"
          }
        }

        resource "google_compute_network" "main" {
          name                    = "app-network"
          auto_create_subnetworks = false
        }

        # Private services access: a reserved range peered with Google's service producer network.
        resource "google_compute_global_address" "private_services" {
          name          = "google-managed-services"
          purpose       = "VPC_PEERING"
          address_type  = "INTERNAL"
          prefix_length = 16
          network       = google_compute_network.main.id
        }

        resource "google_service_networking_connection" "private_services" {
          network                 = google_compute_network.main.id
          service                 = "servicenetworking.googleapis.com"
          reserved_peering_ranges = [google_compute_global_address.private_services.name]
        }

        resource "google_sql_database_instance" "orders" {
          name             = "orders-db"
          database_version = "POSTGRES_16"
          region           = var.region

          deletion_protection = true

          settings {
            tier              = "db-custom-2-7680"
            availability_type = "REGIONAL"

            ip_configuration {
              ipv4_enabled                                  = false
              private_network                               = google_compute_network.main.id
              enable_private_path_for_google_cloud_services = true
              ssl_mode                                      = "ENCRYPTED_ONLY"
            }

            backup_configuration {
              enabled                        = true
              start_time                     = "02:00"
              point_in_time_recovery_enabled = true

              backup_retention_settings {
                retained_backups = 14
                retention_unit   = "COUNT"
              }
            }

            maintenance_window {
              day  = 7
              hour = 3
            }
          }

          depends_on = [google_service_networking_connection.private_services]
        }
    starter:
      kind: terraform
      cloud: gcp
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              google = {
                source  = "hashicorp/google"
                version = "~> 7.46"
              }
            }
          }

          provider "google" {
            project        = var.project_id
            region         = var.region
            default_labels = local.common_labels
          }
        variables.tf: |
          variable "project_id" {
            description = "Google Cloud project ID that owns the resources."
            type        = string
          }

          variable "region" {
            description = "Region for regional resources."
            type        = string
            default     = "europe-west1"
          }
        main.tf: |
          locals {
            common_labels = {
              app         = "nimbo-learn"
              environment = "dev"
              owner       = "platform"
            }
          }

          resource "google_compute_network" "main" {
            name                    = "app-network"
            auto_create_subnetworks = false
          }

          resource "google_sql_database_instance" "orders" {
            name             = "orders-db"
            database_version = "POSTGRES_16"
            region           = var.region

            deletion_protection = false

            settings {
              tier = "db-custom-2-7680"

              ip_configuration {
                ipv4_enabled = true

                authorized_networks {
                  name  = "anywhere"
                  value = "0.0.0.0/0"
                }
              }
            }
          }
    checks:
    - id: validate
      label: The configuration validates
      type: validate
    - id: psa-range
      label: A range is reserved for private services access
      type: has
      has:
        terraform:
          type: google_compute_global_address
          where:
            purpose: VPC_PEERING
            address_type: INTERNAL
    - id: psa-peering
      label: The VPC is peered with Service Networking
      type: has
      has:
        terraform:
          type: google_service_networking_connection
          where:
            service: servicenetworking.googleapis.com
            reserved_peering_ranges:
              ref: google_compute_global_address
    - id: private-only
      label: The instance has a private IP and no public IP
      type: has
      has:
        terraform:
          type: google_sql_database_instance
          where:
            settings.ip_configuration.ipv4_enabled: false
            settings.ip_configuration.private_network:
              ref: google_compute_network
    - id: ssl
      label: Connections must be encrypted
      type: has
      has:
        terraform:
          type: google_sql_database_instance
          where:
            settings.ip_configuration.ssl_mode:
              in:
              - ENCRYPTED_ONLY
              - TRUSTED_CLIENT_CERTIFICATE_REQUIRED
    - id: ha
      label: The instance is regional (HA)
      type: has
      has:
        terraform:
          type: google_sql_database_instance
          where:
            settings.availability_type: REGIONAL
    - id: pitr
      label: Automated backups with point-in-time recovery
      type: has
      has:
        terraform:
          type: google_sql_database_instance
          where:
            settings.backup_configuration.enabled: true
            settings.backup_configuration.point_in_time_recovery_enabled: true
            settings.backup_configuration.backup_retention_settings.retained_backups:
              min: 1
    - id: deletion-protection
      label: Deletion protection is on
      type: has
      has:
        terraform:
          type: google_sql_database_instance
          where:
            deletion_protection: true
