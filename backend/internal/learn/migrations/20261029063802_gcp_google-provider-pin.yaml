description: Pins hashicorp/google to ~> 7.46 (the constraint Nimbo writes) instead of ~> 7.0 in the gcp challenges' solutions and starter code, since releases before 7.26 can't create Cloud SQL databases on the local emulator
operations:
- op: upsert
  kind: challenge
  id: gcp-storage-private-bucket
  data:
    provider: gcp
    level: beginner
    title: Lock down a public Cloud Storage bucket
    summary: Replace a public-read grant with uniform bucket-level access, public access prevention and a group-scoped IAM role.
    minutes: 20
    tags:
    - cloud-storage
    - iam
    - security
    runtime: design
    problem: |-
      The finance team stores monthly reports in a Cloud Storage bucket. To share them with analysts quickly, someone granted **Storage Object Viewer** to `allUsers` — so anyone on the internet who guesses an object name can download a report.

      You own the Terraform for this bucket. Make it private by design: access must be granted only through IAM at the bucket level, the bucket must refuse any public grant even if someone tries again later, and the analysts must keep read access through their Google group.
    requirements:
    - '`google_storage_bucket.reports` enables **uniform bucket-level access** (object ACLs are disabled; only IAM grants access).'
    - The bucket sets **public access prevention** to `enforced`.
    - No IAM grant on the bucket uses `allUsers` or `allAuthenticatedUsers` (Nimbo rule `bp_public_bucket` is clean).
    - Analysts keep `roles/storage.objectViewer` through a `group:` principal passed in as a variable.
    hints:
    - 'Click the bucket and look for two fields in the inspector: `uniform_bucket_level_access` and `public_access_prevention`.'
    - 'Public access prevention only accepts `enforced` or `inherited`; `inherited` defers to the organization policy. The public grant itself is the bucket IAM member node: open its Access section.'
    - In the Variables panel add `analysts_group` (type string, with a description). Then in the IAM member's Who row change the member type from Anyone (public) to Google group and use Link to… to pick `var.analysts_group`.
    solution: |
      Google Cloud recommends **uniform bucket-level access** for most buckets: once enabled, ACLs stop working and access is controlled only by IAM at the bucket (or higher) level, which removes a whole class of accidental exposure through object ACLs. It is also a prerequisite for IAM Conditions on the bucket.

      **Public access prevention** is the second safety net. With `public_access_prevention = "enforced"` Cloud Storage rejects any grant to `allUsers` or `allAuthenticatedUsers` on that bucket, even if a future change tries to add one. (`inherited` means the bucket follows the `storage.publicAccessPrevention` organization policy instead.)

      Finally, replace the public grant with a least-privilege one: the analysts' Google group gets `roles/storage.objectViewer` on this bucket only. Granting to a group rather than individuals keeps the policy stable when people join or leave the team.

      ```hcl
      resource "google_storage_bucket" "reports" {
        name     = "${var.project_id}-reports"
        location = var.region

        uniform_bucket_level_access = true
        public_access_prevention    = "enforced"
      }

      resource "google_storage_bucket_iam_member" "analysts_read" {
        bucket = google_storage_bucket.reports.name
        role   = "roles/storage.objectViewer"
        member = "group:${var.analysts_group}"
      }
      ```

      **Without writing code in Nimbo**

      1. Click the bucket `reports`: turn **uniform_bucket_level_access** on and pick `enforced` in **public_access_prevention**.
      2. Open the **Variables** panel and add `analysts_group` of type string with the description "Email of the Google group whose members read the reports."
      3. Click the IAM member `public_read`. In its **Access** section, under **Who**, change the type to **Google group** and use **Link to…** to pick `var.analysts_group`. Keep the `roles/storage.objectViewer` role.
    solutionFiles:
      versions.tf: |
        terraform {
          required_version = ">= 1.6"

          required_providers {
            google = {
              source  = "hashicorp/google"
              version = "~> 7.46"
            }
          }
        }

        provider "google" {
          project        = var.project_id
          region         = var.region
          default_labels = local.common_labels
        }
      variables.tf: |
        variable "project_id" {
          description = "Google Cloud project ID that owns the resources."
          type        = string
        }

        variable "region" {
          description = "Region for regional resources."
          type        = string
          default     = "europe-west1"
        }

        variable "analysts_group" {
          description = "Email of the Google group whose members read the reports."
          type        = string
        }
      main.tf: |
        locals {
          common_labels = {
            app         = "nimbo-learn"
            environment = "dev"
            owner       = "platform"
          }
        }

        resource "google_storage_bucket" "reports" {
          name     = "${var.project_id}-reports"
          location = var.region

          uniform_bucket_level_access = true
          public_access_prevention    = "enforced"
        }

        resource "google_storage_bucket_iam_member" "analysts_read" {
          bucket = google_storage_bucket.reports.name
          role   = "roles/storage.objectViewer"
          member = "group:${var.analysts_group}"
        }
    starter:
      kind: terraform
      cloud: gcp
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              google = {
                source  = "hashicorp/google"
                version = "~> 7.46"
              }
            }
          }

          provider "google" {
            project        = var.project_id
            region         = var.region
            default_labels = local.common_labels
          }
        variables.tf: |
          variable "project_id" {
            description = "Google Cloud project ID that owns the resources."
            type        = string
          }

          variable "region" {
            description = "Region for regional resources."
            type        = string
            default     = "europe-west1"
          }
        main.tf: |
          locals {
            common_labels = {
              app         = "nimbo-learn"
              environment = "dev"
              owner       = "platform"
            }
          }

          resource "google_storage_bucket" "reports" {
            name     = "${var.project_id}-reports"
            location = var.region
          }

          resource "google_storage_bucket_iam_member" "public_read" {
            bucket = google_storage_bucket.reports.name
            role   = "roles/storage.objectViewer"
            member = "allUsers"
          }
    checks:
    - id: validate
      label: The configuration validates
      type: validate
    - id: uniform
      label: Uniform bucket-level access is enabled
      type: has
      has:
        terraform:
          type: google_storage_bucket
          where:
            uniform_bucket_level_access: true
    - id: pap
      label: Public access prevention is enforced
      type: has
      has:
        terraform:
          type: google_storage_bucket
          where:
            public_access_prevention: enforced
    - id: no-public
      label: No public grants on the bucket (bp_public_bucket)
      type: rules_clean
      rules_clean:
        codes:
        - bp_public_bucket
        minSeverity: info
    - id: no-allusers
      label: No IAM member grants allUsers or allAuthenticatedUsers
      type: has
      has:
        terraform:
          type: google_storage_bucket_iam_member
          where:
            member:
              in:
              - allUsers
              - allAuthenticatedUsers
          count:
            max: 0
    - id: group-reader
      label: A Google group can read the reports
      type: has
      has:
        terraform:
          type: google_storage_bucket_iam_member
          where:
            role: roles/storage.objectViewer
            member:
              contains: 'group:'
    sources:
    - title: Uniform bucket-level access
      url: https://docs.cloud.google.com/storage/docs/uniform-bucket-level-access
    - title: Public access prevention
      url: https://docs.cloud.google.com/storage/docs/public-access-prevention
    - title: Best practices for using service accounts securely
      url: https://docs.cloud.google.com/iam/docs/best-practices-service-accounts
    - title: 'Terraform google provider: google_storage_bucket'
      url: https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/storage_bucket
    - title: 'Terraform google provider: google_storage_bucket_iam'
      url: https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/storage_bucket_iam
    solvableWithoutCode: true
- op: upsert
  kind: challenge
  id: gcp-storage-retention-lifecycle
  data:
    provider: gcp
    level: beginner
    title: Retain audit archives and age them to colder storage
    summary: Add a one-year retention policy and lifecycle rules that move objects to Nearline and Coldline.
    minutes: 25
    tags:
    - cloud-storage
    - retention
    - lifecycle
    - cost
    prerequisites:
    - gcp-storage-private-bucket
    runtime: design
    problem: |-
      Your compliance team requires that exported audit archives can't be deleted or overwritten for **one year**. At the same time, finance noticed the archive bucket keeps everything in Standard storage although the files are almost never read after the first month.

      The bucket is already private. Add a retention policy that protects every object for one year, and lifecycle rules that move objects to cheaper storage classes as they age.
    requirements:
    - The bucket has a **retention policy** of at least one year (31,557,600 seconds — Cloud Storage counts a year as 365.25 days).
    - The retention policy stays **unlocked** while the period is still being agreed (locking is irreversible).
    - A lifecycle rule moves objects to **NEARLINE** after 30 days.
    - A lifecycle rule moves objects to **COLDLINE** after 90 days.
    - Uniform bucket-level access and public access prevention stay on.
    hints:
    - 'Retention is a `retention_policy` block on the bucket: add it in the inspector. Its period is in seconds.'
    - Type `31557600` (one year of 365.25 days) as the retention period and leave `is_locked` off. Each storage-class transition is its own `lifecycle_rule` block with an `action` and a `condition`.
    - 'Add two `lifecycle_rule` blocks: action type `SetStorageClass` with class `NEARLINE` and condition age `30`, then `COLDLINE` at age `90`. Nearline has a 30-day minimum storage duration and Coldline 90 days, which is why those ages line up.'
    solution: |
      A **bucket retention policy** (part of Bucket Lock) makes every object in the bucket — existing and new — undeletable and unreplaceable until it reaches the retention period. Periods are set in seconds; Cloud Storage defines a year as 365.25 days, so one year is `31557600`. You can later **lock** the policy to meet regulations that require WORM storage, but locking is permanent: you can then only increase the period, and the bucket can't be deleted until all objects expire. Keep `is_locked = false` until the period is final.

      **Object Lifecycle Management** applies actions when conditions match. `SetStorageClass` rules that move objects to Nearline at 30 days and Coldline at 90 days follow the access pattern of archives and the minimum storage durations of those classes, cutting cost without changing how the data is read.

      ```hcl
      retention_policy {
        retention_period = 31557600
        is_locked        = false
      }

      lifecycle_rule {
        condition { age = 30 }
        action {
          type          = "SetStorageClass"
          storage_class = "NEARLINE"
        }
      }

      lifecycle_rule {
        condition { age = 90 }
        action {
          type          = "SetStorageClass"
          storage_class = "COLDLINE"
        }
      }
      ```

      **Without writing code in Nimbo**

      1. Click the bucket `audit_logs` and keep **storage_class** `STANDARD`; leave uniform access and public access prevention as they are.
      2. Add the **retention_policy** block: **retention_period** `31557600`, **is_locked** off.
      3. Add a **lifecycle_rule** block: in **action** pick type `SetStorageClass` and class `NEARLINE`; in **condition** set **age** `30`.
      4. Add a second **lifecycle_rule**: `SetStorageClass` to `COLDLINE`, age `90`.
    solutionFiles:
      versions.tf: |
        terraform {
          required_version = ">= 1.6"

          required_providers {
            google = {
              source  = "hashicorp/google"
              version = "~> 7.46"
            }
          }
        }

        provider "google" {
          project        = var.project_id
          region         = var.region
          default_labels = local.common_labels
        }
      variables.tf: |
        variable "project_id" {
          description = "Google Cloud project ID that owns the resources."
          type        = string
        }

        variable "region" {
          description = "Region for regional resources."
          type        = string
          default     = "europe-west1"
        }
      main.tf: |
        locals {
          common_labels = {
            app         = "nimbo-learn"
            environment = "dev"
            owner       = "platform"
          }
        }

        resource "google_storage_bucket" "audit_logs" {
          name          = "${var.project_id}-audit-archive"
          location      = var.region
          storage_class = "STANDARD"

          uniform_bucket_level_access = true
          public_access_prevention    = "enforced"

          # Objects can't be deleted or replaced for 1 year (31,557,600 s).
          # Leave is_locked = false until the period is agreed: locking is irreversible.
          retention_policy {
            retention_period = 31557600
            is_locked        = false
          }

          lifecycle_rule {
            condition {
              age = 30
            }
            action {
              type          = "SetStorageClass"
              storage_class = "NEARLINE"
            }
          }

          lifecycle_rule {
            condition {
              age = 90
            }
            action {
              type          = "SetStorageClass"
              storage_class = "COLDLINE"
            }
          }
        }
    starter:
      kind: terraform
      cloud: gcp
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              google = {
                source  = "hashicorp/google"
                version = "~> 7.46"
              }
            }
          }

          provider "google" {
            project        = var.project_id
            region         = var.region
            default_labels = local.common_labels
          }
        variables.tf: |
          variable "project_id" {
            description = "Google Cloud project ID that owns the resources."
            type        = string
          }

          variable "region" {
            description = "Region for regional resources."
            type        = string
            default     = "europe-west1"
          }
        main.tf: |
          locals {
            common_labels = {
              app         = "nimbo-learn"
              environment = "dev"
              owner       = "platform"
            }
          }

          resource "google_storage_bucket" "audit_logs" {
            name     = "${var.project_id}-audit-archive"
            location = var.region

            uniform_bucket_level_access = true
            public_access_prevention    = "enforced"
          }
    checks:
    - id: validate
      label: The configuration validates
      type: validate
    - id: retention
      label: Objects are retained for at least one year
      type: has
      has:
        terraform:
          type: google_storage_bucket
          where:
            retention_policy.retention_period:
              min: 31557600
    - id: unlocked
      label: The retention policy is not locked yet
      type: has
      has:
        terraform:
          type: google_storage_bucket
          where:
            retention_policy.is_locked:
              notIn:
              - true
    - id: nearline
      label: Objects move to Nearline after 30 days
      type: has
      has:
        terraform:
          type: google_storage_bucket
          where:
            lifecycle_rule.action.storage_class: NEARLINE
    - id: coldline
      label: Objects move to Coldline after 90 days
      type: has
      has:
        terraform:
          type: google_storage_bucket
          where:
            lifecycle_rule.action.storage_class: COLDLINE
    - id: still-private
      label: The bucket stays private
      type: has
      has:
        terraform:
          type: google_storage_bucket
          where:
            uniform_bucket_level_access: true
            public_access_prevention: enforced
    sources:
    - title: Bucket Lock
      url: https://docs.cloud.google.com/storage/docs/bucket-lock
    - title: Object Lifecycle Management
      url: https://docs.cloud.google.com/storage/docs/lifecycle
    - title: Storage classes
      url: https://docs.cloud.google.com/storage/docs/storage-classes
    - title: 'Terraform google provider: google_storage_bucket'
      url: https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/storage_bucket
    solvableWithoutCode: true
- op: upsert
  kind: challenge
  id: gcp-custom-vpc-firewall
  data:
    provider: gcp
    level: beginner
    title: Custom-mode VPC with SSH only through IAP
    summary: Replace an auto-mode network and an SSH-from-anywhere rule with a custom subnet and an IAP-only firewall rule.
    minutes: 25
    tags:
    - vpc
    - firewall
    - iap
    - networking
    runtime: design
    problem: |-
      A team created `app-network` with default settings and opened SSH (`tcp:22`) to `0.0.0.0/0` so developers could reach their VMs. Auto mode created a subnet in every region with predefined ranges they never planned, and port 22 is now exposed to the whole internet.

      Rebuild the network the way production networks on Google Cloud are planned: one **custom-mode** VPC with an explicit subnet in your region, and SSH allowed only from **Identity-Aware Proxy (IAP) TCP forwarding**, so access is checked against IAM instead of being open to any IP.
    requirements:
    - '`google_compute_network.main` is **custom mode** (`auto_create_subnetworks = false`).'
    - A `google_compute_subnetwork` in `var.region` with an explicit CIDR and **Private Google Access** enabled.
    - No firewall rule allows ingress from `0.0.0.0/0` to sensitive ports (Nimbo rule `bp_open_ingress` is clean).
    - SSH (`tcp:22`) is allowed only from IAP's range `35.235.240.0/20`, to instances with a network tag.
    hints:
    - With `auto_create_subnetworks` on, the network is auto mode and creates one subnet per region. Turn it off on the VPC.
    - Add a subnetwork from the palette, Link to… the VPC id, give it an explicit CIDR and turn `private_ip_google_access` on so VMs without external IPs reach Google APIs.
    - 'The IAP TCP forwarding documentation lists the source range to allow: `35.235.240.0/20`. On the SSH firewall rule replace `0.0.0.0/0` with it in `source_ranges`, and add a network tag in `target_tags` to scope the rule.'
    solution: |
      **Custom-mode VPCs** give you full control of subnets and IP ranges; the VPC documentation recommends them when you connect networks, because every auto-mode network uses the same predefined `10.128.0.0/9` space and can collide with on-premises or peered ranges. Subnets are regional, so create one per region you actually use, and enable **Private Google Access** so VMs with only internal IPs can still call Google APIs.

      VPC firewall rules are stateful and apply to instances; a rule with `source_ranges = ["0.0.0.0/0"]` on port 22 lets anyone attempt SSH. **IAP TCP forwarding** tunnels SSH through Identity-Aware Proxy: the user must be authorized in IAM (`roles/iap.tunnelResourceAccessor`), and the VM only needs to accept traffic from IAP's range `35.235.240.0/20`.

      ```hcl
      resource "google_compute_network" "main" {
        name                    = "app-network"
        auto_create_subnetworks = false
      }

      resource "google_compute_subnetwork" "app" {
        name                     = "app-${var.region}"
        network                  = google_compute_network.main.id
        region                   = var.region
        ip_cidr_range            = "10.10.0.0/24"
        private_ip_google_access = true
      }

      resource "google_compute_firewall" "ssh_from_iap" {
        name          = "allow-ssh-from-iap"
        network       = google_compute_network.main.id
        direction     = "INGRESS"
        source_ranges = ["35.235.240.0/20"]
        target_tags   = ["ssh"]

        allow {
          protocol = "tcp"
          ports    = ["22"]
        }
      }
      ```

      **Without writing code in Nimbo**

      1. Click the VPC `main`: turn **auto_create_subnetworks** off and pick `REGIONAL` routing mode.
      2. Add a **subnetwork** from the palette: name `app-us-central1`, **Link to…** `network` → the VPC id, CIDR `10.10.0.0/24`, **private_ip_google_access** on.
      3. Click the firewall `ssh`: name `allow-ssh-from-iap`, direction `INGRESS`, replace the source range with `35.235.240.0/20` and add the tag `ssh` in **target_tags**.
    solutionFiles:
      versions.tf: |
        terraform {
          required_version = ">= 1.6"

          required_providers {
            google = {
              source  = "hashicorp/google"
              version = "~> 7.46"
            }
          }
        }

        provider "google" {
          project        = var.project_id
          region         = var.region
          default_labels = local.common_labels
        }
      variables.tf: |
        variable "project_id" {
          description = "Google Cloud project ID that owns the resources."
          type        = string
        }

        variable "region" {
          description = "Region for regional resources."
          type        = string
          default     = "europe-west1"
        }
      main.tf: |
        locals {
          common_labels = {
            app         = "nimbo-learn"
            environment = "dev"
            owner       = "platform"
          }
        }

        resource "google_compute_network" "main" {
          name                    = "app-network"
          auto_create_subnetworks = false
          routing_mode            = "REGIONAL"
        }

        resource "google_compute_subnetwork" "app" {
          name                     = "app-${var.region}"
          network                  = google_compute_network.main.id
          region                   = var.region
          ip_cidr_range            = "10.10.0.0/24"
          private_ip_google_access = true
        }

        # SSH only through Identity-Aware Proxy TCP forwarding.
        resource "google_compute_firewall" "ssh_from_iap" {
          name      = "allow-ssh-from-iap"
          network   = google_compute_network.main.id
          direction = "INGRESS"

          allow {
            protocol = "tcp"
            ports    = ["22"]
          }

          source_ranges = ["35.235.240.0/20"]
          target_tags   = ["ssh"]
        }
    starter:
      kind: terraform
      cloud: gcp
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              google = {
                source  = "hashicorp/google"
                version = "~> 7.46"
              }
            }
          }

          provider "google" {
            project        = var.project_id
            region         = var.region
            default_labels = local.common_labels
          }
        variables.tf: |
          variable "project_id" {
            description = "Google Cloud project ID that owns the resources."
            type        = string
          }

          variable "region" {
            description = "Region for regional resources."
            type        = string
            default     = "europe-west1"
          }
        main.tf: |
          locals {
            common_labels = {
              app         = "nimbo-learn"
              environment = "dev"
              owner       = "platform"
            }
          }

          resource "google_compute_network" "main" {
            name = "app-network"
          }

          resource "google_compute_firewall" "ssh" {
            name    = "allow-ssh"
            network = google_compute_network.main.id

            allow {
              protocol = "tcp"
              ports    = ["22"]
            }

            source_ranges = ["0.0.0.0/0"]
          }
    checks:
    - id: validate
      label: The configuration validates
      type: validate
    - id: custom-mode
      label: The VPC is custom mode
      type: has
      has:
        terraform:
          type: google_compute_network
          where:
            auto_create_subnetworks: false
    - id: subnet
      label: A regional subnet has Private Google Access
      type: has
      has:
        terraform:
          type: google_compute_subnetwork
          where:
            private_ip_google_access: true
            ip_cidr_range:
              exists: true
    - id: subnet-in-vpc
      label: The subnet belongs to the VPC
      type: has
      has:
        connected:
          from: google_compute_subnetwork
          to: google_compute_network
    - id: no-open-ingress
      label: Nothing is open to the internet (bp_open_ingress)
      type: rules_clean
      rules_clean:
        codes:
        - bp_open_ingress
        minSeverity: info
    - id: iap-ssh
      label: SSH is allowed only from IAP (35.235.240.0/20)
      type: has
      has:
        terraform:
          type: google_compute_firewall
          where:
            source_ranges:
              contains: 35.235.240.0/20
            target_tags:
              exists: true
    sources:
    - title: VPC networks
      url: https://docs.cloud.google.com/vpc/docs/vpc
    - title: Private Google Access
      url: https://docs.cloud.google.com/vpc/docs/private-google-access
    - title: VPC firewall rules
      url: https://docs.cloud.google.com/firewall/docs/firewalls
    - title: Using IAP for TCP forwarding
      url: https://docs.cloud.google.com/iap/docs/using-tcp-forwarding
    - title: 'Terraform google provider: google_compute_network'
      url: https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/compute_network
    - title: 'Terraform google provider: google_compute_subnetwork'
      url: https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/compute_subnetwork
    - title: 'Terraform google provider: google_compute_firewall'
      url: https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/compute_firewall
    solvableWithoutCode: true
- op: upsert
  kind: challenge
  id: gcp-private-vm-cloud-nat
  data:
    provider: gcp
    level: intermediate
    title: Private VMs with outbound internet through Cloud NAT
    summary: Remove the VM's external IP and give the subnet outbound-only internet access with Cloud Router + Cloud NAT.
    minutes: 35
    tags:
    - vpc
    - cloud-nat
    - compute-engine
    - networking
    prerequisites:
    - gcp-custom-vpc-firewall
    runtime: design
    problem: |-
      A batch worker VM needs to download OS updates and call a partner API on the internet. To make that work, it was given an ephemeral **external IP** — which also makes it reachable from the internet and runs it as the Compute Engine default service account.

      Make the worker private: no external IP, its own minimal service account, and outbound internet access through a managed **Cloud NAT** gateway attached to the subnet. Unsolicited inbound connections must not be possible.
    requirements:
    - '`google_compute_instance.worker` has **no `access_config`** block (internal IP only).'
    - The VM runs as a **dedicated service account** (`google_service_account`), not the default compute account.
    - A `google_compute_router` in the VPC and a `google_compute_router_nat` that serves the app subnet.
    - Cloud NAT **logging** is enabled (at least errors) so you can troubleshoot dropped connections.
    hints:
    - 'The VM''s `access_config` block inside `network_interface` is what assigns an ephemeral external IP: remove it with its Trash button.'
    - 'Give the VM a service account from the palette (Link to… its email in the VM''s `service_account` block). Cloud NAT is configured on a Cloud Router: add both from the palette and link the NAT''s `router` to the router''s name.'
    - On the NAT pick `LIST_OF_SUBNETWORKS` and add a `subnetwork` block that links to the app subnet with `ALL_IP_RANGES`. Add a `log_config` block, turn it on and pick `ERRORS_ONLY`.
    solution: |
      **Cloud NAT** gives VMs without external IP addresses outbound access to the internet. It's a distributed, software-defined service — not a proxy VM — and it only translates established response packets back in, so it does **not** allow unsolicited inbound connections. Its configuration lives on a **Cloud Router**, which provides the control plane.

      Steps:
      1. Remove `access_config` from the VM's `network_interface`: the VM keeps only an internal IP.
      2. Attach a dedicated service account with only what the worker needs. Google recommends not using the Compute Engine default service account, which can be automatically granted the Editor role.
      3. Add a regional `google_compute_router` in the VPC and a `google_compute_router_nat` with automatically allocated NAT IPs, scoped to the app subnet, with error logging.

      ```hcl
      resource "google_compute_router" "nat" {
        name    = "app-router"
        network = google_compute_network.main.id
        region  = var.region
      }

      resource "google_compute_router_nat" "egress" {
        name                               = "app-nat"
        router                             = google_compute_router.nat.name
        region                             = var.region
        nat_ip_allocate_option             = "AUTO_ONLY"
        source_subnetwork_ip_ranges_to_nat = "LIST_OF_SUBNETWORKS"

        subnetwork {
          name                    = google_compute_subnetwork.app.id
          source_ip_ranges_to_nat = ["ALL_IP_RANGES"]
        }

        log_config {
          enable = true
          filter = "ERRORS_ONLY"
        }
      }
      ```

      Combine this with Private Google Access on the subnet (from the previous challenge) so calls to Google APIs don't need NAT at all.

      **Without writing code in Nimbo**

      1. Add a **service account** from the palette: account id `worker-vm`, display name `Worker VM`.
      2. Click the VM `worker`: in **network_interface** remove the **access_config** block with its Trash button. In **service_account** **Link to…** `email` → the new account's email and add the scope `cloud-platform`. In **shielded_instance_config** turn **enable_secure_boot** on.
      3. Add a **router** from the palette: name `app-router`, **Link to…** `network` → the VPC id.
      4. Add a **router NAT**: name `app-nat`, **Link to…** `router` → the router's name, `AUTO_ONLY` IP allocation, `LIST_OF_SUBNETWORKS`. Add a **subnetwork** block (**Link to…** the `app` subnet's id, `ALL_IP_RANGES`) and a **log_config** block (enable on, filter `ERRORS_ONLY`).
    solutionFiles:
      versions.tf: |
        terraform {
          required_version = ">= 1.6"

          required_providers {
            google = {
              source  = "hashicorp/google"
              version = "~> 7.46"
            }
          }
        }

        provider "google" {
          project        = var.project_id
          region         = var.region
          default_labels = local.common_labels
        }
      variables.tf: |
        variable "project_id" {
          description = "Google Cloud project ID that owns the resources."
          type        = string
        }

        variable "region" {
          description = "Region for regional resources."
          type        = string
          default     = "europe-west1"
        }

        variable "zone" {
          description = "Zone for the worker VM."
          type        = string
          default     = "europe-west1-b"
        }
      main.tf: |
        locals {
          common_labels = {
            app         = "nimbo-learn"
            environment = "dev"
            owner       = "platform"
          }
        }

        resource "google_compute_network" "main" {
          name                    = "app-network"
          auto_create_subnetworks = false
        }

        resource "google_compute_subnetwork" "app" {
          name                     = "app-${var.region}"
          network                  = google_compute_network.main.id
          region                   = var.region
          ip_cidr_range            = "10.10.0.0/24"
          private_ip_google_access = true
        }

        resource "google_service_account" "worker" {
          account_id   = "worker-vm"
          display_name = "Worker VM"
        }

        resource "google_compute_instance" "worker" {
          name         = "worker"
          machine_type = "e2-small"
          zone         = var.zone

          boot_disk {
            initialize_params {
              image = "debian-cloud/debian-12"
            }
          }

          # No access_config: the VM has only an internal IP.
          network_interface {
            subnetwork = google_compute_subnetwork.app.id
          }

          service_account {
            email  = google_service_account.worker.email
            scopes = ["cloud-platform"]
          }

          shielded_instance_config {
            enable_secure_boot = true
          }
        }

        resource "google_compute_router" "nat" {
          name    = "app-router"
          network = google_compute_network.main.id
          region  = var.region
        }

        resource "google_compute_router_nat" "egress" {
          name                               = "app-nat"
          router                             = google_compute_router.nat.name
          region                             = var.region
          nat_ip_allocate_option             = "AUTO_ONLY"
          source_subnetwork_ip_ranges_to_nat = "LIST_OF_SUBNETWORKS"

          subnetwork {
            name                    = google_compute_subnetwork.app.id
            source_ip_ranges_to_nat = ["ALL_IP_RANGES"]
          }

          log_config {
            enable = true
            filter = "ERRORS_ONLY"
          }
        }
    starter:
