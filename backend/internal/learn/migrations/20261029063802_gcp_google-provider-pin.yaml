- op: upsert
  kind: challenge
  id: gcp-org-policy-guardrails
  data:
    provider: gcp
    level: expert
    title: Organization policy guardrails for a production folder
    summary: 'Enforce preventive org policies on a folder: no SA keys, no public buckets, no VM external IPs, EU-only locations.'
    minutes: 60
    tags:
    - organization-policy
    - governance
    - resource-hierarchy
    - security
    prerequisites:
    - gcp-storage-private-bucket
    - gcp-private-vm-cloud-nat
    runtime: design
    problem: |-
      Your company is moving production workloads into a dedicated **`production` folder**. Previous challenges fixed individual resources; the security team now wants **preventive guardrails** so that no project under this folder can reintroduce the same risks, whoever writes the Terraform.

      Using the Organization Policy Service on the folder, enforce: no downloadable service account keys, public access prevention and uniform bucket-level access on every bucket, no external IPs on VMs, and — for data residency — resources only in EU locations.
    requirements:
    - One `google_org_policy_policy` per constraint, with `parent` set to the `production` folder (policies inherit down the hierarchy).
    - '`iam.managed.disableServiceAccountKeyCreation` is enforced.'
    - '`storage.publicAccessPrevention` and `storage.uniformBucketLevelAccess` are enforced.'
    - '`compute.vmExternalIpAccess` denies all values.'
    - '`gcp.resourceLocations` allows only the `in:eu-locations` value group.'
    hints:
    - A policy's `name` is `<parent>/policies/<constraint>` — the constraint without the `constraints/` prefix, e.g. `${google_folder.production.name}/policies/storage.publicAccessPrevention`.
    - Boolean constraints use `spec { rules { enforce = "TRUE" } }`; list constraints use `deny_all = "TRUE"` or `values { allowed_values = [...] }`.
    - Value groups such as `in:eu-locations` cover every EU region and zone, including ones added later.
    solution: |
      The **Organization Policy Service** sets **constraints** on the resource hierarchy (organization → folders → projects). A policy set on a folder is **inherited** by every project below it, which makes folder-level policies a preventive guardrail that complements IAM: IAM says *who* can act, organization policies say *what* configurations are allowed. The enterprise foundations blueprint uses organization policy constraints as one of its core preventive controls.

      - `iam.managed.disableServiceAccountKeyCreation` blocks service account key creation: workloads use attached service accounts or Workload Identity Federation instead of long-lived keys.
      - `storage.publicAccessPrevention` and `storage.uniformBucketLevelAccess` make the bucket settings from the first challenge mandatory for every bucket.
      - `compute.vmExternalIpAccess` (list constraint) with `deny_all` stops VMs from getting external IPv4 addresses; egress goes through Cloud NAT.
      - `gcp.resourceLocations` with `in:eu-locations` restricts where location-based resources can be created.

      ```hcl
      resource "google_org_policy_policy" "no_sa_keys" {
        name   = "${google_folder.production.name}/policies/iam.managed.disableServiceAccountKeyCreation"
        parent = google_folder.production.name
        spec {
          rules {
            enforce = "TRUE"
          }
        }
      }

      resource "google_org_policy_policy" "no_vm_external_ips" {
        name   = "${google_folder.production.name}/policies/compute.vmExternalIpAccess"
        parent = google_folder.production.name
        spec {
          rules {
            deny_all = "TRUE"
          }
        }
      }

      resource "google_org_policy_policy" "eu_only" {
        name   = "${google_folder.production.name}/policies/gcp.resourceLocations"
        parent = google_folder.production.name
        spec {
          rules {
            values {
              allowed_values = ["in:eu-locations"]
            }
          }
        }
      }
      ```

      Roll out guardrails carefully: test them on a non-production folder first, since enforcing a constraint can block existing pipelines (for example, ones that still create service account keys).

      **Without writing code in Nimbo**

      The folder, the `parent` of each policy and the `spec` rules (enforce, deny all, allowed values) can be filled in the inspector. Each policy's `name`, though, is a string built from the folder created in the same workflow (`"${google_folder.production.name}/policies/<constraint>"`), so write those names in `main.tf`.
    solutionFiles:
      versions.tf: |
        terraform {
          required_version = ">= 1.6"

          required_providers {
            google = {
              source  = "hashicorp/google"
              version = "~> 7.46"
            }
          }
        }

        provider "google" {
          project        = var.project_id
          region         = var.region
          default_labels = local.common_labels
        }
      variables.tf: |
        variable "project_id" {
          description = "Google Cloud project ID that owns the resources."
          type        = string
        }

        variable "region" {
          description = "Region for regional resources."
          type        = string
          default     = "europe-west1"
        }

        variable "org_id" {
          description = "Numeric organization ID."
          type        = string
        }
      main.tf: |
        locals {
          common_labels = {
            app         = "nimbo-learn"
            environment = "dev"
            owner       = "platform"
          }
        }

        resource "google_folder" "production" {
          display_name = "production"
          parent       = "organizations/${var.org_id}"
        }

        # No downloadable service account keys: use attached service accounts or Workload Identity Federation.
        resource "google_org_policy_policy" "no_sa_keys" {
          name   = "${google_folder.production.name}/policies/iam.managed.disableServiceAccountKeyCreation"
          parent = google_folder.production.name

          spec {
            rules {
              enforce = "TRUE"
            }
          }
        }

        resource "google_org_policy_policy" "public_access_prevention" {
          name   = "${google_folder.production.name}/policies/storage.publicAccessPrevention"
          parent = google_folder.production.name

          spec {
            rules {
              enforce = "TRUE"
            }
          }
        }

        resource "google_org_policy_policy" "uniform_bucket_access" {
          name   = "${google_folder.production.name}/policies/storage.uniformBucketLevelAccess"
          parent = google_folder.production.name

          spec {
            rules {
              enforce = "TRUE"
            }
          }
        }

        resource "google_org_policy_policy" "no_vm_external_ips" {
          name   = "${google_folder.production.name}/policies/compute.vmExternalIpAccess"
          parent = google_folder.production.name

          spec {
            rules {
              deny_all = "TRUE"
            }
          }
        }

        # Data residency: resources only in EU locations.
        resource "google_org_policy_policy" "eu_only" {
          name   = "${google_folder.production.name}/policies/gcp.resourceLocations"
          parent = google_folder.production.name

          spec {
            rules {
              values {
                allowed_values = ["in:eu-locations"]
              }
            }
          }
        }
    starter:
      kind: terraform
      cloud: gcp
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              google = {
                source  = "hashicorp/google"
                version = "~> 7.46"
              }
            }
          }

          provider "google" {
            project        = var.project_id
            region         = var.region
            default_labels = local.common_labels
          }
        variables.tf: |
          variable "project_id" {
            description = "Google Cloud project ID that owns the resources."
            type        = string
          }

          variable "region" {
            description = "Region for regional resources."
            type        = string
            default     = "europe-west1"
          }

          variable "org_id" {
            description = "Numeric organization ID."
            type        = string
          }
        main.tf: |
          locals {
            common_labels = {
              app         = "nimbo-learn"
              environment = "dev"
              owner       = "platform"
            }
          }

          resource "google_folder" "production" {
            display_name = "production"
            parent       = "organizations/${var.org_id}"
          }
    checks:
    - id: validate
      label: The configuration validates
      type: validate
    - id: folder-scope
      label: Policies are attached to the production folder
      type: has
      has:
        terraform:
          type: google_org_policy_policy
          where:
            parent:
              ref: google_folder
          count:
            min: 5
    - id: no-sa-keys
      label: Service account key creation is disabled
      type: has
      has:
        terraform:
          type: google_org_policy_policy
          where:
            name:
              contains: iam.managed.disableServiceAccountKeyCreation
            spec.rules.enforce:
              in:
              - 'TRUE'
              - true
    - id: pap
      label: Public access prevention is mandatory
      type: has
      has:
        terraform:
          type: google_org_policy_policy
          where:
            name:
              contains: storage.publicAccessPrevention
            spec.rules.enforce:
              in:
              - 'TRUE'
              - true
    - id: ubla
      label: Uniform bucket-level access is mandatory
      type: has
      has:
        terraform:
          type: google_org_policy_policy
          where:
            name:
              contains: storage.uniformBucketLevelAccess
            spec.rules.enforce:
              in:
              - 'TRUE'
              - true
    - id: no-external-ip
      label: VMs can't get external IPs
      type: has
      has:
        terraform:
          type: google_org_policy_policy
          where:
            name:
              contains: compute.vmExternalIpAccess
            spec.rules.deny_all:
              in:
              - 'TRUE'
              - true
    - id: eu-only
      label: Resources are restricted to EU locations
      type: has
      has:
        terraform:
          type: google_org_policy_policy
          where:
            name:
              contains: gcp.resourceLocations
            spec.rules.values.allowed_values:
              contains: in:eu-locations
    sources:
    - title: Introduction to the Organization Policy Service
      url: https://docs.cloud.google.com/organization-policy/overview
    - title: Organization policy constraints reference
      url: https://docs.cloud.google.com/organization-policy/reference/org-policy-constraints
    - title: Restrict resource locations
      url: https://docs.cloud.google.com/organization-policy/restrict-locations
    - title: Resource hierarchy
      url: https://docs.cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy
    - title: Enterprise foundations blueprint
      url: https://docs.cloud.google.com/architecture/blueprints/security-foundations
    - title: Best practices for using service accounts securely
      url: https://docs.cloud.google.com/iam/docs/best-practices-service-accounts
    - title: 'Terraform google provider: google_org_policy_policy'
      url: https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/org_policy_policy
    solvableWithoutCode: false
