          }
    checks:
    - id: validate
      label: The configuration validates
      type: validate
    - id: run-behind-lb
      label: Cloud Run accepts only internal + load balancer traffic
      type: has
      has:
        terraform:
          type: google_cloud_run_v2_service
          where:
            ingress: INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER
    - id: waf-sqli
      label: Cloud Armor blocks SQL injection
      type: has
      has:
        terraform:
          type: google_compute_security_policy
          where:
            rule.match.expr.expression:
              contains: sqli-v33-stable
    - id: waf-xss
      label: Cloud Armor blocks cross-site scripting
