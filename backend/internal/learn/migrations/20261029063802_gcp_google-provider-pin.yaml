- op: upsert
  kind: challenge
  id: gcp-gke-hardened-cluster
  data:
    provider: gcp
    level: expert
    title: Harden a GKE Standard cluster baseline
    summary: Private nodes, authorized networks, Workload Identity, release channel, Shielded nodes and a least-privilege node pool.
    minutes: 75
    tags:
    - gke
    - kubernetes
    - security
    - workload-identity
    prerequisites:
    - gcp-private-vm-cloud-nat
    - gcp-cloud-run-least-privilege
    runtime: design
    problem: |-
      The platform team's first GKE Standard cluster was created with defaults: a default node pool whose nodes have **public IPs** and run as the **Compute Engine default service account**, a control plane reachable from any IP, no release channel, and pods that read node credentials from the metadata server.

      Rewrite `apps` as a hardened baseline following GKE's security guidance. (If you don't need node-level control, GKE Autopilot applies most of these settings for you — this challenge teaches what they are.)
    requirements:
    - VPC-native networking with named secondary ranges for Pods and Services.
    - '**Private nodes** (`enable_private_nodes = true`) and **authorized networks** limiting control-plane access to `var.admin_cidr`.'
    - '**Workload Identity Federation for GKE** enabled on the cluster (`PROJECT_ID.svc.id.goog`) and the GKE metadata server on nodes (`GKE_METADATA`).'
    - Enrolled in a **release channel** (REGULAR or STABLE), with auto-repair and auto-upgrade on the node pool.
    - The default node pool removed; a separately managed `google_container_node_pool` with autoscaling that runs as a **dedicated, minimally privileged** service account.
    - '**Shielded GKE Nodes** with Secure Boot.'
    hints:
    - '`remove_default_node_pool = true` with `initial_node_count = 1` is the documented pattern for managing node pools as separate resources.'
    - '`private_cluster_config { enable_private_nodes = true, master_ipv4_cidr_block = "172.16.0.0/28" }` plus `master_authorized_networks_config { cidr_blocks { ... } }`.'
    - Workload Identity is `workload_identity_config { workload_pool = "${var.project_id}.svc.id.goog" }` on the cluster and `workload_metadata_config { mode = "GKE_METADATA" }` in the node pool's `node_config`.
    - The minimum role for a node service account is `roles/container.defaultNodeServiceAccount`. Private nodes need Cloud NAT for internet egress (see the Cloud NAT challenge).
    solution: |
      GKE's hardening guide and its network isolation and identity docs drive every setting here:

      - **Private nodes** have only internal IPs, so nodes aren't reachable from the internet; egress uses Cloud NAT. **Authorized networks** restrict which IP ranges can reach the control plane's endpoint; without them it's reachable from any IP (still authenticated).
      - **Workload Identity Federation for GKE** lets Pods authenticate to Google Cloud APIs as Kubernetes ServiceAccounts, and the **GKE metadata server** (`GKE_METADATA`) stops Pods from reading the node's own credentials.
      - **Release channels** keep the control plane and nodes on supported, automatically upgraded versions; **auto-repair** and **auto-upgrade** keep node pools healthy and patched.
      - A **custom, minimally privileged node service account** with `roles/container.defaultNodeServiceAccount` replaces the default compute account, which may hold Editor.
      - **Shielded GKE Nodes** with Secure Boot provide verifiable node identity and integrity.

      ```hcl
      resource "google_container_cluster" "main" {
        name                     = "apps"
        location                 = var.region
        network                  = google_compute_network.gke.id
        subnetwork               = google_compute_subnetwork.gke.id
        remove_default_node_pool = true
        initial_node_count       = 1
        deletion_protection      = true

        release_channel { channel = "REGULAR" }

        ip_allocation_policy {
          cluster_secondary_range_name  = "pods"
          services_secondary_range_name = "services"
        }

        private_cluster_config {
          enable_private_nodes   = true
          master_ipv4_cidr_block = "172.16.0.0/28"
        }

        master_authorized_networks_config {
          cidr_blocks {
            cidr_block   = var.admin_cidr
            display_name = "corporate"
          }
        }

        workload_identity_config {
          workload_pool = "${var.project_id}.svc.id.goog"
        }

        enable_shielded_nodes = true
      }

      resource "google_container_node_pool" "general" {
        name     = "general"
        cluster  = google_container_cluster.main.id
        location = var.region

        autoscaling {
          min_node_count = 1
          max_node_count = 3
        }

        management {
          auto_repair  = true
          auto_upgrade = true
        }

        node_config {
          machine_type    = "e2-standard-4"
          service_account = google_service_account.gke_nodes.email
          oauth_scopes    = ["https://www.googleapis.com/auth/cloud-platform"]

          workload_metadata_config { mode = "GKE_METADATA" }

          shielded_instance_config {
            enable_secure_boot          = true
            enable_integrity_monitoring = true
          }
        }
      }
      ```

      **Without writing code in Nimbo**

      Most of the baseline (private nodes, authorized networks, release channel, the separate node pool, its service account and Shielded Nodes) is switches, selects and nested blocks in the inspector plus nodes from the palette. The part that needs code is the Workload Identity pool: `workload_pool = "${var.project_id}.svc.id.goog"` is a string built from a variable, so write it in `main.tf`.
    solutionFiles:
      versions.tf: |
        terraform {
          required_version = ">= 1.6"

          required_providers {
            google = {
              source  = "hashicorp/google"
              version = "~> 7.46"
            }
          }
        }

        provider "google" {
          project        = var.project_id
          region         = var.region
          default_labels = local.common_labels
        }
      variables.tf: |
        variable "project_id" {
          description = "Google Cloud project ID that owns the resources."
          type        = string
        }

        variable "region" {
          description = "Region for regional resources."
          type        = string
          default     = "europe-west1"
        }

        variable "admin_cidr" {
          description = "CIDR of the corporate network allowed to reach the control plane."
          type        = string
          default     = "203.0.113.0/24"
        }
      main.tf: |
        locals {
          common_labels = {
            app         = "nimbo-learn"
            environment = "dev"
            owner       = "platform"
          }
        }

        resource "google_compute_network" "gke" {
          name                    = "gke-network"
          auto_create_subnetworks = false
        }

        resource "google_compute_subnetwork" "gke" {
          name                     = "gke-${var.region}"
          network                  = google_compute_network.gke.id
          region                   = var.region
          ip_cidr_range            = "10.20.0.0/20"
          private_ip_google_access = true

          secondary_ip_range {
            range_name    = "pods"
            ip_cidr_range = "10.24.0.0/14"
          }

          secondary_ip_range {
            range_name    = "services"
            ip_cidr_range = "10.28.0.0/20"
          }
        }

        resource "google_service_account" "gke_nodes" {
          account_id   = "gke-nodes"
          display_name = "GKE node pools (minimal)"
        }

        # Minimal roles for nodes to write logs and metrics.
        resource "google_project_iam_member" "gke_nodes" {
          for_each = toset([
            "roles/container.defaultNodeServiceAccount",
          ])

          project = var.project_id
          role    = each.value
          member  = "serviceAccount:${google_service_account.gke_nodes.email}"
        }

        resource "google_container_cluster" "main" {
          name       = "apps"
          location   = var.region
          network    = google_compute_network.gke.id
          subnetwork = google_compute_subnetwork.gke.id

          # Node pools are managed separately.
          remove_default_node_pool = true
          initial_node_count       = 1
          deletion_protection      = true

          release_channel {
            channel = "REGULAR"
          }

          ip_allocation_policy {
            cluster_secondary_range_name  = "pods"
            services_secondary_range_name = "services"
          }

          private_cluster_config {
            enable_private_nodes    = true
            enable_private_endpoint = false
            master_ipv4_cidr_block  = "172.16.0.0/28"
          }

          master_authorized_networks_config {
            cidr_blocks {
              cidr_block   = var.admin_cidr
              display_name = "corporate"
            }
          }

          workload_identity_config {
            workload_pool = "${var.project_id}.svc.id.goog"
          }

          enable_shielded_nodes = true

          network_policy {
            enabled = true
          }

          addons_config {
            network_policy_config {
              disabled = false
            }
          }

          maintenance_policy {
            recurring_window {
              start_time = "2026-01-01T03:00:00Z"
              end_time   = "2026-01-01T07:00:00Z"
              recurrence = "FREQ=WEEKLY;BYDAY=SA,SU"
            }
          }
        }

        resource "google_container_node_pool" "general" {
          name     = "general"
          cluster  = google_container_cluster.main.id
          location = var.region

          autoscaling {
            min_node_count = 1
            max_node_count = 3
          }

          management {
            auto_repair  = true
            auto_upgrade = true
          }

          node_config {
            machine_type    = "e2-standard-4"
            service_account = google_service_account.gke_nodes.email
            oauth_scopes    = ["https://www.googleapis.com/auth/cloud-platform"]

            workload_metadata_config {
              mode = "GKE_METADATA"
            }

            shielded_instance_config {
              enable_secure_boot          = true
              enable_integrity_monitoring = true
            }
          }
        }
    starter:
      kind: terraform
      cloud: gcp
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              google = {
                source  = "hashicorp/google"
                version = "~> 7.46"
              }
            }
          }

          provider "google" {
            project        = var.project_id
            region         = var.region
            default_labels = local.common_labels
          }
        variables.tf: |
          variable "project_id" {
            description = "Google Cloud project ID that owns the resources."
            type        = string
          }

          variable "region" {
            description = "Region for regional resources."
            type        = string
            default     = "europe-west1"
          }

          variable "admin_cidr" {
            description = "CIDR of the corporate network allowed to reach the control plane."
            type        = string
            default     = "203.0.113.0/24"
          }
        main.tf: |
          locals {
            common_labels = {
              app         = "nimbo-learn"
              environment = "dev"
              owner       = "platform"
            }
          }

          resource "google_compute_network" "gke" {
            name                    = "gke-network"
            auto_create_subnetworks = false
          }

          resource "google_compute_subnetwork" "gke" {
            name                     = "gke-${var.region}"
            network                  = google_compute_network.gke.id
            region                   = var.region
            ip_cidr_range            = "10.20.0.0/20"
            private_ip_google_access = true

            secondary_ip_range {
              range_name    = "pods"
              ip_cidr_range = "10.24.0.0/14"
            }

            secondary_ip_range {
              range_name    = "services"
              ip_cidr_range = "10.28.0.0/20"
            }
          }

          resource "google_container_cluster" "main" {
            name     = "apps"
            location = var.region
            network    = google_compute_network.gke.id
            subnetwork = google_compute_subnetwork.gke.id

            initial_node_count  = 3
            deletion_protection = false

            node_config {
              machine_type = "e2-standard-4"
            }
          }
    checks:
    - id: validate
      label: The configuration validates
      type: validate
    - id: vpc-native
      label: The cluster is VPC-native with secondary ranges
      type: has
      has:
        terraform:
          type: google_container_cluster
          where:
            ip_allocation_policy.cluster_secondary_range_name:
              exists: true
            ip_allocation_policy.services_secondary_range_name:
              exists: true
    - id: private-nodes
      label: Nodes are private
      type: has
      has:
        terraform:
          type: google_container_cluster
          where:
            private_cluster_config.enable_private_nodes: true
    - id: authorized-networks
      label: Control-plane access is limited to authorized networks
      type: has
      has:
        terraform:
          type: google_container_cluster
          where:
            master_authorized_networks_config.cidr_blocks.cidr_block:
              exists: true
    - id: workload-identity
      label: Workload Identity Federation is enabled
      type: has
      has:
        terraform:
          type: google_container_cluster
          where:
            workload_identity_config.workload_pool:
              contains: svc.id.goog
    - id: release-channel
      label: The cluster follows a release channel
      type: has
      has:
        terraform:
          type: google_container_cluster
          where:
            release_channel.channel:
              in:
              - REGULAR
              - STABLE
    - id: no-default-pool
      label: The default node pool is removed
      type: has
      has:
        terraform:
          type: google_container_cluster
          where:
            remove_default_node_pool: true
    - id: node-sa
      label: Nodes run as a dedicated service account
      type: has
      has:
        terraform:
          type: google_container_node_pool
          where:
            node_config.service_account:
              ref: google_service_account
    - id: metadata-server
      label: Pods use the GKE metadata server
      type: has
      has:
        terraform:
          type: google_container_node_pool
          where:
            node_config.workload_metadata_config.mode: GKE_METADATA
    - id: shielded
      label: Shielded nodes with Secure Boot
      type: has
      has:
        terraform:
          type: google_container_node_pool
          where:
            node_config.shielded_instance_config.enable_secure_boot: true
    - id: auto-upgrade
      label: Node pools auto-repair and auto-upgrade
      type: has
      has:
        terraform:
          type: google_container_node_pool
