- op: upsert
  kind: challenge
  id: gcp-https-lb-cloud-armor
  data:
    provider: gcp
    level: advanced
    title: Global HTTPS load balancer with Cloud Armor in front of Cloud Run
    summary: Serve Cloud Run only through an external Application Load Balancer with a managed certificate, WAF rules and rate limiting.
    minutes: 60
    tags:
    - load-balancing
    - cloud-armor
    - cloud-run
    - tls
    - waf
    prerequisites:
    - gcp-cloud-run-least-privilege
    runtime: design
    problem: |-
      The public `web` frontend runs on Cloud Run behind a global external Application Load Balancer — but the load balancer only listens on **plain HTTP**, there's no edge security policy, and the Cloud Run service still accepts requests sent straight to its `run.app` URL, bypassing the load balancer entirely.

      The security review asks for: TLS with a Google-managed certificate, HTTP redirected to HTTPS, **Cloud Armor** blocking common web attacks (SQL injection, cross-site scripting) and throttling abusive clients, and no way around the load balancer.
    requirements:
    - Cloud Run `web` accepts traffic only from internal sources and Cloud Load Balancing.
    - A `google_compute_security_policy` with preconfigured WAF rules for **SQL injection** (`sqli-v33-stable`) and **XSS** (`xss-v33-stable`), and a `throttle` rate-limiting rule.
    - The backend service (serverless NEG → Cloud Run) attaches that security policy and logs requests.
    - 'HTTPS: a `google_compute_managed_ssl_certificate` for `var.domain`, a `google_compute_target_https_proxy` and a forwarding rule on port 443 with a reserved global IP.'
    - Port 80 only redirects to HTTPS (a URL map with `default_url_redirect`).
    hints:
    - Cloud Armor is a security policy from the palette with one `rule` block per rule. WAF rules use expressions such as `evaluatePreconfiguredWaf('sqli-v33-stable')`, typed in the rule's `match` → `expr` → `expression` field.
    - Rate limiting is a rule with action `throttle` and a `rate_limit_options` block (conform action, exceed action, key, threshold). A security policy also needs the default rule at priority `2147483647`. Attach the policy with Link to… on the backend service's `security_policy` and turn its `log_config` on.
    - For HTTPS add a managed SSL certificate (Link to… `var.domain` in its domains), an HTTPS proxy (Link to… the URL map and the certificate) and a reserved global address. Use that one address in both forwarding rules (443 → HTTPS proxy, 80 → a redirect URL map with `https_redirect` on).
    solution: |
      The **global external Application Load Balancer** terminates TLS at Google's edge and routes to backends — here a **serverless NEG** pointing at the Cloud Run service. **Google-managed SSL certificates** are provisioned and renewed automatically for the domains you list once DNS points at the load balancer's IP.

      **Cloud Armor** security policies attach to backend services of the external Application Load Balancer and are evaluated at the edge, before traffic reaches your service. Preconfigured WAF rules (`sqli-v33-stable`, `xss-v33-stable`, …) are based on the OWASP ModSecurity Core Rule Set. Each signature has a sensitivity level: lower levels are higher-confidence signatures with fewer false positives, so the docs suggest starting at sensitivity 1 (in preview mode while tuning). **Rate limiting** with `throttle` caps the request rate per client key (here per IP); requests above the threshold get the `exceed_action` — `429 Too Many Requests` is the recommended code.

      To make the load balancer the only way in, set the Cloud Run service's ingress to **internal and Cloud Load Balancing**: direct requests to the `run.app` URL from the internet are then rejected, so Cloud Armor can't be bypassed. Finally, an HTTP forwarding rule whose URL map only performs an `https_redirect` keeps port 80 for redirects.

      ```hcl
      resource "google_compute_security_policy" "web" {
        name = "web-edge-policy"
        type = "CLOUD_ARMOR"

        rule {
          action   = "deny(403)"
          priority = 1000
          match {
            expr {
              expression = "evaluatePreconfiguredWaf('sqli-v33-stable', {'sensitivity': 1})"
            }
          }
        }
        # ... xss-v33-stable at 1001, throttle at 2000, default allow at 2147483647
      }

      resource "google_compute_backend_service" "web" {
        name                  = "web-backend"
        load_balancing_scheme = "EXTERNAL_MANAGED"
        security_policy       = google_compute_security_policy.web.id

        backend {
          group = google_compute_region_network_endpoint_group.web.id
        }

        log_config {
          enable      = true
          sample_rate = 1
        }
      }

      resource "google_compute_target_https_proxy" "web" {
        name             = "web-https-proxy"
        url_map          = google_compute_url_map.web.id
        ssl_certificates = [google_compute_managed_ssl_certificate.web.id]
      }
      ```

      **Without writing code in Nimbo**

      1. Add a **security policy** from the palette named `web-armor` with four **rule** blocks:
         - `deny(403)`, priority `1000`, expression `evaluatePreconfiguredWaf('sqli-v33-stable')`;
         - `deny(403)`, priority `1001`, expression `evaluatePreconfiguredWaf('xss-v33-stable')`;
         - `throttle`, priority `2000`, match `SRC_IPS_V1` on `*`, with **rate_limit_options**: conform `allow`, exceed `deny(429)`, key `IP`, threshold `100` per `60` seconds;
         - `allow`, priority `2147483647`, match `SRC_IPS_V1` on `*` (the default rule).
      2. Click the backend service `web`: **Link to…** `security_policy` → the policy's id, and add **log_config** with enable on and sample rate `1`.
      3. Add a **managed SSL certificate** `web-cert` and use **Link to…** on **domains** to add `var.domain`.
      4. Add a **target HTTPS proxy** `web-https-proxy`: **Link to…** the `web` URL map and, on **ssl_certificates**, the certificate's id.
      5. Add a **global address** `web-ip` and a **global forwarding rule** `web-https`: scheme `EXTERNAL_MANAGED`, port `443`, **Link to…** the HTTPS proxy as target and the address.
      6. Add a **URL map** `web-http-redirect` with **default_url_redirect** (https redirect on, strip query off). **Link to…** it from the existing HTTP proxy's **url_map**, and link the existing forwarding rule `web` to the same global address.
    solutionFiles:
      versions.tf: |
        terraform {
          required_version = ">= 1.6"

          required_providers {
            google = {
              source  = "hashicorp/google"
              version = "~> 7.46"
            }
          }
        }

        provider "google" {
          project        = var.project_id
          region         = var.region
          default_labels = local.common_labels
        }
      variables.tf: |
        variable "project_id" {
          description = "Google Cloud project ID that owns the resources."
          type        = string
        }

        variable "region" {
          description = "Region for regional resources."
          type        = string
          default     = "europe-west1"
        }

        variable "image" {
          description = "Container image of the orders API (Artifact Registry path)."
          type        = string
          default     = "us-docker.pkg.dev/cloudrun/container/hello"
        }

        variable "domain" {
          description = "Public hostname served by the load balancer."
          type        = string
        }
      main.tf: |
        locals {
          common_labels = {
            app         = "nimbo-learn"
            environment = "dev"
            owner       = "platform"
          }
        }

        resource "google_service_account" "web" {
          account_id   = "web-frontend"
          display_name = "Web frontend runtime"
        }

        resource "google_cloud_run_v2_service" "web" {
          name     = "web"
          location = var.region
          ingress  = "INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER"

          template {
            service_account = google_service_account.web.email

            containers {
              image = var.image
            }
          }
        }

        resource "google_compute_region_network_endpoint_group" "web" {
          name                  = "web-neg"
          region                = var.region
          network_endpoint_type = "SERVERLESS"

          cloud_run {
            service = google_cloud_run_v2_service.web.name
          }
        }

        resource "google_compute_security_policy" "web" {
          name = "web-edge-policy"
          type = "CLOUD_ARMOR"

          rule {
            action      = "deny(403)"
            priority    = 1000
            description = "Block SQL injection (preconfigured WAF rule)"
            match {
              expr {
                expression = "evaluatePreconfiguredWaf('sqli-v33-stable', {'sensitivity': 1})"
              }
            }
          }

          rule {
            action      = "deny(403)"
            priority    = 1001
            description = "Block cross-site scripting (preconfigured WAF rule)"
            match {
              expr {
                expression = "evaluatePreconfiguredWaf('xss-v33-stable', {'sensitivity': 1})"
              }
            }
          }

          rule {
            action      = "throttle"
            priority    = 2000
            description = "Throttle clients above 100 requests per minute"
            match {
              versioned_expr = "SRC_IPS_V1"
              config {
                src_ip_ranges = ["*"]
              }
            }
            rate_limit_options {
              conform_action = "allow"
              exceed_action  = "deny(429)"
              enforce_on_key = "IP"
              rate_limit_threshold {
                count        = 100
                interval_sec = 60
              }
            }
          }

          rule {
            action      = "allow"
            priority    = 2147483647
            description = "Default rule"
            match {
              versioned_expr = "SRC_IPS_V1"
              config {
                src_ip_ranges = ["*"]
              }
            }
          }
        }

        resource "google_compute_backend_service" "web" {
          name                  = "web-backend"
          load_balancing_scheme = "EXTERNAL_MANAGED"
          security_policy       = google_compute_security_policy.web.id

          backend {
            group = google_compute_region_network_endpoint_group.web.id
          }

          log_config {
            enable      = true
            sample_rate = 1
          }
        }

        resource "google_compute_url_map" "web" {
          name            = "web-url-map"
          default_service = google_compute_backend_service.web.id
        }

        resource "google_compute_managed_ssl_certificate" "web" {
          name = "web-cert"

          managed {
            domains = [var.domain]
          }
        }

        resource "google_compute_target_https_proxy" "web" {
          name             = "web-https-proxy"
          url_map          = google_compute_url_map.web.id
          ssl_certificates = [google_compute_managed_ssl_certificate.web.id]
        }

        resource "google_compute_global_address" "web" {
          name = "web-ip"
        }

        resource "google_compute_global_forwarding_rule" "web" {
          name                  = "web-https"
          load_balancing_scheme = "EXTERNAL_MANAGED"
          target                = google_compute_target_https_proxy.web.id
          ip_address            = google_compute_global_address.web.id
          port_range            = "443"
        }

        # Plain HTTP only redirects to HTTPS.
        resource "google_compute_url_map" "https_redirect" {
          name = "web-https-redirect"

          default_url_redirect {
            https_redirect         = true
            redirect_response_code = "MOVED_PERMANENTLY_DEFAULT"
            strip_query            = false
          }
        }

        resource "google_compute_target_http_proxy" "https_redirect" {
          name    = "web-http-redirect"
          url_map = google_compute_url_map.https_redirect.id
        }

        resource "google_compute_global_forwarding_rule" "http_redirect" {
          name                  = "web-http-redirect"
          load_balancing_scheme = "EXTERNAL_MANAGED"
          target                = google_compute_target_http_proxy.https_redirect.id
          ip_address            = google_compute_global_address.web.id
          port_range            = "80"
        }
    starter:
      kind: terraform
      cloud: gcp
      files:
        versions.tf: |
          terraform {
            required_version = ">= 1.6"

            required_providers {
              google = {
                source  = "hashicorp/google"
                version = "~> 7.46"
              }
            }
          }

          provider "google" {
            project        = var.project_id
            region         = var.region
            default_labels = local.common_labels
          }
        variables.tf: |
          variable "project_id" {
            description = "Google Cloud project ID that owns the resources."
            type        = string
          }

          variable "region" {
            description = "Region for regional resources."
            type        = string
            default     = "europe-west1"
          }

          variable "image" {
            description = "Container image of the orders API (Artifact Registry path)."
            type        = string
            default     = "us-docker.pkg.dev/cloudrun/container/hello"
          }

          variable "domain" {
            description = "Public hostname served by the load balancer."
            type        = string
          }
        main.tf: |
          locals {
            common_labels = {
              app         = "nimbo-learn"
              environment = "dev"
              owner       = "platform"
            }
          }

          resource "google_service_account" "web" {
            account_id   = "web-frontend"
            display_name = "Web frontend runtime"
          }

          resource "google_cloud_run_v2_service" "web" {
            name     = "web"
            location = var.region
            ingress  = "INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER"

