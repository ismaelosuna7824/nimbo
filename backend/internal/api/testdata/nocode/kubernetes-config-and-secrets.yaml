# A Secret from the palette, renamed orders-credentials in the inspector
# header; its key form drops the sample keys and gets DB_PASSWORD and
# PAYMENTS_API_TOKEN (plain text under stringData). The ConfigMap's key
# form removes the token, and the environment row of DB_PASSWORD switches
# to "Secret key" orders-credentials/DB_PASSWORD.
steps:
  - kubeAdd: {itemId: secret}
  - kubeRename: {node: Secret/orders/credentials, name: orders-credentials}
  - kubePatch:
      node: Secret/orders/orders-credentials
      set:
        stringData.DB_PASSWORD: Sup3r-S3cret-2026
        stringData.PAYMENTS_API_TOKEN: tok_live_9f8a7c6b5e4d3c2b1a
      unset: [stringData.USERNAME, stringData.PASSWORD]
  - kubePatch:
      node: ConfigMap/orders/orders-config
      unset: [data.PAYMENTS_API_TOKEN]
  - kubePatch:
      node: Deployment/orders/orders
      set:
        spec.template.spec.containers[name=orders].env[name=DB_PASSWORD].valueFrom:
          secretKeyRef: {name: orders-credentials, key: DB_PASSWORD}
      unset:
        - spec.template.spec.containers[name=orders].env[name=DB_PASSWORD].value
