# Hardening section, "Secrets as files": Move to a secret file on
# POSTGRES_PASSWORD (named db_password, POSTGRES_PASSWORD_FILE checked:
# postgres reads it), then on the api's PGPASSWORD reusing db_password
# (PGPASSWORD_FILE checked: the app reads it).
steps:
  - composePatch: {service: db, patch: {secretFromEnv: {key: POSTGRES_PASSWORD, secret: db_password, fileEnv: true}}}
  - composePatch: {service: api, patch: {secretFromEnv: {key: PGPASSWORD, secret: db_password, fileEnv: true}}}
