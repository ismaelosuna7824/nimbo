# A PodDisruptionBudget from the palette, pointed at the web pods in its
# form's selector (minAvailable 1), the workload form's Spread select
# ("across zones"), and 3 replicas in the prod environment's settings
# (written to the overlay).
steps:
  - kubeAdd: {itemId: pdb}
  - kubePatch:
      node: PodDisruptionBudget/default/web-2
      set:
        spec.selector.matchLabels: {app: web}
  - kubePatch:
      node: Deployment/default/web
      set:
        spec.template.spec.topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector: {matchLabels: {app: web}}
  - envSettings: {env: prod, values: {replicas: "3"}}
