# reserved_peering_ranges is a list: Link to… appends the reserved
# range's name to it.
steps:
  - add: {type: google_compute_global_address, name: private_services}
  - set:
      node: google_compute_global_address.private_services
      attrs:
        name: private-services
        purpose: VPC_PEERING
        address_type: INTERNAL
        prefix_length: 16
        network: {link: google_compute_network.main.id}
  - add: {type: google_service_networking_connection, name: private}
  - set:
      node: google_service_networking_connection.private
      attrs:
        network: {link: google_compute_network.main.id}
        service: servicenetworking.googleapis.com
        reserved_peering_ranges: {link: google_compute_global_address.private_services.name, append: true}
  - set:
      node: google_sql_database_instance.orders
      attrs:
        deletion_protection: true
        settings[0].availability_type: REGIONAL
        settings[0].ip_configuration[0].authorized_networks[0]: {unset: true}
        settings[0].ip_configuration[0].ipv4_enabled: false
        settings[0].ip_configuration[0].private_network: {link: google_compute_network.main.id}
        settings[0].ip_configuration[0].ssl_mode: ENCRYPTED_ONLY
        settings[0].backup_configuration[0].enabled: true
        settings[0].backup_configuration[0].point_in_time_recovery_enabled: true
        settings[0].backup_configuration[0].backup_retention_settings[0].retained_backups: 7
