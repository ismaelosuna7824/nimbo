# The private endpoint's DNS zone group gets the zone with Link to…,
# which appends the zone id to private_dns_zone_ids (a list).
steps:
  - delete: {node: azurerm_mssql_firewall_rule.allow_all}
  - add: {type: azurerm_client_config, kind: data, name: current}
  - set:
      node: azurerm_mssql_server.orders
      attrs:
        public_network_access_enabled: false
        minimum_tls_version: "1.2"
        administrator_login: {unset: true}
        administrator_login_password: {unset: true}
        azuread_administrator[0].login_username: sql-admins
        azuread_administrator[0].object_id: {link: data.azurerm_client_config.current.object_id}
        azuread_administrator[0].azuread_authentication_only: true
  - variable: {name: sql_admin_password, sensitive: true}
  - add: {type: azurerm_private_dns_zone, name: sql}
  - connect: {source: azurerm_resource_group.main, target: azurerm_private_dns_zone.sql, recipe: azure-resource-group}
  - set:
      node: azurerm_private_dns_zone.sql
      attrs:
        name: privatelink.database.windows.net
  - add: {type: azurerm_private_dns_zone_virtual_network_link, name: sql}
  - connect: {source: azurerm_resource_group.main, target: azurerm_private_dns_zone_virtual_network_link.sql, recipe: azure-resource-group}
  - set:
      node: azurerm_private_dns_zone_virtual_network_link.sql
      attrs:
        name: sql-vnet-link
        private_dns_zone_name: {link: azurerm_private_dns_zone.sql.name}
        virtual_network_id: {link: azurerm_virtual_network.main.id}
  - add: {type: azurerm_private_endpoint, name: sql}
  - connect: {source: azurerm_resource_group.main, target: azurerm_private_endpoint.sql, recipe: azure-resource-group}
  - set:
      node: azurerm_private_endpoint.sql
      attrs:
        name: pe-sql
        subnet_id: {link: azurerm_subnet.data.id}
        private_service_connection[0].name: sql
        private_service_connection[0].private_connection_resource_id: {link: azurerm_mssql_server.orders.id}
        private_service_connection[0].is_manual_connection: false
        private_service_connection[0].subresource_names: [sqlServer]
        private_dns_zone_group[0].name: sql
        private_dns_zone_group[0].private_dns_zone_ids: {link: azurerm_private_dns_zone.sql.id, append: true}
