global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    # A request whose replica just died is sent to another one.
    option redispatch
    retries 2
    retry-on conn-failure empty-response response-timeout

# Docker's embedded DNS: "app" resolves to one address per replica.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

frontend public
    bind :8080
    # The load balancer's own health (used by the container healthcheck).
    monitor-uri /healthz
    default_backend app

backend app
    balance roundrobin
    # Active health checks: 2 failures in a row → out, 2 successes → back in.
    option httpchk GET /health
    http-check expect status 200
    default-server inter 2s fall 2 rise 2
    # Up to 3 servers filled from the DNS answers for "app".
    server-template app 3 app:8080 check resolvers docker init-addr none

frontend stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
