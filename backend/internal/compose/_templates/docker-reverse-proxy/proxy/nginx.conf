# Two upstreams the clients never see: they only talk to this proxy.
upstream api {
    server api:8080;
}

upstream web {
    server web:8080;
}

server {
    listen 80;
    # Don't advertise the NGINX version.
    server_tokens off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # /api/orders → http://api:8080/orders (the trailing slash strips /api).
    location /api/ {
        proxy_pass http://api/;
    }

    location / {
        proxy_pass http://web;
    }
}
