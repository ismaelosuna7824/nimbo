name: Release

# Automatic releases from Conventional Commits (see docs/RELEASING.md):
# - push to main      -> compute the next version since the last vX.Y.Z tag; when there are
#                        releasable commits (feat, fix, perf, breaking), build every platform,
#                        smoke-test, then tag the commit and publish "Nimbo vX.Y.Z" with the
#                        installers, updater artifacts, latest.json and SHA256SUMS.txt.
# - workflow_dispatch -> dry_run (default) builds everything with the would-be version and uploads
#                        the assets as workflow artifacts only; dry_run=false on main acts like a push.
# The tag is created by the publish job, after all builds succeed (tags pushed with GITHUB_TOKEN
# don't trigger workflows, so everything happens in this one run).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload artifacts without creating a release
        type: boolean
        default: true

# One release run at a time; a newer push waits (and covers every commit since the last tag).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      nimbo_version: ${{ steps.v.outputs.nimbo_version }}
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: v
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          bun scripts/release/next-version.ts --repo "$GITHUB_REPOSITORY" --notes changelog.md | tee next.env
          source next.env
          if [[ "$DRY_RUN" == "true" ]]; then
            build=true publish=false nimbo_version="$tag-dryrun+${GITHUB_SHA::7}"
          elif [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::releases are published from main only; use dry_run on other branches"
            exit 1
          else
            build="$release" publish="$release" nimbo_version="$tag"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "nimbo_version=$nimbo_version"
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### $tag — release: $release, publish: $publish (previous: ${previous_tag:-none})"
            echo
            cat changelog.md
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$build" != "true" ]]; then
            echo "No releasable commits since ${previous_tag:-the start} (only docs/ci/chore/test/…): nothing to release."
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: changelog.md

  build:
    name: Build ${{ matrix.name }}
    needs: meta
    if: needs.meta.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-universal
            runner: macos-latest
            platform: macos
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows-x64
            runner: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Linux-x86_64
            runner: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - name: Linux-aarch64
            runner: ubuntu-22.04-arm
            platform: linux
            target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      NIMBO_VERSION: ${{ needs.meta.outputs.nimbo_version }}
      BUNDLE_DIR: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
      SIDECAR: apps/desktop/src-tauri/binaries/nimbo-${{ matrix.target }}${{ matrix.platform == 'windows' && '.exe' || '' }}
      PREFIX: Nimbo-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            build-essential file patchelf xdg-utils rpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile
      - name: Set app version
        working-directory: apps/desktop
        run: bun scripts/set-version.ts "$VERSION"
      - name: Build sidecar
        working-directory: apps/desktop
        run: bun scripts/build-sidecar.ts --target ${{ matrix.target }}
      - name: Build app
        working-directory: apps/desktop
        env:
          # Signs the updater artifacts (.app.tar.gz, NSIS .exe, AppImage) -> <file>.sig.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy (AppImage) runs as an AppImage itself and can't strip newer ELF sections.
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        # createUpdaterArtifacts is only on here, so local builds (setup.sh) need no signing key.
        run: >-
          bunx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Smoke test (macOS)
        if: matrix.platform == 'macos'
        run: |
          app="$BUNDLE_DIR/macos/Nimbo.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          for bin in "$app/Contents/MacOS/"*; do
            echo "== $bin: $(lipo -archs "$bin")"
            [[ "$(lipo -archs "$bin")" == *x86_64* && "$(lipo -archs "$bin")" == *arm64* ]]
            codesign -dv "$bin" 2>&1 | grep "Signature=adhoc"
          done
          test "$("$app/Contents/MacOS/nimbo" version)" = "$NIMBO_VERSION"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")" = "$VERSION"

      - name: Smoke test (Windows sidecar + silent NSIS install)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = & $env:SIDECAR version
          if ($v -ne $env:NIMBO_VERSION) { throw "sidecar version '$v' != '$env:NIMBO_VERSION'" }
          $env:NIMBO_HOME = Join-Path $env:RUNNER_TEMP 'nimbo-home'
          $doctor = & $env:SIDECAR doctor --json | Out-String
          Write-Host "doctor exit code: $LASTEXITCODE (1 = not ready, expected without Docker)"
          if ($LASTEXITCODE -gt 1) { throw "doctor failed with exit code $LASTEXITCODE" }
          $status = $doctor | ConvertFrom-Json
          Write-Host "doctor: ready=$($status.ready) platform=$($status.platform) arch=$($status.arch)"

          $setup = Get-ChildItem "$env:BUNDLE_DIR/nsis/*-setup.exe" | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'nimbo-install'
          $p = Start-Process -Wait -PassThru -FilePath $setup.FullName -ArgumentList '/S', "/D=$dir"
          if ($p.ExitCode -ne 0) { throw "NSIS installer exited with $($p.ExitCode)" }
          Get-ChildItem $dir | Format-Table Name, Length
          $installed = Join-Path $dir 'nimbo.exe'
          if (-not (Test-Path $installed)) { throw "sidecar missing from $dir" }
          $iv = & $installed version
          if ($iv -ne $env:NIMBO_VERSION) { throw "installed sidecar version '$iv' != '$env:NIMBO_VERSION'" }
          foreach ($exe in 'nimbo-desktop.exe', 'uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $exe))) { throw "$exe missing from $dir" }
          }

      - name: Smoke test (Linux AppImage, deb, rpm)
        if: matrix.platform == 'linux'
        run: |
          work="$(mktemp -d)"
          cp "$BUNDLE_DIR"/appimage/*.AppImage "$work/Nimbo.AppImage"
          chmod +x "$work/Nimbo.AppImage"
          (cd "$work" && ./Nimbo.AppImage --appimage-extract >/dev/null)
          test "$("$work/squashfs-root/usr/bin/nimbo" version)" = "$NIMBO_VERSION"
          deb="$(ls "$BUNDLE_DIR"/deb/*.deb)"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | grep -E '[ /]usr/bin/nimbo$'
          rpm -qip "$BUNDLE_DIR"/rpm/*.rpm
          rpm -qlp "$BUNDLE_DIR"/rpm/*.rpm | grep -x /usr/bin/nimbo

      - name: Collect assets
        run: |
          mkdir -p release
          one() { # exactly one file matches the glob
            local matches=($1)
            if [[ ${#matches[@]} -ne 1 || ! -e "${matches[0]}" ]]; then
              echo "::error::expected one file for $1, got: ${matches[*]}"
              exit 1
            fi
            cp "${matches[0]}" "release/$2"
          }
          case "${{ matrix.platform }}" in
            macos)
              one "$BUNDLE_DIR/dmg/*.dmg" "$PREFIX.dmg"
              one "$BUNDLE_DIR/macos/*.app.tar.gz" "$PREFIX.app.tar.gz"
              one "$BUNDLE_DIR/macos/*.app.tar.gz.sig" "$PREFIX.app.tar.gz.sig"
              ;;
            windows)
              one "$BUNDLE_DIR/nsis/*-setup.exe" "$PREFIX-setup.exe"
              one "$BUNDLE_DIR/nsis/*-setup.exe.sig" "$PREFIX-setup.exe.sig"
              one "$BUNDLE_DIR/msi/*.msi" "$PREFIX.msi"
              ;;
            linux)
              one "$BUNDLE_DIR/appimage/*.AppImage" "$PREFIX.AppImage"
              one "$BUNDLE_DIR/appimage/*.AppImage.sig" "$PREFIX.AppImage.sig"
              one "$BUNDLE_DIR/deb/*.deb" "$PREFIX.deb"
              one "$BUNDLE_DIR/rpm/*.rpm" "$PREFIX.rpm"
              ;;
          esac
          ls -l release
      - uses: actions/upload-artifact@v7
        with:
          name: nimbo-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish (artifacts only on dry runs)
    needs: [meta, build]
    if: needs.meta.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          pattern: nimbo-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: changelog
      - name: Updater manifest (latest.json)
        run: >-
          bun scripts/release/updater-manifest.ts --dir release --version "$VERSION" --notes changelog.md
          --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
      - name: Checksums
        working-directory: release
        run: |
          sha256sum -- * | sort -k2 > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt
      - name: Release notes
        run: |
          python3 - <<'EOF'
          import os, pathlib
          notes = pathlib.Path(".github/release-notes.md").read_text()
          for key, value in {
              "{{TAG}}": os.environ["TAG"],
              "{{REPO}}": os.environ["GITHUB_REPOSITORY"],
              "{{CHANGELOG}}": pathlib.Path("changelog.md").read_text().strip(),
              "{{CHECKSUMS}}": pathlib.Path("release/SHA256SUMS.txt").read_text().strip(),
          }.items():
              notes = notes.replace(key, value)
          pathlib.Path("release-notes.md").write_text(notes)
          EOF
          cat release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: |
            release-notes.md
            release/SHA256SUMS.txt
            release/latest.json
      - name: Tag and publish the GitHub release
        if: needs.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-run of a published release: refresh assets and notes.
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Nimbo $TAG" --notes-file release-notes.md
            exit 0
          fi
          tagged="$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)"
          if [[ -n "$tagged" && "$tagged" != "$GITHUB_SHA" ]]; then
            echo "::error::$TAG already points at $tagged, not $GITHUB_SHA"
            exit 1
          fi
          # Creates the tag at this commit when it doesn't exist yet.
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nimbo $TAG" \
            --notes-file release-notes.md \
            --latest
