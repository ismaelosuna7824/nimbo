name: Release

# Builds unsigned (macOS: ad-hoc signed) installers for macOS, Windows and Linux.
# - push a tag vX.Y.Z      -> build, smoke-test and publish the GitHub release "Nimbo vX.Y.Z"
# - workflow_dispatch      -> dry_run (default) builds and uploads the assets as workflow
#                             artifacts only; dry_run=false on a v* tag publishes like a tag push.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload artifacts without creating a release
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      nimbo_version: ${{ steps.v.outputs.nimbo_version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* && "$DRY_RUN" != "true" ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release tags must be vX.Y.Z (MSI needs a numeric version), got $tag"
              exit 1
            fi
            version="${tag#v}"
            nimbo_version="$tag"
            publish=true
          elif [[ "$DRY_RUN" == "true" ]]; then
            version="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
            tag="v$version"
            nimbo_version="v$version-dryrun+${GITHUB_SHA::7}"
            publish=false
          else
            echo "::error::publishing needs a v* tag; run the dry run from a branch or push a tag"
            exit 1
          fi
          {
            echo "version=$version"
            echo "nimbo_version=$nimbo_version"
            echo "tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version nimbo_version=$nimbo_version tag=$tag publish=$publish"

  build:
    name: Build ${{ matrix.name }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-universal
            runner: macos-latest
            platform: macos
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows-x64
            runner: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Linux-x86_64
            runner: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - name: Linux-aarch64
            runner: ubuntu-22.04-arm
            platform: linux
            target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      NIMBO_VERSION: ${{ needs.meta.outputs.nimbo_version }}
      BUNDLE_DIR: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
      SIDECAR: apps/desktop/src-tauri/binaries/nimbo-${{ matrix.target }}${{ matrix.platform == 'windows' && '.exe' || '' }}
      PREFIX: Nimbo-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            build-essential file patchelf xdg-utils rpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile
      - name: Set app version
        working-directory: apps/desktop
        run: bun scripts/set-version.ts "$VERSION"
      - name: Build sidecar
        working-directory: apps/desktop
        run: bun scripts/build-sidecar.ts --target ${{ matrix.target }}
      - name: Build app
        working-directory: apps/desktop
        env:
          # linuxdeploy (AppImage) runs as an AppImage itself and can't strip newer ELF sections.
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        run: bunx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Smoke test (macOS)
        if: matrix.platform == 'macos'
        run: |
          app="$BUNDLE_DIR/macos/Nimbo.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          for bin in "$app/Contents/MacOS/"*; do
            echo "== $bin: $(lipo -archs "$bin")"
            [[ "$(lipo -archs "$bin")" == *x86_64* && "$(lipo -archs "$bin")" == *arm64* ]]
            codesign -dv "$bin" 2>&1 | grep "Signature=adhoc"
          done
          test "$("$app/Contents/MacOS/nimbo" version)" = "$NIMBO_VERSION"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")" = "$VERSION"

      - name: Smoke test (Windows sidecar + silent NSIS install)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = & $env:SIDECAR version
          if ($v -ne $env:NIMBO_VERSION) { throw "sidecar version '$v' != '$env:NIMBO_VERSION'" }
          $env:NIMBO_HOME = Join-Path $env:RUNNER_TEMP 'nimbo-home'
          $doctor = & $env:SIDECAR doctor --json | Out-String
          Write-Host "doctor exit code: $LASTEXITCODE (1 = not ready, expected without Docker)"
          if ($LASTEXITCODE -gt 1) { throw "doctor failed with exit code $LASTEXITCODE" }
          $status = $doctor | ConvertFrom-Json
          Write-Host "doctor: ready=$($status.ready) platform=$($status.platform) arch=$($status.arch)"

          $setup = Get-ChildItem "$env:BUNDLE_DIR/nsis/*-setup.exe" | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'nimbo-install'
          $p = Start-Process -Wait -PassThru -FilePath $setup.FullName -ArgumentList '/S', "/D=$dir"
          if ($p.ExitCode -ne 0) { throw "NSIS installer exited with $($p.ExitCode)" }
          Get-ChildItem $dir | Format-Table Name, Length
          $installed = Join-Path $dir 'nimbo.exe'
          if (-not (Test-Path $installed)) { throw "sidecar missing from $dir" }
          $iv = & $installed version
          if ($iv -ne $env:NIMBO_VERSION) { throw "installed sidecar version '$iv' != '$env:NIMBO_VERSION'" }
          foreach ($exe in 'nimbo-desktop.exe', 'uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $exe))) { throw "$exe missing from $dir" }
          }

      - name: Smoke test (Linux AppImage, deb, rpm)
        if: matrix.platform == 'linux'
        run: |
          work="$(mktemp -d)"
          cp "$BUNDLE_DIR"/appimage/*.AppImage "$work/Nimbo.AppImage"
          chmod +x "$work/Nimbo.AppImage"
          (cd "$work" && ./Nimbo.AppImage --appimage-extract >/dev/null)
          test "$("$work/squashfs-root/usr/bin/nimbo" version)" = "$NIMBO_VERSION"
          deb="$(ls "$BUNDLE_DIR"/deb/*.deb)"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | grep -E '[ /]usr/bin/nimbo$'
          rpm -qip "$BUNDLE_DIR"/rpm/*.rpm
          rpm -qlp "$BUNDLE_DIR"/rpm/*.rpm | grep -x /usr/bin/nimbo

      - name: Collect assets
        run: |
          mkdir -p release
          one() { # exactly one file matches the glob
            local matches=($1)
            if [[ ${#matches[@]} -ne 1 || ! -e "${matches[0]}" ]]; then
              echo "::error::expected one file for $1, got: ${matches[*]}"
              exit 1
            fi
            cp "${matches[0]}" "release/$2"
          }
          case "${{ matrix.platform }}" in
            macos)
              one "$BUNDLE_DIR/dmg/*.dmg" "$PREFIX.dmg"
              COPYFILE_DISABLE=1 tar -czf "release/$PREFIX.app.tar.gz" -C "$BUNDLE_DIR/macos" Nimbo.app
              ;;
            windows)
              one "$BUNDLE_DIR/nsis/*-setup.exe" "$PREFIX-setup.exe"
              one "$BUNDLE_DIR/msi/*.msi" "$PREFIX.msi"
              ;;
            linux)
              one "$BUNDLE_DIR/appimage/*.AppImage" "$PREFIX.AppImage"
              one "$BUNDLE_DIR/deb/*.deb" "$PREFIX.deb"
              one "$BUNDLE_DIR/rpm/*.rpm" "$PREFIX.rpm"
              ;;
          esac
          ls -l release
      - uses: actions/upload-artifact@v7
        with:
          name: nimbo-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish (release notes only on dry runs)
    needs: [meta, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: nimbo-*
          merge-multiple: true
          path: release
      - name: Checksums
        working-directory: release
        run: |
          sha256sum -- * | sort -k2 > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt
      - name: Release notes
        run: |
          python3 - <<'EOF'
          import os, pathlib
          notes = pathlib.Path(".github/release-notes.md").read_text()
          for key, value in {
              "{{TAG}}": os.environ["TAG"],
              "{{REPO}}": os.environ["GITHUB_REPOSITORY"],
              "{{CHECKSUMS}}": pathlib.Path("release/SHA256SUMS.txt").read_text().strip(),
          }.items():
              notes = notes.replace(key, value)
          pathlib.Path("release-notes.md").write_text(notes)
          EOF
          cat release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: |
            release-notes.md
            release/SHA256SUMS.txt
      - name: Create GitHub release
        if: needs.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Nimbo $TAG" \
            --notes-file release-notes.md
